# Per-test timeouts live here now (soldr#2493 follow-up).
#
# They used to live in `timed_test!`, a macro that ran each body on a worker
# thread and called `std::process::abort()` when the body outlived its budget.
# That had two failures that no amount of tuning fixes:
#
#   1. The diagnostic was invisible. The banner went through `eprintln!`, which
#      libtest *captures*; the captured buffer is only printed when libtest
#      reports a result, and `abort()` guarantees it never does. CI saw a bare
#      `signal: 6, SIGABRT` and nothing else. The macro's own docs said to
#      re-run with `--nocapture` to see it -- not an option for a CI failure
#      that already happened.
#   2. The blast radius was the whole binary. `abort()` kills every other test
#      in the process. In soldr#2517's Linux lane a 60s test's expiry killed a
#      120s test that was only 60s in and had done nothing wrong.
#
# nextest runs each test in its own process, so a timeout kills exactly one
# test, its captured output survives, and the run summary names it. Note what
# nextest does NOT do: there is no thread-stack dump on timeout. On Unix it
# sends SIGTERM, waits `grace-period`, then SIGKILL; on Windows it kills the
# job object with no grace window. The SIGTERM window is the blessed hook if
# stack dumps are wanted later.
#
# `period` x `terminate-after` is the budget: 60s x 2 = 120s, which is exactly
# the old `DEFAULT_TEST_TIMEOUT`. Tests that declared a *shorter* budget are
# not given overrides -- those were fail-fast niceties rather than safety
# limits, and 162 per-test entries would be noise. Only the 12 tests that
# declared MORE than the default get one, below.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 2 }

# 300s: real-rustc end-to-end compiles through the session bridge, plus the
# Windows long-path publication cases.
[[profile.default.overrides]]
filter = 'test(=session_endpoint_serves_real_compile_via_mux) + test(=session_compile_e2e_real_rustc_through_the_bridge) + test(=session_client_disconnect_mid_compile_aborts_without_reply) + test(=windows_long_path_publication_survives_fresh_worktree_reuse) + test(=windows_deep_cache_root_keeps_staged_linker_path_short) + test(=env_dedup_micro_benchmark)'
slow-timeout = { period = "60s", terminate-after = 5 }

# 240s: daemon single-instance races, which spin up two daemons and wait for
# one to lose.
[[profile.default.overrides]]
filter = 'test(=two_daemons_against_one_root_never_coexist) + test(=losing_daemon_leaves_the_state_db_openable) + test(=no_spawn_guard_leaves_no_daemon_runtime_copy)'
slow-timeout = { period = "60s", terminate-after = 4 }

# 180s: toolchain-preparation memo invalidation and rustup passthrough, both
# of which shell out to a real toolchain.
[[profile.default.overrides]]
filter = 'test(=cargo_front_door_invalidates_toolchain_preparation_memo) + test(=rustup_passthrough_forwards_args_unchanged_for_unscoped_subcommands) + test(=prod_dev_daemons_and_manual_orphan_maintenance_are_isolated)'
slow-timeout = { period = "60s", terminate-after = 3 }

# Inherits `[profile.default]`, so the timeouts above apply here too. That is
# required, not incidental: with `timed_test!` gone, this profile would
# otherwise let a hung test run until the job's 45-minute ceiling.
[profile.target-run]
fail-fast = false

# soldr#2159 / soldr#2168 pattern. These lanes replay a pre-built archive
# on shared Windows and macOS runners, and a steady trickle of *different*
# wall-clock-bounded tests aborts there while passing everywhere else.
# Observed across unrelated PRs in a single session:
#
#   builds_slow_filters_by_threshold                  2000ms daemon IPC
#   embed_lookup_is_fast                              250ms  (fixed, #2171)
#   cargo_timeout_cleans_incremental_and_next_run_... 1s     configured wait
#   cargo_without_timeout_allows_progress_cpu_and_... 60s    timed_test!
#   legacy_and_non_build_commands_spawn_no_prefetch   120s   (fixed, #2169)
#
# The give-away is that it is a *different* test each time. A real
# regression fails the same test deterministically; contention takes
# whichever test happened to sit nearest its bound. Measured locally on
# Windows, `cargo_without_timeout_...` runs in 9.5s against its 60s
# budget -- roughly 6x headroom -- and still hit the wall on CI.
#
# Retrying is the right lever here *because nextest reports it*: a test
# that fails then passes is surfaced as FLAKY in the run summary and in
# the JUnit output below, so the signal survives. That is the difference
# between this and raising a budget, which CLAUDE.md rightly warns
# against -- a raised budget silently absorbs the evidence, a retry
# publishes it.
#
# Scoped to `target-run` on purpose. The default profile keeps zero
# retries, so local runs and the `Linux x64` lane still fail fast: a test
# that is flaky *there* is a bug, not contention.
retries = { backoff = "fixed", count = 2, delay = "2s" }

[profile.target-run.junit]
path = "junit.xml"
report-name = "soldr-target-run"
store-failure-output = true

