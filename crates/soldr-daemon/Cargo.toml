[package]
name = "soldr-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "soldr daemon runtime: lifecycle, IPC server, v2 broker adoption, embedded zccache service"
publish = false

[dependencies]
soldr-core = { path = "../soldr-core" }
soldr-cache = { path = "../soldr-cache" }
soldr-platform = { path = "../soldr-platform" }

fs2 = { workspace = true }
hex = { workspace = true }
interprocess = { version = "2", features = ["tokio"] }
prost = { workspace = true }

running-process = { version = "=4.10.9", default-features = false, features = ["client"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
console-subscriber = { workspace = true, optional = true }
zccache = { version = "=1.13.16", default-features = false, features = ["cli"] }

[dev-dependencies]
filetime = { workspace = true }
zccache = { version = "=1.13.16", default-features = false, features = ["test-support"] }

[features]
# Opt-in tokio-console support for the daemon and embedded zccache
# service. Requires a `--cfg tokio_unstable` build to produce useful
# Tokio task instrumentation. Forwarded from soldr-cli's feature of the
# same name.
tokio-console = [
    "dep:console-subscriber",
    "zccache/tokio-console",
]

# Unix-only PID-liveness probe (kill(pid, 0)) and detached spawn
# (setsid); Windows uses inline OpenProcess declarations.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[lints]
workspace = true
