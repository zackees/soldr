[package]
name = "soldr-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for soldr — instant tools, instant builds"

[dependencies]
# Folded in from former soldr-core / soldr-fetch / soldr-cache crates
# (see crates/soldr-cli/src/{core,fetch,cache_lib}/).
blake3 = { workspace = true }
clap = { workspace = true }
filetime = { workspace = true }
flate2 = { workspace = true }
fs2 = { workspace = true }
hex = { workspace = true }
jwalk = { workspace = true }
prost = { workspace = true }
prost14 = { package = "prost", version = "0.14" }
rayon = { workspace = true }
redb = { workspace = true }
reqwest = { workspace = true }
running-process = { version = "4.4.0", default-features = false, features = ["client"] }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
strsim = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
walkdir = { workspace = true }
wait-timeout = { workspace = true }
xz2 = { workspace = true }
zip = { workspace = true }
zstd = { workspace = true }

# libc powers the daemon's Unix-only PID-liveness probe (kill(pid, 0))
# and detached spawn (setsid). On Windows the equivalent
# OpenProcess / GetExitCodeProcess calls are declared inline so no
# extra crate is needed.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
filetime = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

# `build.rs` compresses `embed/manifest.json` into the OUT_DIR-resident
# `manifest.json.zst` that `src/fetch/manifest_v6.rs` includes via
# `include_bytes!`. See the build script's docstring for context.
[build-dependencies]
zstd = { workspace = true }
serde_json = { workspace = true }
ureq = { version = "2", default-features = false, features = ["tls"] }

[features]
# Internal feature flag that enables test-only fixture binaries (e.g.
# `fake-zccache-265-stub`). Off by default so neither the maturin wheel,
# the GitHub release tarball, nor `cargo install` pick up the stubs.
# Integration tests that need the stub build it explicitly with
# `cargo build --bin <stub> --features test-stubs` at test setup time.
test-stubs = []

# Opt-in feature that exposes `crate::test_util` outside of `cfg(test)`
# so integration tests can spawn a child `cargo test` binary that
# deliberately hangs and observe the watchdog firing. Never enabled
# in production builds. See `tests/test_watchdog_self_test.rs`.
test-watchdog-self-test = []

[lints]
workspace = true

# Thin library entry that re-exports the modules consumed by integration
# tests under `tests/`. Production code goes through the `[[bin]]` target
# below; lib.rs only exists so `tests/save_roundtrip.rs` & co. can keep
# `use soldr_cli::cache_lib::save::*`-style imports after the four-crate
# collapse landed.
[lib]
name = "soldr_cli"
path = "src/lib.rs"

[[bin]]
name = "soldr"
path = "src/main.rs"

[[bin]]
# Long-lived daemon that owns target/ tracking and (future phases) build
# event correlation + linked zccache shutdown. Auto-started by the
# wrapper on first invocation; falls back to direct redb on any error.
name = "soldr-daemon"
path = "src/bin/soldr_daemon.rs"

[[bin]]
# Tiny multi-tool shim binary installed under each toolchain tool name
# (`cargo`, `rustc`, `rustfmt`, `clippy-driver`, `rustdoc`) by
# `soldr shims`. Reads argv[0] basename, strips its own dir from PATH
# (recursion guard), then execs `soldr <tool> ...`. See zackees/soldr#742.
name = "soldr-shim"
path = "src/bin/soldr_shim.rs"

[[bin]]
# Test fixture for crates/soldr-cli/tests/cli_unknown_session_retry.rs
# (covers the deferred integration test from #265 / closes #266).
# Gated behind the `test-stubs` feature so the stub is not built or
# shipped in normal cargo / maturin builds.
name = "fake-zccache-265-stub"
path = "tests/bins/fake_zccache_stub.rs"
required-features = ["test-stubs"]
