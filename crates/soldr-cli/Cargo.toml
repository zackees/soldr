[package]
name = "soldr-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for soldr — instant tools, instant builds"
publish = false

[dependencies]
soldr-cache = { path = "../soldr-cache" }
soldr-daemon = { path = "../soldr-daemon" }
soldr-core = { path = "../soldr-core" }
soldr-fetch = { path = "../soldr-fetch" }

cap-fs-ext = { workspace = true }
cap-std = { workspace = true }
clap = { workspace = true }
filetime = { workspace = true }
flate2 = { workspace = true }
fs2 = { workspace = true }
hex = { workspace = true }
jwalk = { workspace = true }
prost = { workspace = true }
rayon = { workspace = true }
redb = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
sha2 = { workspace = true }
strsim = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
wait-timeout = { workspace = true }
xz2 = { workspace = true }
zip = { workspace = true }
zstd = { workspace = true }

# In-process zccache service (issue #977 / #980 L1). soldr links
# zccache::embedded::* directly. As of soldr#940 + #985 follow-up,
# the dep is sourced from the `_vender/zccache` git submodule
# (branch `feat/inner-compile-tracing-940`) so iteration on the
# embedded compile path can happen in-tree: edit zccache under
# `_vender/zccache/`, soldr's build picks it up immediately. The
# submodule ref + the soldr branch land in lockstep PRs.
#
# To bump the pinned zccache commit: cd _vender/zccache, git pull
# (or git checkout <commit>), then `git add _vender/zccache` from
# the soldr root commits the new submodule pointer.
#
# soldr#1368: there is no longer a separately-downloaded managed zccache
# binary. soldr#1592 exposes the compiled-in CLI by materializing the main
# `soldr` executable under the `zccache` multicall name.
zccache = { version = "1.13.0", path = "../../_vender/zccache/crates/zccache", default-features = false, features = ["cli"] }

# libc powers the daemon's Unix-only PID-liveness probe (kill(pid, 0))
# and detached spawn (setsid). On Windows the equivalent
# OpenProcess / GetExitCodeProcess calls are declared inline so no
# extra crate is needed.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
filetime = { workspace = true }
running-process = { version = "4.8.1", default-features = false, features = ["client"] }
serde_json = { workspace = true }
tempfile = { workspace = true }

# `build.rs` compresses `embed/manifest.json` into the OUT_DIR-resident
# `manifest.json.zst` that `src/fetch/manifest_v6.rs` includes via
# `include_bytes!`. See the build script's docstring for context.
# soldr#1356 A1 — `ureq` build-dep removed; build.rs uses only std + zstd.
[features]
# Opt-in feature that exposes `crate::test_util` outside of `cfg(test)`
# so integration tests can spawn a child `cargo test` binary that
# deliberately hangs and observe the watchdog firing. Never enabled
# in production builds. See `tests/test_watchdog_self_test.rs`.
test-watchdog-self-test = []
# Opt-in tokio-console support for the soldr daemon and embedded zccache
# service. Requires a `--cfg tokio_unstable` build to produce useful Tokio
# task instrumentation.
tokio-console = ["soldr-daemon/tokio-console"]

[lints]
workspace = true

# Thin library entry that re-exports the modules consumed by integration
# tests under `tests/`. Production code goes through the `[[bin]]` target
# below; lib.rs only exists so `tests/save_roundtrip.rs` & co. can keep
# `use soldr_cli::cache_lib::save::*`-style imports after the four-crate
# collapse landed.
[lib]
name = "soldr_cli"
path = "src/lib.rs"

[[bin]]
name = "soldr"
path = "src/main.rs"
