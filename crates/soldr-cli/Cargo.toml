[package]
name = "soldr-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for soldr — instant tools, instant builds"

[dependencies]
# Folded in from former soldr-core / soldr-fetch / soldr-cache crates
# (see crates/soldr-cli/src/{core,fetch,cache_lib}/).
blake3 = { workspace = true }
clap = { workspace = true }
filetime = { workspace = true }
flate2 = { workspace = true }
fs2 = { workspace = true }
hex = { workspace = true }
jwalk = { workspace = true }
prost = { workspace = true }
prost14 = { package = "prost", version = "0.14" }
rayon = { workspace = true }
redb = { workspace = true }
reqwest = { workspace = true }
running-process = { version = "4.4.0", default-features = false, features = ["client"] }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
strsim = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
walkdir = { workspace = true }
wait-timeout = { workspace = true }
xz2 = { workspace = true }
zip = { workspace = true }
zstd = { workspace = true }

# In-process zccache service (issue #977 / #980 L1). soldr links
# zccache::embedded::* directly. As of soldr#940 + #985 follow-up,
# the dep is sourced from the `_vender/zccache` git submodule
# (branch `feat/inner-compile-tracing-940`) so iteration on the
# embedded compile path can happen in-tree: edit zccache under
# `_vender/zccache/`, soldr's build picks it up immediately. The
# submodule ref + the soldr branch land in lockstep PRs.
#
# To bump the pinned zccache commit: cd _vender/zccache, git pull
# (or git checkout <commit>), then `git add _vender/zccache` from
# the soldr root commits the new submodule pointer.
#
# The managed zccache binary (MANAGED_ZCCACHE_VERSION in
# src/fetch/mod.rs) is still tracked separately — that's the
# `soldr update-zccache` workflow + perf-cluster harness pin and
# does not need to match the embedded library commit.
zccache = { path = "../../_vender/zccache/crates/zccache", default-features = false }

# libc powers the daemon's Unix-only PID-liveness probe (kill(pid, 0))
# and detached spawn (setsid). On Windows the equivalent
# OpenProcess / GetExitCodeProcess calls are declared inline so no
# extra crate is needed.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
filetime = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

# `build.rs` compresses `embed/manifest.json` into the OUT_DIR-resident
# `manifest.json.zst` that `src/fetch/manifest_v6.rs` includes via
# `include_bytes!`. See the build script's docstring for context.
[build-dependencies]
zstd = { workspace = true }
serde_json = { workspace = true }
ureq = { version = "2", default-features = false, features = ["tls"] }

[features]
# Opt-in feature that exposes `crate::test_util` outside of `cfg(test)`
# so integration tests can spawn a child `cargo test` binary that
# deliberately hangs and observe the watchdog firing. Never enabled
# in production builds. See `tests/test_watchdog_self_test.rs`.
test-watchdog-self-test = []

[lints]
workspace = true

# Thin library entry that re-exports the modules consumed by integration
# tests under `tests/`. Production code goes through the `[[bin]]` target
# below; lib.rs only exists so `tests/save_roundtrip.rs` & co. can keep
# `use soldr_cli::cache_lib::save::*`-style imports after the four-crate
# collapse landed.
[lib]
name = "soldr_cli"
path = "src/lib.rs"

[[bin]]
name = "soldr"
path = "src/main.rs"

[[bin]]
# Long-lived daemon that owns target/ tracking and (future phases) build
# event correlation + linked zccache shutdown. Auto-started by the
# wrapper on first invocation; falls back to direct redb on any error.
name = "soldr-daemon"
path = "src/bin/soldr_daemon.rs"

[[bin]]
# Tiny multi-tool shim binary installed under each toolchain tool name
# (`cargo`, `rustc`, `rustfmt`, `clippy-driver`, `rustdoc`) by
# `soldr shims`. Reads argv[0] basename, strips its own dir from PATH
# (recursion guard), then execs `soldr <tool> ...`. See zackees/soldr#742.
name = "soldr-shim"
path = "src/bin/soldr_shim.rs"

[[bin]]
# Tiny `clang` / `clang++` wrapper that routes to `clang-cl` when any
# arg in argv matches `--target=*-pc-windows-msvc`. Sidesteps the ring
# 0.17.14 build.rs:563 oversight (cf. soldr#1012 PR 4). Installed by
# `Commands::Build` (PR 5) at `~/.soldr/bin/clang` for blessed cross-
# compile to MSVC targets.
name = "soldr-clang-shim"
path = "src/bin/soldr_clang_shim.rs"
