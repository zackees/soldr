[package]
name = "soldr-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CLI for soldr — instant tools, instant builds"
publish = false

[dependencies]
# Global allocator (soldr#3038): the canonical daemon on this host reached
# 11.7 GiB of private anonymous memory with no way to tell whether that was
# live data or allocator retention, because soldr shipped no
# `#[global_allocator]` at all and got the Rust default (glibc's ptmalloc on
# Linux), which keeps one ~64 MiB arena per thread that essentially never
# shrinks. mimalloc returns freed pages to the OS far more aggressively, and
# exposes exact allocator counters (`mimalloc_pprof::prof::stats()`) that
# finally distinguish "live data" from "allocator retention" instead of
# guessing from a mapping histogram.
#
# zccache's own (optional, `heap-profile`/`*-bin`-gated) dependency on this
# crate resolves `"0.9.3"` (a caret requirement, so >=0.9.3, <0.10.0); soldr
# does not enable any zccache feature that activates it, so nothing pulls it
# in transitively today (`grep -c mimalloc Cargo.lock` was 0 before this
# change). Pinned here to `=0.9.5` — the newest release satisfying zccache's
# own requirement — so that if a future zccache feature *does* turn its
# optional dependency on, Cargo unifies both requirements onto this one
# `=0.9.5` copy rather than linking two mimalloc allocators into one binary.
#
# Default features stay ON (not `default-features = false`): the crate's
# `pprof` feature compiles mimalloc's C build with `MI_PPROF=1`, which is
# what makes `mimalloc_pprof::prof::stats()` return real numbers instead of
# an always-`false` stub — see `crates/soldr-cli/src/lib.rs` for the
# `#[global_allocator]` declaration and why exact counters must be
# unconditional while the *sampled* profiler stays opt-in at runtime.
mimalloc-pprof = { version = "=0.9.5" }
running-process = { version = "=4.10.9", default-features = false, features = ["client", "client-async"] }
soldr-cache = { path = "../soldr-cache" }
soldr-daemon = { path = "../soldr-daemon" }
soldr-core = { path = "../soldr-core" }
soldr-fetch = { path = "../soldr-fetch" }
soldr-platform = { path = "../soldr-platform" }
cap-fs-ext = { workspace = true }
cap-std = { workspace = true }
blake3 = "1"
clap = { workspace = true }
filetime = { workspace = true }
fs2 = { workspace = true }
getrandom = "0.4"
hex = { workspace = true }
interprocess = { version = "2", features = ["tokio"] }
jwalk = { workspace = true }
prost = { workspace = true }
rayon = { workspace = true }

rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
semver = { workspace = true }
sha2 = { workspace = true }
strsim = { workspace = true }
sysinfo = "0.30"
tar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
wait-timeout = { workspace = true }
zstd = { workspace = true }

# In-process zccache service (issue #977 / #980 L1), sourced from the
# released amalgamated crate. The exact pin must have matching prebuilt
# assets in the soldr-toolchain catalogue before it can move.
# soldr#1368: there is no longer a separately-downloaded managed zccache
# binary. soldr#2899: nor is zccache's standalone CLI compiled in. The only
# CLI-adjacent surface soldr consumes is the daemon-free `formatter` API for
# `soldr rustfmt`; Soldr owns the child-process policy through its runner
# callback, so enabling `cli` would pull in a second command dispatcher,
# a second daemon lifecycle, clap, tracing-subscriber, reqwest, and the
# download-client archive stack for no reachable code path.
zccache = { version = "=1.13.22", default-features = false, features = ["formatter"] }

# libc powers the daemon's Unix-only PID-liveness probe (kill(pid, 0))
# and detached spawn (setsid). On Windows the equivalent
# OpenProcess / GetExitCodeProcess calls are declared inline so no
# extra crate is needed.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
widestring = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
soldr-platform = { path = "../soldr-platform" }
filetime = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

# `build.rs` compresses `embed/manifest.json` into the OUT_DIR-resident
# `manifest.json.zst` that `src/fetch/manifest_v6.rs` includes via
# `include_bytes!`. See the build script's docstring for context.
# soldr#1356 A1 — `ureq` build-dep removed; build.rs uses only std + zstd.
[features]
# Opt-in tokio-console support for the soldr daemon and embedded zccache
# service. Requires a `--cfg tokio_unstable` build to produce useful Tokio
# task instrumentation.
tokio-console = ["soldr-daemon/tokio-console"]

[lints]
workspace = true

# Thin library entry that re-exports the modules consumed by integration
# tests under `tests/`. Production code goes through the `[[bin]]` target
# below; lib.rs only exists so `tests/toolchain_env/save_roundtrip.rs` & co. can keep
# `use soldr_cli::cache_lib::save::*`-style imports after the four-crate
# collapse landed.
[lib]
name = "soldr_cli"
path = "src/lib.rs"

[[bin]]
name = "soldr"
path = "src/main.rs"
