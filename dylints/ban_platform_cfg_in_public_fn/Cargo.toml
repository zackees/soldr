[package]
name = "ban_platform_cfg_in_public_fn"
version = "0.1.0"
description = "Require platform-neutral public and crate-visible function facades"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dylint_linting = "6.0.1"

[dev-dependencies]
dylint_testing = "=6.0.3"

[package.metadata.rust-analyzer]
rustc_private = true

[workspace]

[profile.release]
opt-level = 0
lto = false
codegen-units = 16
strip = "none"
