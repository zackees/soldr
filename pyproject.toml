# soldr dogfoods itself as its own PEP 517 build backend, pinned to a
# known-good published wheel. The pin is load-bearing twice over:
# (1) `pip install .` pulls the *published* soldr wheel into the
# isolated build env, so a broken latest release (0.8.21 at time of
# pinning) would make this repo uninstallable if the requirement
# floated; (2) the pinned version must carry the fast-dev profile
# default (`--profile dev`, opt-level 0, lto=false,
# debug=line-tables-only) — 0.8.18 and older pass no --profile, so
# maturin silently falls back to a full RELEASE build (~15 min cold vs
# seconds). 0.9.6 is the validated backend with both properties plus
# catalogue-v2 multipart support. When
# bumping the pin, verify `uv pip install .` from a clean venv builds
# the dev profile before merging. Bootstrap-cycle history:
# soldr#1264/#1269. See README "Use soldr as your PEP 517 build
# backend".
[build-system]
requires = [
    "soldr==0.9.6",
    # Maturin repairs Linux bin-binding wheels with patchelf when a linked
    # shared library (liblzma for soldr) must be bundled. The managed maturin
    # executable does not carry its Python `patchelf` extra, so provision the
    # helper in pip's isolated build environment.
    "patchelf; platform_system == 'Linux'",
]
build-backend = "soldr"

[project]
name = "soldr"
# Version source of truth: Cargo.toml [workspace.package].version.
# maturin derives the Python package version from the Rust package metadata.
dynamic = ["version"]
description = "Instant tools. Instant builds. One command."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Zach Vorhies" },
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
]
keywords = ["rust", "build", "cache", "install", "tools"]

[project.urls]
Repository = "https://github.com/zackees/soldr"

[dependency-groups]
dev = [
    "soldr-maturin==1.14.1.post1",
    "pillow==11.3.0",
    "pyyaml>=6.0",
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "ruff>=0.12,<0.13",
]

[tool.maturin]
manifest-path = "crates/soldr-cli/Cargo.toml"
module-name = "soldr._native"
python-source = "src"
# tokio-console is compiled into every published wheel so it is always
# available on demand. The subscriber only starts when the daemon sees
# `SOLDR_DAEMON_TOKIO_CONSOLE=1`, so this adds no runtime cost to normal
# builds — only Tokio's task-tracing hooks, which require the matching
# `--cfg tokio_unstable` set in .cargo/config.toml. Attach at runtime
# with `tokio-console` (default 127.0.0.1:6669).
features = ["tokio-console"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
    "act_integration: Docker-based integration tests that reproduce the nektos/act bootstrap path (deselect with '-m \"not act_integration\"'); skipped unless explicitly selected via '-m act_integration' or '--act-integration'.",
    "cacheability_integration: Docker-based cacheability tests that build the full nextest archive twice; skipped unless explicitly selected via '-m cacheability_integration' or '--cacheability-integration'.",
]

[tool.ruff]
target-version = "py310"
line-length = 100

# soldr#2102. ruff ran on its default rule set (E4/E7/E9 + F), which is a
# narrow slice of what it can catch. These four families were measured against
# the tree before being enabled, and all four now report zero:
#
#   B    flake8-bugbear -- real bug patterns. Found two: a `zip()` without
#        `strict=`, which silently truncates to the shorter operand, and a
#        `setattr` with a constant name.
#   C4   comprehension misuse -- already clean.
#   RET  return-path smells -- already clean.
#   RUF  ruff's own checks. Found a dead `# noqa` for a rule that is not
#        enabled, i.e. a suppression suppressing nothing.
#
# Deliberately NOT enabled, having measured them: PL (69 findings, 42 of them
# magic-value comparisons in tests), SIM (34, mostly nested `with`), UP (47,
# mostly Optional -> `|` rewrites). Those are style migrations, not defects,
# and each would need its own reviewed diff rather than riding along here.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "C4", "RET", "RUF"]

# RUF001/2/3 flag characters that could be a homoglyph attack. `×` is not one
# -- it is the multiplication sign, used in prose comments that describe unit
# arithmetic ("perf-script periods × Hz"). Rewriting it to the letter `x` makes
# the comment worse to read in order to satisfy a rule aimed at a threat that
# does not apply to a maths symbol, so it is allowed by name rather than
# suppressed per-site.
allowed-confusables = ["×"]
