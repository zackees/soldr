# soldr dogfoods itself as its own PEP 517 build backend, pinned to a
# known-good published wheel. The pin is load-bearing: `pip install .`
# pulls the *published* soldr wheel into the isolated build env, so a
# broken latest release (0.8.21 at time of pinning) would make this
# repo uninstallable if the requirement floated. When bumping the pin,
# verify `uv pip install .` from a clean venv before merging. The
# bootstrap-cycle history is in soldr#1264/#1269. See README "Use
# soldr as your PEP 517 build backend".
[build-system]
requires = ["soldr==0.8.18"]
build-backend = "soldr"

[project]
name = "soldr"
# Version source of truth: Cargo.toml [workspace.package].version.
# maturin derives the Python package version from the Rust package metadata.
dynamic = ["version"]
description = "Instant tools. Instant builds. One command."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [
    { name = "Zach Vorhies" },
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
]
keywords = ["rust", "build", "cache", "install", "tools"]

[project.urls]
Repository = "https://github.com/zackees/soldr"

[dependency-groups]
dev = [
    "maturin>=1.7,<2",
    "pillow==11.3.0",
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "ruff>=0.4",
]

[tool.maturin]
manifest-path = "crates/soldr-cli/Cargo.toml"
module-name = "soldr._native"
python-source = "src"
features = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
    "act_integration: Docker-based integration tests that reproduce the nektos/act bootstrap path (deselect with '-m \"not act_integration\"'); skipped unless explicitly selected via '-m act_integration' or '--act-integration'.",
    "cacheability_integration: Docker-based cacheability tests that build the full nextest archive twice; skipped unless explicitly selected via '-m cacheability_integration' or '--cacheability-integration'.",
]

[tool.ruff]
target-version = "py310"
line-length = 100
