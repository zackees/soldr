# soldr#1264: dogfood soldr's own PEP 517 backend (src/soldr/__init__.py).
# The published soldr wheel installs into the isolated build env and
# drives the build via `soldr maturin pep517 <hook>` — pinned maturin,
# rustup-resolved CARGO (MSVC on Windows regardless of PATH junk),
# managed cmake/ninja env for cmake-based *-sys deps, and
# RUSTC_WRAPPER=soldr caching. Direct `maturin build` invocations
# (release CI) are unaffected — maturin as a CLI ignores [build-system].
# User-facing walkthrough: README "Use soldr as your PEP 517 build
# backend" + docs/API.md "PEP 517 Build Backend".
[build-system]
requires = ["soldr"]
build-backend = "soldr"

[project]
name = "soldr"
# Version source of truth: Cargo.toml [workspace.package].version.
# maturin derives the Python package version from the Rust package metadata.
dynamic = ["version"]
description = "Instant tools. Instant builds. One command."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [
    { name = "Zach Vorhies" },
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
]
keywords = ["rust", "build", "cache", "install", "tools"]

[project.urls]
Repository = "https://github.com/zackees/soldr"

[dependency-groups]
dev = [
    "maturin>=1.7,<2",
    "pillow==11.3.0",
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "ruff>=0.4",
]

[tool.maturin]
manifest-path = "crates/soldr-cli/Cargo.toml"
module-name = "soldr._native"
python-source = "src"
features = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
    "act_integration: Docker-based integration tests that reproduce the nektos/act bootstrap path (deselect with '-m \"not act_integration\"'); skipped unless explicitly selected via '-m act_integration' or '--act-integration'.",
]

[tool.ruff]
target-version = "py310"
line-length = 100
