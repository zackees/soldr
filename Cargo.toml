[workspace]
resolver = "2"
# Internal publish=false crate split (#1490, reversing the 2026-05
# monocrate collapse): `soldr-core` is the foundation crate; the
# remaining trees split out phase by phase (fetch, cache, daemon).
# soldr publishes no crates, so workspace membership has no external
# surface — the old monocrate_guard test was deleted with the split.
members = [
    "crates/soldr-cli",
    "crates/soldr-daemon",
    "crates/soldr-cache",
    "crates/soldr-core",
    "crates/soldr-fetch",
]
# The zccache submodule has its own [workspace] declaration and its
# own `[workspace.dependencies]` (arc-swap, etc.). Excluding it here
# keeps cargo from trying to fold its crates into soldr's workspace —
# the path-dep in `crates/soldr-cli/Cargo.toml` still resolves the
# specific `_vender/zccache/crates/zccache` crate we link against.
exclude = [
    "_vender/zccache",
]

[workspace.package]
version = "0.8.22"
edition = "2021"
rust-version = "1.94.1"
license = "BSD-3-Clause"
repository = "https://github.com/zackees/soldr"
homepage = "https://github.com/zackees/soldr"

[workspace.metadata.soldr]
# Compatibility mirror of the authoritative `ci/canonical-targets.json`,
# consumed by `soldr prepare --target all` (RFC #914).
# Cargo ignores `[workspace.metadata.*]` — this is the blessed way to
# attach tool-specific config to a manifest. A parity guard checks every
# runtime, workflow, release, alias, documentation, and catalogue mirror.
# When this checkout is run with a locally-built soldr, hand off to the
# globally-installed `soldr` on PATH when it has a newer SemVer version.
prefer_newer_global = true
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]

[workspace.dependencies]
cap-fs-ext = "3.4.4"
cap-std = "3.4.4"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
# Opt-in tokio-console support for soldr-daemon. Only pulled into
# soldr-cli when the crate's `tokio-console` feature is enabled.
console-subscriber = "0.5"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"
# soldr#1356 prep — reqwest features made explicit for robustness.
# fetch/forge_dispatch.rs + fetch/manifest_lookup.rs use Response::text()
# (`charset`), Response::json() (`json`), and Response streaming
# (`stream`). Previously these were pulled in by feature-unification
# through other deps; declaring them explicitly makes soldr's build
# self-sufficient against dep-trim churn.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "charset", "stream"] }
tempfile = "3"
# soldr#1356 A4 — default-features=false + deflate only. Drops bzip2-sys
# (C build) + aes + sha1 + lzma + deflate64 + zopfli + zip's own zstd copy.
zip = { version = "2", default-features = false, features = ["deflate"] }
# soldr#1356 A3 — rust_backend replaces zlib-ng. Drops libz-ng-sys
# (C build) + the `cmake` build-dependency needed to compile it.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
# .tar.xz support — cargo-zigbuild and other rust-cross prebuilts ship
# their per-triple binary tarballs in xz, not gzip. Without this, soldr
# falls through to the "raw binary" branch in fetch::archive and writes
# the compressed tarball bytes to disk as the binary (#809).
xz2 = "0.1"
toml = "0.8"
redb = "4.1.0"
rayon = "1"
prost = "0.14"
# soldr#1356 A2 — walkdir workspace dep removed; jwalk is the sole
# directory walker used in soldr-cli.
jwalk = "0.8"
wait-timeout = "0.2"
zstd = { version = "0.13", default-features = false, features = ["zstdmt"] }
filetime = "0.2"
# Jaro-Winkler scoring for the target-triple classifier in
# `src/prepare_cmd.rs`. Lets `classify_target` pick the best-match
# token from a registry of known arches/oses/abis instead of doing
# brittle exact-string matches that miss obvious aliases.
strsim = "0.11"
# Used by `core::git::normalize_origin_url` for canonicalizing git
# remote URLs into the prefetch hint stored alongside cook artifacts
# (issue #577).
url = "2"
# Read-only access to cargo's `$CARGO_HOME/.global-cache` SQLite database
# (issue #349). `bundled` compiles SQLite ourselves so neither the
# managed wheel nor the cargo-install path needs a system libsqlite3.
rusqlite = { version = "0.32", features = ["bundled"] }

# Release profile size optimization (#920). soldr ships as a template
# binary that every CI consumer downloads via setup-soldr / actions/
# cache@v4 / cross-build-artifact passing — leaner binary = faster
# CI cycles for every consumer. The cargo defaults (`strip = "none"`,
# `lto = false`, `codegen-units = 16`) leave ~50% on the table for a
# pure-CLI binary that doesn't need user-side debuggability. Numbers:
# pre-change shipped 16.3 MB uncompressed for soldr v0.7.59.
[profile.release]
# Drop symbol table + debuginfo from the shipped binary. Biggest
# single contributor to size (~30–50%). For deep debugging via
# `SOLDR_ZCCACHE_LOCAL_DIR` the user builds locally without this
# profile anyway; the managed-zccache debug-symbol path is a
# separate sibling file (`.pdb` / `.dwp` / `.dSYM`).
strip = "symbols"
# Cross-crate inlining + dead-code elimination. `thin` is the
# sweet spot — meaningful size win with manageable compile-time
# cost (~10–30% slower clean release builds; incremental is fine).
lto = "thin"
# Single codegen unit unlocks the last bit of optimization. Slows
# clean builds further; release-only, so acceptable.
codegen-units = 1

# soldr#1282 — fast-compile profile for the CI bootstrap step.
# `Bootstrap soldr for SDK / blessed-build prep` builds a throwaway
# host-side soldr binary used only inside the same cross-build lane —
# it never ships to a user, never gets downloaded via setup-soldr, and
# never survives past post-step cleanup. Optimising it for size buys
# nothing. Dropping opt-level 3, LTO, and cu=1 saves the three
# darwin/MSVC lanes from compiling an optimized helper binary that is
# thrown away before the job exits.
[profile.ci-bootstrap]
inherits = "release"
opt-level = 0
lto = false
codegen-units = 16
strip = "none"

# soldr#1357 — fast-compile profile for CI cross-build lanes. Same
# rationale as ci-bootstrap but applied to Stage B of
# `_ci-cross-build-linux.yml` where `soldr build --profile ci-release --target X`
# spends 5+ min per lane, most of it in single-threaded LLVM codegen +
# link for the soldr-cli monocrate. CI cross-build artifacts are
# `soldr-ci-e2e-*` — consumed only by `_ci-target-run.yml` for
# nextest smoke runs; NOT the shipped `release-soldr-*` /
# `pypi-soldr-*` artifacts produced by `release-auto.yml` (which
# stays on `--release` for shipped-binary quality). Keep a light
# optimizer pass so CI still catches optimized-codegen issues without
# paying full release opt-level 3 on every cross/PEP smoke build.
# Keeps `strip = "symbols"` so archive size stays comparable.
[profile.ci-release]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
strip = "symbols"

# soldr#1248 — fast-compile profile for CI cross-build lanes that also
# produce nextest archives. It matches ci-release's compile-time wins so
# Stage B and Stage C share target/<triple>/ci-nextest artifacts, while
# preserving the soldr#1168 line-table-only debug info target-run needs
# for useful backtraces from archived tests.
[profile.ci-nextest]
inherits = "ci-release"
debug = "line-tables-only"
strip = "none"

[workspace.lints.rust]
unused_mut = "deny"

# Enforce the "no new bincode" rule from CLAUDE.md's
# "Serialization (issues #580 / #603)" section. The actual disallowed-methods
# list lives in workspace-root `clippy.toml`. #603 already removed every
# bincode call site; this gate keeps it that way.
[workspace.lints.clippy]
disallowed_methods = "deny"
