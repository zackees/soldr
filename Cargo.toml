[workspace]
resolver = "2"
# Monocrate. The former soldr-core / soldr-fetch / soldr-cache crates
# live under `crates/soldr-cli/src/{core,fetch,cache_lib}/` as in-crate
# modules. A regression guard at
# `crates/soldr-cli/tests/monocrate_guard.rs` fails the workspace
# `cargo test` run if anyone re-introduces a second crate.
members = [
    "crates/soldr-cli",
]

[workspace.package]
version = "0.7.53"
edition = "2021"
rust-version = "1.94.1"
license = "BSD-3-Clause"
repository = "https://github.com/zackees/soldr"
homepage = "https://github.com/zackees/soldr"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
tempfile = "3"
zip = "2"
flate2 = "1"
tar = "0.4"
toml = "0.8"
redb = "4.1.0"
rayon = "1"
prost = "0.13"
walkdir = "2"
jwalk = "0.8"
zstd = { version = "0.13", default-features = false, features = ["zstdmt"] }
filetime = "0.2"
# Used by `core::git::normalize_origin_url` for canonicalizing git
# remote URLs into the prefetch hint stored alongside cook artifacts
# (issue #577).
url = "2"
# Read-only access to cargo's `$CARGO_HOME/.global-cache` SQLite database
# (issue #349). `bundled` compiles SQLite ourselves so neither the
# managed wheel nor the cargo-install path needs a system libsqlite3.
rusqlite = { version = "0.32", features = ["bundled"] }

[workspace.lints.rust]
unused_mut = "deny"

# Enforce the "no new bincode" rule from CLAUDE.md's
# "Serialization (issues #580 / #603)" section. The actual disallowed-methods
# list lives in workspace-root `clippy.toml`. #603 already removed every
# bincode call site; this gate keeps it that way.
[workspace.lints.clippy]
disallowed_methods = "deny"
