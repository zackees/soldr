## Workspace-wide clippy configuration.
##
## `disallowed-methods` enforces the "no new bincode" rule from
## CLAUDE.md's "Serialization (issues #580 / #603)" section. Binary
## transports and persisted-state metadata must use prost (see
## `crates/soldr-cli/src/daemon/wire.rs` + `wire.proto` for the
## established pattern). #603 already removed the bincode workspace
## dep and every call site; this rule prevents re-introduction even if
## someone vendors a stray `bincode = "..."` dep into a sub-crate.
##
## `std::env::temp_dir` is banned for the reasons in soldr#1900: on most
## Linux distributions it resolves to `/tmp`, a `tmpfs`, so scratch
## writes land in RAM, nothing ever reclaims them, and a "write to temp,
## rename into the cache" sequence stops being atomic because the two
## ends sit on different filesystems (`rename(2)` fails `EXDEV` and the
## caller silently degrades to a copy).
##
## `soldr_core::core::temp` is the blessed resolver: scratch defaults to
## `<cache>/tmp` — on the cache's volume by construction — and
## `SOLDR_TMPDIR` overrides it. Route every scratch site through it.
##
## The only sanctioned raw uses are inside that module, each carrying an
## explicit `#[allow(clippy::disallowed_methods)]` and a reason: they are
## its documented "degrade rather than fail when the preferred root is
## unwritable" path, plus one test that asserts we are *not* the OS temp
## dir. Anything else is a lint error, which is what stops #1900 from
## silently regrowing one call site at a time.
disallowed-methods = [
    { path = "bincode::serialize",   reason = "use prost; see CLAUDE.md 'Serialization (issues #580 / #603)'." },
    { path = "bincode::deserialize", reason = "use prost; see CLAUDE.md 'Serialization (issues #580 / #603)'." },
    { path = "std::env::temp_dir",   reason = "use soldr_core::core::temp; scratch belongs under <cache>/tmp. See soldr#1900." },
]
