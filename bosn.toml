[stack.cook]
dockerfile = "docker/cook-shared-cache/Dockerfile"
family = "soldr-rematerialization"
default = true

[stack.cook.volumes]
target = { scope = "stack", destination = "/target" }
cargo-home = { scope = "stack", destination = "/root/.cargo" }
soldr-home = { scope = "stack", destination = "/root/.soldr" }
soldr-dev-home = { scope = "stack", destination = "/root/.soldr-dev" }
tools = { scope = "machine", destination = "/tools" }
artifact = { scope = "machine", destination = "/artifact" }

[stack.cook.mounts]
repo = { source = ".", destination = "/repo" }

[stack.seed]
dockerfile = "docker/cook-shared-cache/Dockerfile"
family = "soldr-rematerialization"

[stack.seed.volumes]
cargo-home = { scope = "stack", destination = "/root/.cargo" }
soldr-home = { scope = "stack", destination = "/root/.soldr" }
tools = { scope = "machine", destination = "/tools" }
artifact = { scope = "machine", destination = "/artifact" }

[stack.seed.mounts]
repo = { source = ".", destination = "/repo", readonly = true }

[stack.warm]
dockerfile = "docker/cook-shared-cache/Dockerfile"
family = "soldr-rematerialization"

[stack.warm.volumes]
cargo-home = { scope = "stack", destination = "/root/.cargo" }
soldr-home = { scope = "stack", destination = "/root/.soldr" }
tools = { scope = "machine", destination = "/tools" }
artifact = { scope = "machine", destination = "/artifact" }

[stack.warm.mounts]
repo = { source = ".", destination = "/repo", readonly = true }

[task.strip-rematerialization-test]
stack = "cook"
cmd = "cd /repo && CARGO_TARGET_DIR=/target soldr cargo test -p soldr-cache cook_preset_preserves_build_script_binaries_for_rematerialization --lib"

[task.test]
stack = "cook"
cmd = "python3 /repo/ci/bosn_workspace_test.py"

[task.lint]
stack = "cook"
cmd = "cd /repo && CARGO_TARGET_DIR=/target /opt/soldr-bootstrap/bin/soldr cargo fmt --all -- --check && CARGO_TARGET_DIR=/target /opt/soldr-bootstrap/bin/soldr cargo clippy --workspace --all-targets -- -D warnings"

[task.platform-boundary]
stack = "cook"
cmd = "cd /repo && python3 .github/scripts/platform_cfg_boundary_ratchet.py"

[task.format]
stack = "cook"
cmd = "cd /repo && CARGO_TARGET_DIR=/target /opt/soldr-bootstrap/bin/soldr cargo fmt --all"

[task.ci-test-acceptance]
stack = "cook"
cmd = "cd /repo && CARGO_TARGET_DIR=/target /opt/soldr-bootstrap/bin/soldr cargo nextest run -p soldr-cli --test guards -E 'test(/^cli_ci_test::/)'"

[task.ci-test-archive-smoke]
stack = "cook"
cmd = "cd /repo && CARGO_TARGET_DIR=/target /opt/soldr-bootstrap/bin/soldr cargo build -p soldr-cli --bin soldr && CARGO_TARGET_DIR=/target /target/debug/soldr ci-test --no-run --target x86_64-unknown-linux-gnu --package soldr-core"

[task.windows-guest-probe-contract]
stack = "cook"
cmd = "cd /repo && uv run --no-project --with pytest --with pyyaml pytest -q tests/test_windows_guest_probe.py tests/test_cross_compile_workflows.py"

[task.windows-guest-probe-lint]
stack = "cook"
cmd = "cd /repo && uv run --no-project --with 'ruff==0.12.12' ruff check ci/windows_guest_probe.py tests/test_windows_guest_probe.py && uv run --no-project --with black black --check --target-version py310 ci/windows_guest_probe.py tests/test_windows_guest_probe.py && uv run --no-project --with isort isort --check-only ci/windows_guest_probe.py tests/test_windows_guest_probe.py && uv run --no-project --with flake8 flake8 ci/windows_guest_probe.py tests/test_windows_guest_probe.py && uv run --no-project --with pylint pylint ci/windows_guest_probe.py && uv run --no-project --with pylint --with pytest pylint --rcfile=tests/.pylintrc tests/test_windows_guest_probe.py && uv run --no-project --with mypy --with pytest mypy ci/windows_guest_probe.py tests/test_windows_guest_probe.py && uv run --no-project --with pyyaml python .github/scripts/check_workflow_python_pin.py"

[task.windows-guest-probe-format]
stack = "cook"
cmd = "cd /repo && uv run --no-project --with isort isort ci/windows_guest_probe.py tests/test_windows_guest_probe.py && uv run --no-project --with black black --target-version py310 ci/windows_guest_probe.py tests/test_windows_guest_probe.py"

[task.macos-recovery-executor-contract]
stack = "cook"
cmd = "cd /repo && uv run --no-project --with pytest pytest -q tests/test_macos_recovery_run.py tests/test_macos_recovery_lane_contract.py tests/test_cross_compile_workflows.py"

[task.macos-recovery-executor-contract-lint]
stack = "cook"
cmd = "cd /repo && uv run --no-project --with 'ruff==0.12.12' ruff check ci/macos_recovery_run.py tests/test_macos_recovery_run.py tests/test_macos_recovery_lane_contract.py"

[task.macos-arm64-release-contract]
stack = "cook"
cmd = "cd /repo && uv run --no-project --with pytest pytest -q tests/test_release_execution_contract.py tests/test_release_completeness.py tests/test_canonical_target_contract.py tests/test_cross_compile_workflows.py tests/test_release_yaml_ratchet.py && uv run --no-project --python 3.13 --with pyyaml python .github/scripts/check_workflow_python_pin.py"

[task.macos-arm64-release-contract-lint]
stack = "cook"
cmd = "cd /repo && uv run --no-project --with 'ruff==0.12.12' ruff check .github/scripts/release_completeness.py .github/scripts/release_manifest.py .github/scripts/verify_release_manifest.py tests/test_release_execution_contract.py && uv run --no-project --with 'pylint>=4.0,<5' --with 'pytest>=8.0' --with 'pyyaml>=6,<7' python -m pylint --rcfile=tests/.pylintrc tests && uv run --no-project --with 'pylint>=4.0,<5' --with 'pytest>=8.0' --with 'pyyaml>=6,<7' python -m pylint .github/scripts/release_completeness.py .github/scripts/release_manifest.py .github/scripts/verify_release_manifest.py && uv run --no-project --with 'mypy>=1.18,<2' --with 'pytest>=8.0' --with types-PyYAML python -m mypy .github/scripts/release_completeness.py .github/scripts/release_manifest.py .github/scripts/verify_release_manifest.py tests/test_release_execution_contract.py tests/test_release_manifest.py"

[task.macos-arm64-release-provenance]
stack = "cook"
cmd = "cd /repo && uv run --no-project --with pytest pytest -q tests/test_release_manifest.py .github/scripts/test_verify_release_manifest.py tests/test_release_execution_contract.py tests/test_zccache_runtime_contract.py"

[task.macos-x64-wheel-smoke-contract]
stack = "cook"
cmd = "cd /repo && uv run --no-project --with pytest pytest -q tests/test_smoke_release_artifacts.py tests/test_macos_recovery_lane_contract.py tests/test_cross_compile_workflows.py"

[task.ci-test-report-unit]
stack = "cook"
cmd = "cd /repo && CARGO_TARGET_DIR=/target /opt/soldr-bootstrap/bin/soldr cargo test -p soldr-daemon ci_test_report && CARGO_TARGET_DIR=/target /opt/soldr-bootstrap/bin/soldr cargo test -p soldr-cli ci_test::execute::tests::report_summary_groups_repeated_normalized_identities"

[task.publication-shutdown-regression]
stack = "cook"
cmd = "cd /repo && CARGO_TARGET_DIR=/target /opt/soldr-bootstrap/bin/soldr cargo test -p soldr-daemon shutdown_waits_for_compile_publication_and_closes_admission"

[task.ci-test-proof]
stack = "cook"
cmd = "cd /repo && CARGO_TARGET_DIR=/target CARGO_BUILD_JOBS=1 SOLDR_JOBS=1 /opt/soldr-bootstrap/bin/soldr cargo build -p soldr-cli --bin soldr && CARGO_TARGET_DIR=/target CARGO_BUILD_JOBS=1 SOLDR_JOBS=1 /target/debug/soldr ci-test"

[task.hydrate-alias-test]
stack = "cook"
cmd = "cd /repo && CARGO_TARGET_DIR=/target /opt/soldr-bootstrap/bin/soldr cargo test -p soldr-cli --test toolchain_env cli_save::hydrate_primary_and_load_alias_restore_the_same_archive"

[task.test-rematerialization]
stack = "cook"
cmd = "cd /repo && CARGO_TARGET_DIR=/target /opt/soldr-bootstrap/bin/soldr cargo test -p soldr-cache --lib && CARGO_TARGET_DIR=/target /opt/soldr-bootstrap/bin/soldr cargo test -p soldr-cli --lib cook::tests:: && CARGO_TARGET_DIR=/target /opt/soldr-bootstrap/bin/soldr cargo test -p soldr-cli --test toolchain_env cli_save::"

[task.clippy-rematerialization]
stack = "cook"
cmd = "cd /repo && CARGO_TARGET_DIR=/target /opt/soldr-bootstrap/bin/soldr cargo clippy -p soldr-cache -p soldr-cli --all-targets -- -D warnings"

[task.build-rematerialization-tool]
stack = "cook"
cmd = "bash /repo/ci/cook_rematerialization/build_tool.sh"

[task.generate-rematerialization-lock]
stack = "cook"
cmd = "bash /repo/ci/cook_rematerialization/generate_lock.sh"

[task.seed-rematerialization]
stack = "seed"
cmd = "bash /repo/ci/cook_rematerialization/seed.sh"

[task.verify-rematerialization]
stack = "warm"
cmd = "bash /repo/ci/cook_rematerialization/verify_warm.sh"
