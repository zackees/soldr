[package]
name = "sqlite-link-app"
version = "0.1.0"
edition = "2021"

# Standalone workspace — see ../medium/Cargo.toml for rationale.
[workspace]

[dependencies]
# `bundled` makes rusqlite compile libsqlite3 from source via cc-rs.
# That introduces a C build script into the dep graph, which has a
# completely different fingerprint surface than pure Rust crates —
# the whole point of this fixture.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.dev]
# Pin debug/incremental so cold/warm/bare measure the same thing.
# soldr forces `debug = false` on managed cargo builds; without this
# block bare cargo would default `debug = true` and pay for debuginfo
# work the cold scenario skipped, inflating the cold-minus-bare gap
# and lying about real soldr overhead. See L8 in soldr#980.
debug = false
incremental = false

[profile.release]
codegen-units = 16
lto = false
