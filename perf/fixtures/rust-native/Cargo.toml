[package]
name = "rust-native-benchmark"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[workspace]

[build-dependencies]
cc = "1"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[[bin]]
name = "rust-native"
path = "src/main.rs"
