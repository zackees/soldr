name: Perf Matrix

# See PERF.md (root of repo) for the user-facing branch-naming
# convention and the full per-branch scope table. perf/README.md
# explains the per-scenario design rationale.
#
# Triggered by `workflow_dispatch` (manual button) and by pushes to
# `main` / `perf/**` / `evaluate/**`. ci.yml has a matching
# `branches-ignore` so perf branches only run this workflow.
#
# Effective scope is computed by the `setup` job from the branch
# name (hierarchical `perf/<plat>-<fix>-<scen>`) on push events, or
# from the dispatch inputs on workflow_dispatch events. Downstream
# build-soldr / bench / evaluate gates consult
# `needs.setup.outputs.{platforms,fixtures,scenarios}`.

on:
  workflow_dispatch:
    inputs:
      platforms:
        # mac-x86 is intentionally not listed (Intel macs are EOL on
        # GHA's roadmap). Until a matrix row exists for a given
        # platform its cells gate themselves out via the
        # bench/build-soldr gate steps, so the dispatch UI stays
        # stable as cross-platform RSS pollers land in
        # perf/lib/common.sh.
        description: Platform subset
        type: choice
        required: true
        default: linux
        options:
          - all
          - linux
          - mac-arm
          - win
      fixtures:
        description: Fixture subset
        type: choice
        required: true
        default: all
        options:
          - all
          - medium
          - sqlite-link
      scenarios:
        # Single-select dropdown to match the platforms / fixtures
        # shape. Arbitrary subsets (e.g. "cold + worktree but not
        # touch") aren't expressible here today — pick `all` or one
        # specific scenario. If subsets become a regular need, swap
        # back to per-scenario booleans.
        description: Scenario subset
        type: choice
        required: true
        default: all
        options:
          - all
          - cold-tar-untar-warm
          - worktree-share
          - touch-no-change
          - build-then-check
      # The `debug` input was removed: verbose tracing + raw RSS CSV
      # retention is now always on. The downstream consumer sets
      # SOLDR_DEBUG=1 unconditionally.
  push:
    branches:
      - main
      - 'perf/**'
      - 'evaluate/**'
    paths:
      - '.github/workflows/perf-matrix.yml'
      - 'perf/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  # soldr#1213 — nightly cron so an active day always produces at least one
  # perf sweep. The gate below inverts to schedule mode on this trigger:
  # runs only if there was at least one non-bot commit on main in the last
  # 24h. 4:23 UTC deliberately staggered from benchmark-stats' 3:17 slot so
  # the two nightly runs don't collide on shared runners.
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: read

env:
  # soldr#1322 — soldr's zccache/crgx fetch reads SOLDR_GITHUB_TOKEN
  # for authenticated GitHub Releases lookups (5,000/hr) instead of
  # unauthenticated (60/hr per runner IP). Follow-up to #1319 / #1323 /
  # #1326 / #1328 / #1329. Every step in this perf harness that
  # invokes soldr (build-soldr, benchmark, evaluate) inherits it.
  SOLDR_GITHUB_TOKEN: ${{ github.token }}

concurrency:
  # Never cancel a perf run in flight — every measurement is a data
  # point we want to keep, even if a follow-up push lands before this
  # one finishes. Runs queue per-ref instead of superseding.
  group: perf-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # soldr#1203 + soldr#1213 — Perf Matrix reconciles two concerns:
  #
  #   * push:main — active-dev bursts would run the full sweep on every
  #     merge. Skip when the last non-bot commit on main is < 24h old.
  #   * schedule — nightly cron. Run when there WAS at least one non-bot
  #     commit on main in the last 24h (active day → benchmark it).
  #     Skip on quiet days.
  #   * workflow_dispatch — explicit human request, always run.
  #   * perf/** / evaluate/** branch pushes — feature-branch iteration,
  #     always run (dev is watching each push).
  #
  # Net: one perf sweep per day of activity on main, plus every dispatch
  # and every feature-branch push. Zero per burst, zero per quiet day.
  gate:
    # Coordination only; observed 0.1 min across 20 runs. soldr#1978 item 8.
    timeout-minutes: 15
    name: Decide whether to run
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      reason:     ${{ steps.check.outputs.reason }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 250
      - name: Evaluate activity gate
        id: check
        shell: bash
        run: |
          set -euo pipefail
          # workflow_dispatch: explicit human request → always run.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "workflow_dispatch — bypassing gate; run unconditionally."
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "reason=bypass: workflow_dispatch" >> "$GITHUB_OUTPUT"
              exit 0
          fi
          # perf/** or evaluate/** feature-branch pushes → always run.
          # (These branches are only reachable via push, so this check
          # only applies to that event.)
          ref='${{ github.ref }}'
          case "$ref" in
            refs/heads/perf/*|refs/heads/evaluate/*)
              echo "Ref is $ref — perf/eval feature branch bypasses gate; run unconditionally."
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "reason=bypass: feature-branch ref=$ref" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          # Remaining code paths: main-branch push OR nightly schedule.
          case "${{ github.event_name }}" in
            schedule)
              python3 .github/scripts/perf_gate.py --mode schedule --hours 24
              ;;
            push)
              python3 .github/scripts/perf_gate.py --mode push --hours 24
              ;;
            *)
              echo "Unknown event ${{ github.event_name }} — running to be safe."
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "reason=bypass: unknown event=${{ github.event_name }}" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

  setup:
    # Scope resolution only; observed 0.1 min across 20 runs. soldr#1978 item 8.
    timeout-minutes: 15
    # Resolve the effective (platforms, fixtures, scenarios) scope
    # once and pipe the result to every downstream gate via job
    # outputs. Two sources:
    #
    # 1. `workflow_dispatch` -> use the dispatch inputs verbatim.
    # 2. `push` -> parse the branch name. `main` and `perf/all` are
    #    full-sweep aliases. `perf/<P>-<F>-<S>` narrows on the named
    #    axis tokens (see PERF.md for the full table). Unknown
    #    perf/* branches fall back to a full sweep with an
    #    `::notice::` so the dev still gets useful data while
    #    iterating on a feature branch.
    name: setup
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.parse.outputs.platforms }}
      fixtures:  ${{ steps.parse.outputs.fixtures }}
      scenarios: ${{ steps.parse.outputs.scenarios }}
      source:    ${{ steps.parse.outputs.source }}
    steps:
      - name: Parse scope
        id: parse
        env:
          EVENT:    ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          IN_PLAT:  ${{ inputs.platforms }}
          IN_FIX:   ${{ inputs.fixtures }}
          IN_SCEN:  ${{ inputs.scenarios }}
        run: |
          set -euo pipefail

          PLAT="all"; FIX="all"; SCEN="all"; SOURCE="default"

          if [[ "${EVENT}" == "workflow_dispatch" ]]; then
            PLAT="${IN_PLAT:-linux}"
            FIX="${IN_FIX:-all}"
            SCEN="${IN_SCEN:-all}"
            SOURCE="dispatch"
          else
            case "${REF_NAME}" in
              main|perf/all)
                SOURCE="alias:${REF_NAME}"
                ;;
              perf/*)
                triple="${REF_NAME#perf/}"
                # Strict 3-token split. Branches with fewer or more
                # tokens fall through to the unknown-branch arm.
                IFS='-' read -r tp tf ts rest <<<"${triple}"
                bad=0
                # Platform token
                case "${tp}" in
                  all|linux|win) plat="${tp}" ;;
                  mac)           plat="mac-arm" ;;
                  *)             bad=1 ;;
                esac
                # Fixture token
                case "${tf}" in
                  all|medium) fix="${tf}" ;;
                  sqlite)     fix="sqlite-link" ;;
                  *)          bad=1 ;;
                esac
                # Scenario token
                case "${ts}" in
                  all)       scen="all" ;;
                  cold)      scen="cold-tar-untar-warm" ;;
                  worktree)  scen="worktree-share" ;;
                  touch)     scen="touch-no-change" ;;
                  crossverb) scen="build-then-check" ;;
                  *)         bad=1 ;;
                esac
                if [[ -n "${rest}" || "${bad}" == "1" ]]; then
                  echo "::notice::Branch '${REF_NAME}' does not match perf/<plat>-<fix>-<scen>; running full sweep. See PERF.md."
                  SOURCE="unknown-perf:${REF_NAME}"
                else
                  PLAT="${plat}"; FIX="${fix}"; SCEN="${scen}"
                  SOURCE="branch:${REF_NAME}"
                fi
                ;;
              *)
                # evaluate/** and anything else covered by the push
                # filter that isn't main/perf — run full.
                SOURCE="non-perf:${REF_NAME}"
                ;;
            esac
          fi

          {
            echo "## Scope"
            echo ""
            echo "| axis | value |"
            echo "| --- | --- |"
            echo "| event | ${EVENT} |"
            echo "| ref | ${REF_NAME} |"
            echo "| source | ${SOURCE} |"
            echo "| platforms | ${PLAT} |"
            echo "| fixtures | ${FIX} |"
            echo "| scenarios | ${SCEN} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "platforms=${PLAT}" >> "$GITHUB_OUTPUT"
          echo "fixtures=${FIX}"   >> "$GITHUB_OUTPUT"
          echo "scenarios=${SCEN}" >> "$GITHUB_OUTPUT"
          echo "source=${SOURCE}"  >> "$GITHUB_OUTPUT"

  build-soldr:
    # Observed max 6.0 min across 20 runs, so ~7x headroom. soldr#1978 item 8.
    timeout-minutes: 45
    needs: setup
    name: build-soldr (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        # Currently ships linux only; win / mac-arm / mac-x86 rows
        # drop in here once perf/lib/common.sh has cross-platform
        # RSS pollers. The dispatch input still accepts those names
        # so the surface stays stable.
        include:
          - platform: linux
            runs_on: ubuntu-24.04
    runs-on: ${{ matrix.runs_on }}
    steps:
      # Platform gate is a step (not job-level `if:`) because GHA
      # rejects `matrix.X` references in job-level `if:` expressions
      # with "Unrecognized named-value: 'matrix'", even though the
      # same context is available at `runs-on:` and inside step
      # `if:` blocks. Mirrors the gate-step pattern used by the
      # bench job below.
      - name: Gate cell against resolved scope
        id: gate
        env:
          REQ_PLATFORMS: ${{ needs.setup.outputs.platforms }}
          M_PLATFORM:    ${{ matrix.platform }}
        run: |
          if [[ "${REQ_PLATFORMS}" == "all" ]] \
             || [[ ",${REQ_PLATFORMS}," == *",${M_PLATFORM},"* ]]; then
            echo "selected=true" >> "$GITHUB_OUTPUT"
          else
            echo "selected=false" >> "$GITHUB_OUTPUT"
            echo "Platform ${M_PLATFORM} not in scope '${REQ_PLATFORMS}'; skipping build." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.gate.outputs.selected == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        if: steps.gate.outputs.selected == 'true'
        run: |
          rustup show active-toolchain || rustup toolchain install stable --profile minimal --no-self-update

      # Layer 1: actions/cache keyed by the source-of-truth files that
      # determine the soldr binary. Same source on the same platform =
      # zero-compile restore of the prebuilt binary. PRs that only
      # touch perf/ reuse a cached binary indefinitely.
      - name: Restore cached soldr binary
        if: steps.gate.outputs.selected == 'true'
        id: soldr-bin-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/release/soldr
          key: soldr-bin-${{ matrix.platform }}-${{ hashFiles('crates/**', 'Cargo.toml', 'Cargo.lock') }}

      # Layer 2: cache cargo intermediates (registry, target/) so a
      # cache-miss rebuild is incremental, not from scratch. Only
      # exercised when the binary cache misses. Soldr itself is NOT
      # used here on purpose — perf must work even when soldr is
      # broken or absent on a new platform.
      - name: Restore cargo intermediates
        if: steps.gate.outputs.selected == 'true' && steps.soldr-bin-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # soldr#1978 item 6 deliberately leaves this off the shared
          # `ws-<profile>-<target>` scheme -- this is the measurement lane
          # PERF.md calls the most important workflow in the repo, and its
          # cache namespace must stay private to it so an ordinary CI lane
          # cannot alter the state a perf run starts from.
          shared-key: perf-build-soldr-${{ matrix.platform }}

      - name: Build soldr (release)
        if: steps.gate.outputs.selected == 'true' && steps.soldr-bin-cache.outputs.cache-hit != 'true'
        run: cargo build --release -p soldr-cli

      - name: Stage binary
        if: steps.gate.outputs.selected == 'true'
        run: |
          mkdir -p soldr-artifact
          cp target/release/soldr soldr-artifact/soldr
          chmod +x soldr-artifact/soldr
          soldr-artifact/soldr version --json | tee soldr-artifact/version.json

      - name: Upload soldr binary
        if: steps.gate.outputs.selected == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: soldr-bin-${{ matrix.platform }}
          path: soldr-artifact/
          retention-days: 7

  bench:
    # Observed max 4.1 min, but only the medium and sqlite-link fixtures have
    # actually run; a heavier fixture legitimately takes longer, so this is
    # deliberately ~29x the observed max. It is a runaway backstop, not a
    # performance target. soldr#1978 item 8.
    timeout-minutes: 120
    name: bench (${{ matrix.platform }} / ${{ matrix.fixture }})
    needs: [setup, build-soldr]
    strategy:
      fail-fast: false
      matrix:
        platform: [linux]
        fixture: [medium, sqlite-link]
        include:
          - platform: linux
            runs_on: ubuntu-24.04
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Gate cell against resolved scope
        id: gate
        env:
          REQ_PLATFORMS: ${{ needs.setup.outputs.platforms }}
          REQ_FIXTURES:  ${{ needs.setup.outputs.fixtures }}
          REQ_SCENARIOS: ${{ needs.setup.outputs.scenarios }}
          M_PLATFORM:    ${{ matrix.platform }}
          M_FIXTURE:     ${{ matrix.fixture }}
        run: |
          in_subset() {
            local req="$1" val="$2"
            [[ "${req}" == "all" ]] && return 0
            [[ ",${req}," == *",${val},"* ]] && return 0
            return 1
          }

          # Cell is gated on (platform, fixture) only. Scenarios that
          # are not selected are filtered out of the per-cell loop
          # below, so a cell with zero selected scenarios still skips
          # the rest of the steps but does not consume bench-time.
          ALL_SCENARIOS="cold-tar-untar-warm worktree-share touch-no-change build-then-check"
          selected_scenarios=""
          for s in ${ALL_SCENARIOS}; do
            if in_subset "${REQ_SCENARIOS}" "${s}"; then
              selected_scenarios="${selected_scenarios:+${selected_scenarios} }${s}"
            fi
          done

          if in_subset "${REQ_PLATFORMS}" "${M_PLATFORM}" \
             && in_subset "${REQ_FIXTURES}" "${M_FIXTURE}" \
             && [[ -n "${selected_scenarios}" ]]; then
            echo "selected=true" >> "$GITHUB_OUTPUT"
            echo "scenarios=${selected_scenarios}" >> "$GITHUB_OUTPUT"
          else
            echo "selected=false" >> "$GITHUB_OUTPUT"
            echo "Cell (${M_PLATFORM}, ${M_FIXTURE}) not selected by dispatch inputs (or zero matching scenarios); skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.gate.outputs.selected == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        if: steps.gate.outputs.selected == 'true'
        run: |
          # Workers need cargo on PATH so soldr cargo can dispatch to
          # it. Soldr fetches/manages zccache itself on first use.
          rustup show active-toolchain || rustup toolchain install stable --profile minimal --no-self-update

      - name: Install fixture native deps
        if: steps.gate.outputs.selected == 'true' && matrix.fixture == 'sqlite-link'
        run: |
          # rusqlite's `bundled` feature compiles libsqlite3 from C
          # via cc-rs. ubuntu-24.04 ships gcc already, but be
          # explicit so a future image change does not silently break
          # this row.
          which gcc || sudo apt-get install -y gcc

      - name: Download soldr binary
        if: steps.gate.outputs.selected == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: soldr-bin-${{ matrix.platform }}
          path: soldr-bin

      - name: Stage soldr on PATH
        if: steps.gate.outputs.selected == 'true'
        run: |
          chmod +x soldr-bin/soldr
          mkdir -p "$HOME/.local/bin"
          cp soldr-bin/soldr "$HOME/.local/bin/soldr"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify soldr is the artifact build
        if: steps.gate.outputs.selected == 'true'
        run: |
          which soldr
          soldr version --json

      - name: Run selected scenarios
        if: steps.gate.outputs.selected == 'true'
        id: run
        env:
          # Verbose tracing + raw RSS CSV retention always on — no
          # dispatch toggle. Saves the cost of a missed debug flag
          # the next time something breaks.
          SOLDR_DEBUG: "1"
          SELECTED_SCENARIOS: ${{ steps.gate.outputs.scenarios }}
          M_PLATFORM: ${{ matrix.platform }}
          M_FIXTURE: ${{ matrix.fixture }}
        run: |
          set -o pipefail

          out_root="${RUNNER_TEMP}/perf-${M_PLATFORM}-${M_FIXTURE}"
          rm -rf "${out_root}"
          mkdir -p "${out_root}"
          echo "out_root=${out_root}" >> "$GITHUB_OUTPUT"

          # One header for the cell; each scenario appends a row via
          # measure::append_summary_md.
          {
            echo "## ${M_PLATFORM} / ${M_FIXTURE}"
            echo
            echo "| scenario | cold/A ms | warm/B ms | speedup | hits/misses | hit rate | peak daemon RSS |"
            echo "| --- | --- | --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          status=0
          for scenario in ${SELECTED_SCENARIOS}; do
            # Per-scenario workdir keeps cache dirs / tarball / RSS
            # CSV isolated even though all scenarios share this runner.
            workdir="${out_root}/${scenario}"
            mkdir -p "${workdir}"
            bash perf/lib/extract.sh "${M_FIXTURE}" "${workdir}"

            echo "::group::scenario: ${scenario}"
            if bash "perf/scenarios/${scenario}/run.sh" "${workdir}/${M_FIXTURE}" \
                 | tee "${workdir}/result.json"; then
              :
            else
              # Don't abort the loop on a single scenario failure —
              # the other scenarios on this fixture are independent
              # signals worth collecting. Final exit status reflects
              # the worst case.
              echo "scenario ${scenario} failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "${status}"

      - name: Upload raw results
        if: steps.gate.outputs.selected == 'true' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: perf-results-${{ matrix.platform }}-${{ matrix.fixture }}
          path: |
            ${{ steps.run.outputs.out_root }}/*/result.json
            ${{ steps.run.outputs.out_root }}/*/cargo-*.jsonl
            ${{ steps.run.outputs.out_root }}/*/*-shutdown.json
            ${{ steps.run.outputs.out_root }}/*/rss-*.csv
            ${{ steps.run.outputs.out_root }}/*/warm-cache-report.json
            ${{ steps.run.outputs.out_root }}/*/cold-cache-report.json
            ${{ steps.run.outputs.out_root }}/*/warm-zccache-logs/**
            ${{ steps.run.outputs.out_root }}/*/cold-zccache-logs/**
          if-no-files-found: warn
          retention-days: 14

  evaluate:
    # Downloads artifacts and compares; observed 0.1 min. soldr#1978 item 8.
    timeout-minutes: 20
    # Per-platform gate: pull every fixture's artifact for this
    # platform via `pattern: perf-results-<platform>-*` and iterate
    # (fixture x scenario) internally. One Evaluate check per
    # platform (max 3 when win and mac-arm matrix rows land alongside
    # linux). Every scenario is currently soft (::warning::) — every
    # scenario has an untrusted or actively-regressed baseline right
    # now, so a hard gate would fail every run without adding signal.
    # cold-tar-untar-warm's demotion is tracked in soldr#1148 and
    # gets re-promoted when soldr#1146's root cause lands.
    name: Evaluate ${{ matrix.platform }}
    needs: [setup, bench]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runs_on: ubuntu-24.04
            min_speedup: "3.0"
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Gate cell against resolved scope
        id: gate
        env:
          REQ_PLATFORMS: ${{ needs.setup.outputs.platforms }}
          M_PLATFORM:    ${{ matrix.platform }}
        run: |
          in_subset() {
            local req="$1" val="$2"
            [[ "${req}" == "all" ]] && return 0
            [[ ",${req}," == *",${val},"* ]] && return 0
            return 1
          }

          # Fixture/scenario subsetting is done inside the evaluate
          # step (via needs.setup.outputs). The cell-level gate only
          # decides whether this whole platform's evaluator runs.
          if in_subset "${REQ_PLATFORMS}" "${M_PLATFORM}"; then
            echo "selected=true" >> "$GITHUB_OUTPUT"
          else
            echo "selected=false" >> "$GITHUB_OUTPUT"
            echo "Evaluate (${M_PLATFORM}) not selected by dispatch inputs; skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download all perf results for ${{ matrix.platform }}
        if: steps.gate.outputs.selected == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          # Glob across every fixture bench cell ran for this
          # platform. v4's `pattern:` keeps each artifact's
          # subdirectory under `perf-results/` so the scenario
          # lookup below stays unambiguous.
          pattern: perf-results-${{ matrix.platform }}-*
          path: perf-results

      - name: Evaluate scenarios for ${{ matrix.platform }}
        if: steps.gate.outputs.selected == 'true'
        env:
          MIN_SPEEDUP:   ${{ matrix.min_speedup }}
          # Minimum warm Rust hit rate for the C-floored `sqlite-link`
          # cold-tar-untar-warm cell (see mode_for + the hit-rate gate
          # below). soldr is RUSTC_WRAPPER-only, so the bundled-libsqlite3
          # C compile is never cached and caps that fixture's speedup near
          # ~1.2x — the Rust hit rate, not speedup, is what proves the
          # restored cache still serves. Healthy runs sit at ~0.93-1.0.
          MIN_HIT_RATE:  "0.80"
          REQ_FIXTURES:  ${{ needs.setup.outputs.fixtures }}
          REQ_SCENARIOS: ${{ needs.setup.outputs.scenarios }}
          M_PLATFORM:    ${{ matrix.platform }}
        run: |
          set -uo pipefail

          in_subset() {
            local req="$1" val="$2"
            [[ "${req}" == "all" ]] && return 0
            [[ ",${req}," == *",${val},"* ]] && return 0
            return 1
          }

          # scenario -> "fail" or "warn".
          #
          # cold-tar-untar-warm re-promoted to `fail` (#1286, closing
          # out the #1146/#1148 demotion): the ~1.20x plateau was the
          # embedded zccache's artifact index + depgraph being
          # memory-only in soldr-daemon when `soldr save` archived the
          # cache tree — the restored cache served zero rustc hits.
          # `soldr save` / `cache flush` / `cache shutdown` now
          # checkpoint the embedded state (Request::FlushCaches), so a
          # sub-threshold speedup here is a real regression again.
          # cold-tar-untar-warm is hard-gated on SPEEDUP for the Rust-only
          # `medium` fixture: a sub-MIN_SPEEDUP result there means the
          # restored cache stopped serving rustc hits (the #1146/#1148
          # "zero rustc hits" regression). For `sqlite-link` the warm build
          # is FLOORED by the ~40s bundled-libsqlite3 C compile (cc-rs ->
          # gcc, NOT wrapped by zccache, which is RUSTC_WRAPPER-only), so
          # even a 100%-Rust-hit warm build tops out near ~1.2x
          # (touch-no-change: 100% hits, still 1.16x). Speedup is the wrong
          # metric there — that cell is gated on the Rust HIT RATE instead
          # (see the MIN_HIT_RATE block below) and speedup is informational.
          mode_for() {
            local fixture="$1" scenario="$2"
            case "${scenario}" in
              cold-tar-untar-warm)
                if [[ "${fixture}" == "sqlite-link" ]]; then echo "warn"; else echo "fail"; fi ;;
              worktree-share|touch-no-change|build-then-check) echo "warn" ;;
              *) echo "warn" ;;
            esac
          }

          # Each scenario emits a different (cold_key, warm_key) pair.
          # Centralizing here keeps the assertion loop scenario-agnostic.
          cold_key_for() {
            case "$1" in
              worktree-share) echo "a_ms" ;;
              *) echo "cold_ms" ;;
            esac
          }
          warm_key_for() {
            case "$1" in
              worktree-share) echo "b_ms" ;;
              *) echo "warm_ms" ;;
            esac
          }
          hits_key_for() {
            case "$1" in
              worktree-share) echo "b_hits" ;;
              *) echo "warm_hits" ;;
            esac
          }
          misses_key_for() {
            case "$1" in
              worktree-share) echo "b_misses" ;;
              *) echo "warm_misses" ;;
            esac
          }

          {
            echo "## Evaluate ${M_PLATFORM}"
            echo
            echo "| fixture | scenario | cold ms | warm ms | speedup | hits/misses | threshold | mode | result |"
            echo "| --- | --- | --- | --- | --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          status=0
          for fixture in medium sqlite-link; do
            if ! in_subset "${REQ_FIXTURES}" "${fixture}"; then
              echo "fixture ${fixture} not selected by dispatch input / branch narrowing; skipping"
              continue
            fi

            # download-artifact@v4 with `pattern:` lays each artifact
            # under its own subdir: perf-results/perf-results-<plat>-<fixt>/.
            fixture_root="perf-results/perf-results-${M_PLATFORM}-${fixture}"
            if [[ ! -d "${fixture_root}" ]]; then
              echo "::warning::no artifact for fixture ${fixture} on ${M_PLATFORM} — bench cell likely skipped"
              continue
            fi

            for scenario in cold-tar-untar-warm worktree-share touch-no-change build-then-check; do
              if ! in_subset "${REQ_SCENARIOS}" "${scenario}"; then
                echo "scenario ${scenario} not selected by dispatch input; skipping"
                continue
              fi

              mode="$(mode_for "${fixture}" "${scenario}")"
              cold_key="$(cold_key_for "${scenario}")"
              warm_key="$(warm_key_for "${scenario}")"
              hits_key="$(hits_key_for "${scenario}")"
              misses_key="$(misses_key_for "${scenario}")"

              result_json="$(find "${fixture_root}" -type f -path "*/${scenario}/result.json" | head -n1)"
              if [[ -z "${result_json}" ]]; then
                echo "| ${fixture} | ${scenario} | - | - | - | - | >= ${MIN_SPEEDUP}x | ${mode} | MISSING |" >> "$GITHUB_STEP_SUMMARY"
                if [[ "${mode}" == "fail" ]]; then
                  echo "::error::${scenario}/result.json not found in ${fixture} artifact"
                  status=1
                else
                  echo "::warning::${scenario}/result.json not found in ${fixture} artifact"
                fi
                continue
              fi

              cold_ms="$(jq -r --arg k "${cold_key}" '.[$k] // empty' "${result_json}")"
              warm_ms="$(jq -r --arg k "${warm_key}" '.[$k] // empty' "${result_json}")"

              if [[ -z "${cold_ms}" || -z "${warm_ms}" ]]; then
                echo "| ${fixture} | ${scenario} | ${cold_ms:--} | ${warm_ms:--} | - | - | >= ${MIN_SPEEDUP}x | ${mode} | BAD-JSON |" >> "$GITHUB_STEP_SUMMARY"
                if [[ "${mode}" == "fail" ]]; then
                  echo "::error::${fixture}/${scenario} result.json missing ${cold_key}/${warm_key}"
                  status=1
                else
                  echo "::warning::${fixture}/${scenario} result.json missing ${cold_key}/${warm_key}"
                fi
                continue
              fi

              # Treat a 0ms warm build as a measurement bug, not a win.
              if (( warm_ms <= 0 )); then
                echo "| ${fixture} | ${scenario} | ${cold_ms} | ${warm_ms} | - | - | >= ${MIN_SPEEDUP}x | ${mode} | BAD-WARM |" >> "$GITHUB_STEP_SUMMARY"
                if [[ "${mode}" == "fail" ]]; then
                  echo "::error::${fixture}/${scenario} ${warm_key}=${warm_ms} is non-positive"
                  status=1
                else
                  echo "::warning::${fixture}/${scenario} ${warm_key}=${warm_ms} is non-positive"
                fi
                continue
              fi

              hits="$(jq -r --arg k "${hits_key}" '.[$k] // empty' "${result_json}")"
              misses="$(jq -r --arg k "${misses_key}" '.[$k] // empty' "${result_json}")"
              if [[ -z "${hits}" || -z "${misses}" ]]; then
                echo "| ${fixture} | ${scenario} | ${cold_ms} | ${warm_ms} | - | ${hits:--}/${misses:--} | >= ${MIN_SPEEDUP}x | ${mode} | BAD-STATS |" >> "$GITHUB_STEP_SUMMARY"
                echo "::error::${fixture}/${scenario} result.json missing ${hits_key}/${misses_key}"
                status=1
                continue
              fi
              if (( hits + misses <= 0 )); then
                echo "| ${fixture} | ${scenario} | ${cold_ms} | ${warm_ms} | - | ${hits}/${misses} | >= ${MIN_SPEEDUP}x | ${mode} | BAD-STATS |" >> "$GITHUB_STEP_SUMMARY"
                # Issue #761: respect mode_for so soft scenarios don't
                # hard-fail the workflow on a missing-stats finding. The
                # hard gate (cold-tar-untar-warm when restored) still
                # errors here as designed.
                if [[ "${mode}" == "fail" ]]; then
                  echo "::error::${fixture}/${scenario} reported ${hits_key}+${misses_key}=0; zccache stats were not captured"
                  status=1
                else
                  echo "::warning::${fixture}/${scenario} reported ${hits_key}+${misses_key}=0; zccache stats were not captured; soft gate — not failing today"
                fi
                continue
              fi

              speedup="$(awk -v c="${cold_ms}" -v w="${warm_ms}" 'BEGIN { printf "%.2f", c / w }')"
              pass="$(awk -v s="${speedup}" -v t="${MIN_SPEEDUP}" 'BEGIN { print (s >= t) ? "1" : "0" }')"

              if [[ "${pass}" == "1" ]]; then
                echo "| ${fixture} | ${scenario} | ${cold_ms} | ${warm_ms} | ${speedup}x | ${hits}/${misses} | >= ${MIN_SPEEDUP}x | ${mode} | PASS |" >> "$GITHUB_STEP_SUMMARY"
                echo "${fixture}/${scenario}: ${speedup}x >= ${MIN_SPEEDUP}x — PASS"
              else
                if [[ "${mode}" == "fail" ]]; then
                  echo "| ${fixture} | ${scenario} | ${cold_ms} | ${warm_ms} | ${speedup}x | ${hits}/${misses} | >= ${MIN_SPEEDUP}x | fail | FAIL |" >> "$GITHUB_STEP_SUMMARY"
                  echo "::error::${fixture}/${scenario} only ${speedup}x faster (need >= ${MIN_SPEEDUP}x)"
                  status=1
                else
                  echo "| ${fixture} | ${scenario} | ${cold_ms} | ${warm_ms} | ${speedup}x | ${hits}/${misses} | >= ${MIN_SPEEDUP}x | warn | WARN |" >> "$GITHUB_STEP_SUMMARY"
                  echo "::warning::${fixture}/${scenario} only ${speedup}x faster (need >= ${MIN_SPEEDUP}x); soft gate — not failing today"
                fi
              fi

              # Hard hit-rate gate for the C-floored sqlite-link cell. Its
              # speedup can't reach MIN_SPEEDUP (uncached bundled-libsqlite3
              # C compile dominates warm_ms), so speedup is warn-only above —
              # but the restored Rust cache MUST still serve. If it stops
              # (the #1146/#1148 "zero rustc hits" regression) the hit rate
              # craters, and that we DO hard-fail on.
              if [[ "${fixture}" == "sqlite-link" && "${scenario}" == "cold-tar-untar-warm" ]]; then
                hit_rate="$(awk -v h="${hits}" -v m="${misses}" 'BEGIN { t=h+m; printf "%.4f", (t>0)? h/t : 0 }')"
                hr_pass="$(awk -v r="${hit_rate}" -v t="${MIN_HIT_RATE}" 'BEGIN { print (r >= t) ? "1" : "0" }')"
                if [[ "${hr_pass}" == "1" ]]; then
                  echo "| ${fixture} | ${scenario} | ${cold_ms} | ${warm_ms} | ${speedup}x | ${hits}/${misses} | hit-rate >= ${MIN_HIT_RATE} | fail | PASS |" >> "$GITHUB_STEP_SUMMARY"
                  echo "${fixture}/${scenario}: Rust hit-rate ${hit_rate} >= ${MIN_HIT_RATE} — PASS (speedup ${speedup}x C-floored, informational)"
                else
                  echo "| ${fixture} | ${scenario} | ${cold_ms} | ${warm_ms} | ${speedup}x | ${hits}/${misses} | hit-rate >= ${MIN_HIT_RATE} | fail | FAIL |" >> "$GITHUB_STEP_SUMMARY"
                  echo "::error::${fixture}/${scenario} Rust hit-rate ${hit_rate} < ${MIN_HIT_RATE} — restored cache is not serving rustc hits (regression)"
                  status=1
                fi
              fi
            done
          done

          exit "${status}"
