name: Windows GNU MinGW Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "src/**"
      - ".github/scripts/**"
      - ".github/workflows/windows-gnu-mingw-validation.yml"
  schedule:
    - cron: "17 10 * * 0"

permissions:
  contents: read

concurrency:
  group: windows-gnu-mingw-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  running-process:
    name: running-process on x86_64-pc-windows-gnu
    runs-on: windows-2025
    timeout-minutes: 240
    env:
      SOLDR_GITHUB_TOKEN: ${{ github.token }}
      # Use explicit soldr cache-layer opt-outs instead of the global
      # ZCCACHE_DISABLE kill switch. #1409 validated that disabling only
      # native cc-rs wrapping was not enough on hosted Windows GNU: the
      # rustc wrapper path also stayed far slower than the direct build.
      SOLDR_RUSTC_WRAPPER: "none"
      SOLDR_NATIVE_CACHE: "0"
      TARGET: x86_64-pc-windows-gnu
    steps:
      - name: Checkout soldr
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.94.1
          targets: ${{ env.TARGET }}

      - name: Use isolated soldr cache
        shell: pwsh
        run: |
          "SOLDR_CACHE_DIR=$env:RUNNER_TEMP\soldr-cache" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build soldr from checkout
        shell: pwsh
        env:
          RUSTC_WRAPPER: ""
        run: |
          cargo build --package soldr-cli --release --locked
          "${{ github.workspace }}\target\release" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Checkout running-process
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: zackees/running-process
          path: running-process
          submodules: recursive

      - name: Prepare managed MinGW-w64 GCC
        shell: pwsh
        run: |
          soldr --version
          soldr prepare --target $env:TARGET --github-env $env:GITHUB_ENV

      - name: Verify managed gcc is on PATH
        shell: pwsh
        run: |
          $gcc = (where.exe gcc | Select-Object -First 1).Trim()
          if (-not $gcc) {
            throw "gcc was not found on PATH after soldr prepare"
          }
          $expected = Join-Path $env:MINGW_W64_GCC_BIN "gcc.exe"
          if (-not [StringComparer]::OrdinalIgnoreCase.Equals($gcc, $expected)) {
            throw "expected soldr-managed gcc first on PATH, got: $gcc; expected: $expected"
          }
          Write-Host "gcc=$gcc"
          gcc --version

      - name: Build running-process crates
        shell: pwsh
        working-directory: running-process
        run: |
          soldr build -p running-process --features daemon --target $env:TARGET --color never
          soldr build -p running-process-observer-interposer-windows --target $env:TARGET --color never
          soldr build -p running-process-observer --features embed-helper --target $env:TARGET --color never

      - name: Build and run soldr GNU target binary
        shell: pwsh
        run: |
          soldr build --release --target $env:TARGET --package soldr-cli --bin soldr --locked
          $binary = Join-Path $env:GITHUB_WORKSPACE "target\$env:TARGET\release\soldr.exe"
          if (-not (Test-Path $binary)) {
            throw "expected GNU target binary was not produced: $binary"
          }
          $format = (objdump -f $binary | Out-String)
          if ($format -notmatch "pei-x86-64") {
            throw "unexpected GNU target binary format: $format"
          }
          & $binary --version
          if ($LASTEXITCODE -ne 0) {
            throw "GNU target binary failed to execute with exit code $LASTEXITCODE"
          }

      - name: Verify GNU syslibs were materialized
        shell: pwsh
        run: |
          $syslib = Join-Path $env:SOLDR_CACHE_DIR "bin\syslib"
          $expected = @{
            "zstd" = "1.5.7"
            "sqlite" = "3.46.0"
            "mimalloc" = "3.3.2"
            "zlib-ng" = "2.2.5"
            "lzma" = "5.6.3"
            "bzip2" = "1.0.8"
          }
          foreach ($name in $expected.Keys) {
            $stamp = Join-Path $syslib "$name\$($expected[$name])\windows-x64-gnu\.complete"
            if (-not (Test-Path $stamp)) {
              throw "expected soldr-managed GNU syslib was not materialized: $stamp"
            }
            Write-Host "verified $name $($expected[$name]) windows-x64-gnu"
          }
