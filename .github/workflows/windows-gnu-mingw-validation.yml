name: Windows GNU MinGW Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * 0"

permissions:
  contents: read

concurrency:
  group: windows-gnu-mingw-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  running-process:
    name: running-process on x86_64-pc-windows-gnu
    runs-on: windows-2025
    env:
      SOLDR_GITHUB_TOKEN: ${{ github.token }}
      TARGET: x86_64-pc-windows-gnu
    steps:
      - name: Checkout soldr
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.94.1
          targets: ${{ env.TARGET }}

      - name: Build soldr from checkout
        shell: pwsh
        env:
          RUSTC_WRAPPER: ""
        run: |
          cargo build --package soldr-cli --release --locked
          "${{ github.workspace }}\target\release" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Checkout running-process
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: zackees/running-process
          path: running-process
          submodules: recursive

      - name: Prepare managed MinGW-w64 GCC
        shell: pwsh
        run: |
          soldr --version
          soldr prepare --target $env:TARGET --github-env $env:GITHUB_ENV

      - name: Verify managed gcc is on PATH
        shell: pwsh
        run: |
          $gcc = (where.exe gcc | Select-Object -First 1)
          if (-not $gcc) {
            throw "gcc was not found on PATH after soldr prepare"
          }
          if ($gcc -notmatch "\\.soldr\\") {
            throw "expected soldr-managed gcc first on PATH, got: $gcc"
          }
          Write-Host "gcc=$gcc"
          gcc --version

      - name: Build running-process crates
        shell: pwsh
        working-directory: running-process
        run: |
          soldr build -p running-process --features daemon --target $env:TARGET --color never
          soldr build -p running-process-observer-interposer-windows --target $env:TARGET --color never
          soldr build -p running-process-observer --features embed-helper --target $env:TARGET --color never
