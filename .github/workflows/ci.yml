name: CI

on:
  push:
    # Skip perf-iteration branches — they only need perf-matrix.yml,
    # not the full Lint/build/e2e sweep. (`branches` and
    # `branches-ignore` are mutually exclusive, so this replaces the
    # previous `branches: ['**']` catch-all.)
    branches-ignore:
      - 'perf/**'
      - 'evaluate/**'
    tags-ignore:
      - '*'
    paths-ignore:
      - '*.md'
      - '**/*.md'
  # pull_request triggers exist so the `fast-build` label gate below
  # has a `github.event.pull_request.labels` payload to inspect. On a
  # label-only event (`labeled` / `unlabeled`) GHA re-runs the
  # workflow, which lets contributors flip a PR between "fast" and
  # "full" CI by toggling the label.
  #
  # NOTE: pushes to main always run the full sweep — the gate's
  # `contains(...)` check evaluates to `false` on push events because
  # `github.event.pull_request` is null, so the `!contains(...)`
  # condition is `true` and the heavy mac/win jobs proceed.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths-ignore:
      - '*.md'
      - '**/*.md'

permissions:
  contents: read

env:
  RUST_BACKTRACE: "1"
  # Direct CI jobs may resolve managed zccache from zackees/zccache.
  # Use soldr's explicit opt-in token env for authenticated release
  # metadata requests without weakening generic cross-repo GITHUB_TOKEN use.
  SOLDR_GITHUB_TOKEN: ${{ github.token }}

jobs:
  lint:
    name: Lint
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup soldr build cache
        uses: zackees/setup-soldr@cca74625e75e70b56f1805fa6eeee9069f945d48
        with:
          toolchain: 1.94.1
          cache: true
          zccache-seed-strict: true
          cache-key-suffix: lint-ubuntu
          prebuild-deps: soldr-cook
          prebuild-deps-flags: ""

      - name: Restore checkout after soldr-cook
        shell: pwsh
        run: git restore --worktree -- .

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Check formatting
        run: soldr cargo fmt --all -- --check

      - name: Check npm package metadata
        run: node scripts/test-npm-package.js

      - name: Run clippy
        run: soldr cargo clippy --workspace --all-targets --locked -- -D warnings

  # Per-platform `build workspace + run unit/smoke tests` jobs.
  # Each is a thin caller of the `_build-and-test.yml` template so
  # the duplicated cargo invocations live in one place and every
  # platform still shows as its own top-level entry in the GHA
  # sidebar. Add a new platform: copy one of these blocks and tweak
  # the inputs.

  build-linux-x64:
    name: Linux x64
    needs: lint
    if: github.ref_name == 'main'
    uses: ./.github/workflows/_build-and-test.yml
    with:
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      shared_key: build-linux-x64

  # build-macos-x64 removed: cross-compile-all-targets.yml builds the
  # darwin artifacts on linux+zigbuild; smoke-on-mac in
  # build-macos-x64.yml verifies the cross-built binary runs on real
  # hardware. Native macOS unit-test sweep was redundant given that
  # coverage chain — see commit message for the analysis.

  build-windows-x64:
    name: Windows x64
    needs: lint
    if: >-
      github.ref_name == 'main'
      && !contains(github.event.pull_request.labels.*.name, 'fast-build')
    uses: ./.github/workflows/_build-and-test.yml
    with:
      runner: windows-2025
      target: x86_64-pc-windows-msvc
      shared_key: windows-x86_64-msvc
      cache_key: ci-windows-x64
      install_components: rustfmt, clippy
      verify_windows_msys_default_msvc: true

  build-windows-arm64:
    # Preserves the cargo-test coverage that the standalone
    # build-windows-arm64.yml provided before it was deleted in
    # favour of this template + materializer pattern. The
    # equivalent e2e-windows-arm64 job below only builds; this one
    # runs the unit + cli + fetch test sweep.
    name: Windows ARM64
    needs: lint
    if: >-
      github.ref_name == 'main'
      && !contains(github.event.pull_request.labels.*.name, 'fast-build')
    uses: ./.github/workflows/_build-and-test.yml
    with:
      runner: windows-11-arm
      target: aarch64-pc-windows-msvc
      shared_key: windows-aarch64-msvc
      cache_key: ci-windows-arm64
      install_components: rustfmt, clippy

  # Linux glibc/musl e2e jobs always run — they are the proof of life
  # and are cheap. The `fast-build` label only suppresses mac/win.
  e2e-linux-x64:
    name: build
    uses: ./.github/workflows/_bootstrap-e2e.yml
    with:
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      binary_name: soldr
      save_cache: ${{ github.event_name == 'push' }}
      source_ref: ${{ github.sha }}

  e2e-linux-arm64:
    name: build
    uses: ./.github/workflows/_bootstrap-e2e.yml
    with:
      runner: ubuntu-24.04-arm
      target: aarch64-unknown-linux-gnu
      binary_name: soldr
      save_cache: ${{ github.event_name == 'push' }}
      source_ref: ${{ github.sha }}

  e2e-linux-x64-musl:
    name: build
    uses: ./.github/workflows/_bootstrap-e2e.yml
    with:
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-musl
      binary_name: soldr
      save_cache: ${{ github.event_name == 'push' }}
      source_ref: ${{ github.sha }}

  e2e-linux-arm64-musl:
    name: build
    uses: ./.github/workflows/_bootstrap-e2e.yml
    with:
      runner: ubuntu-24.04-arm
      target: aarch64-unknown-linux-musl
      binary_name: soldr
      save_cache: ${{ github.event_name == 'push' }}
      source_ref: ${{ github.sha }}

  # e2e-macos-{x64,arm64} removed: the bootstrap-build phase moved to
  # linux+zigbuild via cross-compile-all-targets.yml, and runtime
  # verification of the cross-built darwin binary lives in
  # build-macos-x64.yml + build-macos-arm64.yml (smoke-on-mac jobs
  # that download the prebuilt artifact and run it). Maintaining a
  # separate bootstrap+e2e lane on a paid macOS runner duplicated
  # both halves without adding coverage.

  e2e-windows-x64:
    name: build
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'fast-build') }}
    uses: ./.github/workflows/_bootstrap-e2e.yml
    with:
      runner: windows-2025
      target: x86_64-pc-windows-msvc
      binary_name: soldr.exe
      save_cache: ${{ github.event_name == 'push' }}
      source_ref: ${{ github.sha }}

  e2e-windows-arm64:
    name: build
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'fast-build') }}
    uses: ./.github/workflows/_bootstrap-e2e.yml
    with:
      runner: windows-11-arm
      target: aarch64-pc-windows-msvc
      binary_name: soldr.exe
      save_cache: ${{ github.event_name == 'push' }}
      source_ref: ${{ github.sha }}
