name: CI

on:
  push:
    # soldr#1985 — only main. Previously `branches-ignore: [perf/**,
    # evaluate/**]`, which matches every PR branch, so each push to an
    # open PR fired this workflow TWICE: once for `push` and once for
    # `pull_request`, with byte-identical content. Five branches were
    # observed running two concurrent 21-job sweeps each. Feature
    # branches keep full coverage through the `pull_request` trigger
    # below; perf/** and evaluate/** remain excluded by construction.
    branches:
      - main
    tags-ignore:
      - '*'
    paths-ignore:
      - '*.md'
      - '**/*.md'
  # pull_request triggers exist so the `fast-build` gates below have a
  # labels payload. On a label-only event (`labeled` / `unlabeled`) GHA
  # re-runs the workflow, which lets contributors request the fast path.
  # The Windows MSVC E2E policy still overrides that request whenever a
  # platform-sensitive path changed.
  #
  # NOTE: pushes to main always run the full sweep. Label gates evaluate
  # open when `github.event.pull_request` is null,
  # and windows_e2e_policy.py explicitly requires the Windows pairs on
  # every non-PR event.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths-ignore:
      - '*.md'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# soldr#1985 — superseded PR runs used to keep holding runner slots while a
# fresh 21-job sweep queued behind them; five concurrent CI runs were observed
# stacked on main alone. That self-inflicted load is what pushed ubuntu-24.04
# queues to 20-30 min, which in turn delayed the cross-builds that gate the
# macOS target-runs (one waited 83m40s to do 117s of work).
#
# Pushes to main are never cancelled: release-auto.yml triggers on push-to-main
# (Cargo.toml / package.json), so every commit that lands must stay fully tested.
concurrency:
  # run_id fallback on non-PR events: GitHub keeps at most ONE pending run
  # per group, so a ref-only group silently cancels queued main-push SHAs.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_BACKTRACE: "1"
  # Direct CI jobs may resolve managed zccache from zackees/zccache.
  # Use soldr's explicit opt-in token env for authenticated release
  # metadata requests without weakening generic cross-repo GITHUB_TOKEN use.
  SOLDR_GITHUB_TOKEN: ${{ github.token }}

jobs:
  lint:
    name: Lint
    # Run on every push to main AND on every PR — without this PRs slip
    # in unformatted code that breaks main's Lint job on merge. Repeated
    # 4 times in late 2026-06 (#1111/#1114/#1115/#1120 fallout), each
    # requiring a chase-PR to unbreak main. PR-side Lint failure is the
    # cheap fix; required-status branch protection is the structural
    # fix and lives in repo settings.
    runs-on: ubuntu-24.04
    # soldr#1978: bounded, but it had no headroom and was cancelling healthy
    # runs. Measured over the last 20 ci.yml runs:
    #
    #   succeeded  5m00s .. 9m51s
    #   cancelled  6 of the last 7, all at ~10m -- the timeout itself
    #
    # A 10-minute bound against a 9m51s observed max is 1.02x. Every slow run
    # died on whichever step held the clock (always the last Dylint one), so
    # the gate read as a Dylint flake rather than as its own timeout, and it
    # got merged past repeatedly -- which is the real cost: an always-red gate
    # teaches people to ignore it.
    #
    # The job grew into this: the Dylint boundary steps, and the five Python
    # lint gates added in #2103/#2105/#2108/#2109/#2119, each cost 30-60s.
    #
    # 30 is ~3x the observed non-Rust maximum. `verify_ci_job_timeouts.py`
    # states the rule this restores: "a too-low timeout that kills a healthy
    # long build is worse than the 360-minute default".
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive
          # soldr#1966: the line-ceiling ratchet below needs `git merge-base`,
          # which the default depth-1 checkout cannot compute.
          fetch-depth: 0

      - name: Enlarge swap (OOM headroom)
        shell: bash
        run: bash .github/scripts/setup_ci_swap.sh

      # soldr#1248/#2 follow-up: cache + soldr-cook stay disabled on
      # Lint while target/profile-shaped cook restore is reintroduced in
      # the cross/release lanes first. Restore-from-git workaround that
      # paired with the old cook flow is no longer needed because the
      # manifest is never overwritten.
      # soldr#1340 — pre-cache the 1.95.0 toolchain in ~/.rustup so
      # setup-soldr uses it (Setup soldr build cache drops from ~22 s
      # to ~2 s). Same pattern as #1341/#1342/#1343. Shared cache key
      # across all soldr workflows.
      # soldr#1966 — the 1,500-line ceiling was enforced only by a
      # PostToolUse hook, which fires for agent edits and nothing else, so
      # files drifted past it by every other route and the cost landed on
      # whichever agent next had to touch one. A ratchet rather than a
      # threshold: 13 files are already over, and blocking every PR that
      # touches them would be worse than the drift. Runs before the
      # expensive toolchain setup so an oversized diff fails in seconds.
      # soldr#2763: uv must exist before the first step that uses it. The
      # guard steps below run through `uv run --python 3.13` so the Lint job
      # has one pinned interpreter rather than whatever `python3` the runner
      # image ships; installing uv here is what makes that possible.
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5

      - name: Line-ceiling ratchet
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # Must compare against the MERGE BASE, not the base tip. A branch
          # behind main differs from the tip in files it never touched, so a
          # tip comparison attributes main's own changes to this PR -- caught
          # while testing this step, which flagged a file the PR did not touch.
          #
          # merge-base needs real history, which the default shallow
          # pull_request checkout does not have (the first version of this step
          # skipped itself into uselessness for exactly that reason), hence
          # fetch-depth: 0 on the checkout above.
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          uv run --no-project --python 3.13 python .github/scripts/loc_ratchet.py --base-ref "origin/$GITHUB_BASE_REF"

      # soldr#2493 — the 1000-line absolute ceiling for production sources.
      # Unlike the 1500-line ratchet above, this is a hard threshold: every
      # production file under crates/*/src must be at or under 1000 lines.
      - name: 1000-line production ceiling
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          uv run --no-project --python 3.13 python .github/scripts/loc_ceiling.py

      # soldr#2753 — the `.proto` files are the documented source of truth for
      # the wire format, but soldr runs no prost-build, so nothing read them
      # and they had drifted: wire.proto referenced a message it never defined
      # (invalid protobuf), and the rust_plan mirror understated its tag space
      # by two fields. Compares (message, field, tag) triples on both sides.
      - name: Protobuf schema drift
        run: |
          set -euo pipefail
          uv run --no-project --python 3.13 python .github/scripts/check_proto_drift.py

      # soldr#2752 Rule A — the manifest half of the `soldr-deps` gateway,
      # landed first because it needs no facade and no source churn. Adding a
      # third-party dependency now means amending a checked-in inventory in
      # the same PR, so the edge shows up in review instead of as one line in
      # a manifest nobody diffs. Fails in both directions, like loc_ratchet:
      # an unlisted dependency, and a listed one that is gone.
      - name: Third-party dependency inventory
        run: |
          set -euo pipefail
          uv run --no-project --python 3.13 python .github/scripts/check_dependency_inventory.py

      # soldr#2937 (phase 5 of soldr#2931) — linked test products are never
      # cacheable. Fails when a normal workflow puts one in a cross-run store,
      # or restores a broad target/ snapshot downstream of cook.
      - name: Cache ownership policy
        run: |
          set -euo pipefail
          uv run --no-project --python 3.13 --with pyyaml python .github/scripts/check_cache_ownership.py

      # soldr#2360/#2363 — the broker-fronted daemon design deliberately
      # keeps the wire at protocol_v2/client_v2, broken in place; a
      # protocol_v3/client_v3 module would mean two wire majors coexisting,
      # which defeats the minimum-version floor the design relies on to force
      # upgrades. Cheap static grep, no build required.
      - name: No protocol_v3 policy
        run: uv run --no-project --python 3.13 python .github/scripts/no_protocol_v3.py

      # soldr#1981 — `--release` costs thin-LTO + single-CU codegen, and paying
      # that on a job whose output never ships is pure waste. soldr#1982 removed
      # the offenders; this keeps them gone. Runs before the toolchain setup so
      # a regression fails in seconds rather than after a full build.
      - name: Release-profile policy
        run: uv run --no-project --python 3.13 python .github/scripts/verify_release_profile_policy.py

      # soldr#2442 slice 4 — tree-level raw process-spawn guard: a new raw
      # `.spawn()` site in any production crate fails here by name until it
      # is routed through a sanctioned module or allowlisted with a
      # justification. Complements the soldr-daemon dylint boundary.
      - name: Spawn-path guard
        run: uv run --no-project --python 3.13 python .github/scripts/spawn_path_guard.py

      # soldr#2763 -- the v0.9.3 release died on macOS ARM64 because a release
      # script ran under the runner image's own python3, which predated the
      # 3.10 API it used. The interpreter floor was a per-file convention that
      # nothing enforced. A ratchet, like loc_ratchet: the 23 jobs already in
      # that state are baselined, and no new one may join them.
      #
      # Routed through `uv run` because the guard needs PyYAML, and because a
      # guard about pinning interpreters should not be exempt from its own
      # rule. That is also why it sits *after* the uv setup above rather than
      # with the other guards earlier in the job -- placed before it, the step died on
      # `uv: command not found`.
      - name: Workflow Python interpreter pin
        run: |
          set -euo pipefail
          uv run --no-project --python 3.13 --with pyyaml python .github/scripts/check_workflow_python_pin.py

      # soldr#2765/#2164 -- zccache is compiled into soldr, but
      # release staging separately downloads a PREBUILT zccache keyed on the
      # locked crate's version. So a pin can lead the release: #2164 moved it
      # to a version with no published asset, every local signal stayed green
      # (builds, ~1460 tests, clippy, verify_vendor_state.py, loc_ratchet --
      # none of them exercise that fetch), and main went red.
      #
      # CLAUDE.md documents the pre-flight query a human is meant to run before
      # bumping. This runs it. An unreachable manifest is skipped rather than
      # failed: this is on every PR, and failing on a Pages blip would teach
      # people to ignore it.
      - name: Locked zccache has a published release asset
        run: |
          set -euo pipefail
          uv run --no-project --python 3.13 python .github/scripts/check_zccache_asset.py

      # soldr#2945 — the lint libraries are now the authority on Dylint's
      # nightly, but nothing checked that the nightly they declare has drivers
      # published. Soldr fetches a prebuilt driver and refuses to build one
      # (binary-or-exit, #2432/#2484), so re-pinning `dylints/*/rust-
      # toolchain.toml` to an undriven nightly compiles, tests, lints and
      # merges — then breaks Dylint on every host until someone runs it. This
      # asserts the exact `<version>-<nightly>` driver asset exists for every
      # release-included canonical triple, not just the CI host's. Skipped, not
      # failed, when the catalogue is unreachable — same policy as above.
      - name: Dylint driver published for every shipped triple
        run: |
          set -euo pipefail
          uv run --no-project --python 3.13 python .github/scripts/check_dylint_driver_assets.py

      # soldr#2013 — nothing ran `tests/` on CI, so it decayed silently: a test
      # asserting on a workflow #1982 deleted, two lints that scanned nothing
      # and reported clean (#2008), and a manifest-coupled assertion (#2004).
      # A deletion PR cannot learn it orphaned a test; a lint cannot learn it
      # stopped scanning. 281 tests, ~15s, and no Rust toolchain needed — so it
      # runs here, before the expensive setup below.
      - name: Python tests
        run: |
          set -euo pipefail
          # `.github/scripts/` is included deliberately: six test files live
          # beside the scripts they cover (target-run summary, the Windows
          # e2e/MSVC-cache policies, catalogued-asset download, nextest fetch,
          # toolchain asset query) and this step used to run `tests/` only, so
          # those 29 tests never executed in CI. Tests that exist but never run
          # are worse than none -- they rot silently while implying coverage.
          uv run --no-project --python 3.13 --with pytest --with pyyaml python -m pytest tests/ .github/scripts/ -q

      # Rust compiler validation is centralized in the native host lane.
      # Its single `soldr ci-test` invocation (soldr#2868) leaves this job
      # responsible for non-Rust policy, Python, and JavaScript checks.

      - name: Check npm package metadata
        run: node scripts/test-npm-package.js

      - name: Verify direct CI job timeouts
        run: uv run --no-project --python 3.13 python .github/scripts/verify_ci_job_timeouts.py

      # Three lanes assert the glibc floor of a binary soldr builds, and
      # they arrived in three separate PRs with nothing tying them
      # together. `release-auto.yml` is excluded on purpose — its ceiling
      # also covers crgx / cargo-chef, which soldr fetches prebuilt at
      # 2.39, so it legitimately differs (soldr#2170).
      - name: Verify the per-PR glibc ceilings agree
        run: uv run --no-project --python 3.13 python .github/scripts/check_glibc_ceilings.py

      # A `paths:` filter that matches nothing leaves its workflow silently
      # dark: it never runs, so it can never go red. `crates/soldr-cli/src/
      # cache_lib/**` moved to crates/soldr-cache in #1490 Phase 4, and
      # cook-size-gate kept watching the old location.
      # soldr#3018: a `#` inside a folded `run: >` block is not a comment --
      # YAML folds it onto one line and the shell then drops every argument
      # after it. That silently disabled `--grace-seconds 2700` on the macOS
      # queue watchdog, which ran at its 900s default for as long as nobody
      # noticed, and every failure looked like the flaky lane it was watching.
      - name: Verify no folded run block hides arguments behind a comment
        run: uv run --no-project --python 3.13 python .github/scripts/check_run_block_comments.py

      - name: Verify workflow path filters still match
        run: uv run --no-project --python 3.13 python .github/scripts/verify_workflow_paths.py

      # soldr#2102. `./lint` runs six Python tools and CI ran none of them, so
      # lint drift accumulated unnoticed for months. flake8 is the one that can
      # be enforced today: with `.flake8` delegating line length to black it
      # reports 0 violations across every Python directory, so this is a
      # regression guard rather than a new policy.
      #
      # black, isort and mypy still report on main and are NOT wired here --
      # each needs a decision (which width, whether to fix or scope mypy's 34
      # errors). soldr#2102 tracks them. Adding a gate that fails on main would
      # block every PR for a problem it did not cause.
      # ruff was not in CI at all -- it ran only from `./lint`, locally, so
      # nothing enforced it. #2102 widened its rule selection (bugbear and
      # friends) and it passes on `src tests`, so it is enforced here now.
      #
      # `.github/scripts` and `ci` were left out at first because they had 10
      # findings, and fixing them was owed a reviewed diff rather than a
      # drive-by. That diff happened, so the scope is now all four directories
      # and the two that were unenforced are the ones most worth enforcing:
      # they are the scripts CI itself runs.
      - name: Python lint (ruff)
        # Bounded, like the other four. `ruff>=0.4` was open-ended, so CI
        # resolved a newer ruff than `./install` gives contributors and
        # failed on RUF043 -- a rule that did not exist in the tested
        # version. An unbounded linter is a CI break waiting on someone
        # else's release date.
        run: >-
          uv run --no-project --with 'ruff>=0.12,<0.13'
          ruff check --fix src tests .github/scripts .github/actions ci tools .claude/hooks

      - name: Python lint (flake8)
        # Pinned, not floating. An unpinned `--with flake8` means a future
        # release that adds a check turns this red on code nobody touched,
        # and the failure would look like the PR's fault. `>=7.3,<8` follows
        # the `maturin>=1.7,<2` style already in pyproject: patches flow,
        # a major cannot land unannounced. soldr#2102 covers the wider
        # problem -- black, isort, pylint and mypy are installed unpinned by
        # `./install` and declared nowhere, which is why contributors format
        # differently from one another.
        run: uv run --no-project --with 'flake8>=7.3,<8' python -m flake8 src tests .github/scripts .github/actions ci tools .claude/hooks

      # black and isort, now that #2105 constrained them in `./install` so a
      # contributor and CI cannot resolve different versions. Both bounds were
      # checked to be format-stable before wiring: formatting the tree with
      # 25.1.0 and with 25.12.0 produced byte-identical output, and likewise
      # isort 6.0.1 vs 6.1.0. Black's own stability policy is per calendar
      # year and its major IS the year, so `<26` is the guarantee, not a guess.
      #
      # Widened to all four directories (soldr#2120). That widening reformats
      # 16 files under `.github/scripts` and `ci`, which is why it was held for
      # its own diff rather than ridden along with the scope change.
      #
      # The same stability check was repeated for the new directories before
      # enforcing, because the point of the bounds is that a contributor and CI
      # cannot disagree: formatting them at the bounds' floor (black 25.1.0 /
      # isort 6.0.1) and at whatever `>=25.1,<26` / `>=6.0,<7` resolve to today
      # produced byte-identical output -- compared as patches, not by eyeballing
      # a diffstat.
      # Formatting changes are deterministic and safe to apply in CI. Do not
      # make a PR red solely because Black or isort can correct it; the
      # remaining lint/type checks still reject defects that need judgment.
      - name: Auto-format Python (black, isort)
        run: |
          set -euo pipefail
          uv run --no-project --with 'black>=25.1,<26' python -m black src tests .github/scripts .github/actions ci tools .claude/hooks
          uv run --no-project --with 'isort>=6.0,<7' python -m isort --profile black src tests .github/scripts .github/actions ci tools .claude/hooks

      # mypy over both the shipped package and the tests. `src/` was cleaned
      # in #2107 (four annotation defects, none behavioural); `tests/` is
      # clean as of this change, so the whole tree is checked and this stays a
      # regression guard rather than a new policy.
      # The sixth and last tool from `./lint`, and the one the issue is named
      # for: pylint reported 319 findings, so `./lint` (which runs under
      # `set -e`) could never reach its final line.
      #
      # 315 of the 319 were in `tests/` and were pytest idiom, not defects --
      # fixtures shadowing their own names, tests reaching into the private
      # functions they exist to test. `src/` had four, all deliberate, all now
      # carrying an inline disable that states the reason at the site.
      #
      # So the two surfaces are checked with two rulesets. `src/` runs pylint's
      # DEFAULT configuration -- nothing disabled -- and scores 10.00/10. Only
      # `tests/` gets the relaxations, and they live in `tests/.pylintrc` with
      # a per-entry rationale. Passing that file explicitly rather than relying
      # on pylint's directory discovery means it applies where it is named and
      # nowhere else.
      - name: Python lint (pylint)
        # pytest in the ephemeral env for the same reason as the mypy step
        # below: 22 test files import it, and pylint reports import-error for
        # what it cannot resolve.
        #
        # pyyaml for the same reason, on the three invocations that reach a
        # file importing it (five under tests/, plus check_workflow_python_pin
        # under .github/scripts). mypy already carries types-PyYAML; pylint
        # needs the real package, because E0401 is about importability rather
        # than typing. This was masked for as long as it existed: the Python
        # tests step runs first, and it had been failing on a collection error
        # since #2823, so pylint never got to report.
        run: |
          set -euo pipefail
          uv run --no-project --with 'pylint>=4.0,<5' --with 'pytest>=8.0'             python -m pylint src
          uv run --no-project --with 'pylint>=4.0,<5' --with 'pytest>=8.0' --with 'pyyaml>=6,<7'             python -m pylint --rcfile=tests/.pylintrc tests
          # pylint gets `.github/actions/setup-soldr` rather than the parent
          # `.github/actions`: ensure_soldr.py imports its sibling module, which
          # only resolves when pylint has that leaf directory on its path.
          # Pointed at the parent it reports E0401 for an import that is fine.
          # The other five tools resolve it either way and take the parent.
          # soldr#2120: the CI scripts themselves, on pylint's default rules.
          # Two surfaces here for the same reason src/ and tests/ are split:
          # `test_*.py` in this directory are pytest suites, so they take the
          # tests/ ruleset, and everything else takes the default one.
          uv run --no-project --with 'pylint>=4.0,<5' --with 'pytest>=8.0' --with 'pyyaml>=6,<7'             python -m pylint .github/scripts .github/actions/setup-soldr ci tools .claude/hooks --ignore-patterns='test_.*\.py'
          uv run --no-project --with 'pylint>=4.0,<5' --with 'pytest>=8.0' --with 'pyyaml>=6,<7'             python -m pylint --rcfile=tests/.pylintrc .github/scripts/test_*.py

      # All four directories. `.github/scripts` and `ci` are the scripts CI
      # itself runs, so a type error in them breaks a lane rather than a
      # developer's editor. Every finding was fixed at the source rather than
      # suppressed (a `None` that could reach `.get`, a list indexed with a
      # str, an over-tight `dict[str, object]` on a `json.loads` payload).
      #
      # `ci/` was held back in #2119 because four of its findings were
      # `fcntl.flock` "has no attribute" -- which looked like a Windows-only
      # artifact that would make the check pass or fail depending on who ran
      # it. It was not: `perf_local.py` already branches correctly at runtime,
      # but on `os.name == "nt"`, and mypy narrows `sys.platform`, not
      # `os.name`. Switching to the idiom mypy understands prunes the dead
      # branch on each platform and the findings disappear on both, so no
      # platform-scoping is needed here after all.
      - name: Python types (mypy)
        # pytest is in the ephemeral env because the tests import it, and
        # mypy cannot resolve an import it cannot see. This passed locally
        # without it only because `uv run` picked up the project .venv,
        # which CI does not have -- the same environment-parity trap that
        # bit the flake8 step in #2103.
        # types-PyYAML: tests/test_wheel_lane_policy.py imports yaml (already
        # importable in this env -- the Python tests step passes) but mypy
        # needs the stub package to type it.
        run: >-
          uv run --no-project --with 'mypy>=1.18,<2' --with 'pytest>=8.0'
          --with types-PyYAML
          python -m mypy src tests .github/scripts .github/actions ci tools .claude/hooks

      # Rustfmt, Clippy, doctests, dependency policy, and all Dylint
      # domains run once in build-linux-x64 through `soldr ci-test`
      # (soldr#2868), preventing duplicate parallel compiler domains.

  # Per-platform `build workspace + run unit/smoke tests` jobs.
  # Each is a thin caller of the `_build-and-test.yml` template so
  # the duplicated cargo invocations live in one place and every
  # platform still shows as its own top-level entry in the GHA
  # sidebar. Add a new platform: copy one of these blocks and tweak
  # the inputs.

  build-linux-x64:
    name: Linux x64
    # soldr#1258 — dropped `needs: lint`. Every cross-build lane runs in
    # parallel with Lint; the sequential gate here was inconsistent and
    # added ~130 s to the CI critical path. Lint remains a required
    # status check via branch protection, so a Lint failure still blocks
    # merge — the `needs:` clause was purely a wallclock cost.
    # soldr#1676/#1703: x86_64 GNU is the canonical native exception: run the
    # complete workspace suite directly on its native runner. The other seven
    # canonical targets independently replay their complete archives.
    if: github.ref_name == 'main' || github.event_name == 'pull_request'
    uses: ./.github/workflows/_build-and-test.yml
    with:
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-gnu

  pep517-daemon-smoke:
    name: PEP 517 daemon smoke (${{ matrix.name }})
    if: ${{ github.ref_name == 'main' || !contains(github.event.pull_request.labels.*.name, 'fast-build') }}
    runs-on: ${{ matrix.runner }}
    # Includes native wheel compilation plus 3m and 15m inner smoke limits.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      # PEP 517 is a public wheel boundary, so the native platform smokes run
      # on pull requests as well as main. The macos-arm64 leg moved into the
      # e2e-macos-arm64 target-run (soldr#2615, `run_pep517_smoke: true`) so a
      # PR allocates macos-15 once instead of twice; only windows-x64 remains
      # here. The matrix stays selected rather than filtered per-leg so a
      # `fast-build` PR allocates no runner.
      matrix:
        include: ${{ fromJSON('[{"name":"windows-x64","runner":"windows-2025","python":"3.13t"}]') }}
    env:
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: always
      SOLDR_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install rustup 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update

      - name: Setup soldr build cache
        uses: zackees/setup-soldr@5f1f68dcb8377818413c28ce52214261ae8ff771
        with:
          # soldr#1799: pin the soldr that builds us -- the action's default
          # (0.8.23) predates #1820 and GCs live target/ artifacts after every
          # build, so the next build recompiles the world. See
          # tests/test_setup_soldr_version_pins.py.
          version: 0.9.10
          toolchain: 1.95.0
          # soldr#2451: `cache: false` does not gate setup-soldr's soldr-mini /
          # solo-toolchain / build-cache layers, so these lanes still restored a
          # cached soldr 0.8.29 + buildcache-v2. This repo IS soldr — no self-
          # build lane may reuse a prebuilt soldr binary. Turn every layer off.
          cache: false
          build-cache: false
          target-cache: false
          cargo-registry-cache: false
          soldr-mini-cache: false
          solo-toolchain-cache: false
          zccache-seed-strict: true

      # soldr#1438: the PEP 517 smoke source-builds soldr-maturin before
      # building the current wheel. Reuse Cargo's target/registry cache here
      # just like the Lint job does; keep a separate key because this job
      # builds native ci-release wheels on macOS/Windows. soldr#1479 lowered
      # ci-release opt-levels; v2 avoids restoring stale opt-level-3
      # target trees under rust-cache's profile-blind meta-hash.
      - name: Restore cargo + target caches for wheel build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: pep517-${{ matrix.name }}-ci-release-v2

      - name: Build soldr wheel under test
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python .github/scripts/install_soldr_maturin.py
          maturin build --profile ci-release --out dist

      - name: Run downstream PEP 517 daemon smoke
        shell: pwsh
        env:
          SOLDR_DAEMON_REQUIRED: "1"
          SOLDR_DAEMON_SPAWN_RETRY_BUDGET_MS: "5000"
        run: >-
          python .github/scripts/pep517_daemon_smoke.py
          --wheel "dist/*.whl"
          --timeout 900
          --log-dir "${{ runner.temp }}/pep517-soldr-logs"

      - name: Upload PEP 517 Soldr logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pep517-soldr-logs-${{ matrix.name }}
          path: ${{ runner.temp }}/pep517-soldr-logs
          if-no-files-found: ignore
          retention-days: 14

      - name: Build source wheel with installed shims first on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          python .github/scripts/source_wheel_shim_smoke.py
          --wheel "dist/*.whl"
          --source .
          --timeout 900
          --require-free-threaded

  # There is no standalone macOS x64 build workflow. The native Linux
  # integration sweep covers target-independent logic, while the
  # `e2e-macos-x64` lane below cross-builds on Linux and runs the produced
  # archive on `macos-15-intel`.

  # build-windows-{x64,arm64} removed. The unit-test sweep for
  # windows runs on linux x86 via `build-linux-x64` (target-
  # independent logic); the `e2e-windows-{x64,arm64}` lanes below
  # cover windows-runtime behavior via the cross-built binary
  # downloaded onto the windows runner. ONE windows runner per
  # arch — goal of the consolidation pass.

  # soldr#3018 changed this. It previously read: "Linux glibc/musl e2e jobs
  # always run -- they are the proof of life and are cheap. macOS E2E pairs
  # always run. fast-build may skip only the Windows MSVC E2E pairs."
  #
  # The proof-of-life half stands and is unchanged: `e2e-linux-x64` is never
  # gated. A proof of life a heuristic can skip is not one, and it is the
  # cheapest lane, so gating it would save least and risk most.
  #
  # What changed is the rest. A docs-only PR paid for eight platform fan-outs,
  # and on macOS each also re-pays a 12-23 minute queue -- soldr#2996 measured
  # that queue as the largest single source of wall-clock variance, moving a
  # run from 52 to 80 minutes. The same fast-build classification that already
  # gated Windows now gates the macOS pairs and the non-x64 Linux lanes, via
  # `run_platform_e2e`.
  #
  # The gate is fail-open by construction: pushes, an absent label, an empty
  # diff, and any path it cannot classify all run everything. Only a
  # fast-build PR whose every changed path is documentation or repository
  # metadata skips.
  #
  # The separate PEP 517 platform smoke remains label-gated as a pair.
  e2e-linux-x64:
    name: build
    uses: ./.github/workflows/_bootstrap-e2e.yml
    with:
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      binary_name: soldr
      source_ref: ${{ github.sha }}

  # soldr#1697: a stable, always-reported check decides whether the Windows
  # E2E pairs may be skipped. A failed/empty classification runs them; pushes
  # always run them. This keeps required-check behavior deterministic while a
  # docs-only fast-build PR can still avoid two Linux builds + target runners.
  windows-e2e-policy:
    name: Windows E2E policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run_windows_e2e: ${{ steps.policy.outputs.run_windows_e2e }}
      run_platform_e2e: ${{ steps.policy.outputs.run_platform_e2e }}
      reason: ${{ steps.policy.outputs.reason }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      # soldr#2763: uv must exist before the first step that uses it.
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - name: Classify Windows E2E requirement
        id: policy
        run: uv run --no-project --python 3.13 python .github/scripts/windows_e2e_policy.py

  # soldr#1248: darwin/MSVC cross-build lanes need a current in-tree
  # host soldr to drive the blessed `soldr build --target ...` surface.
  # Building that binary inside each lane turns a cache miss into three
  # identical ~5 minute compiles. Restore/build it once, then fan out the
  # resulting artifact to those lanes.
  e2e-cross-bootstrap-soldr:
    name: bootstrap soldr for darwin/msvc cross-builds
    runs-on: ubuntu-24.04
    # Bounds the shared prerequisite; cold-cache successes are normally under 3m.
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive
          ref: ${{ github.sha }}

      - name: Cache rustup 1.95.0 in ~/.rustup
        id: rustup_cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.rustup/toolchains/1.95.0-x86_64-unknown-linux-gnu
          key: rustup-1.95.0-linux-x64-v1

      - name: Install rustup 1.95.0 to ~/.rustup (if not cached)
        if: steps.rustup_cache.outputs.cache-hit != 'true'
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update

      - name: Restore cached bootstrap soldr binary
        id: bootstrap_cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/soldr-bin
          # soldr#2451: key on the commit SHA, NOT hashFiles('crates/**', ...).
          # The bootstrap binary IS the `soldr build` driver that spawns the
          # broker on every cross lane, so it must always be built from HEAD.
          # hashFiles() over crates/ + the manifests EXCLUDES `_vender/**`
          # submodule content, so a submodule-only broker bump (running-process
          # #947's XDG_RUNTIME_DIR fix arrived as submodule bump #2449;
          # zccache #1363 as #2447) left this key UNCHANGED and served a
          # pre-fix driver from cache. Run 31449864708 got a cache HIT on the
          # #2448 binary and drove every cross lane with a pre-#947 broker →
          # "broker is unreachable (os error 2)". `github.sha` changes on every
          # commit (including submodule-only bumps), so the driver can never be
          # stale; same-SHA re-runs still hit. Profile is fixed at
          # --profile ci-bootstrap below, so it no longer needs to be in the key.
          key: bootstrap-soldr-blessed-linux-gnu-ci-bootstrap-${{ github.sha }}

      - name: Restore cargo + target caches for bootstrap build
        if: steps.bootstrap_cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # soldr#1479 lowered ci-bootstrap to opt-level 0; v2 keeps
          # cache saves aligned with the new helper-binary profile.
          shared-key: bootstrap-soldr-linux-gnu-ci-bootstrap-v2

      - name: Build bootstrap soldr
        if: steps.bootstrap_cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          RUSTC_WRAPPER: ""
        run: |
          set -euo pipefail
          cargo build --profile ci-bootstrap --package soldr-cli \
            --bin soldr \
            --target x86_64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/soldr-bin"
          cp target/x86_64-unknown-linux-gnu/ci-bootstrap/soldr "$RUNNER_TEMP/soldr-bin/soldr"

      - name: Verify bootstrap soldr
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/soldr-bin/soldr"
          "$RUNNER_TEMP/soldr-bin/soldr" --version

      - name: Upload bootstrap soldr artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: soldr-ci-bootstrap-linux-gnu
          path: ${{ runner.temp }}/soldr-bin/soldr
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # soldr#1051 / #1038: all cross-builds go through the consolidated
  # _ci-cross-build-linux.yml workflow on ubuntu-24.04. Each pair
  # below is "cross-build on linux + target-run on native runner".
  # The windows-host cross-compile regression that lived here previously
  # was dropped per the #1051 acceptance — saves a scarce-runner job
  # and the same path is exercised locally via `ci/docker-*` harnesses.

  # ---------- Linux x64 (gnu) — glibc floor only ----------
  # soldr#2145 / soldr#1060 item 3. x86_64-unknown-linux-gnu is host-native
  # both here and at release, so until now nothing on a PR exercised it
  # through the blessed `soldr build --target` surface -- and it inherited
  # the runner's glibc (2.39) while the cross-built aarch64 artifact got
  # 2.28. This lane covers that gap and, because the reusable workflow
  # already runs the glibc ratchet for `unknown-linux-gnu`, it is what
  # proves the managed-zig detour actually lowers the floor: without it
  # the binary links at 2.39 and the 2.28 ceiling fails.
  #
  # No paired `target-run`: this lane exists for the ABI floor, and the
  # complete workspace suite already runs natively on this exact image in
  # `build-linux-x64`. Adding a replay would be the degenerate same-image
  # build/run split soldr#1978 item 3 is about.
  e2e-linux-x64-gnu-build:
    name: native-build x86_64-unknown-linux-gnu (glibc floor)
    needs: e2e-cross-bootstrap-soldr
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: x86_64-unknown-linux-gnu
      artifact_name: soldr-ci-e2e-linux-x64-gnu
      source_ref: ${{ github.sha }}
      bootstrap_artifact_name: soldr-ci-bootstrap-linux-gnu

  # ---------- Linux ARM64 (gnu) ----------
  e2e-linux-arm64-build:
    name: cross-build aarch64-unknown-linux-gnu (linux host)
    needs: [e2e-cross-bootstrap-soldr, windows-e2e-policy]
    if: ${{ needs.windows-e2e-policy.outputs.run_platform_e2e == 'true' }}
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: aarch64-unknown-linux-gnu
      artifact_name: soldr-ci-e2e-linux-arm64
      source_ref: ${{ github.sha }}
      bootstrap_artifact_name: soldr-ci-bootstrap-linux-gnu

  e2e-linux-arm64:
    name: target-run aarch64-unknown-linux-gnu
    needs: [e2e-linux-arm64-build, windows-e2e-policy]
    if: ${{ needs.windows-e2e-policy.outputs.run_platform_e2e == 'true' }}
    uses: ./.github/workflows/_ci-target-run.yml
    with:
      runs_on: ubuntu-24.04-arm
      target: aarch64-unknown-linux-gnu
      artifact_name: soldr-ci-e2e-linux-arm64
      # soldr#2874: this is the only native-ARM64 runner in the matrix, so it
      # is the only place the GNU lifecycle can be prepared on the host shape
      # it targets.
      assert_native_gnu_prepare: true

  # ---------- Linux x64 (musl) ----------
  # soldr#1978 item 3. This lane had a paired `target-run` on `ubuntu-24.04`
  # -- the same image the cross-build runs on. The build/run split exists to
  # move execution onto a runner that is *native to the target*, so for a
  # host-identical target it bought a second runner allocation plus a full
  # nextest-archive round-trip through the artifact store for zero new host
  # coverage: a statically linked musl binary replayed on the image it was
  # built on exercises nothing the native `build-linux-x64` suite does not.
  #
  # No paired `target-run`, for the same reason `e2e-linux-x64-gnu-build`
  # above has none. Both aarch64 splits below keep theirs -- those are
  # genuinely cross-arch (`ubuntu-24.04` -> `ubuntu-24.04-arm`).
  e2e-linux-x64-musl-build:
    name: cross-build x86_64-unknown-linux-musl (linux host)
    needs: [e2e-cross-bootstrap-soldr, windows-e2e-policy]
    if: ${{ needs.windows-e2e-policy.outputs.run_platform_e2e == 'true' }}
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: x86_64-unknown-linux-musl
      artifact_name: soldr-ci-e2e-linux-x64-musl
      source_ref: ${{ github.sha }}
      bootstrap_artifact_name: soldr-ci-bootstrap-linux-gnu
      # Nothing downloads this artifact now that the replay is gone; the
      # archive is still built (test code must still compile for musl), it
      # just no longer round-trips through the artifact store unread.
      upload_test_archive: false

  # ---------- Linux ARM64 (musl) ----------
  e2e-linux-arm64-musl-build:
    name: cross-build aarch64-unknown-linux-musl (linux host)
    needs: [e2e-cross-bootstrap-soldr, windows-e2e-policy]
    if: ${{ needs.windows-e2e-policy.outputs.run_platform_e2e == 'true' }}
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: aarch64-unknown-linux-musl
      artifact_name: soldr-ci-e2e-linux-arm64-musl
      source_ref: ${{ github.sha }}
      bootstrap_artifact_name: soldr-ci-bootstrap-linux-gnu

  e2e-linux-arm64-musl:
    name: target-run aarch64-unknown-linux-musl
    needs: [e2e-linux-arm64-musl-build, windows-e2e-policy]
    if: ${{ needs.windows-e2e-policy.outputs.run_platform_e2e == 'true' }}
    uses: ./.github/workflows/_ci-target-run.yml
    with:
      runs_on: ubuntu-24.04-arm
      target: aarch64-unknown-linux-musl
      artifact_name: soldr-ci-e2e-linux-arm64-musl

  # ---------- macOS x64 ----------
  # Re-enabled now that zccache no longer pulls tikv-jemalloc-sys —
  # mimalloc is the sole allocator (zccache PR #948). Previously
  # disabled because the darwin cross-compile died on jemalloc's
  # autoconf sys/syscall.h probe (#1071).
  e2e-macos-x64-build:
    name: cross-build x86_64-apple-darwin (linux host)
    needs: [e2e-cross-bootstrap-soldr, windows-e2e-policy]
    if: ${{ needs.windows-e2e-policy.outputs.run_platform_e2e == 'true' }}
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: x86_64-apple-darwin
      artifact_name: soldr-ci-e2e-macos-x64
      source_ref: ${{ github.sha }}
      bootstrap_artifact_name: soldr-ci-bootstrap-linux-gnu

  e2e-macos-x64:
    name: target-run x86_64-apple-darwin
    needs: [e2e-macos-x64-build, windows-e2e-policy]
    if: ${{ needs.windows-e2e-policy.outputs.run_platform_e2e == 'true' }}
    uses: ./.github/workflows/_ci-target-run.yml
    with:
      # macos-15 is ARM64; target-run verifies this archive through Rosetta,
      # never by substituting ARM execution (soldr#2968).
      runs_on: macos-15
      target: x86_64-apple-darwin
      artifact_name: soldr-ci-e2e-macos-x64
      target_execution: x86_64-rosetta
      # Rosetta's translated complete archive replay exceeded the reusable
      # 30-minute default; keep the 55-minute allowance local to this lane.
      extended_replay: true

  # This cannot depend on e2e-macos-x64: the observed failure is precisely a
  # target-run that never receives a runner. It starts after the artifact
  # producer and reports bounded queue starvation from an ordinary Ubuntu VM.
  e2e-macos-x64-queue-watchdog:
    name: observe x86_64-apple-darwin target-run queue
    needs: e2e-macos-x64-build
    if: ${{ needs.e2e-macos-x64-build.result == 'success' }}
    runs-on: ubuntu-24.04
    # 15m queue bound, plus interpreter setup and polling/diagnostic headroom.
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
      - name: Set up diagnostics interpreter
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      # soldr#2968 moved the x86_64 replay onto `macos-15`, where the aarch64
      # target-run already lives. The two now contend for one runner pool
      # instead of `macos-15` + the retired `macos-15-intel`, so the x86 lane
      # routinely queues behind its ARM sibling -- which takes 19-25 minutes
      # (19m16s on #3006, 24m35s on #2971).
      #
      # A 900s grace was calibrated when x86_64 had a pool to itself. It now
      # fires whenever the sibling is running, reporting starvation for a lane
      # that is merely waiting its turn. That inverts the point of #2968: the
      # watchdog exists to tell a stuck lane from a slow one, and at 15 minutes
      # it could no longer tell the difference.
      #
      # 2700s sits clear of a full sibling occupancy plus scheduling slack, and
      # still far below the failure this guards -- #2968's Intel lane sat
      # queued for 80+ minutes and was never going to start at all.
      #
      # These are YAML comments, deliberately ABOVE the step. They used to sit
      # inside the `run: >-` folded scalar, where `#` is not a comment: YAML
      # folded them onto one line and the shell then treated the first `#` as
      # the start of a shell comment, discarding everything after it --
      # including `--grace-seconds 2700`. The watchdog silently ran at its
      # 900s argparse default, so the recalibration this text describes had
      # never once taken effect (soldr#3018 validation).
      - name: Observe bounded macOS x86 queue admission (soldr#2968)
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python .github/scripts/target_run_queue_watchdog.py
          --repo "$GITHUB_REPOSITORY"
          --run-id "$GITHUB_RUN_ID"
          --token "$GH_TOKEN"
          --job-prefix "target-run x86_64-apple-darwin"
          --runner "macos-15"
          --grace-seconds 2700
          --poll-seconds 30
          --github-summary "$GITHUB_STEP_SUMMARY"

  # ---------- macOS ARM64 ----------
  e2e-macos-arm64-build:
    name: cross-build aarch64-apple-darwin (linux host)
    needs: [e2e-cross-bootstrap-soldr, windows-e2e-policy]
    if: ${{ needs.windows-e2e-policy.outputs.run_platform_e2e == 'true' }}
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: aarch64-apple-darwin
      artifact_name: soldr-ci-e2e-macos-arm64
      source_ref: ${{ github.sha }}
      bootstrap_artifact_name: soldr-ci-bootstrap-linux-gnu

  e2e-macos-arm64:
    name: target-run aarch64-apple-darwin
    needs: [e2e-macos-arm64-build, windows-e2e-policy]
    if: ${{ needs.windows-e2e-policy.outputs.run_platform_e2e == 'true' }}
    uses: ./.github/workflows/_ci-target-run.yml
    with:
      runs_on: macos-15
      target: aarch64-apple-darwin
      artifact_name: soldr-ci-e2e-macos-arm64
      # soldr#2615: run the PEP 517 wheel smoke on this same macos-15
      # allocation instead of a dedicated pep517-daemon-smoke leg. Mirrors
      # that job's gate: main always runs it, `fast-build` PRs skip it.
      run_pep517_smoke: ${{ github.ref_name == 'main' || !contains(github.event.pull_request.labels.*.name, 'fast-build') }}

  # ---------- Windows x64 ----------
  e2e-windows-x64-build:
    name: cross-build x86_64-pc-windows-msvc (linux host)
    needs: [e2e-cross-bootstrap-soldr, windows-e2e-policy]
    if: ${{ needs.windows-e2e-policy.outputs.run_windows_e2e == 'true' }}
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: x86_64-pc-windows-msvc
      artifact_name: soldr-ci-e2e-windows-x64
      source_ref: ${{ github.sha }}
      bootstrap_artifact_name: soldr-ci-bootstrap-linux-gnu

  e2e-windows-x64:
    name: target-run x86_64-pc-windows-msvc
    needs: e2e-windows-x64-build
    uses: ./.github/workflows/_ci-target-run.yml
    with:
      runs_on: windows-2025
      target: x86_64-pc-windows-msvc
      artifact_name: soldr-ci-e2e-windows-x64

  # ---------- Windows x64 (GNU) ----------
  # soldr#2336: the Linux-hosted MinGW bundle is a blessed canonical target.
  # Replay the resulting PE binaries on the same native Windows runner class
  # as MSVC; the ABI is a build-toolchain choice, not a separate host class.
  e2e-windows-x64-gnu-build:
    name: cross-build x86_64-pc-windows-gnu (linux host)
    needs: [e2e-cross-bootstrap-soldr, windows-e2e-policy]
    if: ${{ needs.windows-e2e-policy.outputs.run_windows_e2e == 'true' }}
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: x86_64-pc-windows-gnu
      artifact_name: soldr-ci-e2e-windows-x64-gnu
      source_ref: ${{ github.sha }}
      bootstrap_artifact_name: soldr-ci-bootstrap-linux-gnu

  e2e-windows-x64-gnu:
    name: target-run x86_64-pc-windows-gnu
    needs: e2e-windows-x64-gnu-build
    uses: ./.github/workflows/_ci-target-run.yml
    with:
      runs_on: windows-2025
      target: x86_64-pc-windows-gnu
      artifact_name: soldr-ci-e2e-windows-x64-gnu
      # The full native GNU archive replay needs more than the shared 30-minute
      # target-run default after cold Cargo front doors are serialized (#2701).
      extended_replay: true
      # Fixture-local cache roots persist for a test process lifetime. Three
      # fresh workers keep each shard below hosted Windows disk capacity while
      # hash partitioning still covers the complete archive exactly once (#2704).
      replay_partitions: '[{"label":"1-of-3","value":"hash:1/3","run_followup":false},{"label":"2-of-3","value":"hash:2/3","run_followup":false},{"label":"3-of-3","value":"hash:3/3","run_followup":false}]'

  # ---------- Windows ARM64 ----------
  # soldr#1524: the managed ARM64 xwin cache and zlib-ng catalogue row
  # make this the same blessed build + nextest archive path as x64 MSVC.
  e2e-windows-arm64-build:
    name: cross-build aarch64-pc-windows-msvc (linux host)
    needs: [e2e-cross-bootstrap-soldr, windows-e2e-policy]
    if: ${{ needs.windows-e2e-policy.outputs.run_windows_e2e == 'true' }}
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: aarch64-pc-windows-msvc
      artifact_name: soldr-ci-e2e-windows-arm64
      source_ref: ${{ github.sha }}
      bootstrap_artifact_name: soldr-ci-bootstrap-linux-gnu

  e2e-windows-arm64:
    name: target-run aarch64-pc-windows-msvc
    needs: e2e-windows-arm64-build
    uses: ./.github/workflows/_ci-target-run.yml
    with:
      runs_on: windows-11-arm
      target: aarch64-pc-windows-msvc
      artifact_name: soldr-ci-e2e-windows-arm64

  # ---------- `soldr wheel` cross-verification (soldr#2139 acceptance) ----------
  #
  # soldr#2139 asked for a blessed wheel surface; #2291 shipped the verb but
  # nothing ever produced a wheel through it, and `verify_wheel_glibc.py` --
  # which exists because "the tag is a claim" -- had never been pointed at its
  # output. This pair is that acceptance check: build a real release wheel via
  # `soldr wheel --release --target aarch64-unknown-linux-gnu` (a cross wheel
  # from an x86_64 Linux host, the issue's actual criterion), assert the
  # filename carries the manylinux_2_17 tag, then read the embedded binary's
  # ELF and prove the tag matches the bytes.
  #
  # Cost (soldr#1978): this is one extra ubuntu-24.04 runner doing a full
  # cross compile, so it is NOT on every PR. The policy job below selects the
  # matrix; on a PR that touches no wheel-relevant path the matrix is `[]` and
  # the build job is never scheduled -- no runner is allocated at all, which a
  # step-level `if:` would not achieve. Pushes to main always run it.
  wheel-cross-policy:
    name: wheel lane policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.policy.outputs.matrix }}
      reason: ${{ steps.policy.outputs.reason }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      # soldr#2763: uv must exist before the first step that uses it.
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - name: Select wheel lane matrix
        id: policy
        run: uv run --no-project --python 3.13 python .github/scripts/wheel_lane_policy.py

  wheel-cross-verify:
    name: soldr wheel --target ${{ matrix.target }} (tag vs bytes)
    needs: [wheel-cross-policy, e2e-cross-bootstrap-soldr]
    # An empty matrix schedules zero jobs. See wheel_lane_policy.py.
    if: ${{ needs.wheel-cross-policy.outputs.matrix != '[]' }}
    runs-on: ${{ matrix.runner }}
    # Cross-compiling the whole workspace cold, plus catalogue sysroot download.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.wheel-cross-policy.outputs.matrix) }}
    env:
      CARGO_TERM_COLOR: always
      # soldr#2453/#2469: this is a cache-disabled, all-miss release+LTO build.
      # Two concurrent rustc processes still OOM-killed zccache-daemon-core on
      # the 4-vCPU hosted runner, so the policy matrix carries the measured
      # per-cell memory bound.
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      SOLDR_JOBS: ${{ matrix.jobs }}
      SOLDR_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive
          ref: ${{ github.sha }}

      - name: Setup Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install rustup 1.95.0
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update

      - name: Add ${{ matrix.target }} rust target
        run: rustup target add ${{ matrix.target }} --toolchain 1.95.0

      # Reuse the shared bootstrap binary rather than compiling a fourth copy
      # of soldr; this lane is about what `soldr wheel` does, not about
      # building soldr.
      - name: Download shared bootstrap soldr artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: soldr-ci-bootstrap-linux-gnu
          path: ${{ runner.temp }}/soldr-bin

      - name: Restore cargo + target caches for the wheel build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: wheel-cross-${{ matrix.target }}-release-v1

      # Deliberately no `pip install maturin` here: provisioning maturin is
      # part of what `soldr wheel` claims to do (it re-enters through the
      # `soldr maturin ...` execution path, which resolves the managed
      # maturin). Pre-installing one would hide a regression in that ladder.

      - name: Build the wheel through `soldr wheel`
        shell: bash
        run: |
          set -euo pipefail
          driver="$RUNNER_TEMP/soldr-bin/soldr"
          chmod +x "$driver"
          "$driver" --version
          # The verb under test. `--release` is opt-in as of the #2139
          # follow-up, and a release CROSS build is the only shape in which
          # soldr claims a manylinux floor -- because it is the only shape in
          # which `target_lifecycle::prepare_for_invocation` actually ran and
          # mounted the catalogue sysroot that creates the floor.
          #
          # allow-release: the release profile is precisely what is under test here -- a manylinux tag is only claimed on a release cross build, so a cheaper profile would verify a wheel in a shape soldr never claims a floor for (soldr#1981 second criterion).
          "$driver" wheel --release --target "${{ matrix.target }}" \
            --out dist

      - name: Assert the wheel filename carries the expected tags
        shell: python
        env:
          EXPECTED_TAG: ${{ matrix.expected_tag }}
          TARGET: ${{ matrix.target }}
        run: |
          import os
          import sys
          from pathlib import Path

          expected = os.environ["EXPECTED_TAG"]
          wheels = sorted(Path("dist").glob("*.whl"))
          if not wheels:
              sys.exit("`soldr wheel` produced no wheel in dist/")

          # soldr's wheel has no PyO3 extension module -- soldr-cli's [lib] is
          # a plain rlib and the wheel ships a `[[bin]]` plus a pure-Python
          # package. maturin therefore emits `py3-none-<platform>`, NOT
          # `cp3xx-abi3-<platform>`. `abi3` in `soldr wheel` names the *scope
          # gate* (it refuses builds that would need a target-side CPython),
          # not a tag this particular project's wheel carries. Asserting the
          # tag maturin actually emits is what makes this a gate; asserting a
          # tag that cannot appear would only ever fail.
          bad = [w.name for w in wheels if expected not in w.name]
          if bad:
              sys.exit(
                  f"wheel(s) missing the {expected} platform tag: {bad}\n"
                  "soldr claimed this floor because the build was release +\n"
                  "cross, so `target_lifecycle::prepare_for_invocation` ran.\n"
                  "A different tag means maturin re-derived it from the bytes,\n"
                  "i.e. the catalogue sysroot did not take effect."
              )
          untagged = [w.name for w in wheels if "-py3-none-" not in w.name]
          if untagged:
              sys.exit(
                  f"unexpected Python/ABI tag: {untagged}\n"
                  "This wheel is bin-bindings + pure Python, so maturin emits\n"
                  "py3-none-*. A cp3xx-abi3-* name means the project grew an\n"
                  "extension module and this assertion needs revisiting."
              )
          print(f"tag assertion OK ({expected}): {[w.name for w in wheels]}")

      # The step above reads the NAME. This one reads the BYTES. A wheel
      # tagged manylinux_2_17 whose binary needs GLIBC_2.39 is worse than an
      # untagged one: pip trusts the tag, installs it on Debian 12, and the
      # program dies at run time. See soldr#1060.
      - name: Verify the embedded binary honours the claimed floor
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_wheel_glibc.py \
            --max-glibc "${{ matrix.max_glibc }}" dist/*.whl

      - name: Upload the wheel for inspection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: soldr-wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: warn
          retention-days: 7
