name: CI

on:
  push:
    # soldr#1985 — only main. Previously `branches-ignore: [perf/**,
    # evaluate/**]`, which matches every PR branch, so each push to an
    # open PR fired this workflow TWICE: once for `push` and once for
    # `pull_request`, with byte-identical content. Five branches were
    # observed running two concurrent 21-job sweeps each. Feature
    # branches keep full coverage through the `pull_request` trigger
    # below; perf/** and evaluate/** remain excluded by construction.
    branches:
      - main
    tags-ignore:
      - '*'
    paths-ignore:
      - '*.md'
      - '**/*.md'
  # pull_request triggers exist so the `fast-build` gates below have a
  # labels payload. On a label-only event (`labeled` / `unlabeled`) GHA
  # re-runs the workflow, which lets contributors request the fast path.
  # The Windows MSVC E2E policy still overrides that request whenever a
  # platform-sensitive path changed.
  #
  # NOTE: pushes to main always run the full sweep. Label gates evaluate
  # open when `github.event.pull_request` is null,
  # and windows_e2e_policy.py explicitly requires the Windows pairs on
  # every non-PR event.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths-ignore:
      - '*.md'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# soldr#1985 — superseded PR runs used to keep holding runner slots while a
# fresh 21-job sweep queued behind them; five concurrent CI runs were observed
# stacked on main alone. That self-inflicted load is what pushed ubuntu-24.04
# queues to 20-30 min, which in turn delayed the cross-builds that gate the
# macOS target-runs (one waited 83m40s to do 117s of work).
#
# Pushes to main are never cancelled: release-auto.yml triggers on push-to-main
# (Cargo.toml / package.json), so every commit that lands must stay fully tested.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_BACKTRACE: "1"
  # Direct CI jobs may resolve managed zccache from zackees/zccache.
  # Use soldr's explicit opt-in token env for authenticated release
  # metadata requests without weakening generic cross-repo GITHUB_TOKEN use.
  SOLDR_GITHUB_TOKEN: ${{ github.token }}

jobs:
  lint:
    name: Lint
    # Run on every push to main AND on every PR — without this PRs slip
    # in unformatted code that breaks main's Lint job on merge. Repeated
    # 4 times in late 2026-06 (#1111/#1114/#1115/#1120 fallout), each
    # requiring a chase-PR to unbreak main. PR-side Lint failure is the
    # cheap fix; required-status branch protection is the structural
    # fix and lives in repo settings.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive
          # soldr#1966: the line-ceiling ratchet below needs `git merge-base`,
          # which the default depth-1 checkout cannot compute.
          fetch-depth: 0

      # soldr#1248/#2 follow-up: cache + soldr-cook stay disabled on
      # Lint while target/profile-shaped cook restore is reintroduced in
      # the cross/release lanes first. Restore-from-git workaround that
      # paired with the old cook flow is no longer needed because the
      # manifest is never overwritten.
      # soldr#1340 — pre-cache the 1.94.1 toolchain in ~/.rustup so
      # setup-soldr uses it (Setup soldr build cache drops from ~22 s
      # to ~2 s). Same pattern as #1341/#1342/#1343. Shared cache key
      # across all soldr workflows.
      # soldr#1966 — the 1,500-line ceiling was enforced only by a
      # PostToolUse hook, which fires for agent edits and nothing else, so
      # files drifted past it by every other route and the cost landed on
      # whichever agent next had to touch one. A ratchet rather than a
      # threshold: 13 files are already over, and blocking every PR that
      # touches them would be worse than the drift. Runs before the
      # expensive toolchain setup so an oversized diff fails in seconds.
      - name: Line-ceiling ratchet
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # Must compare against the MERGE BASE, not the base tip. A branch
          # behind main differs from the tip in files it never touched, so a
          # tip comparison attributes main's own changes to this PR -- caught
          # while testing this step, which flagged a file the PR did not touch.
          #
          # merge-base needs real history, which the default shallow
          # pull_request checkout does not have (the first version of this step
          # skipped itself into uselessness for exactly that reason), hence
          # fetch-depth: 0 on the checkout above.
          git fetch --no-tags origin "$GITHUB_BASE_REF"
          python3 .github/scripts/loc_ratchet.py --base-ref "origin/$GITHUB_BASE_REF"

      # soldr#1981 — `--release` costs thin-LTO + single-CU codegen, and paying
      # that on a job whose output never ships is pure waste. soldr#1982 removed
      # the offenders; this keeps them gone. Runs before the toolchain setup so
      # a regression fails in seconds rather than after a full build.
      - name: Release-profile policy
        run: python3 .github/scripts/verify_release_profile_policy.py

      # Same pinned action benchmark-stats.yml already uses. `uv run --with`
      # builds an ephemeral env, which sidesteps the PEP 668 / system-python
      # friction that workflow hit with `uv pip install --system`.
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5

      # soldr#2013 — nothing ran `tests/` on CI, so it decayed silently: a test
      # asserting on a workflow #1982 deleted, two lints that scanned nothing
      # and reported clean (#2008), and a manifest-coupled assertion (#2004).
      # A deletion PR cannot learn it orphaned a test; a lint cannot learn it
      # stopped scanning. 281 tests, ~15s, and no Rust toolchain needed — so it
      # runs here, before the expensive setup below.
      - name: Python tests
        run: |
          set -euo pipefail
          # `.github/scripts/` is included deliberately: six test files live
          # beside the scripts they cover (target-run summary, the Windows
          # e2e/MSVC-cache policies, catalogued-asset download, nextest fetch,
          # toolchain asset query) and this step used to run `tests/` only, so
          # those 29 tests never executed in CI. Tests that exist but never run
          # are worse than none -- they rot silently while implying coverage.
          uv run --no-project --with pytest python -m pytest tests/ .github/scripts/ -q

      - name: Cache rustup 1.94.1 in ~/.rustup
        id: rustup_cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.rustup/toolchains/1.94.1-x86_64-unknown-linux-gnu
          key: rustup-1.94.1-linux-x64-v1

      - name: Install rustup 1.94.1 to ~/.rustup (if not cached)
        if: steps.rustup_cache.outputs.cache-hit != 'true'
        run: rustup toolchain install 1.94.1 --profile minimal --no-self-update

      - name: Setup soldr build cache
        uses: zackees/setup-soldr@922fe76752c37e46d63436b338fbe8cf3709bb69
        with:
          # soldr#1799: pin the soldr that builds us -- the action's default
          # (0.8.23) predates #1820 and GCs live target/ artifacts after every
          # build, so the next build recompiles the world. See
          # tests/test_setup_soldr_version_pins.py.
          version: 0.8.29
          toolchain: 1.94.1
          cache: false
          zccache-seed-strict: true

      # soldr#1239 — cache ~/.cargo/{registry,git} + target/ so `cargo
      # clippy --workspace --all-targets` doesn't recompile ~700 deps
      # from scratch every CI run. Same SHA-pinned action as #1228/
      # #1233/#1236/#1238.
      - name: Restore cargo + target caches
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: lint

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      # Explicit `-p` per workspace member, not `--all` — `cargo fmt --all`
      # walks the `_vender/zccache` path-dep submodule. See soldr#1066.
      # Keep this list in sync with `[workspace].members` in Cargo.toml;
      # a crate missing here drifts unformatted forever (soldr-daemon and
      # soldr-fetch both had, when only `-p soldr-cli` was checked).
      - name: Check formatting
        run: >-
          soldr cargo fmt
          -p soldr-cli
          -p soldr-core
          -p soldr-cache
          -p soldr-fetch
          -p soldr-daemon
          -- --check

      - name: Check npm package metadata
        run: node scripts/test-npm-package.js

      - name: Verify direct CI job timeouts
        run: python3 .github/scripts/verify_ci_job_timeouts.py

      # A `paths:` filter that matches nothing leaves its workflow silently
      # dark: it never runs, so it can never go red. `crates/soldr-cli/src/
      # cache_lib/**` moved to crates/soldr-cache in #1490 Phase 4, and
      # thin-v2-verify + cook-size-gate kept watching the old location.
      - name: Verify workflow path filters still match
        run: python3 .github/scripts/verify_workflow_paths.py

      # soldr#2102. `./lint` runs six Python tools and CI ran none of them, so
      # lint drift accumulated unnoticed for months. flake8 is the one that can
      # be enforced today: with `.flake8` delegating line length to black it
      # reports 0 violations across every Python directory, so this is a
      # regression guard rather than a new policy.
      #
      # black, isort and mypy still report on main and are NOT wired here --
      # each needs a decision (which width, whether to fix or scope mypy's 34
      # errors). soldr#2102 tracks them. Adding a gate that fails on main would
      # block every PR for a problem it did not cause.
      # ruff was not in CI at all -- it ran only from `./lint`, locally, so
      # nothing enforced it. #2102 widened its rule selection (bugbear and
      # friends) and it passes on `src tests`, so it is enforced here now.
      #
      # `.github/scripts` and `ci` were left out at first because they had 10
      # findings, and fixing them was owed a reviewed diff rather than a
      # drive-by. That diff happened, so the scope is now all four directories
      # and the two that were unenforced are the ones most worth enforcing:
      # they are the scripts CI itself runs.
      - name: Python lint (ruff)
        # Bounded, like the other four. `ruff>=0.4` was open-ended, so CI
        # resolved a newer ruff than `./install` gives contributors and
        # failed on RUF043 -- a rule that did not exist in the tested
        # version. An unbounded linter is a CI break waiting on someone
        # else's release date.
        run: >-
          uv run --no-project --with 'ruff>=0.12,<0.13'
          ruff check src tests .github/scripts ci

      - name: Python lint (flake8)
        # Pinned, not floating. An unpinned `--with flake8` means a future
        # release that adds a check turns this red on code nobody touched,
        # and the failure would look like the PR's fault. `>=7.3,<8` follows
        # the `maturin>=1.7,<2` style already in pyproject: patches flow,
        # a major cannot land unannounced. soldr#2102 covers the wider
        # problem -- black, isort, pylint and mypy are installed unpinned by
        # `./install` and declared nowhere, which is why contributors format
        # differently from one another.
        run: uv run --no-project --with 'flake8>=7.3,<8' python -m flake8 src tests .github/scripts ci

      # black and isort, now that #2105 constrained them in `./install` so a
      # contributor and CI cannot resolve different versions. Both bounds were
      # checked to be format-stable before wiring: formatting the tree with
      # 25.1.0 and with 25.12.0 produced byte-identical output, and likewise
      # isort 6.0.1 vs 6.1.0. Black's own stability policy is per calendar
      # year and its major IS the year, so `<26` is the guarantee, not a guess.
      #
      # Scoped to `src tests`, matching `./lint` -- the directories that were
      # reformatted. Widening this is a separate change with its own diff.
      - name: Python format (black, isort)
        run: |
          set -euo pipefail
          uv run --no-project --with 'black>=25.1,<26' python -m black --check src tests
          uv run --no-project --with 'isort>=6.0,<7' python -m isort --profile black --check-only src tests

      # mypy over both the shipped package and the tests. `src/` was cleaned
      # in #2107 (four annotation defects, none behavioural); `tests/` is
      # clean as of this change, so the whole tree is checked and this stays a
      # regression guard rather than a new policy.
      # The sixth and last tool from `./lint`, and the one the issue is named
      # for: pylint reported 319 findings, so `./lint` (which runs under
      # `set -e`) could never reach its final line.
      #
      # 315 of the 319 were in `tests/` and were pytest idiom, not defects --
      # fixtures shadowing their own names, tests reaching into the private
      # functions they exist to test. `src/` had four, all deliberate, all now
      # carrying an inline disable that states the reason at the site.
      #
      # So the two surfaces are checked with two rulesets. `src/` runs pylint's
      # DEFAULT configuration -- nothing disabled -- and scores 10.00/10. Only
      # `tests/` gets the relaxations, and they live in `tests/.pylintrc` with
      # a per-entry rationale. Passing that file explicitly rather than relying
      # on pylint's directory discovery means it applies where it is named and
      # nowhere else.
      - name: Python lint (pylint)
        # pytest in the ephemeral env for the same reason as the mypy step
        # below: 22 test files import it, and pylint reports import-error for
        # what it cannot resolve.
        run: |
          set -euo pipefail
          uv run --no-project --with 'pylint>=4.0,<5' --with 'pytest>=8.0'             python -m pylint src
          uv run --no-project --with 'pylint>=4.0,<5' --with 'pytest>=8.0'             python -m pylint --rcfile=tests/.pylintrc tests

      # All four directories. `.github/scripts` and `ci` are the scripts CI
      # itself runs, so a type error in them breaks a lane rather than a
      # developer's editor. Every finding was fixed at the source rather than
      # suppressed (a `None` that could reach `.get`, a list indexed with a
      # str, an over-tight `dict[str, object]` on a `json.loads` payload).
      #
      # `ci/` was held back in #2119 because four of its findings were
      # `fcntl.flock` "has no attribute" -- which looked like a Windows-only
      # artifact that would make the check pass or fail depending on who ran
      # it. It was not: `perf_local.py` already branches correctly at runtime,
      # but on `os.name == "nt"`, and mypy narrows `sys.platform`, not
      # `os.name`. Switching to the idiom mypy understands prunes the dead
      # branch on each platform and the findings disappear on both, so no
      # platform-scoping is needed here after all.
      - name: Python types (mypy)
        # pytest is in the ephemeral env because the tests import it, and
        # mypy cannot resolve an import it cannot see. This passed locally
        # without it only because `uv run` picked up the project .venv,
        # which CI does not have -- the same environment-parity trap that
        # bit the flake8 step in #2103.
        run: >-
          uv run --no-project --with 'mypy>=1.18,<2' --with 'pytest>=8.0'
          python -m mypy src tests .github/scripts ci


      # soldr#1978 item 6 names this step as duplicating build-linux-x64's
      # compile of the same workspace + test targets on a second runner.
      # Measured across three consecutive runs before acting on it:
      #
      #   Run clippy                              39s  32s  39s
      #   Enforce daemon boundary (dylint)       134s 127s 125s
      #   Test the daemon-boundary lint           85s  83s  81s
      #   Install Dylint toolchain                21s  21s  21s
      #   Build the daemon-boundary lint          10s  10s  10s
      #
      # The duplicate compile costs ~35s -- the shared-key cargo/target caches
      # are doing their job, so it is a freshness check rather than a rebuild.
      # About 72% of this job is the dylint custom-lint pipeline instead, which
      # item 6 does not mention.
      #
      # The obvious saving there would be gating the lint's OWN test (~85s) on
      # changes to the lint crate. Deliberately not done: soldr#2091 was two
      # workflows that went silently dark because a path filter stopped
      # matching, and trading a reliably-running check for 85s is the wrong
      # side of that trade. Measure again before revisiting.
      - name: Run clippy
        run: soldr cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Install Dylint
        run: |
          soldr cargo install cargo-dylint --version 6.0.1 --locked
          soldr cargo install dylint-link --version 6.0.1 --locked

      - name: Install Dylint toolchain
        run: >-
          soldr rustup toolchain install
          nightly-2026-05-26
          --profile minimal
          --component rustc-dev
          --component llvm-tools-preview
          --component rust-src

      - name: Configure Dylint driver Cargo shim
        run: >-
          uv run --no-project python
          .github/scripts/configure_dylint_cargo_shim.py
          --output-dir "${RUNNER_TEMP}/dylint-cargo-shim"
          --toolchain nightly-2026-05-26-x86_64-unknown-linux-gnu
          >> "${GITHUB_PATH}"

      - name: Build daemon process-creation boundary lint
        working-directory: dylints/ban_raw_process_creation
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-05-26-x86_64-unknown-linux-gnu
          SOLDR_LINKER: default
        run: >-
          soldr rustup run
          nightly-2026-05-26-x86_64-unknown-linux-gnu
          cargo build --profile release
          --target-dir
          "${GITHUB_WORKSPACE}/target/dylint/libraries/nightly-2026-05-26-x86_64-unknown-linux-gnu"

      - name: Enforce daemon process-creation boundary
        env:
          # setup-soldr currently provides v0.8.23, whose post-command target
          # pruning can remove Dylint's cdylib before cargo-dylint loads it.
          # Newer Soldr releases no longer prune automatically. Its fast-linker
          # default would also override the Dylint library's required linker
          # wrapper, so disable that convenience for this step.
          SOLDR_NO_GC_TARGET: "1"
          SOLDR_LINKER: default
        run: >-
          "${CARGO_HOME}/bin/cargo-dylint"
          dylint --no-build --all
          -- --workspace --all-targets

      - name: Test daemon process-creation boundary lint
        working-directory: dylints/ban_raw_process_creation
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-05-26-x86_64-unknown-linux-gnu
          SOLDR_NO_GC_TARGET: "1"
          SOLDR_LINKER: default
        run: >-
          soldr rustup run
          nightly-2026-05-26-x86_64-unknown-linux-gnu
          cargo test
          --manifest-path Cargo.toml

  # Per-platform `build workspace + run unit/smoke tests` jobs.
  # Each is a thin caller of the `_build-and-test.yml` template so
  # the duplicated cargo invocations live in one place and every
  # platform still shows as its own top-level entry in the GHA
  # sidebar. Add a new platform: copy one of these blocks and tweak
  # the inputs.

  build-linux-x64:
    name: Linux x64
    # soldr#1258 — dropped `needs: lint`. Every cross-build lane runs in
    # parallel with Lint; the sequential gate here was inconsistent and
    # added ~130 s to the CI critical path. Lint remains a required
    # status check via branch protection, so a Lint failure still blocks
    # merge — the `needs:` clause was purely a wallclock cost.
    # soldr#1676/#1703: x86_64 GNU is the canonical native exception: run the
    # complete workspace suite directly on its native runner. The other seven
    # canonical targets independently replay their complete archives.
    if: github.ref_name == 'main' || github.event_name == 'pull_request'
    uses: ./.github/workflows/_build-and-test.yml
    with:
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-gnu

  pep517-daemon-smoke:
    name: PEP 517 daemon smoke (${{ matrix.name }})
    if: ${{ github.ref_name == 'main' || !contains(github.event.pull_request.labels.*.name, 'fast-build') }}
    runs-on: ${{ matrix.runner }}
    # Includes native wheel compilation plus 3m and 15m inner smoke limits.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      # soldr#1978 item 1: the macOS leg runs on main only.
      #
      # macOS is the scarcest pool -- target-runs were observed waiting 39-84
      # minutes for 2-minute jobs, and the v0.8.28 release sat queued over an
      # hour behind a single `macos-15` slot. This job and `e2e-macos-arm64`
      # each allocate their own `macos-15` VM per PR, on the same image.
      #
      # Gating rather than merging the two jobs: they do genuinely different
      # work (native wheel build vs nextest archive replay), so sharing one
      # allocation is a restructure, not a trigger edit. That is still the
      # better end state -- soldr#1978 tracks it.
      #
      # The matrix is selected rather than filtered per-leg so the runner is
      # never allocated at all; a step-level `if` would still take the slot.
      matrix:
        include: ${{ fromJSON(github.ref_name == 'main'
          && '[{"name":"macos-arm64","runner":"macos-15","python":"3.13"},{"name":"windows-x64","runner":"windows-2025","python":"3.13t"}]'
          || '[{"name":"windows-x64","runner":"windows-2025","python":"3.13t"}]') }}
    env:
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: always
      SOLDR_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install rustup 1.94.1
        run: rustup toolchain install 1.94.1 --profile minimal --no-self-update

      - name: Setup soldr build cache
        uses: zackees/setup-soldr@922fe76752c37e46d63436b338fbe8cf3709bb69
        with:
          # soldr#1799: pin the soldr that builds us -- the action's default
          # (0.8.23) predates #1820 and GCs live target/ artifacts after every
          # build, so the next build recompiles the world. See
          # tests/test_setup_soldr_version_pins.py.
          version: 0.8.29
          toolchain: 1.94.1
          cache: false
          zccache-seed-strict: true

      # soldr#1438: the PEP 517 smoke builds the current wheel with
      # plain maturin, so setup-soldr's compiler cache is not in the
      # build path. Reuse Cargo's target/registry cache here just like
      # the Lint job does; keep a separate key because this job builds
      # native ci-release wheels on macOS/Windows. soldr#1479 lowered
      # ci-release opt-levels; v2 avoids restoring stale opt-level-3
      # target trees under rust-cache's profile-blind meta-hash.
      - name: Restore cargo + target caches for wheel build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: pep517-${{ matrix.name }}-ci-release-v2

      - name: Build soldr wheel under test
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin>=1.7,<2"
          maturin build --locked --profile ci-release --out dist

      - name: Run downstream PEP 517 daemon smoke
        shell: pwsh
        env:
          SOLDR_DAEMON_REQUIRED: "1"
          SOLDR_DAEMON_SPAWN_RETRY_BUDGET_MS: "5000"
        run: python .github/scripts/pep517_daemon_smoke.py --wheel "dist/*.whl" --timeout 180

      - name: Build source wheel with installed shims first on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          python .github/scripts/source_wheel_shim_smoke.py
          --wheel "dist/*.whl"
          --source .
          --timeout 900
          --require-free-threaded

  # There is no standalone macOS x64 build workflow. The native Linux
  # integration sweep covers target-independent logic, while the
  # `e2e-macos-x64` lane below cross-builds on Linux and runs the produced
  # archive on `macos-15-intel`.

  # build-windows-{x64,arm64} removed. The unit-test sweep for
  # windows runs on linux x86 via `build-linux-x64` (target-
  # independent logic); the `e2e-windows-{x64,arm64}` lanes below
  # cover windows-runtime behavior via the cross-built binary
  # downloaded onto the windows runner. ONE windows runner per
  # arch — goal of the consolidation pass.

  # Linux glibc/musl e2e jobs always run — they are the proof of life
  # and are cheap. macOS E2E pairs always run.
  # fast-build may skip only the Windows MSVC E2E pairs, and only for low-risk
  # docs/repository metadata.
  # The separate PEP 517 platform smoke remains label-gated as a pair.
  e2e-linux-x64:
    name: build
    uses: ./.github/workflows/_bootstrap-e2e.yml
    with:
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      binary_name: soldr
      source_ref: ${{ github.sha }}

  # soldr#1697: a stable, always-reported check decides whether the Windows
  # E2E pairs may be skipped. A failed/empty classification runs them; pushes
  # always run them. This keeps required-check behavior deterministic while a
  # docs-only fast-build PR can still avoid two Linux builds + target runners.
  windows-e2e-policy:
    name: Windows E2E policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      run_windows_e2e: ${{ steps.policy.outputs.run_windows_e2e }}
      reason: ${{ steps.policy.outputs.reason }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - name: Classify Windows E2E requirement
        id: policy
        run: python3 .github/scripts/windows_e2e_policy.py

  # soldr#1248: darwin/MSVC cross-build lanes need a current in-tree
  # host soldr to drive the blessed `soldr build --target ...` surface.
  # Building that binary inside each lane turns a cache miss into three
  # identical ~5 minute compiles. Restore/build it once, then fan out the
  # resulting artifact to those lanes.
  e2e-cross-bootstrap-soldr:
    name: bootstrap soldr for darwin/msvc cross-builds
    runs-on: ubuntu-24.04
    # Bounds the shared prerequisite; cold-cache successes are normally under 3m.
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive
          ref: ${{ github.sha }}

      - name: Cache rustup 1.94.1 in ~/.rustup
        id: rustup_cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.rustup/toolchains/1.94.1-x86_64-unknown-linux-gnu
          key: rustup-1.94.1-linux-x64-v1

      - name: Install rustup 1.94.1 to ~/.rustup (if not cached)
        if: steps.rustup_cache.outputs.cache-hit != 'true'
        run: rustup toolchain install 1.94.1 --profile minimal --no-self-update

      - name: Restore cached bootstrap soldr binary
        id: bootstrap_cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/soldr-bin
          # soldr#1978 item 6: the profile is part of the artifact's identity.
          # This builds with `--profile ci-bootstrap` (opt-level 0 since
          # soldr#1479) while baseline-zero-deps.yml builds `--release`, so the
          # two binaries are NOT interchangeable. hashFiles() covers the
          # sources but not the profile, so without naming it here a profile
          # change would silently restore a binary built the old way.
          key: bootstrap-soldr-blessed-linux-gnu-ci-bootstrap-${{ hashFiles('crates/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}

      - name: Restore cargo + target caches for bootstrap build
        if: steps.bootstrap_cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # soldr#1479 lowered ci-bootstrap to opt-level 0; v2 keeps
          # cache saves aligned with the new helper-binary profile.
          shared-key: bootstrap-soldr-linux-gnu-ci-bootstrap-v2

      - name: Build bootstrap soldr
        if: steps.bootstrap_cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          RUSTC_WRAPPER: ""
        run: |
          set -euo pipefail
          cargo build --profile ci-bootstrap --locked --package soldr-cli \
            --bin soldr \
            --target x86_64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/soldr-bin"
          cp target/x86_64-unknown-linux-gnu/ci-bootstrap/soldr "$RUNNER_TEMP/soldr-bin/soldr"

      - name: Verify bootstrap soldr
        shell: bash
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP/soldr-bin/soldr"
          "$RUNNER_TEMP/soldr-bin/soldr" --version

      - name: Upload bootstrap soldr artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: soldr-ci-bootstrap-linux-gnu
          path: ${{ runner.temp }}/soldr-bin/soldr
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # soldr#1051 / #1038: all cross-builds go through the consolidated
  # _ci-cross-build-linux.yml workflow on ubuntu-24.04. Each pair
  # below is "cross-build on linux + target-run on native runner".
  # The windows-host cross-compile regression that lived here previously
  # was dropped per the #1051 acceptance — saves a scarce-runner job
  # and the same path is exercised locally via `ci/docker-*` harnesses.

  # ---------- Linux ARM64 (gnu) ----------
  e2e-linux-arm64-build:
    name: cross-build aarch64-unknown-linux-gnu (linux host)
    needs: e2e-cross-bootstrap-soldr
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: aarch64-unknown-linux-gnu
      artifact_name: soldr-ci-e2e-linux-arm64
      source_ref: ${{ github.sha }}
      bootstrap_artifact_name: soldr-ci-bootstrap-linux-gnu

  e2e-linux-arm64:
    name: target-run aarch64-unknown-linux-gnu
    needs: e2e-linux-arm64-build
    uses: ./.github/workflows/_ci-target-run.yml
    with:
      runs_on: ubuntu-24.04-arm
      target: aarch64-unknown-linux-gnu
      artifact_name: soldr-ci-e2e-linux-arm64

  # ---------- Linux x64 (musl) ----------
  e2e-linux-x64-musl-build:
    name: cross-build x86_64-unknown-linux-musl (linux host)
    needs: e2e-cross-bootstrap-soldr
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: x86_64-unknown-linux-musl
      artifact_name: soldr-ci-e2e-linux-x64-musl
      source_ref: ${{ github.sha }}
      bootstrap_artifact_name: soldr-ci-bootstrap-linux-gnu

  e2e-linux-x64-musl:
    name: target-run x86_64-unknown-linux-musl
    needs: e2e-linux-x64-musl-build
    uses: ./.github/workflows/_ci-target-run.yml
    with:
      runs_on: ubuntu-24.04
      target: x86_64-unknown-linux-musl
      artifact_name: soldr-ci-e2e-linux-x64-musl

  # ---------- Linux ARM64 (musl) ----------
  e2e-linux-arm64-musl-build:
    name: cross-build aarch64-unknown-linux-musl (linux host)
    needs: e2e-cross-bootstrap-soldr
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: aarch64-unknown-linux-musl
      artifact_name: soldr-ci-e2e-linux-arm64-musl
      source_ref: ${{ github.sha }}
      bootstrap_artifact_name: soldr-ci-bootstrap-linux-gnu

  e2e-linux-arm64-musl:
    name: target-run aarch64-unknown-linux-musl
    needs: e2e-linux-arm64-musl-build
    uses: ./.github/workflows/_ci-target-run.yml
    with:
      runs_on: ubuntu-24.04-arm
      target: aarch64-unknown-linux-musl
      artifact_name: soldr-ci-e2e-linux-arm64-musl

  # ---------- macOS x64 ----------
  # Re-enabled now that zccache no longer pulls tikv-jemalloc-sys —
  # mimalloc is the sole allocator (zccache PR #948). Previously
  # disabled because the darwin cross-compile died on jemalloc's
  # autoconf sys/syscall.h probe (#1071).
  e2e-macos-x64-build:
    name: cross-build x86_64-apple-darwin (linux host)
    needs: e2e-cross-bootstrap-soldr
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: x86_64-apple-darwin
      artifact_name: soldr-ci-e2e-macos-x64
      source_ref: ${{ github.sha }}
      bootstrap_artifact_name: soldr-ci-bootstrap-linux-gnu

  e2e-macos-x64:
    name: target-run x86_64-apple-darwin
    needs: e2e-macos-x64-build
    uses: ./.github/workflows/_ci-target-run.yml
    with:
      runs_on: macos-15-intel
      target: x86_64-apple-darwin
      artifact_name: soldr-ci-e2e-macos-x64

  # ---------- macOS ARM64 ----------
  e2e-macos-arm64-build:
    name: cross-build aarch64-apple-darwin (linux host)
    needs: e2e-cross-bootstrap-soldr
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: aarch64-apple-darwin
      artifact_name: soldr-ci-e2e-macos-arm64
      source_ref: ${{ github.sha }}
      bootstrap_artifact_name: soldr-ci-bootstrap-linux-gnu

  e2e-macos-arm64:
    name: target-run aarch64-apple-darwin
    needs: e2e-macos-arm64-build
    uses: ./.github/workflows/_ci-target-run.yml
    with:
      runs_on: macos-15
      target: aarch64-apple-darwin
      artifact_name: soldr-ci-e2e-macos-arm64

  # ---------- Windows x64 ----------
  e2e-windows-x64-build:
    name: cross-build x86_64-pc-windows-msvc (linux host)
    needs: [e2e-cross-bootstrap-soldr, windows-e2e-policy]
    if: ${{ needs.windows-e2e-policy.outputs.run_windows_e2e == 'true' }}
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: x86_64-pc-windows-msvc
      artifact_name: soldr-ci-e2e-windows-x64
      source_ref: ${{ github.sha }}
      bootstrap_artifact_name: soldr-ci-bootstrap-linux-gnu

  e2e-windows-x64:
    name: target-run x86_64-pc-windows-msvc
    needs: e2e-windows-x64-build
    uses: ./.github/workflows/_ci-target-run.yml
    with:
      runs_on: windows-2025
      target: x86_64-pc-windows-msvc
      artifact_name: soldr-ci-e2e-windows-x64

  # ---------- Windows ARM64 ----------
  # soldr#1524: the managed ARM64 xwin cache and zlib-ng catalogue row
  # make this the same blessed build + nextest archive path as x64 MSVC.
  e2e-windows-arm64-build:
    name: cross-build aarch64-pc-windows-msvc (linux host)
    needs: [e2e-cross-bootstrap-soldr, windows-e2e-policy]
    if: ${{ needs.windows-e2e-policy.outputs.run_windows_e2e == 'true' }}
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: aarch64-pc-windows-msvc
      artifact_name: soldr-ci-e2e-windows-arm64
      source_ref: ${{ github.sha }}
      bootstrap_artifact_name: soldr-ci-bootstrap-linux-gnu

  e2e-windows-arm64:
    name: target-run aarch64-pc-windows-msvc
    needs: e2e-windows-arm64-build
    uses: ./.github/workflows/_ci-target-run.yml
    with:
      runs_on: windows-11-arm
      target: aarch64-pc-windows-msvc
      artifact_name: soldr-ci-e2e-windows-arm64
