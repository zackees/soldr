name: CI

on:
  push:
    # Skip perf-iteration branches — they only need perf-matrix.yml,
    # not the full Lint/build/e2e sweep. (`branches` and
    # `branches-ignore` are mutually exclusive, so this replaces the
    # previous `branches: ['**']` catch-all.)
    branches-ignore:
      - 'perf/**'
      - 'evaluate/**'
    tags-ignore:
      - '*'
    paths-ignore:
      - '*.md'
      - '**/*.md'
  # pull_request triggers exist so the `fast-build` label gate below
  # has a `github.event.pull_request.labels` payload to inspect. On a
  # label-only event (`labeled` / `unlabeled`) GHA re-runs the
  # workflow, which lets contributors flip a PR between "fast" and
  # "full" CI by toggling the label.
  #
  # NOTE: pushes to main always run the full sweep — the gate's
  # `contains(...)` check evaluates to `false` on push events because
  # `github.event.pull_request` is null, so the `!contains(...)`
  # condition is `true` and the heavy mac/win jobs proceed.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths-ignore:
      - '*.md'
      - '**/*.md'

permissions:
  contents: read

env:
  RUST_BACKTRACE: "1"
  # Direct CI jobs may resolve managed zccache from zackees/zccache.
  # Use soldr's explicit opt-in token env for authenticated release
  # metadata requests without weakening generic cross-repo GITHUB_TOKEN use.
  SOLDR_GITHUB_TOKEN: ${{ github.token }}

jobs:
  lint:
    name: Lint
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Setup soldr build cache
        uses: zackees/setup-soldr@cca74625e75e70b56f1805fa6eeee9069f945d48
        with:
          toolchain: 1.94.1
          cache: true
          zccache-seed-strict: true
          cache-key-suffix: lint-ubuntu
          prebuild-deps: soldr-cook
          prebuild-deps-flags: ""

      - name: Restore checkout after soldr-cook
        shell: pwsh
        run: git restore --worktree -- .

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      # `-p soldr-cli` not `--all` — `cargo fmt --all` walks the
      # `_vender/zccache` path-dep submodule. See soldr#1066.
      - name: Check formatting
        run: soldr cargo fmt -p soldr-cli -- --check

      - name: Check npm package metadata
        run: node scripts/test-npm-package.js

      - name: Run clippy
        run: soldr cargo clippy --workspace --all-targets --locked -- -D warnings

  # Per-platform `build workspace + run unit/smoke tests` jobs.
  # Each is a thin caller of the `_build-and-test.yml` template so
  # the duplicated cargo invocations live in one place and every
  # platform still shows as its own top-level entry in the GHA
  # sidebar. Add a new platform: copy one of these blocks and tweak
  # the inputs.

  build-linux-x64:
    name: Linux x64
    needs: lint
    if: github.ref_name == 'main'
    uses: ./.github/workflows/_build-and-test.yml
    with:
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      shared_key: build-linux-x64

  # build-macos-x64 removed. The unit-test sweep for darwin runs on
  # linux x86 (same Rust code, target-independent logic) via
  # `build-linux-x64`; the `e2e-macos-x64` lane below covers
  # darwin-runtime behavior via the cross-built binary; the
  # standalone `build-macos-x64.yml` push:main smoke is the
  # native-runtime guard. One mac runner per arch — goal of the
  # consolidation pass.

  # build-windows-{x64,arm64} removed. The unit-test sweep for
  # windows runs on linux x86 via `build-linux-x64` (target-
  # independent logic); the `e2e-windows-{x64,arm64}` lanes below
  # cover windows-runtime behavior via the cross-built binary
  # downloaded onto the windows runner. ONE windows runner per
  # arch — goal of the consolidation pass.

  # Linux glibc/musl e2e jobs always run — they are the proof of life
  # and are cheap. The `fast-build` label only suppresses mac/win.
  e2e-linux-x64:
    name: build
    uses: ./.github/workflows/_bootstrap-e2e.yml
    with:
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      binary_name: soldr
      save_cache: ${{ github.event_name == 'push' }}
      source_ref: ${{ github.sha }}

  # soldr#1051 / #1038: all cross-builds go through the consolidated
  # _ci-cross-build-linux.yml workflow on ubuntu-24.04. Each pair
  # below is "cross-build on linux + target-run on native runner".
  # The windows-host cross-compile regression that lived here previously
  # was dropped per the #1051 acceptance — saves a scarce-runner job
  # and the same path is exercised locally via `ci/docker-*` harnesses.

  # ---------- Linux ARM64 (gnu) ----------
  e2e-linux-arm64-build:
    name: cross-build aarch64-unknown-linux-gnu (linux host)
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: aarch64-unknown-linux-gnu
      artifact_name: soldr-ci-e2e-linux-arm64
      source_ref: ${{ github.sha }}

  e2e-linux-arm64:
    name: target-run aarch64-unknown-linux-gnu
    needs: e2e-linux-arm64-build
    uses: ./.github/workflows/_ci-target-run.yml
    with:
      runs_on: ubuntu-24.04-arm
      target: aarch64-unknown-linux-gnu
      artifact_name: soldr-ci-e2e-linux-arm64

  # ---------- Linux x64 (musl) ----------
  e2e-linux-x64-musl-build:
    name: cross-build x86_64-unknown-linux-musl (linux host)
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: x86_64-unknown-linux-musl
      artifact_name: soldr-ci-e2e-linux-x64-musl
      source_ref: ${{ github.sha }}

  e2e-linux-x64-musl:
    name: target-run x86_64-unknown-linux-musl
    needs: e2e-linux-x64-musl-build
    uses: ./.github/workflows/_ci-target-run.yml
    with:
      runs_on: ubuntu-24.04
      target: x86_64-unknown-linux-musl
      artifact_name: soldr-ci-e2e-linux-x64-musl

  # ---------- Linux ARM64 (musl) ----------
  e2e-linux-arm64-musl-build:
    name: cross-build aarch64-unknown-linux-musl (linux host)
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: aarch64-unknown-linux-musl
      artifact_name: soldr-ci-e2e-linux-arm64-musl
      source_ref: ${{ github.sha }}

  e2e-linux-arm64-musl:
    name: target-run aarch64-unknown-linux-musl
    needs: e2e-linux-arm64-musl-build
    uses: ./.github/workflows/_ci-target-run.yml
    with:
      runs_on: ubuntu-24.04-arm
      target: aarch64-unknown-linux-musl
      artifact_name: soldr-ci-e2e-linux-arm64-musl

  # ---------- macOS x64 ----------
  e2e-macos-x64-build:
    name: cross-build x86_64-apple-darwin (linux host)
    if: >-
      (github.event_name != 'push' || github.ref_name == 'main' || github.ref_name == 'release')
      && !contains(github.event.pull_request.labels.*.name, 'fast-build')
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: x86_64-apple-darwin
      artifact_name: soldr-ci-e2e-macos-x64
      source_ref: ${{ github.sha }}

  e2e-macos-x64:
    name: target-run x86_64-apple-darwin
    needs: e2e-macos-x64-build
    if: >-
      (github.event_name != 'push' || github.ref_name == 'main' || github.ref_name == 'release')
      && !contains(github.event.pull_request.labels.*.name, 'fast-build')
    uses: ./.github/workflows/_ci-target-run.yml
    with:
      runs_on: macos-15-intel
      target: x86_64-apple-darwin
      artifact_name: soldr-ci-e2e-macos-x64

  # ---------- macOS ARM64 ----------
  e2e-macos-arm64-build:
    name: cross-build aarch64-apple-darwin (linux host)
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'fast-build') }}
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: aarch64-apple-darwin
      artifact_name: soldr-ci-e2e-macos-arm64
      source_ref: ${{ github.sha }}

  e2e-macos-arm64:
    name: target-run aarch64-apple-darwin
    needs: e2e-macos-arm64-build
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'fast-build') }}
    uses: ./.github/workflows/_ci-target-run.yml
    with:
      runs_on: macos-15
      target: aarch64-apple-darwin
      artifact_name: soldr-ci-e2e-macos-arm64

  # ---------- Windows x64 ----------
  e2e-windows-x64-build:
    name: cross-build x86_64-pc-windows-msvc (linux host)
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'fast-build') }}
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: x86_64-pc-windows-msvc
      artifact_name: soldr-ci-e2e-windows-x64
      source_ref: ${{ github.sha }}

  e2e-windows-x64:
    name: target-run x86_64-pc-windows-msvc
    needs: e2e-windows-x64-build
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'fast-build') }}
    uses: ./.github/workflows/_ci-target-run.yml
    with:
      runs_on: windows-2025
      target: x86_64-pc-windows-msvc
      artifact_name: soldr-ci-e2e-windows-x64

  # ---------- Windows ARM64 ----------
  e2e-windows-arm64-build:
    name: cross-build aarch64-pc-windows-msvc (linux host)
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'fast-build') }}
    uses: ./.github/workflows/_ci-cross-build-linux.yml
    with:
      target: aarch64-pc-windows-msvc
      artifact_name: soldr-ci-e2e-windows-arm64
      source_ref: ${{ github.sha }}

  e2e-windows-arm64:
    name: target-run aarch64-pc-windows-msvc
    needs: e2e-windows-arm64-build
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'fast-build') }}
    uses: ./.github/workflows/_ci-target-run.yml
    with:
      runs_on: windows-11-arm
      target: aarch64-pc-windows-msvc
      artifact_name: soldr-ci-e2e-windows-arm64
