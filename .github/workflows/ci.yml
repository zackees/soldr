name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '*'
    paths-ignore:
      - '*.md'

permissions:
  contents: read

env:
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: Lint
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify setup-soldr pin matches v0
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            python3 .github/scripts/verify_setup_soldr_pin.py
          else
            python .github/scripts/verify_setup_soldr_pin.py
          fi

      - uses: zackees/setup-soldr@d66c6fc50c7dc6fd483f64bacd05526b21bfdcd6 # @v0
        with:
          linker: platform-default
          # Formatting does not benefit from a restored target directory, but
          # clippy still uses soldr's compilation cache below.
          target-cache: false

      # setup-soldr@d7be70d installs a minimal toolchain without rustfmt or
      # clippy. Once https://github.com/zackees/setup-soldr/issues/93 lands,
      # the shim layer + default components will make this step unnecessary.
      - name: Install rustfmt and clippy components
        run: rustup component add rustfmt clippy

      - name: Check formatting
        run: soldr cargo fmt --all -- --check

      - name: Check npm package metadata
        run: node scripts/test-npm-package.js

      - name: Run clippy
        run: soldr cargo clippy --workspace --all-targets --locked -- -D warnings

  build-linux-x64:
    name: Linux x64
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    needs: lint
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify setup-soldr pin matches v0
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            python3 .github/scripts/verify_setup_soldr_pin.py
          else
            python .github/scripts/verify_setup_soldr_pin.py
          fi

      - uses: zackees/setup-soldr@d66c6fc50c7dc6fd483f64bacd05526b21bfdcd6 # @v0
        with:
          linker: platform-default

      - name: Build workspace
        run: soldr cargo build --workspace --locked

      - name: Run library tests
        run: soldr cargo test --workspace --lib --locked

      - name: Run CLI smoke tests
        run: soldr cargo test -p soldr-cli --tests --locked

      - name: Run fetch integration test
        run: soldr cargo test -p soldr-fetch --test fetch_crgx --locked

  build-macos-x64:
    name: macOS x64
    if: github.ref_name == 'main'
    runs-on: macos-15-intel
    needs: lint
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify setup-soldr pin matches v0
        shell: bash
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            python3 .github/scripts/verify_setup_soldr_pin.py
          else
            python .github/scripts/verify_setup_soldr_pin.py
          fi

      - uses: zackees/setup-soldr@d66c6fc50c7dc6fd483f64bacd05526b21bfdcd6 # @v0
        with:
          linker: platform-default

      - name: Build workspace
        run: soldr cargo build --workspace --locked

      - name: Run library tests
        run: soldr cargo test --workspace --lib --locked

      - name: Run CLI smoke tests
        run: soldr cargo test -p soldr-cli --tests --locked

      - name: Run fetch integration test
        run: soldr cargo test -p soldr-fetch --test fetch_crgx --locked

  build-windows-x64:
    name: Windows x64
    if: github.ref_name == 'main'
    runs-on: windows-2025
    needs: lint
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.94.1
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ci-windows-x64
          shared-key: windows-x86_64-msvc

      - name: Build workspace
        run: cargo build --workspace --locked --target x86_64-pc-windows-msvc

      - name: Run library tests
        run: cargo test --workspace --lib --locked --target x86_64-pc-windows-msvc

      - name: Run CLI smoke tests
        run: cargo test -p soldr-cli --tests --locked --target x86_64-pc-windows-msvc

      - name: Verify Windows defaults to MSVC under Git Bash
        if: runner.os == 'Windows'
        shell: bash
        run: bash .github/scripts/windows-msys-default-msvc.sh

      - name: Run fetch integration test
        run: cargo test -p soldr-fetch --test fetch_crgx --locked --target x86_64-pc-windows-msvc

  e2e-linux-x64:
    name: build
    uses: ./.github/workflows/_bootstrap-e2e.yml
    with:
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      binary_name: soldr
      save_cache: ${{ github.event_name == 'push' }}
      source_ref: ${{ github.sha }}

  e2e-linux-arm64:
    name: build
    uses: ./.github/workflows/_bootstrap-e2e.yml
    with:
      runner: ubuntu-24.04-arm
      target: aarch64-unknown-linux-gnu
      binary_name: soldr
      save_cache: ${{ github.event_name == 'push' }}
      source_ref: ${{ github.sha }}

  e2e-linux-x64-musl:
    name: build
    uses: ./.github/workflows/_bootstrap-e2e.yml
    with:
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-musl
      binary_name: soldr
      save_cache: ${{ github.event_name == 'push' }}
      source_ref: ${{ github.sha }}

  e2e-linux-arm64-musl:
    name: build
    uses: ./.github/workflows/_bootstrap-e2e.yml
    with:
      runner: ubuntu-24.04-arm
      target: aarch64-unknown-linux-musl
      binary_name: soldr
      save_cache: ${{ github.event_name == 'push' }}
      source_ref: ${{ github.sha }}

  e2e-macos-x64:
    name: build
    if: github.event_name != 'push' || github.ref_name == 'main' || github.ref_name == 'release'
    uses: ./.github/workflows/_bootstrap-e2e.yml
    with:
      runner: macos-15-intel
      target: x86_64-apple-darwin
      binary_name: soldr
      save_cache: ${{ github.event_name == 'push' }}
      source_ref: ${{ github.sha }}

  e2e-macos-arm64:
    name: build
    uses: ./.github/workflows/_bootstrap-e2e.yml
    with:
      runner: macos-15
      target: aarch64-apple-darwin
      binary_name: soldr
      save_cache: ${{ github.event_name == 'push' }}
      source_ref: ${{ github.sha }}

  e2e-windows-x64:
    name: build
    uses: ./.github/workflows/_bootstrap-e2e-windows.yml
    with:
      runner: windows-2025
      target: x86_64-pc-windows-msvc
      binary_name: soldr.exe
      save_cache: ${{ github.event_name == 'push' }}
      source_ref: ${{ github.sha }}

  e2e-windows-arm64:
    name: build
    uses: ./.github/workflows/_bootstrap-e2e-windows.yml
    with:
      runner: windows-11-arm
      target: aarch64-pc-windows-msvc
      binary_name: soldr.exe
      save_cache: ${{ github.event_name == 'push' }}
      source_ref: ${{ github.sha }}
