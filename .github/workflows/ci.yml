name: CI

on:
  push:
    # Skip perf-iteration branches — they only need perf-cluster.yml,
    # not the full Lint/build/e2e sweep. (`branches` and
    # `branches-ignore` are mutually exclusive, so this replaces the
    # previous `branches: ['**']` catch-all.)
    branches-ignore:
      - 'perf/**'
      - 'evaluate/**'
    tags-ignore:
      - '*'
    paths-ignore:
      - '*.md'

permissions:
  contents: read

env:
  RUST_BACKTRACE: "1"

jobs:
  lint:
    name: Lint
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: lint-ubuntu

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check npm package metadata
        run: node scripts/test-npm-package.js

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Per-platform `build workspace + run unit/smoke tests` jobs.
  # Each is a thin caller of the `_build-and-test.yml` template so
  # the duplicated cargo invocations live in one place and every
  # platform still shows as its own top-level entry in the GHA
  # sidebar. Add a new platform: copy one of these blocks and tweak
  # the inputs.

  build-linux-x64:
    name: Linux x64
    needs: lint
    if: github.ref_name == 'main'
    uses: ./.github/workflows/_build-and-test.yml
    with:
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      shared_key: build-linux-x64

  build-macos-x64:
    name: macOS x64
    needs: lint
    if: github.ref_name == 'main'
    uses: ./.github/workflows/_build-and-test.yml
    with:
      runner: macos-15-intel
      target: x86_64-apple-darwin
      shared_key: build-macos-x64

  build-windows-x64:
    name: Windows x64
    needs: lint
    if: github.ref_name == 'main'
    uses: ./.github/workflows/_build-and-test.yml
    with:
      runner: windows-2025
      target: x86_64-pc-windows-msvc
      shared_key: windows-x86_64-msvc
      cache_key: ci-windows-x64
      install_components: rustfmt, clippy
      verify_windows_msys_default_msvc: true

  build-windows-arm64:
    # Preserves the cargo-test coverage that the standalone
    # build-windows-arm64.yml provided before it was deleted in
    # favour of this template + materializer pattern. The
    # equivalent e2e-windows-arm64 job below only builds; this one
    # runs the unit + cli + fetch test sweep.
    name: Windows ARM64
    needs: lint
    if: github.ref_name == 'main'
    uses: ./.github/workflows/_build-and-test.yml
    with:
      runner: windows-11-arm
      target: aarch64-pc-windows-msvc
      shared_key: windows-aarch64-msvc
      cache_key: ci-windows-arm64
      install_components: rustfmt, clippy

  e2e-linux-x64:
    name: build
    uses: ./.github/workflows/_bootstrap-e2e.yml
    with:
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      binary_name: soldr
      save_cache: ${{ github.event_name == 'push' }}
      source_ref: ${{ github.sha }}

  e2e-linux-arm64:
    name: build
    uses: ./.github/workflows/_bootstrap-e2e.yml
    with:
      runner: ubuntu-24.04-arm
      target: aarch64-unknown-linux-gnu
      binary_name: soldr
      save_cache: ${{ github.event_name == 'push' }}
      source_ref: ${{ github.sha }}

  e2e-linux-x64-musl:
    name: build
    uses: ./.github/workflows/_bootstrap-e2e.yml
    with:
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-musl
      binary_name: soldr
      save_cache: ${{ github.event_name == 'push' }}
      source_ref: ${{ github.sha }}

  e2e-linux-arm64-musl:
    name: build
    uses: ./.github/workflows/_bootstrap-e2e.yml
    with:
      runner: ubuntu-24.04-arm
      target: aarch64-unknown-linux-musl
      binary_name: soldr
      save_cache: ${{ github.event_name == 'push' }}
      source_ref: ${{ github.sha }}

  e2e-macos-x64:
    name: build
    if: github.event_name != 'push' || github.ref_name == 'main' || github.ref_name == 'release'
    uses: ./.github/workflows/_bootstrap-e2e.yml
    with:
      runner: macos-15-intel
      target: x86_64-apple-darwin
      binary_name: soldr
      save_cache: ${{ github.event_name == 'push' }}
      source_ref: ${{ github.sha }}

  e2e-macos-arm64:
    name: build
    uses: ./.github/workflows/_bootstrap-e2e.yml
    with:
      runner: macos-15
      target: aarch64-apple-darwin
      binary_name: soldr
      save_cache: ${{ github.event_name == 'push' }}
      source_ref: ${{ github.sha }}

  e2e-windows-x64:
    name: build
    uses: ./.github/workflows/_bootstrap-e2e.yml
    with:
      runner: windows-2025
      target: x86_64-pc-windows-msvc
      binary_name: soldr.exe
      save_cache: ${{ github.event_name == 'push' }}
      source_ref: ${{ github.sha }}

  e2e-windows-arm64:
    name: build
    uses: ./.github/workflows/_bootstrap-e2e.yml
    with:
      runner: windows-11-arm
      target: aarch64-pc-windows-msvc
      binary_name: soldr.exe
      save_cache: ${{ github.event_name == 'push' }}
      source_ref: ${{ github.sha }}
