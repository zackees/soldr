# soldr#1042 / #1038 phase 4: target run-only job.
#
# Companion to `_ci-cross-build-linux.yml` (phase 3). Downloads the
# artifact produced by the linux cross-builder + runs the pre-built
# test binaries on the native runner. No `cargo` / `rustc` / `rustup`
# install. The downloaded soldr binary resolves cargo-nextest and runs
# the downloaded test archive.
#
# Sets SOLDR_BIN / SOLDR_TEST_FIXTURES_DIR / SOLDR_TEST_SKIP_SOURCE_TREE
# so tests resolve binaries + fixtures from the artifact and skip the
# source-tree-coupled tests (phases 1 + 2 of the refactor).

name: CI target run (download + nextest run)

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
        description: Target triple — used to pick the runner OS + the artifact name.
      runs_on:
        type: string
        required: true
        description: GHA runs-on label (e.g. macos-15, windows-11-arm, macos-15-intel).
      artifact_name:
        type: string
        required: true
        description: Name of the artifact produced by _ci-cross-build-linux.yml.
      skip_filter:
        type: string
        default: "!test(/cook_/) and !test(/_real_toolchain/) and !test(/fetch_crgx/) and !binary(/cli_cargo_/) and !binary(/cli_daemon_/) and !binary(/cli_rust_plan/)"
        description: |
          nextest filter expression. Default skips:
          - test names matching cook_/_real_toolchain/fetch_crgx (#1038
            Q2) — those need cargo/rustup on the runner
          - integration test BINARIES (i.e. the .rs files under tests/)
            named cli_cargo_*, cli_daemon_*, cli_rust_plan — those need
            cargo on PATH, but the cross-build artifact ships only the
            primary `soldr` test binary. Their behavior is already covered
            by unit tests on the cross-build linux-host side.
            (nextest distinguishes `test(...)` for test names from
            `binary(...)` for test-binary names — these tests' binaries
            are named after the integration-test file, so use binary().)
            Override if a target's runner has the toolchain
            (e.g. linux-native).

permissions:
  contents: read

jobs:
  target-run:
    name: target-run ${{ inputs.target }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 30
    steps:
      # nextest's `run --archive-file` needs the workspace Cargo.toml
      # present (per the `--workspace-remap` docs) even when all binaries
      # come from the archive. Shallow checkout is enough; we don't run
      # cargo build here.
      # soldr#1350 — dropped `submodules: recursive`. _vender/zccache is
      # `exclude = ["_vender/zccache"]` in the workspace root Cargo.toml,
      # so `cargo metadata` doesn't walk into the submodule. Nextest
      # runs pre-built test binaries from the archive; no cargo build
      # here. Saves ~4-5 s per target-run.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Download cross-build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact_name }}
          path: artifact

      - name: List artifact contents
        shell: bash
        run: |
          set -euo pipefail
          ls -la artifact/ || true
          find artifact/ -maxdepth 3 -type f | head -30 || true

      # actions/download-artifact unpacks from a zip, which strips the
      # executable bit on POSIX runners. Tests that exec SOLDR_BIN
      # otherwise fail with "Permission denied" before any logic runs.
      # No-op on windows runners.
      - name: Restore executable bit on artifact binaries
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          for bin in artifact/package/soldr; do
            if [ -f "$bin" ]; then
              chmod +x "$bin"
              echo "chmod +x $bin"
            fi
          done
          for bin in artifact/package/tools/cargo-nextest; do
            if [ -f "$bin" ]; then
              chmod +x "$bin"
              echo "chmod +x $bin"
            fi
          done

      - name: Run pre-built tests via nextest archive
        shell: bash
        env:
          # soldr#1039 phase 1 + #1040 phase 2 env handoff.
          # The cross-build artifact layout (from _ci-cross-build-linux.yml
          # Stage D) puts the soldr binary at `package/soldr[.exe]` and
          # fixtures at `package/fixtures/`. The test archive sits next to
          # `package/` at `<artifact-name>-tests.tar.zst`.
          # Derive the Windows suffix from the target instead of probing a
          # native C:\ path with Git Bash's `-f` operator.
          SOLDR_BIN: ${{ github.workspace }}/artifact/package/soldr${{ contains(inputs.target, 'pc-windows-msvc') && '.exe' || '' }}
          SOLDR_TEST_FIXTURES_DIR: ${{ github.workspace }}/artifact/package/fixtures
          SOLDR_TEST_SKIP_SOURCE_TREE: "1"
        run: |
          set -euo pipefail
          test -f "$SOLDR_BIN"
          echo "SOLDR_BIN=$SOLDR_BIN"
          echo "SOLDR_TEST_FIXTURES_DIR=$SOLDR_TEST_FIXTURES_DIR"

          NEXTEST_BIN="$GITHUB_WORKSPACE/artifact/package/tools/cargo-nextest"
          if [ ! -f "$NEXTEST_BIN" ] && [ -f "${NEXTEST_BIN}.exe" ]; then
            NEXTEST_BIN="${NEXTEST_BIN}.exe"
          fi
          test -f "$NEXTEST_BIN"
          metadata="${NEXTEST_BIN%/*}/cargo-nextest.json"
          test -f "$metadata"
          expected_version=$(jq -r '.version' "$metadata" | sed 's/^v//')
          actual_version=$("$NEXTEST_BIN" nextest --version \
            | sed -n 's/.* \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' \
            | head -n1)
          test -n "$actual_version"
          test "$actual_version" = "$expected_version" || {
            echo "cargo-nextest version mismatch: expected=$expected_version actual=$actual_version" >&2
            exit 1
          }
          echo "cargo-nextest version=$actual_version metadata=$metadata network=not-used"

          # The archive's filename mirrors the artifact name + a -tests suffix.
          # Every target-run lane requires the real archive; a missing file is
          # a failed cross-build contract, not a binary-only smoke fallback.
          archive="artifact/${{ inputs.artifact_name }}-tests.tar.zst"
          test -f "$archive"
          "$NEXTEST_BIN" nextest run \
            --archive-file "$archive" \
            --workspace-remap "$GITHUB_WORKSPACE" \
            --no-fail-fast \
            -E "${{ inputs.skip_filter }}"

      - name: Upload junit / on-failure logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5
        with:
          name: target-run-${{ inputs.target }}-failure
          path: |
            target/nextest/default/*.xml
          if-no-files-found: ignore
          retention-days: 7
