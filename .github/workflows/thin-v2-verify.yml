# Verifier workflow for the thin-v2 target-cache slice (issue #237, Phase 3).
#
# What this gate proves:
#   With SOLDR_TARGET_CACHE_PROFILE=thin-v2, build a workspace, delete its
#   target directory, and restore the slice with the warm-sentinel bypass
#   disabled. Thin-v2 may retain Cargo JSON-verified primary outputs; if the
#   captured closure is incomplete, Cargo must rebuild rather than falsely
#   report the workspace unit Fresh.
#
# Why this is informational for now:
#   This is the first end-to-end gate. Treat it as an early-warning signal
#   while we shake out fixture and runner-environment quirks. Once it has
#   been green for a week on `main`, drop `continue-on-error: true` so it
#   becomes a hard required check on PRs that touch the relevant code.
#
# Scope:
#   - One Linux x86_64 host. This is a correctness gate, not a perf bench.
#   - Uses a tiny synthesized one-crate workspace so the cold/warm timing is
#     small. The verifier behavior is workspace-agnostic; once stable we can
#     point it at the real soldr workspace too.
#
# Follow-up once this gate is stable: flip continue-on-error to false, expand
# the matrix to Windows and macOS, and consider running on the soldr workspace
# itself.
#
# The verifier now runs the synthetic fixture through `soldr cargo build` with
# SOLDR_TARGET_CACHE_BUNDLE_DIR pinned to a deterministic temp path, so the
# thin-v2 manifest assertion is an active gate instead of a guarded no-op.
name: thin-v2-verify

on:
  push:
    branches: [main]
    paths:
      - "crates/soldr-cli/src/main.rs"
      - "crates/soldr-cache/**"
      - "crates/soldr-cli/src/rust_plan.rs"
      - "_vender/zccache"
      - ".github/scripts/assert_thin_noop.py"
      - ".github/scripts/assert_thin_manifest.py"
      - ".github/workflows/thin-v2-verify.yml"
      - "tests/test_assert_thin_noop.py"
      - "tests/test_assert_thin_manifest.py"
      - "tests/test_thin_v2_verify_workflow.py"
  pull_request:
    paths:
      - "crates/soldr-cli/src/main.rs"
      - "crates/soldr-cache/**"
      - "crates/soldr-cli/src/rust_plan.rs"
      - "_vender/zccache"
      - ".github/scripts/assert_thin_noop.py"
      - ".github/scripts/assert_thin_manifest.py"
      - ".github/workflows/thin-v2-verify.yml"
      - "tests/test_assert_thin_noop.py"
      - "tests/test_assert_thin_manifest.py"
      - "tests/test_thin_v2_verify_workflow.py"

permissions:
  contents: read

# soldr#1985 - stop superseded runs from holding runner slots.
concurrency:
  group: thin-v2-verify-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: thin-v2 fresh-target restore (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    # soldr#1985 - was inheriting GitHub's 360-minute default.
    timeout-minutes: 30
    continue-on-error: true # informational while we iterate; see header.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

    env:
      SOLDR_TARGET_CACHE_PROFILE: thin-v2
      CARGO_TERM_COLOR: never
      # The verification fixture is created under $RUNNER_TEMP, outside
      # soldr's rust-toolchain.toml. setup-soldr installs 1.94.1 into its
      # managed RUSTUP_HOME, but rustup still needs an explicit selected
      # toolchain when cargo runs from that synthetic crate.
      RUSTUP_TOOLCHAIN: 1.94.1
      # soldr#1322 — soldr's zccache/crgx fetch reads SOLDR_GITHUB_TOKEN
      # for authenticated GitHub Releases lookups (5,000/hr) instead of
      # unauthenticated (60/hr per runner IP). Follow-up to #1319 / #1323.
      SOLDR_GITHUB_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Setup soldr build cache
        uses: zackees/setup-soldr@40320d277ba4946e38d4b3c02e6c7a15a29c3f3f
        with:
          # soldr#1799: pin the soldr that builds us -- the action's default
          # (0.8.23) predates #1820 and GCs live target/ artifacts after every
          # build, so the next build recompiles the world. See
          # tests/test_setup_soldr_version_pins.py.
          version: 0.8.29
          toolchain: 1.94.1
          cache: false
          zccache-seed-strict: true

      - name: Build soldr CLI
        run: soldr cargo build -p soldr-cli --locked

      - name: Use soldr under test
        run: echo "${{ github.workspace }}/target/debug" >> "$GITHUB_PATH"

      - name: Synthesize verification fixture
        working-directory: ${{ runner.temp }}
        run: |
          soldr cargo init --name verify-noop --bin verify-noop
          cd verify-noop
          # Pin a deterministic small dep so the cold build does meaningful
          # work the verifier can recognize as a baseline.
          soldr cargo add serde --no-default-features --features derive
          printf '%s\n' 'fn main() { println!("cargo:rerun-if-changed=build-input.txt"); }' > build.rs
          printf '%s\n' 'thin-v2 build-script input' > build-input.txt

      - name: Reset thin-v2 bundle dir
        run: |
          rm -rf "${{ runner.temp }}/thin-v2-bundle"
          mkdir -p "${{ runner.temp }}/thin-v2-bundle"

      - name: First (cold) build
        working-directory: ${{ runner.temp }}/verify-noop
        env:
          SOLDR_TRUST_INHERITED_ENV: "1"
          # soldr#1951: assert_thin_noop.py anchors on `^\s*Compiling`, and
          # soldr#1915 prefixes every relayed line with elapsed seconds
          # (default-on for non-TTY, which is every CI step). A digit is not
          # `\s`, so the stamp makes the verifier read a normal cold build as
          # having compiled nothing. Stamping is display; this consumer needs
          # cargo's exact bytes.
          SOLDR_TIMESTAMP_LINES: "0"
          SOLDR_TARGET_CACHE_MODE: thin
          SOLDR_TARGET_CACHE_PROFILE: thin-v2
          SOLDR_TARGET_CACHE_BACKEND: local
          SOLDR_TARGET_CACHE_BUNDLE_DIR: ${{ runner.temp }}/thin-v2-bundle
        run: |
          set -o pipefail
          soldr cargo build --locked -v 2>&1 | tee first.log

      - name: Delete target before restore
        run: rm -rf "${{ runner.temp }}/verify-noop/target"

      - name: Second (fresh-target restore) - missing primary outputs must rebuild
        working-directory: ${{ runner.temp }}/verify-noop
        env:
          SOLDR_TRUST_INHERITED_ENV: "1"
          # soldr#1951: assert_thin_noop.py anchors on `^\s*Compiling`, and
          # soldr#1915 prefixes every relayed line with elapsed seconds
          # (default-on for non-TTY, which is every CI step). A digit is not
          # `\s`, so the stamp makes the verifier read a normal cold build as
          # having compiled nothing. Stamping is display; this consumer needs
          # cargo's exact bytes.
          SOLDR_TIMESTAMP_LINES: "0"
          # Force the restore path even though the cold build wrote a matching
          # in-job warm sentinel. This is the behavior the verifier exists to test.
          SOLDR_RUST_PLAN_SKIP_WARM_RESTORE: "0"
          SOLDR_TARGET_CACHE_MODE: thin
          SOLDR_TARGET_CACHE_PROFILE: thin-v2
          SOLDR_TARGET_CACHE_BACKEND: local
          SOLDR_TARGET_CACHE_BUNDLE_DIR: ${{ runner.temp }}/thin-v2-bundle
        run: |
          set -o pipefail
          soldr cargo build --locked -v 2>&1 | tee second.log

      - name: Assert incomplete restore remained Cargo-dirty
        run: |
          python ${{ github.workspace }}/.github/scripts/assert_thin_noop.py \
            ${{ runner.temp }}/verify-noop/first.log \
            ${{ runner.temp }}/verify-noop/second.log \
            --expect-incomplete-restore

      # Validate the thin-v2 manifest the soldr-cli writes alongside the
      # deterministic bundle directory. This is intentionally unconditional:
      # if soldr stops producing manifest.v2.json, the verifier fails.
      - name: Assert thin-v2 manifest matches bundle
        run: |
          python ${{ github.workspace }}/.github/scripts/assert_thin_manifest.py \
            "${{ runner.temp }}/thin-v2-bundle/manifest.v2.json" \
            "${{ runner.temp }}/thin-v2-bundle"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: thin-v2-verify-logs-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/verify-noop/first.log
            ${{ runner.temp }}/verify-noop/second.log
          if-no-files-found: warn
          retention-days: 7
