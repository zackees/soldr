name: Nextest Cacheability

on:
  workflow_dispatch:
  # Not a per-PR job (soldr#1907 follow-up). This acceptance runs inside the
  # `ci/perf_local.py` Docker runner, whose value is a *reusable* local
  # container with warm volumes. A GitHub Actions runner is already an
  # ephemeral isolated VM with nothing to reuse, so the container adds an image
  # build and no isolation. Median run: 47 minutes, and it triggered on
  # `crates/**`.
  #
  # push-to-main below still runs it unconditionally, so main stays verified;
  # the weekly schedule and manual dispatch cover the rest.
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/nextest-cacheability.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "ci/assert_nextest_archive_cacheability.py"
      - "crates/**"
      - "docker/cook-shared-cache/Dockerfile"
      - "rust-toolchain.toml"
      - "tests/conftest.py"
      - "tests/test_nextest_archive_cacheability.py"
      - "_vender/zccache"
      - "_vender/zccache/**"

permissions:
  contents: read

# soldr#1985 - stop superseded runs from holding runner slots.
concurrency:
  group: nextest-cacheability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nextest-cacheability:
    name: full nextest archive warm cacheability
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Assert zero warm misses
        run: python3 ci/assert_nextest_archive_cacheability.py
