# Warm-dependency cacheability across a full nextest archive build.
#
# soldr#2937 (phase 5 of soldr#2931) replaced the invariant this lane used to
# assert. soldr#1391 required the full LINKED test archive to be warm-cacheable
# at positive hits and zero misses; soldr#2931 inverted that -- a linked test
# product is never cacheable, because its identity key moves with every source
# edit while its size is among the largest the build produces.
#
# What is asserted now is the half that was always valuable: on a warm rebuild,
# dependency compilation units must hit the compiler cache. Test-harness LINK
# products are reported and are explicitly NOT required to be hits.
name: Nextest Cacheability

on:
  workflow_dispatch:
  # Deliberately NOT triggered by pushes or PRs (soldr#1985).
  #
  # The acceptance runs inside the `ci/perf_local.py` Docker runner, whose
  # value is a *reusable* local container with warm volumes. A GitHub Actions
  # runner is an ephemeral VM with nothing to reuse, so the container costs a
  # full `docker build` every run and collects none of the benefit. The job is
  # ~39-47 minutes, of which >99% is one opaque step.
  #
  # soldr#1907's follow-up removed the PR trigger and kept push-to-main, on the
  # grounds that main would stay verified. That stopped being true when
  # soldr#1985's concurrency group landed: consecutive merges now cancel each
  # other, so only the last merge of a burst is ever checked. On 2026-07-28,
  # 7 of 12 push-triggered runs were cancelled -- each having occupied a runner
  # first, while a release sat queued for over an hour (soldr#1978).
  #
  # This is a cacheability acceptance, not a correctness gate: a regression
  # here is a performance regression, and weekly plus on-demand detection is
  # proportionate. Per-merge signal would first require making the job cheap --
  # dropping the container on Actions, where the VM already supplies the
  # isolation it stands in for, and splitting the single step into observable
  # phases (soldr#1978 item 4).
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# soldr#1977 - stop superseded runs from holding runner slots.
concurrency:
  group: nextest-cacheability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nextest-cacheability:
    name: warm dependency cacheability across a nextest archive build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      # soldr#2763: uv must exist before the first step that uses it.
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5

      # Pinned interpreter rather than whatever `python3` the runner image
      # ships. The harness itself is stdlib-only, so the pin is about the
      # runner's Python being reproducible, not about dependencies.
      #
      # This pins the interpreter that drives the harness. The harness then
      # runs its build INSIDE a container, and the `python3` in that container
      # is the image's own -- pinned by the Dockerfile, not by this step.
      - name: Assert dependency compilation stays warm
        run: uv run --no-project --python 3.13 python ci/assert_nextest_archive_cacheability.py
