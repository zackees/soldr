name: Autonomous Release

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - package.json
  workflow_dispatch:
    inputs:
      force_pypi_publish:
        description: Force the PyPI wheel build/publish path for the current Cargo version, even if PyPI already lists files for it.
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  attestations: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # soldr#1322 — soldr's zccache/crgx fetch reads SOLDR_GITHUB_TOKEN
  # for authenticated GitHub Releases lookups (5,000/hr) instead of
  # unauthenticated (60/hr per runner IP). Follow-up to #1319 / #1323 /
  # #1326.
  SOLDR_GITHUB_TOKEN: ${{ github.token }}

concurrency:
  group: release-auto-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Detect release version bump
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.validate.outputs.should_release }}
      should_publish_github_release: ${{ steps.validate.outputs.should_publish_github_release }}
      should_publish_pypi: ${{ steps.validate.outputs.should_publish_pypi }}
      should_publish_npm: ${{ steps.validate.outputs.should_publish_npm }}
      tag_exists: ${{ steps.validate.outputs.tag_exists }}
      github_release_complete: ${{ steps.validate.outputs.github_release_complete }}
      pypi_has_version: ${{ steps.validate.outputs.pypi_has_version }}
      pypi_file_count: ${{ steps.validate.outputs.pypi_file_count }}
      npm_has_version: ${{ steps.validate.outputs.npm_has_version }}
      version: ${{ steps.validate.outputs.version }}
      commit_sha: ${{ steps.validate.outputs.commit_sha }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Compare candidate version against PyPI
        id: validate
        env:
          FORCE_PYPI_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_pypi_publish || false }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          commit_sha='${{ github.sha }}'
          force_pypi_publish="${FORCE_PYPI_PUBLISH,,}"

          cargo_version="$(
            sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\([^"]*\)"/\1/p}' Cargo.toml | head -n1
          )"

          if [[ -z "$cargo_version" ]]; then
            echo "failed to derive workspace version from Cargo.toml" >&2
            exit 1
          fi

          version="v${cargo_version}"

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "derived version must look like vX.Y.Z" >&2
            exit 1
          fi

          npm_package_name="$(jq -r '.name // ""' package.json)"
          npm_package_version="$(jq -r '.version // ""' package.json)"
          if [[ -z "$npm_package_name" || -z "$npm_package_version" ]]; then
            echo "failed to derive npm package metadata from package.json" >&2
            exit 1
          fi
          if [[ "$npm_package_version" != "$cargo_version" ]]; then
            echo "package.json version ($npm_package_version) must match Cargo.toml ($cargo_version)" >&2
            exit 1
          fi

          tag_exists=false
          if git ls-remote --exit-code --tags origin "$version" >/dev/null 2>&1; then
            tag_exists=true
          fi

          github_release_complete=false
          github_release_missing_assets="release-not-found"
          expected_assets=(
            "soldr-${version}-x86_64-unknown-linux-gnu.tar.zst"
            "soldr-${version}-aarch64-unknown-linux-gnu.tar.zst"
            "soldr-${version}-x86_64-unknown-linux-musl.tar.zst"
            "soldr-${version}-aarch64-unknown-linux-musl.tar.zst"
            "soldr-${version}-aarch64-apple-darwin.tar.zst"
            "soldr-${version}-x86_64-pc-windows-msvc.tar.zst"
            "soldr-${version}-aarch64-pc-windows-msvc.tar.zst"
            "soldr-${cargo_version}-py3-none-macosx_11_0_arm64.whl"
            "soldr-${cargo_version}-py3-none-manylinux_2_17_aarch64.manylinux2014_aarch64.whl"
            "soldr-${cargo_version}-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
            "soldr-${cargo_version}-py3-none-win_amd64.whl"
            "soldr-${cargo_version}-py3-none-win_arm64.whl"
            "soldr-${version}-SHA256SUMS.txt"
          )
          release_json="$(gh release view "$version" --repo "$GITHUB_REPOSITORY" --json assets,isDraft 2>/dev/null || true)"
          if [[ -n "$release_json" ]]; then
            is_draft="$(jq -r '.isDraft' <<< "$release_json")"
            mapfile -t actual_assets < <(jq -r '.assets[].name' <<< "$release_json" | sort)
            missing=()
            for asset in "${expected_assets[@]}"; do
              if ! printf '%s\n' "${actual_assets[@]}" | grep -Fx "$asset" >/dev/null; then
                missing+=("$asset")
              fi
            done
            if [[ "$is_draft" == "false" && ${#missing[@]} -eq 0 ]]; then
              github_release_complete=true
              github_release_missing_assets=""
            else
              github_release_missing_assets="$(IFS=,; echo "${missing[*]}")"
              if [[ "$is_draft" != "false" ]]; then
                github_release_missing_assets="draft-release${github_release_missing_assets:+,$github_release_missing_assets}"
              fi
            fi
          fi

          pypi_json="$(curl -fsSL --max-time 30 --connect-timeout 10 https://pypi.org/pypi/soldr/json)"
          pypi_version="$(jq -r '.info.version // ""' <<< "$pypi_json")"

          if [[ -z "$pypi_version" || "$pypi_version" == "null" ]]; then
            echo "failed to fetch latest PyPI version for soldr" >&2
            exit 1
          fi

          pypi_file_count="$(
            jq --arg candidate "$cargo_version" -r '(.releases[$candidate] // []) | length' <<< "$pypi_json"
          )"
          pypi_has_version=false
          if (( pypi_file_count > 0 )); then
            pypi_has_version=true
          fi

          npm_package_uri="$(jq -rn --arg value "$npm_package_name" '$value | @uri')"
          npm_json="$(curl -fsSL --max-time 30 --connect-timeout 10 "https://registry.npmjs.org/${npm_package_uri}")"
          npm_has_version=false
          if jq -e --arg candidate "$cargo_version" '.versions[$candidate] != null' <<< "$npm_json" >/dev/null; then
            npm_has_version=true
          fi

          should_publish_github_release=false
          if [[ "$github_release_complete" != "true" ]]; then
            should_publish_github_release=true
          fi

          should_publish_pypi=false
          if [[ "$pypi_has_version" != "true" || "$force_pypi_publish" == "true" ]]; then
            should_publish_pypi=true
          fi

          should_publish_npm=false
          if [[ "$npm_has_version" != "true" ]]; then
            should_publish_npm=true
          fi

          should_release=false
          if [[ "$should_publish_github_release" == "true" || "$should_publish_pypi" == "true" || "$should_publish_npm" == "true" ]]; then
            should_release=true
          fi

          {
            echo "### Release detection"
            echo ""
            echo "- candidate version: \`$version\`"
            echo "- current PyPI latest: \`v${pypi_version}\`"
            echo "- PyPI files for candidate: \`$pypi_file_count\`"
            echo "- npm package: \`$npm_package_name@$npm_package_version\`"
            echo "- npm has candidate: \`$npm_has_version\`"
            echo "- GitHub tag exists: \`$tag_exists\`"
            echo "- GitHub release complete: \`$github_release_complete\`"
            echo "- GitHub release missing assets: \`${github_release_missing_assets:-none}\`"
            echo "- force PyPI publish: \`$force_pypi_publish\`"
            echo "- publish GitHub release assets: \`$should_publish_github_release\`"
            echo "- publish PyPI wheels: \`$should_publish_pypi\`"
            echo "- publish npm package: \`$should_publish_npm\`"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "should_release=$should_release"
            echo "should_publish_github_release=$should_publish_github_release"
            echo "should_publish_pypi=$should_publish_pypi"
            echo "should_publish_npm=$should_publish_npm"
            echo "tag_exists=$tag_exists"
            echo "github_release_complete=$github_release_complete"
            echo "pypi_has_version=$pypi_has_version"
            echo "pypi_file_count=$pypi_file_count"
            echo "npm_has_version=$npm_has_version"
            echo "version=$version"
            echo "commit_sha=$commit_sha"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    # Every release lane is required. Registry publishes are gated on a
    # verified GitHub Release asset set, so a missing target must stop the
    # release instead of silently shipping PyPI/npm only.
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        include:
          # All targets now produce a single `.tar.zst` archive that
          # bundles the soldr binary alongside same-target soldr-owned
          # sidecars, crgx, and cargo-chef. One fetch from
          # GitHub Releases installs the full runtime surface; registry
          # publishes are gated on that GitHub asset set being complete.
          - name: Linux x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: soldr
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: soldr
          - name: Linux x64 (musl)
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            binary: soldr
          - name: Linux ARM64 (musl)
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binary: soldr
          # x86_64-apple-darwin is intentionally omitted. Native Intel
          # macOS hosted capacity has been unreliable for release runs,
          # and the current release surface keeps macOS ARM64 as the
          # shipped macOS archive target.
          #
          # Pragmatic decision: **drop x86_64-apple-darwin from the release
          # matrix** for the 0.7.9x line. Intel Macs are a shrinking user
          # segment (Apple stopped shipping them in 2023), and pip users on
          # Intel Mac can still install via sdist. If/when GHA either
          # improves macos-13 capacity or provides a hosted Rosetta path
          # under macos-15, we re-add.
          #
          # x86_64-apple-darwin: **intentionally omitted** — see comment above.
          - name: macOS ARM64
            runner: macos-15
            target: aarch64-apple-darwin
            binary: soldr
          - name: Windows x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: soldr.exe
          - name: Windows ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: soldr.exe

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive
          ref: ${{ needs.prepare.outputs.commit_sha }}

      # soldr#1061 phase A: replaced dtolnay/rust-toolchain +
      # Swatinem/rust-cache with setup-soldr's integrated
      # `prebuild-deps: soldr-cook` flow so the release build benefits
      # from the same `target/<triple>/release/build/*/out/` cc-rs-
      # artifact restore that every-commit CI now uses. Saves the
      # 45-70s/lane that release builds were spending on bit-identical
      # libsqlite3-sys / tikv-jemalloc-sys / zstd-sys / ring rebuilds.
      # soldr#1083 follow-up: cache + soldr-cook hydration disabled.
      # Cook rewrites Cargo.toml in ways that don't compose with
      # cross-compile (stripped [workspace.package], wrong-versioned
      # wheels). Save cost no longer offsets the savings. Drop both;
      # rely on cargo's native incremental + zccache for build
      # acceleration.
      # soldr#1340 — pre-cache the 1.94.1 toolchain in ~/.rustup so
      # setup-soldr uses it without spending the release lane on a fresh
      # rustup install. Same pattern as #1341/#1342/#1343/#1345.
      - name: Cache rustup 1.94.1 in ~/.rustup
        id: rustup_cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.rustup/toolchains/1.94.1-x86_64-unknown-linux-gnu
          key: rustup-1.94.1-linux-x64-v1

      - name: Install rustup 1.94.1 to ~/.rustup (if not cached)
        if: steps.rustup_cache.outputs.cache-hit != 'true'
        run: rustup toolchain install 1.94.1 --profile minimal --no-self-update

      - name: Setup Rust toolchain
        uses: zackees/setup-soldr@cca74625e75e70b56f1805fa6eeee9069f945d48
        with:
          # Release CI runs the checked-out soldr CLI via `cargo run`
          # below, because the previous released soldr can lack the
          # exact cross-build and sidecar behavior needed to build the
          # next release. Keep setup-soldr in passthrough mode here so it
          # only provisions Rust and cannot enter stale standalone
          # zccache setup paths.
          enable: false
          toolchain: 1.94.1
          cache: false
          build-cache: false
          target-cache: false
          cargo-registry-cache: false
          prebuild-deps: none
          zccache-seed-strict: false

      - name: Add cross-compile target
        shell: bash
        run: rustup target add ${{ matrix.target }}

      # Mirrors `_bootstrap-e2e.yml`'s musl-tools install: retried apt
      # update + install, --no-install-recommends to narrow the input
      # surface (#41), and an installed-version log line so the workflow
      # run is auditable.
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        shell: bash
        run: |
          set -euo pipefail
          attempts=0
          max_attempts=3
          until sudo apt-get update; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge "$max_attempts" ]; then
              echo "apt-get update failed after $max_attempts attempts" >&2
              exit 1
            fi
            sleep $((attempts * 3))
          done
          # cmake + perl added soldr#1022: zstd-sys (cmake) and
          # openssl-sys (perl) transitively-depended build scripts
          # need them. ubuntu-latest ships both, so this was implicit;
          # locally-validated in `ci/docker-aarch64-musl-cross/` via a
          # vanilla ubuntu:24.04 container to surface the dependency.
          attempts=0
          until sudo apt-get install -y --no-install-recommends musl-tools cmake perl; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge "$max_attempts" ]; then
              echo "apt-get install musl-tools+cmake+perl failed after $max_attempts attempts" >&2
              exit 1
            fi
            sleep $((attempts * 3))
          done
          dpkg-query -W -f='musl-tools installed version: ${Version}\n' musl-tools
          dpkg-query -W -f='cmake installed version: ${Version}\n' cmake
          dpkg-query -W -f='perl installed version: ${Version}\n' perl

      # soldr#1005 / fbuild ingestion: Zig remains needed only for the
      # linux-gnu wheel lanes where `maturin build --zig` links the
      # wheel's embedded soldr binary against a glibc 2.17 floor and
      # tags the wheel manylinux_2_17. Release binary cross-compilation
      # itself is owned by `soldr build` below.
      - name: Setup zig for manylinux_2_17 wheel lanes
        if: contains(matrix.target, 'unknown-linux-gnu')
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      - name: Build release binary
        shell: bash
        env:
          CARGO_PROFILE_RELEASE_DEBUG: ${{ contains(matrix.target, 'pc-windows-msvc') && 'line-tables-only' || '0' }}
        run: |
          # soldr#1140 root-cause fix: restore Cargo.toml + Cargo.lock
          # + crates/soldr-cli/Cargo.toml BEFORE cargo runs.
          #
          # setup-soldr's `cook` step (which fires before this one on any
          # cache-hit lane) strips [workspace.package] from Cargo.toml
          # for cache-key stability and compiles soldr-cli as v0.0.1 into
          # target/. Without a restore + clean here, the subsequent
          # `cargo build --release` sees a stub target/ + a stripped
          # manifest, does not detect a version change, and links a
          # v0.0.1 stub binary (~118K on Windows, ~332K on Linux gnu)
          # that ships to PyPI as the release binary. Symptom: every
          # soldr invocation from `pip install soldr` silently exits 0
          # — see soldr#1140 and the FastLED-side fallback in
          # FastLED/FastLED#3523 for the downstream impact.
          #
          # `git restore` is the same incantation the wheel-build step
          # below already uses (v0.7.81 lesson); this just moves the
          # rescue earlier so the tar.zst archive + wheel both start
          # from the correct workspace.package version.
          #
          # `cargo clean -p soldr-cli` purges cook's stub soldr-cli
          # artifacts specifically; the 200+ transitive deps keep their
          # cached object code so cold recompile stays ~30-60s, not
          # multi-minute.
          git restore -- Cargo.toml Cargo.lock crates/soldr-cli/Cargo.toml || true
          cargo clean -p soldr-cli --target "${{ matrix.target }}" --release 2>/dev/null || true

          target='${{ matrix.target }}'
          # Release CI runs the checked-out soldr CLI as the build
          # driver and lets `soldr build` own all target-specific
          # toolchain dispatch. The workflow must not install or invoke
          # lower-level cross-build helpers directly.
          cargo run --release --locked --package soldr-cli --bin soldr -- \
            build --release --locked --target "$target" \
            --package soldr-cli \
            --bin soldr \
            --bin soldr-daemon \
            --bin soldr-shim \
            --bin soldr-clang-shim
          echo "=== post-build diagnostic: target/$target/release/ ==="
          ls -la "target/$target/release/" 2>&1 | head -20 || true
          echo "==================================================="

      - name: Stage soldr release binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          suffix=""
          case "${{ matrix.target }}" in *-pc-windows-msvc) suffix=".exe" ;; esac

          for stem in soldr soldr-daemon soldr-shim soldr-clang-shim; do
            src="target/${{ matrix.target }}/release/${stem}${suffix}"
            if [ ! -f "$src" ]; then
              echo "expected ${stem}${suffix} in target dir; observed release dir:" >&2
              ls -la "target/${{ matrix.target }}/release" >&2 || true
              exit 1
            fi
            cp "$src" "dist/package/${stem}${suffix}"
            chmod +x "dist/package/${stem}${suffix}" 2>/dev/null || true
          done

          # soldr#1032 bug 2: ship soldr-clang-shim next to soldr.
          # The shim is a tiny clang/clang++ wrapper installed by
          # Commands::Build (#1015 + #1016) to route ring 0.17.x's
          # hardcoded `c.compiler("clang")` to clang-cl on
          # *-pc-windows-msvc targets. `Commands::Build` looks for it
          # at `~/.soldr/bin/soldr-clang-shim`, sourced FROM the release
          # archive — so every archive must include it. Including it on
          # every target keeps the archive layout uniform; it's a no-op
          # binary on non-MSVC lanes.
          case "${{ matrix.target }}" in
            *-pc-windows-msvc)
              # Windows MSVC always emits a `.pdb` next to the binary
              # under the default release profile. Required (#782).
              pdb_src=""
              for candidate in \
                "target/${{ matrix.target }}/release/soldr.pdb" \
                "target/${{ matrix.target }}/release/soldr_cli.pdb"; do
                if [ -f "$candidate" ]; then
                  pdb_src="$candidate"
                  break
                fi
              done
              if [ -z "$pdb_src" ]; then
                echo "expected a soldr PDB sidecar next to ${{ matrix.binary }}; observed release dir:" >&2
                ls -la "target/${{ matrix.target }}/release" >&2 || true
                exit 1
              fi
              cp "$pdb_src" "dist/package/$(basename "$pdb_src")"
              ;;
            *-unknown-linux-*)
              # Linux split DWARF: only present when the release
              # profile sets `split-debuginfo = "packed"`. The default
              # Rust release profile DOES NOT, so a missing `.dwp` is
              # non-fatal — we stage it opportunistically. Issue #786:
              # generalize debug-sidecar packaging beyond Windows. The
              # manifest writer below records whatever ends up in
              # `dist/package/` under `soldr.debug_info`.
              for candidate in \
                "target/${{ matrix.target }}/release/soldr.dwp" \
                "target/${{ matrix.target }}/release/soldr_cli.dwp"; do
                if [ -f "$candidate" ]; then
                  cp "$candidate" "dist/package/$(basename "$candidate")"
                  echo "staged Linux split-DWARF sidecar: $(basename "$candidate")"
                  break
                fi
              done
              ;;
            *-apple-darwin)
              # macOS dSYM bundle: only present when the release
              # profile sets `split-debuginfo = "packed"`. The bundle
              # is a directory tree, NOT a single file — `cp -R`
              # preserves it. Missing bundle is non-fatal (#786).
              for candidate in \
                "target/${{ matrix.target }}/release/soldr.dSYM" \
                "target/${{ matrix.target }}/release/soldr_cli.dSYM"; do
                if [ -d "$candidate" ]; then
                  cp -R "$candidate" "dist/package/$(basename "$candidate")"
                  echo "staged macOS dSYM sidecar bundle: $(basename "$candidate")"
                  break
                fi
              done
              ;;
          esac
          ls -la dist/package/

      - name: Fetch support binaries from soldr-toolchain
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          SUPPORT_ISSUE_URL: https://github.com/zackees/soldr-toolchain/issues/47
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          import sys
          import tarfile
          import tempfile
          import urllib.request
          from urllib.parse import urljoin
          import zipfile
          from pathlib import Path

          ORIGIN = os.environ.get("SOLDR_TOOLCHAIN_ORIGIN", "https://zackees.github.io/soldr-toolchain").rstrip("/")
          TARGET = os.environ["TARGET_TRIPLE"]
          ISSUE = os.environ["SUPPORT_ISSUE_URL"]
          OUT = Path("dist/package")
          OUT.mkdir(parents=True, exist_ok=True)

          def read_constant(path: str, name: str) -> str:
              import re
              text = Path(path).read_text(encoding="utf-8")
              m = re.search(rf'{name}\\s*:\\s*&str\\s*=\\s*"([^"]+)"', text)
              if not m:
                  raise SystemExit(f"could not read {name} from {path}")
              return m.group(1)

          def platform_for_target(target: str) -> dict[str, str]:
              table = {
                  "x86_64-unknown-linux-gnu": {"os": "linux", "arch": "x86_64", "libc": "glibc"},
                  "aarch64-unknown-linux-gnu": {"os": "linux", "arch": "aarch64", "libc": "glibc"},
                  "x86_64-unknown-linux-musl": {"os": "linux", "arch": "x86_64", "libc": "musl"},
                  "aarch64-unknown-linux-musl": {"os": "linux", "arch": "aarch64", "libc": "musl"},
                  "aarch64-apple-darwin": {"os": "darwin", "arch": "aarch64"},
                  "x86_64-pc-windows-msvc": {"os": "windows", "arch": "x86_64", "abi": "msvc"},
                  "aarch64-pc-windows-msvc": {"os": "windows", "arch": "aarch64", "abi": "msvc"},
              }
              try:
                  return table[target]
              except KeyError:
                  raise SystemExit(f"no soldr-toolchain platform mapping for {target}")

          def read_url(url: str, timeout: int) -> bytes:
              with urllib.request.urlopen(url, timeout=timeout) as resp:
                  return resp.read()

          def load_json(url: str):
              return json.loads(read_url(url, timeout=60).decode("utf-8"))

          def download(url: str, dest: Path) -> None:
              dest.write_bytes(read_url(url, timeout=600))

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def sha256_bytes(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          INDEX_URL = f"{ORIGIN}/manifest.json"
          INDEX = load_json(INDEX_URL)

          def load_tool_catalog(tool: str):
              entry = (INDEX.get("tools") or {}).get(tool)
              descriptor = (entry or {}).get("descriptor") or {}
              descriptor_url = descriptor.get("url")
              if not descriptor_url:
                  raise SystemExit(f"{INDEX_URL} has no descriptor URL for {tool}; support coverage is tracked in {ISSUE}")
              catalog_url = urljoin(f"{ORIGIN}/", descriptor_url)
              raw = read_url(catalog_url, timeout=60)
              expected_sha = str(descriptor.get("sha256") or "").lower()
              if expected_sha and sha256_bytes(raw) != expected_sha:
                  raise SystemExit(f"{catalog_url} sha256 mismatch against {INDEX_URL} descriptor")
              return catalog_url, json.loads(raw.decode("utf-8"))

          def extract_archive(archive: Path, extract_dir: Path) -> None:
              name = archive.name
              if name.endswith(".tar.zst"):
                  subprocess.run(
                      [
                          "cargo",
                          "run",
                          "--release",
                          "--locked",
                          "--package",
                          "soldr-cli",
                          "--bin",
                          "soldr",
                          "--",
                          "archive",
                          "--input",
                          str(archive),
                          "--extract-dir",
                          str(extract_dir),
                      ],
                      check=True,
                  )
              elif name.endswith(".zip"):
                  with zipfile.ZipFile(archive) as zf:
                      zf.extractall(extract_dir)
              elif name.endswith(".tar.gz") or name.endswith(".tgz"):
                  with tarfile.open(archive, "r:gz") as tf:
                      tf.extractall(extract_dir)
              else:
                  raise SystemExit(f"unsupported support archive format: {archive}")

          def fetch_tool(tool: str, version: str) -> None:
              release_version = version if version.startswith("v") else f"v{version}"
              catalog_url, catalog = load_tool_catalog(tool)
              release = next((r for r in catalog.get("releases", []) if r.get("version") == release_version), None)
              if release is None:
                  raise SystemExit(
                      f"{catalog_url} has no release {release_version}; support coverage is tracked in {ISSUE}"
                  )
              platform = platform_for_target(TARGET)
              platform_entry = next((p for p in release.get("platforms", []) if p.get("platform") == platform), None)
              if platform_entry is None:
                  raise SystemExit(
                      f"{catalog_url} release {release_version} has no asset for {TARGET} ({platform}); "
                      f"support coverage is tracked in {ISSUE}"
                  )
              asset = platform_entry["asset"]
              urls = asset.get("urls") or []
              expected_sha = str(asset.get("sha256", "")).lower()
              if not urls or len(expected_sha) != 64:
                  raise SystemExit(f"{catalog_url} release {release_version} asset for {TARGET} lacks url/sha256")
              suffix = ".exe" if TARGET.endswith("pc-windows-msvc") else ""
              with tempfile.TemporaryDirectory(prefix=f"{tool}-support-") as td:
                  tmp = Path(td)
                  archive = tmp / asset["filename"]
                  print(f"fetching {tool} {release_version} for {TARGET}: {urls[0]}")
                  download(urls[0], archive)
                  actual_sha = sha256(archive)
                  if actual_sha != expected_sha:
                      raise SystemExit(f"{tool} sha256 mismatch: expected {expected_sha}, got {actual_sha}")
                  extract_dir = tmp / "extract"
                  extract_dir.mkdir()
                  extract_archive(archive, extract_dir)
                  binary_name = f"{tool}{suffix}"
                  matches = [p for p in extract_dir.rglob(binary_name) if p.is_file()]
                  if not matches:
                      raise SystemExit(f"{tool} support archive did not contain {binary_name}")
                  matches.sort(key=lambda p: (0 if p.parent.name == "bin" else 1, len(p.parts), str(p)))
                  dest = OUT / binary_name
                  shutil.copy2(matches[0], dest)
                  dest.chmod(dest.stat().st_mode | 0o755)
                  env_name = "CRGX_SOURCE_COMMIT" if tool == "crgx" else "CARGO_CHEF_SOURCE_COMMIT"
                  with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
                      fh.write(f"{env_name}=soldr-toolchain:{release_version}\\n")
                  print(f"staged {dest} from {matches[0]}")

          versions = {
              "crgx": read_constant("crates/soldr-cli/src/fetch/mod.rs", "MANAGED_CRGX_VERSION"),
              "cargo-chef": read_constant("crates/soldr-cli/src/fetch/known_tools.rs", "CARGO_CHEF_PINNED_VERSION"),
          }
          fetch_tool("crgx", versions["crgx"])
          fetch_tool("cargo-chef", versions["cargo-chef"])
          PY
          ls -la dist/package/

      - name: Write manifest.json
        # Drop a small JSON descriptor into the archive root so downstream
        # consumers (setup-soldr, npm install wrapper, ad-hoc tooling)
        # have one stable source of truth for what's inside: soldr +
        # zccache versions, target triples, per-binary sha256s, archive
        # format. Schema is versioned so we can extend later without
        # breaking parsers.
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          commit_sha="${{ needs.prepare.outputs.commit_sha }}"
          soldr_target="${{ matrix.target }}"
          zccache_version=$(sed -n 's/^version = "\(.*\)"/\1/p' \
            _vender/zccache/Cargo.toml | head -n1)
          crgx_version=$(sed -n 's/.*MANAGED_CRGX_VERSION: &str = "\(.*\)";/\1/p' \
            crates/soldr-cli/src/fetch/mod.rs | head -n1)
          cargo_chef_version=$(sed -n 's/.*CARGO_CHEF_PINNED_VERSION: &str = "\(.*\)";/\1/p' \
            crates/soldr-cli/src/fetch/known_tools.rs | head -n1)
          if [ -z "$cargo_chef_version" ]; then
            echo "could not read CARGO_CHEF_PINNED_VERSION from crates/soldr-cli/src/fetch/known_tools.rs" >&2
            exit 1
          fi
          crgx_commit="${CRGX_SOURCE_COMMIT:-unknown}"
          cargo_chef_commit="${CARGO_CHEF_SOURCE_COMMIT:-unknown}"
          zccache_target="$soldr_target"
          suffix=""
          case "$soldr_target" in *-pc-windows-msvc) suffix=".exe" ;; esac

          sha256_of() {
            # Cross-platform sha256: macOS lacks `sha256sum` by default,
            # so fall back to `shasum -a 256` (or fail loudly).
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | awk '{print $1}'
            else
              shasum -a 256 "$1" | awk '{print $1}'
            fi
          }

          soldr_sha=$(sha256_of "dist/package/soldr${suffix}")
          # Build `soldr.debug_info` from every sidecar staged above
          # (issue #786). Windows .pdb is REQUIRED — its absence fails
          # the build. Linux .dwp / macOS .dSYM are OPTIONAL — the
          # default Rust release profile doesn't emit them, so a
          # missing sidecar is silent and the array stays empty. Format
          # tags MUST match the constants in
          # `crates/soldr-cli/src/release_sidecar.rs::DebugSidecarFormat::as_manifest_str`.
          soldr_debug_info_entries=()
          add_sidecar_entry() {
            local path="$1" format="$2"
            local name sha
            name=$(basename "$path")
            sha=$(sha256_of "$path")
            soldr_debug_info_entries+=("{ \"name\": \"${name}\", \"sha256\": \"${sha}\", \"format\": \"${format}\" }")
          }
          if [ -n "$suffix" ]; then
            soldr_pdb=$(find dist/package -maxdepth 1 -type f \( -name 'soldr.pdb' -o -name 'soldr_cli.pdb' \) -print -quit)
            if [ -z "$soldr_pdb" ]; then
              echo "missing soldr PDB sidecar in dist/package for Windows release" >&2
              ls -la dist/package >&2
              exit 1
            fi
            add_sidecar_entry "$soldr_pdb" "pdb"
          fi
          soldr_dwp=$(find dist/package -maxdepth 1 -type f \( -name 'soldr.dwp' -o -name 'soldr_cli.dwp' \) -print -quit)
          if [ -n "$soldr_dwp" ]; then
            add_sidecar_entry "$soldr_dwp" "dwp"
          fi
          # macOS dSYM is a directory; sha256 it as a tarball of its
          # contents so consumers can verify the whole bundle in one
          # check. The bundle layout itself is preserved on disk.
          # Pipe through whichever sha256 binary is available — the
          # `sha256_of` helper above takes a path arg, not stdin.
          soldr_dsym=$(find dist/package -maxdepth 1 -type d \( -name 'soldr.dSYM' -o -name 'soldr_cli.dSYM' \) -print -quit)
          if [ -n "$soldr_dsym" ]; then
            dsym_name=$(basename "$soldr_dsym")
            if command -v sha256sum >/dev/null 2>&1; then
              dsym_sha=$(tar -cf - -C "$(dirname "$soldr_dsym")" "$dsym_name" | sha256sum | awk '{print $1}')
            else
              dsym_sha=$(tar -cf - -C "$(dirname "$soldr_dsym")" "$dsym_name" | shasum -a 256 | awk '{print $1}')
            fi
            soldr_debug_info_entries+=("{ \"name\": \"${dsym_name}\", \"sha256\": \"${dsym_sha}\", \"format\": \"dsym\" }")
          fi
          if [ ${#soldr_debug_info_entries[@]} -eq 0 ]; then
            soldr_debug_info_json="[]"
          else
            soldr_debug_info_json=$(printf "[%s]" "$(IFS=,; echo "${soldr_debug_info_entries[*]}")")
          fi
          soldr_daemon_sha=$(sha256_of "dist/package/soldr-daemon${suffix}")
          soldr_shim_sha=$(sha256_of "dist/package/soldr-shim${suffix}")
          soldr_clang_shim_sha=$(sha256_of "dist/package/soldr-clang-shim${suffix}")
          crgx_sha=$(sha256_of "dist/package/crgx${suffix}")
          cargo_chef_sha=$(sha256_of "dist/package/cargo-chef${suffix}")
          built_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # schema_version 3 adds the `cargo_chef` block. Consumers that
          # only understand v2 still get the old soldr/zccache/crgx fields,
          # but installers now require v3 so the bundled cook path is present.
          cat > dist/package/manifest.json <<EOF
          {
            "schema_version": 3,
            "soldr": {
              "version": "${version}",
              "target": "${soldr_target}",
              "binary": "soldr${suffix}",
              "sha256": "${soldr_sha}",
              "sidecars": [
                { "name": "soldr-daemon${suffix}",       "sha256": "${soldr_daemon_sha}" },
                { "name": "soldr-shim${suffix}",         "sha256": "${soldr_shim_sha}" },
                { "name": "soldr-clang-shim${suffix}",   "sha256": "${soldr_clang_shim_sha}" }
              ],
              "debug_info": ${soldr_debug_info_json},
              "commit_sha": "${commit_sha}"
            },
            "zccache": {
              "version": "${zccache_version}",
              "target": "${zccache_target}",
              "embedded": true
            },
            "crgx": {
              "version": "${crgx_version}",
              "target": "${soldr_target}",
              "binary": "crgx${suffix}",
              "sha256": "${crgx_sha}",
              "source_commit": "${crgx_commit}"
            },
            "cargo_chef": {
              "version": "${cargo_chef_version}",
              "target": "${soldr_target}",
              "binary": "cargo-chef${suffix}",
              "sha256": "${cargo_chef_sha}",
              "source_commit": "${cargo_chef_commit}"
            },
            "archive": {
              "format": "tar.zst",
              "compression_level": 19
            },
            "built_at": "${built_at}"
          }
          EOF

          echo "--- manifest.json ---"
          cat dist/package/manifest.json

      - name: Package combined archive (tar.zst level 19)
        # Use soldr's in-process Rust zstd encoder rather than depending
        # on a runner-local `zstd` executable. The command uses level 19
        # and all available cores.
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          name="soldr-${version}-${{ matrix.target }}"
          cargo run --release --locked --package soldr-cli --bin soldr -- \
            archive --stage-dir dist/package --output "dist/${name}.tar.zst"
          ls -la "dist/${name}.tar.zst"
          echo "compressed_size_bytes=$(wc -c < "dist/${name}.tar.zst")"

      - name: Install uv
        # PyPI wheel build is gnu-only for now. musllinux wheels need a
        # docker-based smoke test (the smoke step below cannot install a
        # musllinux wheel on the glibc-based release runner), and that
        # plumbing is out of scope for the initial musl-binary ship.
        # Users on alpine still get pip install via the source dist or
        # the GitHub Releases tarball; the npm wrapper picks up the musl
        # tarball directly via libc detection.
        if: ${{ !contains(matrix.target, 'musl') }}
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: false

      - name: Build hardened wheel from shared target directory
        if: ${{ !contains(matrix.target, 'musl') }}
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # soldr#1083 follow-up: aggressive cache bust before maturin.
          # Linux GNU lanes were producing wheels tagged with
          # version "0.0.1" instead of the workspace version
          # because setup-soldr's target/ cache restored stale
          # build artifacts whose fingerprints lied about the
          # crate version. macOS ARM64 + Windows lanes didn't have
          # this contamination and produced correct wheels.
          #
          # Steps:
          #   1. Wipe ANY .whl anywhere under dist/ or target/.
          #      Belt-and-suspenders for stale wheels.
          #   2. Wipe maturin's internal staging dirs.
          #   3. `cargo clean -p soldr-cli --target $T --release`
          #      invalidates the soldr-cli per-package fingerprint
          #      so the upcoming maturin-driven cargo build
          #      re-evaluates the crate version from the (correct)
          #      Cargo.toml on disk. Only invalidates soldr-cli
          #      itself; the 200+ transitive deps keep their cached
          #      object code. Recompile cost: ~30-60s.
          #   4. Verify the source-of-truth version BEFORE maturin
          #      runs (defense in depth — the wheel-lint after
          #      maturin would still catch this, but failing early
          #      with the exact diagnostic is friendlier).
          rm -f dist/*.whl
          rm -rf target/wheels target/maturin
          find target -name "*.whl" -delete 2>/dev/null || true
          cargo clean -p soldr-cli --target "${{ matrix.target }}" --release 2>/dev/null || true
          mkdir -p dist

          expected="${EXPECTED_VERSION#v}"
          # v0.7.81 lesson: the workspace `Cargo.toml` on disk at
          # this point is a STRIPPED variant (only `[workspace]` +
          # `[workspace.dependencies]`, missing `[workspace.package]`
          # entirely). Some prior step in this matrix lane is
          # replacing the manifest — most likely setup-soldr's
          # cache restoration normalizing it for cache-key
          # stability. The result: maturin reads the wrong
          # manifest, writes wheels tagged with whatever first
          # `version = "X"` line is in the stripped file (the
          # first dep version, usually clap's "4"), and downstream
          # twine aborts the PyPI upload.
          #
          # Restore the real manifest tree from git BEFORE
          # anything reads it. Cheap (just file IO from
          # .git/objects).
          git restore -- Cargo.toml Cargo.lock crates/soldr-cli/Cargo.toml || true

          echo "=== pre-maturin diagnostic ==="
          echo "pwd: $(pwd)"
          echo "ls Cargo.toml Cargo.lock:"
          ls -la Cargo.toml Cargo.lock 2>&1 || true
          echo "head -30 Cargo.toml:"
          head -30 Cargo.toml || true
          echo "================================"

          # Authoritative version via cargo metadata.
          cargo_version="$(cargo metadata --no-deps --format-version 1 --manifest-path crates/soldr-cli/Cargo.toml 2>/dev/null \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); pkgs=[p for p in d["packages"] if p["name"]=="soldr-cli"]; print(pkgs[0]["version"] if pkgs else "")' 2>/dev/null || true)"
          echo "cargo metadata reports soldr-cli version = $cargo_version"
          echo "Expected (from prepare.outputs.version) = $expected"
          if [ -z "$cargo_version" ]; then
              echo "ERROR: cargo metadata returned no version for soldr-cli" >&2
              exit 1
          fi
          if [ "$cargo_version" != "$expected" ]; then
              echo "ERROR: soldr-cli version ($cargo_version) does not match prepare.outputs.version ($expected) — possible cache contamination" >&2
              exit 1
          fi

          uv tool install "maturin>=1.7,<2"

          # soldr#1005 / fbuild ingestion: on the linux-gnu lanes,
          # build the wheel with maturin's zig integration so the
          # embedded soldr binary links against a glibc 2.17 floor and
          # the wheel is tagged manylinux_2_17. `--compatibility pypi`
          # alone lets maturin auto-tag from the runner glibc
          # (manylinux_2_39 on ubuntu-24.04), which excludes every
          # glibc<2.39 consumer and triggers pip's fallback to the
          # 0.1.0 placeholder sdist. Reference implementation:
          # FastLED/fbuild .github/workflows/template_native_build.yml
          # with a Zig-linked manylinux floor; `maturin --zig` owns its
          # internal linker setup for wheel tagging. macOS / Windows
          # lanes keep `--compatibility pypi` untouched.
          compat_args=(--compatibility pypi)
          case "${{ matrix.target }}" in
            *-unknown-linux-gnu)
              compat_args=(--zig --compatibility manylinux_2_17)
              ;;
          esac

          maturin build \
            --release \
            --locked \
            "${compat_args[@]}" \
            --auditwheel repair \
            --target "${{ matrix.target }}" \
            --target-dir target \
            --out dist

      - name: Lint wheel filenames against workspace version
        if: ${{ !contains(matrix.target, 'musl') }}
        shell: python
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # soldr#1083 follow-up: catch wrong-versioned wheels (e.g.
          # the 0.0.1-tagged stubs from the v0.7.72 release that
          # aborted PyPI upload) BEFORE they leave the build job and
          # poison the publish-pypi twine step. Fails the build with
          # a clear error if any wheel in dist/ has a name whose
          # version field doesn't match `[workspace.package].version`
          # as derived from the prepare job. PEP 491: wheel filename
          # is `<distname>-<version>-...`, so version is parts[1].
          import os
          import re
          import sys
          from pathlib import Path

          # outputs.version is `vX.Y.Z`; wheel filename uses `X.Y.Z`.
          expected = os.environ["EXPECTED_VERSION"].lstrip("v")
          wheels = sorted(Path("dist").glob("*.whl"))
          if not wheels:
              sys.exit("no wheels in dist/ — maturin produced nothing?")
          bad = []
          for w in wheels:
              parts = w.stem.split("-")
              if len(parts) < 2:
                  bad.append((w.name, "filename has no version field"))
                  continue
              wheel_version = parts[1]
              if wheel_version != expected:
                  bad.append(
                      (w.name, f"version {wheel_version!r} != expected {expected!r}")
                  )
          if bad:
              msg = ["wheel version lint FAILED:"]
              for name, why in bad:
                  msg.append(f"  - {name}: {why}")
              msg.append("")
              msg.append(
                  f"Every wheel in dist/ must be tagged {expected!r} to match "
                  f"[workspace.package].version in Cargo.toml. A wrong-versioned "
                  f"wheel here would cause twine to abort the whole PyPI publish "
                  f"on its first '400 File already exists' (see soldr#1083 + the "
                  f"v0.7.72 release log)."
              )
              sys.exit("\n".join(msg))
          print(
              f"wheel version lint OK: {len(wheels)} wheel(s) all tagged {expected!r}:"
          )
          for w in wheels:
              print(f"  - {w.name}")

      - name: Assert linux-gnu wheels are tagged manylinux_2_17
        if: contains(matrix.target, 'unknown-linux-gnu')
        shell: python
        run: |
          # soldr#1005 / fbuild ingestion: hard assertion-gate in the
          # spirit of FastLED/fbuild's `NO CHEATING` artifact gates
          # (cf. fbuild ci/docker-mac-cross/build.sh:77-84, where
          # file(1) must report Mach-O for every cross-built artifact
          # or the lane fails loudly — a silently host-linked binary
          # must never ship). Here the equivalent silent failure mode
          # is maturin quietly falling back to the runner glibc and
          # tagging manylinux_2_39: the wheel still builds, still
          # smoke-tests on the 2.39 runner, and only breaks downstream
          # when pip on glibc<2.39 skips it and installs the 0.1.0
          # placeholder sdist instead. Fail the lane at build time if
          # any linux wheel filename is not manylinux_2_17-tagged.
          import sys
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          if not wheels:
              sys.exit("no wheels in dist/ — maturin produced nothing?")
          bad = [w.name for w in wheels if "manylinux_2_17" not in w.name]
          if bad:
              msg = ["manylinux_2_17 tag assertion FAILED:"]
              for name in bad:
                  msg.append(f"  - {name}")
              msg.append("")
              msg.append(
                  "Every linux-gnu wheel must carry the manylinux_2_17 "
                  "platform tag (glibc 2.17 floor via `maturin build "
                  "--zig --compatibility manylinux_2_17`). A higher tag "
                  "(e.g. manylinux_2_39 from the runner glibc) makes "
                  "`pip install soldr` on older glibc fall back to the "
                  "0.1.0 placeholder sdist — the soldr#1005 trap. Check "
                  "that zig is on PATH and the maturin invocation kept "
                  "the --zig/--compatibility args for this lane."
              )
              sys.exit("\n".join(msg))
          print(f"manylinux_2_17 tag assertion OK: {len(wheels)} wheel(s):")
          for w in wheels:
              print(f"  - {w.name}")

      - name: Verify wheel ships the bin script at the spec path
        if: ${{ !contains(matrix.target, 'musl') }}
        shell: python
        run: |
          import zipfile
          from pathlib import Path

          binary_name = "${{ matrix.binary }}"

          wheels = sorted(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, found {len(wheels)}: {wheels}")

          # Pin the verification to the exact PEP 491 `.data/scripts/`
          # entry that pip installs to the bin directory. Anchored to
          # the wheel root so we never accept a nested or look-alike
          # path. Per PEP 491 the wheel filename's first two
          # `-`-separated tokens are `<distname>-<version>` and the
          # data directory is `<distname>-<version>.data/`.
          wheel_stem = wheels[0].stem  # filename without `.whl`
          parts = wheel_stem.split("-")
          if len(parts) < 2:
              raise SystemExit(f"unexpected wheel filename: {wheels[0].name}")
          distname_version = f"{parts[0]}-{parts[1]}"
          script_entry = f"{distname_version}.data/scripts/{binary_name}"

          # We do NOT SHA-compare the wheel binary to the standalone
          # release tarball binary at `dist/package/<binary>`. From
          # maturin 1.13.2 onward, maturin builds its own binary at
          # `target/maturin/<binary>` and post-processes it on macOS
          # (delocate-style rewrite of external dylib load paths,
          # e.g. `liblzma.5.dylib`). The wheel binary is therefore
          # intentionally byte-different from cargo's release binary
          # even though they're functionally equivalent. The
          # `Smoke test wheel` step that follows installs the wheel
          # and runs `<binary> --version` — that's the real functional
          # check. This step's job is to confirm the wheel is
          # structurally well-formed: exactly one entry at the
          # PEP 491 scripts path, no nested look-alikes.
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = wheel.namelist()
              if names.count(script_entry) != 1:
                  matches = [n for n in names if n == script_entry]
                  raise SystemExit(
                      f"expected exactly one `{script_entry}` entry in "
                      f"{wheels[0].name}, found {matches}"
                  )
              info = wheel.getinfo(script_entry)
              if info.file_size == 0:
                  raise SystemExit(
                      f"`{script_entry}` in {wheels[0].name} is empty"
                  )
              # soldr#1140: v0.7.87 shipped 118 KB stubs on
              # win_amd64 + Linux gnu lanes. Both wheels had every
              # `.data/scripts/*` entry at ~118 KB / ~332 KB — real
              # release binaries are 4+ MB. Enforce a floor so the
              # stub bug can never ship again. On macOS lanes, maturin
              # uses delocate-style repair: the `.data/scripts/*`
              # entries are ~450-byte Python launcher stubs that exec
              # the real binaries under `soldr.scripts/`. We validate
              # both possible locations and require ONE of them ships
              # a payload larger than the floor.
              #
              # Floor derived from win_arm64 (a known-good release):
              #   soldr.exe          15074816  ← main CLI
              #   soldr-daemon.exe    4700672
              #   soldr-clang-shim    226304
              #   soldr-shim          226304
              # Pick 2 MB as the floor for the primary bin (soldr /
              # soldr.exe). Anything below that means the actual
              # crate code did not get compiled in.
              MIN_PRIMARY_BIN_BYTES = 2 * 1024 * 1024
              soldr_scripts_entry = f"soldr.scripts/{binary_name}"
              candidates = [
                  (script_entry, info.file_size),
              ]
              if soldr_scripts_entry in names:
                  candidates.append(
                      (soldr_scripts_entry, wheel.getinfo(soldr_scripts_entry).file_size)
                  )
              largest = max(sz for _, sz in candidates)
              if largest < MIN_PRIMARY_BIN_BYTES:
                  layout = "\n".join(
                      f"  {p}: {sz} bytes" for p, sz in candidates
                  )
                  raise SystemExit(
                      f"wheel ships {binary_name!r} at {largest} bytes across "
                      f"{len(candidates)} candidate path(s):\n{layout}\n"
                      f"expected >= {MIN_PRIMARY_BIN_BYTES} bytes (2 MiB) — a "
                      f"real soldr binary compiled from crates/soldr-cli is "
                      f"~15 MB. Anything below this floor means the crate's "
                      f"main.rs did not get compiled into the shipped bin "
                      f"(soldr#1140 — v0.7.87 stub regression). Do NOT ship "
                      f"this wheel; investigate the maturin cargo invocation."
                  )
              # Dump all script entries so post-mortems can see per-bin sizes
              # even when the assertion above passes.
              print("=== wheel scripts/ layout ===")
              for n in sorted(names):
                  if ".data/scripts/" in n or n.startswith("soldr.scripts/"):
                      print(f"  {wheel.getinfo(n).file_size:>10}  {n}")

          print(
              f"{wheels[0].name} ships {binary_name} at `{script_entry}` "
              f"({info.file_size} bytes); primary-bin payload >="
              f"{MIN_PRIMARY_BIN_BYTES} bytes OK"
          )

      - name: Smoke test wheel
        if: ${{ !contains(matrix.target, 'musl') }}
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          uv venv .venv
          uv pip install --python .venv dist/*.whl
          # soldr#1140: previously this step only checked exit code. A
          # stub bin that silently exits 0 (as v0.7.87 shipped on
          # win_amd64) trivially passed. Capture stdout and require it
          # to start with "soldr " so a stub can never sneak through.
          if [ -x .venv/bin/soldr ]; then
              soldr_bin=".venv/bin/soldr"
          else
              soldr_bin=".venv/Scripts/soldr.exe"
          fi
          out="$("$soldr_bin" --version)"
          printf 'wheel smoke test — soldr --version output: %s\n' "$out"
          case "$out" in
              "soldr "*) ;;
              *) echo "ERROR: 'soldr --version' output did not start with 'soldr ' — likely shipping a stub binary (soldr#1140)." >&2; exit 1 ;;
          esac

          # soldr#1202: cross-check via `soldr version --json` — the
          # dispatch-arm code path (Commands::Version) is distinct from
          # clap's built-in --version and downstream tooling parses the
          # JSON. v0.7.87 shipped a binary whose `--version` passed
          # (`soldr 0.0.1`) but whose `version --json` returned empty
          # stdout, breaking setup-soldr's verify step. Guard both.
          expected_soldr_version="${EXPECTED_VERSION#v}"
          json_out="$("$soldr_bin" version --json)"
          if [ -z "$json_out" ]; then
              echo "ERROR: 'soldr version --json' produced empty stdout in wheel (soldr#1202)." >&2
              exit 1
          fi
          printf 'wheel smoke test — soldr version --json output: %s\n' "$json_out"
          compact="$(printf '%s' "$json_out" | tr -d ' \n\r\t')"
          if ! printf '%s' "$compact" | grep -q "\"soldr_version\":\"${expected_soldr_version}\""; then
              echo "ERROR: wheel's 'soldr version --json' output does not include soldr_version=${expected_soldr_version} (soldr#1202)." >&2
              exit 1
          fi

      - name: Smoke test standalone musl binary
        # The wheel smoke test above is unreachable for musl rows (the
        # release runner is glibc, can't install a musllinux wheel). The
        # standalone musl binary is statically linked so it CAN run on
        # glibc — verify that the build actually produced a working
        # executable, otherwise we'd ship an untested artifact.
        if: contains(matrix.target, 'musl')
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          test -x "$binary" || { echo "missing release binary: $binary" >&2; exit 1; }
          file "$binary" || true
          "./$binary" --version

          # soldr#1202: guard the `version --json` dispatch-arm code
          # path — v0.7.87 shipped a stub whose `--version` passed but
          # whose `version --json` returned empty stdout.
          expected_soldr_version="${EXPECTED_VERSION#v}"
          json_out="$("./$binary" version --json)"
          if [ -z "$json_out" ]; then
              echo "ERROR: 'soldr version --json' produced empty stdout on musl binary (soldr#1202)." >&2
              exit 1
          fi
          printf 'musl smoke test — soldr version --json output: %s\n' "$json_out"
          compact="$(printf '%s' "$json_out" | tr -d ' \n\r\t')"
          if ! printf '%s' "$compact" | grep -q "\"soldr_version\":\"${expected_soldr_version}\""; then
              echo "ERROR: musl 'soldr version --json' output does not include soldr_version=${expected_soldr_version} (soldr#1202)." >&2
              exit 1
          fi

      - name: Smoke test combined tar.zst archive
        # Round-trip: extract the freshly-packaged combined archive into a
        # scratch dir, list its contents, and run soldr from there. Catches
        # mistakes in the tar layout / file modes / zstd compression /
        # sidecar binary names before the artifact reaches the GH
        # release. Cross-arch archives can't be executed (e.g. aarch64
        # build on x86_64 host) so the `--version` step is gated to
        # native-arch combinations.
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          archive="dist/soldr-${version}-${{ matrix.target }}.tar.zst"
          test -f "$archive" || { echo "missing archive: $archive" >&2; exit 1; }

          extract=$(mktemp -d)
          cargo run --release --locked --package soldr-cli --bin soldr -- \
            archive --input "$archive" --extract-dir "$extract"
          echo "--- extracted layout ---"
          ls -la "$extract"

          # Every archive must ship soldr, soldr-owned sidecars, crgx,
          # cargo-chef, and a manifest.json describing the bundle.
          # Windows archives must also ship soldr's PDB sidecar.
          suffix=""
          case "${{ matrix.target }}" in *-pc-windows-msvc) suffix=".exe" ;; esac
          for required in \
            "${{ matrix.binary }}" \
            "soldr-daemon${suffix}" \
            "soldr-shim${suffix}" \
            "soldr-clang-shim${suffix}" \
            "crgx${suffix}" \
            "cargo-chef${suffix}" \
            "manifest.json"; do
            test -f "$extract/$required" \
              || { echo "missing $required in $archive" >&2; exit 1; }
          done
          if [ -n "$suffix" ]; then
            if ! find "$extract" -maxdepth 1 -type f \( -name 'soldr.pdb' -o -name 'soldr_cli.pdb' \) | grep -q .; then
              echo "missing soldr PDB sidecar in $archive" >&2
              exit 1
            fi
          fi
          echo "--- extracted manifest.json ---"
          cat "$extract/manifest.json"

          # soldr#1202 follow-up to #1206: cross-arch size-floor guard.
          # The `soldr --version` + `soldr version --json` guards below
          # only run on native-arch matches (aarch64 archives can't
          # execute on x86_64 release runners). A stub binary shipped
          # into a cross-arch archive would slip past every dynamic
          # check. Enforce a 2 MiB floor here so a shipped `soldr` bin
          # that got left as a 332 KiB stub is rejected before it
          # reaches the GH release surface, on every lane. Real soldr
          # ~13-15 MB on Linux glibc / ~15 MB on Windows / ~15 MB on
          # darwin; 2 MiB is well below that but far above any
          # conceivable stub (soldr-shim / soldr-clang-shim).
          MIN_SOLDR_BYTES=$((2 * 1024 * 1024))
          soldr_size=$(wc -c < "$extract/${{ matrix.binary }}" | tr -d ' ')
          if [ "$soldr_size" -lt "$MIN_SOLDR_BYTES" ]; then
              echo "ERROR: '$extract/${{ matrix.binary }}' is ${soldr_size} bytes; expected >= ${MIN_SOLDR_BYTES} (2 MiB)." >&2
              echo "This is the soldr#1140 / soldr#1202 stub-binary regression — the release archive shipped a placeholder instead of the real soldr binary." >&2
              exit 1
          fi
          echo "archive smoke test — ${{ matrix.binary }} size ${soldr_size} bytes >= ${MIN_SOLDR_BYTES} floor OK"

          # Run soldr only when the archive's target matches the runner's
          # native arch. ubuntu-24.04 / windows-2025 are x86_64; the
          # ubuntu-24.04-arm / windows-11-arm runners are aarch64; macOS is
          # whatever the matrix entry says (Intel vs ARM).
          runner_arch=$(uname -m)
          case "$runner_arch:${{ matrix.target }}" in
            x86_64:x86_64-*|aarch64:aarch64-*|arm64:aarch64-*)
              "$extract/${{ matrix.binary }}" --version

              # soldr#1202: `soldr version --json` is a distinct code
              # path (Commands::Version arm) from `soldr --version`
              # (clap's built-in --version flag → early exit). v0.7.87
              # shipped a stub whose `soldr --version` printed
              # `soldr 0.0.1` — trivially passing the "starts with
              # soldr " wheel check — while `soldr version --json`
              # produced empty stdout, breaking every downstream JSON
              # consumer including setup-soldr's verify step. Guard
              # both paths here so the class of regression can't
              # recur.
              expected_soldr_version="${version#v}"
              json_out="$("$extract/${{ matrix.binary }}" version --json)"
              if [ -z "$json_out" ]; then
                  echo "ERROR: 'soldr version --json' produced empty stdout — likely a stub binary (soldr#1140 / soldr#1202)." >&2
                  exit 1
              fi
              printf 'soldr version --json output: %s\n' "$json_out"
              # Compact JSON before matching so the pattern survives
              # any whitespace / newline formatting.
              compact="$(printf '%s' "$json_out" | tr -d ' \n\r\t')"
              if ! printf '%s' "$compact" | grep -q "\"soldr_version\":\"${expected_soldr_version}\""; then
                  echo "ERROR: 'soldr version --json' output does not include soldr_version=${expected_soldr_version} (soldr#1202)." >&2
                  exit 1
              fi

              # Smoke the bundled crgx too — same arch gate. crgx is
              # self-contained (no daemon, no sidecars), so --version
              # is enough to prove the binary loads and the static
              # linkage works on the host.
              "$extract/soldr-daemon${suffix}" --help >/dev/null
              "$extract/soldr-shim${suffix}" --help >/dev/null || true
              "$extract/crgx${suffix}" --version
              "$extract/cargo-chef${suffix}" --version
              ;;
            *)
              echo "skipping --version (runner $runner_arch vs target ${{ matrix.target }})"
              ;;
          esac

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-soldr-${{ matrix.target }}
          path: dist/soldr-*.tar.zst

      - if: ${{ !contains(matrix.target, 'musl') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pypi-soldr-${{ matrix.target }}
          path: dist/*.whl

  publish:
    name: Attest and publish release assets
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.should_publish_github_release == 'true'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: release-soldr-*
          merge-multiple: true

      # Wheels ship as GH-release assets alongside the .tar.zst archives.
      # This is parity with what `publish-pypi` uploads to PyPI: the same
      # 6 platform wheels become offline-installable via
      # `pip install <release-asset-url>`, and the assets are attestation-
      # covered via the same SHA256SUMS file below.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: pypi-soldr-*
          merge-multiple: true

      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # Glob expansion happens before the `>` redirect creates the
          # output file, so SHA256SUMS.txt is never present in the set
          # it's writing.
          sha256sum soldr-* > "soldr-${{ needs.prepare.outputs.version }}-SHA256SUMS.txt"

      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-checksums: dist/soldr-${{ needs.prepare.outputs.version }}-SHA256SUMS.txt

      # Pre-create the tag via the git refs API instead of letting
      # `gh release create --target <sha>` create it implicitly.
      # Rationale: on workflow_dispatch runs (vs push) the GITHUB_TOKEN
      # cannot create-via-release at a protected branch's HEAD — `gh
      # release create` returns "HTTP 403: Resource not accessible by
      # integration" even though the job log shows `Contents: write`.
      # The /git/refs endpoint accepts the same token at this repo, so
      # creating the tag first lets the subsequent release-create see an
      # existing tag and skip the implicit-tag-creation that was the
      # source of the 403.
      #
      # soldr#1252: both endpoints started returning 403 for v0.7.95 even
      # on push runs. Owner may need to pre-populate the tag out-of-band
      # with a PAT. Make the step idempotent: check if the tag already
      # exists first (owner may have pre-populated it), skip if so, else
      # attempt the create. The check-first flow also makes reruns after
      # a partial success safe.
      - name: Pre-create release tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ needs.prepare.outputs.version }}'
          sha='${{ needs.prepare.outputs.commit_sha }}'
          if gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" >/dev/null 2>&1; then
              echo "tag ${tag} already exists — skipping create"
              exit 0
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              -X POST \
              -f "ref=refs/tags/${tag}" \
              -f "sha=${sha}"; then
              echo "::error::GITHUB_TOKEN could not create tag ${tag} via /git/refs. Registry publishes are blocked until the GitHub release tag/assets can be created. See soldr#1252."
              {
                echo "## Manual release recovery needed (tag)"
                echo '```'
                echo "gh api repos/${GITHUB_REPOSITORY}/git/refs -X POST -f ref=refs/tags/${tag} -f sha=${sha}"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
          fi

      - name: Create draft GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ needs.prepare.outputs.version }}'
          # Idempotent: reruns after a partial success (or an owner-side
          # manual create) must not fail on "release already exists".
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "release ${tag} already exists; uploading/replacing assets"
              gh release upload "${tag}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
              echo "created=true" >> "$GITHUB_OUTPUT"
              exit 0
          fi
          if gh release create "${tag}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --generate-notes \
            --target "${{ needs.prepare.outputs.commit_sha }}" \
            --title "${tag}"; then
              echo "created=true" >> "$GITHUB_OUTPUT"
          else
              echo "created=false" >> "$GITHUB_OUTPUT"
              echo "::error::GITHUB_TOKEN could not create the GitHub release for ${tag}. Registry publishes are blocked until the GitHub release exists with the expected assets. See soldr#1252."
              {
                echo "## Manual release recovery needed (GitHub release)"
                echo '```'
                echo "gh run download ${GITHUB_RUN_ID} --repo ${GITHUB_REPOSITORY} --pattern 'release-soldr-*' --dir dist"
                echo "gh release create ${tag} dist/* --repo ${GITHUB_REPOSITORY} --generate-notes --target ${{ needs.prepare.outputs.commit_sha }} --title ${tag}"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
          fi

      - name: Publish GitHub Release
        if: steps.create_release.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "${{ needs.prepare.outputs.version }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false

  verify_github_release:
    name: Verify GitHub Release assets
    needs:
      - prepare
      - build
      - publish
    if: always() && needs.prepare.outputs.should_release == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04

    steps:
      - name: Verify expected release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ needs.prepare.outputs.version }}'
          cargo_version="${tag#v}"
          release_json="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets,isDraft)"
          if [[ "$(jq -r '.isDraft' <<< "$release_json")" != "false" ]]; then
            echo "GitHub release $tag is still a draft" >&2
            exit 1
          fi
          expected_assets=(
            "soldr-${tag}-x86_64-unknown-linux-gnu.tar.zst"
            "soldr-${tag}-aarch64-unknown-linux-gnu.tar.zst"
            "soldr-${tag}-x86_64-unknown-linux-musl.tar.zst"
            "soldr-${tag}-aarch64-unknown-linux-musl.tar.zst"
            "soldr-${tag}-aarch64-apple-darwin.tar.zst"
            "soldr-${tag}-x86_64-pc-windows-msvc.tar.zst"
            "soldr-${tag}-aarch64-pc-windows-msvc.tar.zst"
            "soldr-${cargo_version}-py3-none-macosx_11_0_arm64.whl"
            "soldr-${cargo_version}-py3-none-manylinux_2_17_aarch64.manylinux2014_aarch64.whl"
            "soldr-${cargo_version}-py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64.whl"
            "soldr-${cargo_version}-py3-none-win_amd64.whl"
            "soldr-${cargo_version}-py3-none-win_arm64.whl"
            "soldr-${tag}-SHA256SUMS.txt"
          )
          missing=()
          for asset in "${expected_assets[@]}"; do
            size="$(jq --arg name "$asset" -r '.assets[] | select(.name == $name) | .size' <<< "$release_json" | head -n1)"
            if [[ -z "$size" || "$size" == "null" ]]; then
              missing+=("$asset")
              continue
            fi
            if (( size <= 0 )); then
              echo "GitHub release asset $asset has invalid size $size" >&2
              exit 1
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'GitHub release %s is missing expected assets:\n' "$tag" >&2
            printf ' - %s\n' "${missing[@]}" >&2
            exit 1
          fi
          echo "GitHub release $tag has all ${#expected_assets[@]} expected assets."

  publish-pypi:
    name: Publish hardened PyPI wheels
    needs:
      - prepare
      - build
      - verify_github_release
    # Registry publishes must happen only after the GitHub Release has
    # all expected binary/wheel assets. An existing tag or release is not
    # enough; verify_github_release checks the actual asset set.
    if: always() && needs.prepare.outputs.should_publish_pypi == 'true' && needs.verify_github_release.result == 'success'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          pattern: pypi-soldr-*
          merge-multiple: true

      - name: Show Python distributions
        shell: bash
        run: |
          set -euo pipefail
          ls -1 dist

      - name: Publish wheel set to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist

      - name: Verify all wheels visible on PyPI
        # pypa/gh-action-pypi-publish uploads wheels sequentially via twine.
        # For an N-wheel matrix there is an N x ~2-3s window during which
        # `https://pypi.org/pypi/<project>/<version>/json` returns a partial
        # set, and downstream resolvers (e.g. `uv sync`) can cache a
        # "no compatible wheel" failure for the platforms not yet uploaded.
        # Poll the JSON endpoint until the full set is visible before the
        # workflow returns success. See issue #605 for the downstream
        # breakage that motivated this.
        shell: bash
        env:
          PYPI_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # Tag-style version is `vX.Y.Z`; PyPI keys releases by `X.Y.Z`.
          pypi_version="${PYPI_VERSION#v}"
          # Expected wheel count == number of non-musl matrix rows in the
          # `build` job (the musl rows skip wheel build by design). 5 = 2
          # linux-gnu + 1 darwin (aarch64-only per soldr#1237 macos-x64
          # drop) + 2 windows-msvc.
          expected=5
          deadline=$(( $(date +%s) + 1800 ))
          attempts=0
          max_attempts=60
          while :; do
            attempts=$((attempts + 1))
            count="$(curl -fsSL --max-time 30 --connect-timeout 10 "https://pypi.org/pypi/soldr/${pypi_version}/json" \
              | python3 -c 'import json,sys; print(len(json.load(sys.stdin).get("urls",[])))' 2>/dev/null \
              || echo 0)"
            echo "PyPI reports ${count}/${expected} files for soldr==${pypi_version}"
            if [ "$count" -ge "$expected" ]; then
              echo "All ${expected} wheels visible on PyPI; verification complete."
              exit 0
            fi
            if [ "$attempts" -ge "$max_attempts" ]; then
              echo "Timed out after ${max_attempts} attempts waiting for ${expected} wheels for soldr==${pypi_version}" >&2
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Timed out waiting for ${expected} wheels for soldr==${pypi_version}" >&2
              exit 1
            fi
            sleep 15
          done

  publish-npm:
    name: Publish npm package
    needs:
      - prepare
      - build
      - verify_github_release
      - publish-pypi
    if: always() && needs.prepare.outputs.should_publish_npm == 'true' && needs.verify_github_release.result == 'success' && (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive
          ref: ${{ needs.prepare.outputs.commit_sha }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Install npm CLI with trusted publishing support
        shell: bash
        run: npm install --global npm@11.12.1

      - name: Validate npm package
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          node scripts/test-npm-package.js
          npm pack --dry-run

      - name: Publish package to npm
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          package_spec="${package_name}@${package_version}"

          if npm dist-tag ls "$package_name" | awk '{print $2}' | grep -Fx "$package_version" >/dev/null; then
            echo "$package_spec is already published; skipping npm publish."
            exit 0
          fi

          npm publish
