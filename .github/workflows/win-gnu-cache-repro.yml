name: win-gnu cache repro (#2348)

# Reproduces reld#66 / soldr#2348: a CACHED (daemon path) `soldr build
# --target x86_64-pc-windows-gnu` on a Linux host where the win-gnu rust-std
# lives only in the toolchain home soldr provisions — the win-gnu-smoke lane
# masks this with `--no-cache` (which bypasses the daemon) + a dtolnay
# pre-install of the target into the runner's ~/.rustup. Dispatch-only.

on:
  workflow_dispatch:
  # Temporary: run on push to the fix branch so the diagnostic can iterate
  # before the workflow exists on the default branch. Removed before merge.
  push:
    branches:
      - fix/win-gnu-rustup-home

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SOLDR_GITHUB_TOKEN: ${{ github.token }}
  SOLDR_DEBUG_COMPILE_ENV: "1"

jobs:
  repro:
    name: linux-host cached win-gnu build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      # NOTE: no `targets:` — win-gnu is deliberately NOT added to the runner's
      # ~/.rustup, so the only place it can come from is soldr's provisioning.
      - name: Install Rust toolchain (host only)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.94.1

      - name: Setup soldr (managed home, like reld#66)
        uses: zackees/setup-soldr@62d1596b70168e422156f12273a2ed476d3a16dc
        with:
          version: 0.8.44
          toolchain: 1.94.1
          cache: false

      - name: Build soldr from this checkout (with the #2348 diagnostic)
        shell: bash
        run: soldr cargo build -p soldr-cli --bin soldr

      - name: Diagnose toolchain homes before the build
        shell: bash
        run: |
          set -x
          echo "RUSTUP_HOME=${RUSTUP_HOME:-<unset>} CARGO_HOME=${CARGO_HOME:-<unset>} RUSTUP_TOOLCHAIN=${RUSTUP_TOOLCHAIN:-<unset>}"
          rh="${RUSTUP_HOME:-$HOME/.rustup}"
          echo "--- toolchains in the managed home ---"
          ls -la "$rh/toolchains" || true
          for tc in "$rh"/toolchains/*/; do
            echo "=== $tc rustlib targets ==="
            ls "$tc/lib/rustlib" 2>/dev/null || true
            echo "  is-linked-file? $( [ -f "$tc" ] && echo yes || echo no )"
          done
          echo "--- MANUAL: rustup target add x86_64-pc-windows-gnu --toolchain 1.94.1 (RUSTUP_HOME=$rh) ---"
          RUSTUP_HOME="$rh" rustup target add x86_64-pc-windows-gnu --toolchain 1.94.1; echo "manual add exit=$?"
          echo "--- after manual add: rustlib targets ---"
          for tc in "$rh"/toolchains/*/; do echo "=== $tc ==="; ls "$tc/lib/rustlib" 2>/dev/null || true; done
          echo "--- rustup toolchain list ---"
          RUSTUP_HOME="$rh" rustup toolchain list || true

      - name: Cached win-gnu build with RELEASED 0.8.44 (reld#66 exact binary)
        shell: bash
        run: |
          set -x
          released="$(command -v soldr)"
          echo "released soldr = $released"
          "$released" --version || true
          work="$RUNNER_TEMP/fixture-released"
          mkdir -p "$work/src"
          cat > "$work/Cargo.toml" <<'EOF'
          [package]
          name = "wingnu-repro"
          version = "0.0.0"
          edition = "2021"
          [[bin]]
          name = "wingnu-repro"
          path = "src/main.rs"
          EOF
          echo 'fn main() { println!("ok"); }' > "$work/src/main.rs"
          cd "$work"
          "$released" build --target x86_64-pc-windows-gnu 2>&1 | tee "$RUNNER_TEMP/released.log" || true
          if grep -q 'E0463' "$RUNNER_TEMP/released.log"; then
            echo "RELEASED-0.8.44 REPRODUCED: E0463" >&2
          else
            echo "RELEASED-0.8.44: no E0463 (built ok)" >&2
          fi

      - name: Cached win-gnu build (the daemon path — repro target)
        id: build
        shell: bash
        run: |
          set -x
          work="$RUNNER_TEMP/fixture"
          mkdir -p "$work/src"
          cat > "$work/Cargo.toml" <<'EOF'
          [package]
          name = "wingnu-repro"
          version = "0.0.0"
          edition = "2021"
          [[bin]]
          name = "wingnu-repro"
          path = "src/main.rs"
          EOF
          echo 'fn main() { println!("ok"); }' > "$work/src/main.rs"
          cd "$work"
          # CACHED build (no --no-cache) — routes compiles through the daemon.
          # This runs the CHECKOUT soldr (with the #2348 fix), immediately after
          # the released 0.8.44 build above has poisoned the toolchain manifest.
          # RED->GREEN: released fails E0463; the fixed build must recover.
          "$GITHUB_WORKSPACE/target/debug/soldr" build --target x86_64-pc-windows-gnu 2>&1 | tee "$RUNNER_TEMP/build.log"
          echo "---- outcome ----"
          if grep -q 'E0463' "$RUNNER_TEMP/build.log"; then
            echo "FAIL: E0463 persisted with the fix" >&2
            exit 1
          fi
          exe="$work/target/x86_64-pc-windows-gnu/debug/wingnu-repro.exe"
          test -f "$exe"
          python3 "$GITHUB_WORKSPACE/.github/scripts/win_gnu_link_smoke.py" assert-pe --path "$exe"
          echo "PASS: fixed checkout build produced a PE after the poisoned released build"
