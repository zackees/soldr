name: win-gnu cache repro (#2348)

# Reproduces reld#66 / soldr#2348: a CACHED (daemon path) `soldr build
# --target x86_64-pc-windows-gnu` on a Linux host where the win-gnu rust-std
# lives only in the toolchain home soldr provisions — the win-gnu-smoke lane
# masks this with `--no-cache` (which bypasses the daemon) + a dtolnay
# pre-install of the target into the runner's ~/.rustup. Dispatch-only.

on:
  workflow_dispatch:
  # Temporary: run on push to the fix branch so the diagnostic can iterate
  # before the workflow exists on the default branch. Removed before merge.
  push:
    branches:
      - fix/win-gnu-rustup-home

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SOLDR_GITHUB_TOKEN: ${{ github.token }}
  SOLDR_DEBUG_COMPILE_ENV: "1"

jobs:
  repro:
    name: linux-host cached win-gnu build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      # NOTE: no `targets:` — win-gnu is deliberately NOT added to the runner's
      # ~/.rustup, so the only place it can come from is soldr's provisioning.
      - name: Install Rust toolchain (host only)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.94.1

      - name: Setup soldr (managed home, like reld#66)
        uses: zackees/setup-soldr@62d1596b70168e422156f12273a2ed476d3a16dc
        with:
          version: 0.8.44
          toolchain: 1.94.1
          cache: false

      - name: Build soldr from this checkout (with the #2348 diagnostic)
        shell: bash
        run: soldr cargo build -p soldr-cli --bin soldr

      - name: Poison the toolchain (rustup manifest lies, payload absent)
        shell: bash
        run: |
          set -euxo pipefail
          rh="${RUSTUP_HOME:-$HOME/.rustup}"
          tc="$rh/toolchains/1.94.1-x86_64-unknown-linux-gnu"
          payload="$tc/lib/rustlib/x86_64-pc-windows-gnu/lib"
          # Try a normal add; a solo-toolchain-cache restore may already have
          # left the poisoned state (manifest present, payload absent), in
          # which case this no-ops ("up to date").
          rustup target add x86_64-pc-windows-gnu --toolchain 1.94.1 || true
          if [ -d "$payload" ]; then
            # Clean state: poison it — delete the std payload but leave rustup's
            # installed-manifest intact (soldr#2348 = the exact cache-restore lie).
            rm -rf "$tc/lib/rustlib/x86_64-pc-windows-gnu"
            echo "poisoned: deleted the win-gnu payload, kept the manifest"
          else
            echo "already poisoned: payload absent (cache restored the lie)"
          fi
          # Prove the lie: rustup still lists it + add no-ops, but the rlibs are gone.
          rustup target list --installed --toolchain 1.94.1 | grep -q x86_64-pc-windows-gnu \
            && echo "manifest still lists win-gnu"
          rustup target add x86_64-pc-windows-gnu --toolchain 1.94.1 2>&1 | tee /tmp/reAdd.log || true
          grep -q 'up to date' /tmp/reAdd.log && echo "confirmed: rustup no-ops despite missing payload"
          [ ! -d "$payload" ] && echo "confirmed: win-gnu payload absent"
          echo "===== rustup tracking layout (soldr#2348 diagnosis) ====="
          echo "--- $tc/lib/rustlib listing ---"; ls -la "$tc/lib/rustlib/" || true
          echo "--- components file ---"; cat "$tc/lib/rustlib/components" 2>/dev/null || echo "(no components file)"
          echo "--- multirust-config.toml ---"; cat "$tc/lib/rustlib/multirust-config.toml" 2>/dev/null || echo "(no multirust-config)"
          echo "--- any file mentioning windows-gnu under the toolchain ---"
          grep -rl "x86_64-pc-windows-gnu" "$tc/lib/rustlib" 2>/dev/null | head || echo "(none)"
          true

      - name: Fixed build must recover (RED->GREEN for #2348)
        shell: bash
        env:
          SOLDR_DEBUG_COMPILE_ENV: "1"
          # #2348 is the std/toolchain-home E0463. Use the mingw gcc's own ld
          # (not soldr's default `fast` -> -fuse-ld=lld, which the cross gcc
          # can't resolve — a separate linker concern, reld#66 / soldr#2347).
          SOLDR_LINKER: platform-default
        run: |
          set -euxo pipefail
          work="$RUNNER_TEMP/fixture"
          mkdir -p "$work/src"
          cat > "$work/Cargo.toml" <<'EOF'
          [package]
          name = "wingnu-repro"
          version = "0.0.0"
          edition = "2021"
          [[bin]]
          name = "wingnu-repro"
          path = "src/main.rs"
          EOF
          echo 'fn main() { println!("ok"); }' > "$work/src/main.rs"
          cd "$work"
          # The checkout soldr carries the #2348 fix: rustup_add_target must
          # detect the empty libdir and force a remove+add reinstall, so the
          # build recovers instead of failing E0463.
          "$GITHUB_WORKSPACE/target/debug/soldr" build --target x86_64-pc-windows-gnu 2>&1 | tee "$RUNNER_TEMP/build.log"
          echo "---- outcome ----"
          grep -nE "dbg#2348|forcing a rustup reinstall|E0463" "$RUNNER_TEMP/build.log" || true
          if grep -q 'E0463' "$RUNNER_TEMP/build.log"; then
            echo "FAIL: E0463 persisted with the fix" >&2; exit 1
          fi
          grep -q 'forcing a rustup reinstall' "$RUNNER_TEMP/build.log" \
            || { echo "FAIL: the #2348 reinstall path did not trigger" >&2; exit 1; }
          exe="$work/target/x86_64-pc-windows-gnu/debug/wingnu-repro.exe"
          test -f "$exe"
          python3 "$GITHUB_WORKSPACE/.github/scripts/win_gnu_link_smoke.py" assert-pe --path "$exe"
          echo "PASS: fix re-materialized the std and produced a PE"
