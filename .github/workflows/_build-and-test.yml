name: _Build and Test

# Reusable template that captures the per-platform "build the
# workspace and run our smoke test suite" pattern. Callers in
# ci.yml materialise one top-level job per platform so each shows
# up as its own entry in the GitHub Actions sidebar (no matrix
# expansion, no `(arch)` suffix hidden behind a parent name).
#
# The pattern is intentionally the same shape as `_bootstrap-e2e.yml`
# (the existing reusable that handles soldr→third-party builds): one
# template, N explicit callers.

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      # soldr#1664 — `shared_key` input removed. It was `required: true`,
      # so every caller had to supply it, but the body never read it:
      # the cache step keys off `build-and-test-${{ inputs.target }}`
      # instead. Using it would have changed that key (busting the
      # existing cache) to express what `target` already expresses
      # uniquely, so removal is the honest fix. Same reasoning as the
      # two dead inputs below.
      # soldr#1218 — `run_fetch_test` input removed. It gated a
      # dedicated `cargo test --test fetch_crgx` step that duplicated
      # what `Run CLI smoke tests` already covers via `--tests`. The
      # separate step never actually skipped the fetch — smoke tests
      # ran it unconditionally regardless of this toggle.
      # soldr#1313 — `install_components` + `verify_windows_msys_default_msvc`
      # inputs removed. Only caller (build-linux-x64 in ci.yml) uses
      # ubuntu-24.04 and never set either input — both steps were dead.
      # If a future Windows caller lands, re-thread these inputs then.

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ inputs.target }}
    runs-on: ${{ inputs.runner }}
    # soldr#1985 - was inheriting GitHub's 360-minute default.
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      # soldr still fetches managed support tools from GitHub Releases.
      # Use soldr's explicit opt-in token env so release metadata requests
      # are authenticated without weakening the generic GITHUB_TOKEN guard.
      SOLDR_GITHUB_TOKEN: ${{ github.token }}
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      # soldr#1178 — dropped the dtolnay/rust-toolchain step: setup-soldr
      # below installs the same 1.94.1 toolchain, so running dtolnay
      # first duplicated ~8 s of install work per CI run. The host target
      # (x86_64-unknown-linux-gnu) is rustup's default so no explicit
      # `rustup target add` is required. Components are installed further
      # down via the "Install requested Rust components" step.
      #
      # soldr#1248/#2 follow-up: cache + soldr-cook stay disabled in
      # this general build/test template while target/profile-shaped
      # cook restore is reintroduced in the cross/release lanes first.
      # Swatinem/rust-cache remains the authoritative target/ restore.
      # soldr#1340 — pre-cache the 1.94.1 toolchain in ~/.rustup so
      # setup-soldr finds it via its "Runner rustup home already
      # contains toolchain X" check and skips its own 9 s rustup
      # install. On cache miss (first run at a new key) the install
      # step runs locally and populates ~/.rustup for the save.
      - name: Cache rustup 1.94.1 in ~/.rustup
        id: rustup_cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.rustup/toolchains/1.94.1-x86_64-unknown-linux-gnu
          key: rustup-1.94.1-linux-x64-v1

      - name: Install rustup 1.94.1 to ~/.rustup (if not cached)
        if: steps.rustup_cache.outputs.cache-hit != 'true'
        run: rustup toolchain install 1.94.1 --profile minimal --no-self-update

      - name: Setup soldr build cache
        uses: zackees/setup-soldr@922fe76752c37e46d63436b338fbe8cf3709bb69
        with:
          toolchain: 1.94.1
          cache: false
          zccache-seed-strict: true

      # soldr#1241 — cache ~/.cargo/{registry,git} + target/ so
      # `Build workspace + tests`, `Run library tests`, `Run CLI
      # smoke tests` don't recompile ~700 deps from scratch every
      # run. Same SHA-pinned action as #1228/#1233/#1236/#1238/#1240.
      - name: Restore cargo + target caches
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: build-and-test-${{ inputs.target }}

      # soldr#1335 — removed `Enable Windows line-table debug symbols`
      # + `Upload Windows test PDBs on failure`. Both gated on
      # `runner.os == 'Windows'`; the only caller (build-linux-x64 in
      # ci.yml) uses ubuntu-24.04, so both were dead. If a Windows
      # caller returns, both come back in one PR.

      # soldr#1254 — removed the "Restore checkout after soldr-cook"
      # step. setup-soldr's `cache: false` disables cook, so nothing
      # rewrites the workspace and `git restore --worktree -- .` was
      # 4-7 s of dead code.

      # soldr#1252 — removed the "Reset stale cache fallback artifacts"
      # step. Same rationale as the sibling in _bootstrap-e2e.yml:
      # setup-soldr's `cache: false` makes its restore-status never
      # `exact-hit`, so the guard tripped every run and the step
      # deleted `target/<triple>/` right after Swatinem/rust-cache
      # (#1242) restored it. rust-cache's own restore is authoritative.

      # soldr#1176 — build workspace bins AND test binaries in one pass.
      # Downstream `Run library tests` / `Run CLI smoke tests` steps then
      # find every artifact fresh in target/deps and skip rustc entirely
      # (cargo's freshness check hits, no compile). Saves the redundant
      # test-mode compile that used to happen twice (once here in non-
      # test mode, once again in each test step in test mode).
      - name: Build workspace + tests
        shell: pwsh
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          soldr cargo build --workspace --tests --bins --locked --target ${{ inputs.target }}
          $exitCode = $LASTEXITCODE
          $timer.Stop()
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ([string]::Format(
            [Globalization.CultureInfo]::InvariantCulture,
            "- **${{ inputs.target }} / Build workspace + tests**: {0:F3}s",
            $timer.Elapsed.TotalSeconds
          ))
          exit $exitCode

      # soldr#1799: an immediately-repeated build must recompile nothing.
      # Nothing changed in between, so any crate rebuilding means something
      # invalidated cargo's fingerprints -- a toolchain-home flip or a
      # compiler-path change -- which is the silent 10-50x slowdown this issue
      # exists to catch. A warm repeat is sub-second, so this is cheap; if it
      # is NOT warm the step is exactly what should report that.
      - name: Assert a repeated build recompiles nothing (soldr#1799)
        if: success()
        continue-on-error: ${{ !contains(inputs.target, 'linux-gnu') }}
        shell: pwsh
        run: |
          soldr cargo build --workspace --tests --bins --locked --target ${{ inputs.target }} `
            *> warm-rebuild.log
          Get-Content warm-rebuild.log | Select-Object -Last 20
          python3 .github/scripts/check_warm_rebuild.py warm-rebuild.log

      # soldr#1838 Phase 4: fail the lane when the build silently ran uncached
      # via the direct compiler. `soldr status --json` surfaces the same
      # compile-daemon fallback rollup operators see (default home = the one the
      # build above used); the guard reads it and exits non-zero on any
      # fallback. Hard-fail only on the native linux-gnu lane, whose daemon is
      # reliable; advisory elsewhere so a flaky Windows/macOS daemon race
      # surfaces in the log without gating the build. Until now this was a
      # stderr line nothing asserted on.
      - name: Assert the build did not silently run uncached (soldr#1838)
        if: success()
        continue-on-error: ${{ !contains(inputs.target, 'linux-gnu') }}
        shell: pwsh
        run: |
          soldr status --json > soldr-status.json
          python3 .github/scripts/check_compile_fallbacks.py soldr-status.json

      # soldr#1799: fail the lane if soldr's managed toolchain homes leaked onto
      # a host-resolved tool (the #1768 bug). It never fails loudly -- it flips
      # which rustc runs, invalidating cargo fingerprints and zccache keys, so
      # warm builds silently recompile the world. The build log already records
      # `home_origin` beside the resolved `binary`; this asserts the pair.
      # Unconditional, unlike the #1838 guard above. That one is advisory off
      # linux-gnu for a stated reason -- a flaky Windows/macOS daemon race
      # should surface in the log without gating the build. This check has no
      # such platform story: `home_origin` correctness is the invariant in
      # CLAUDE.md ("one canonical toolchain-home pair per execution, chosen by
      # where the binary lives"), and it holds on every platform. The advisory
      # expression here was the neighbour's, not a decision.
      #
      # It is dead today either way -- ci.yml is the only caller and passes
      # x86_64-unknown-linux-gnu, so the expression is always false. The point
      # is that adding a Windows or macOS caller would silently downgrade this
      # to advisory, and soldr#1799 exists precisely because a home leak never
      # fails loudly: it flips which rustc runs, invalidating cargo
      # fingerprints and zccache keys, so warm builds silently recompile the
      # world. A guard that quietly stops guarding is how that got missed once
      # already.
      - name: Assert managed toolchain homes did not leak (soldr#1799)
        if: success()
        shell: pwsh
        run: |
          python3 .github/scripts/check_toolchain_homes.py "$HOME/.soldr/logs/builds" `
            --managed-root "$HOME/.soldr" --managed-root "$HOME/.soldr-dev"

      - name: Stop setup-soldr builder cache before tests
        uses: zackees/setup-soldr/cleanup@922fe76752c37e46d63436b338fbe8cf3709bb69

      # soldr#1324/#1703 — run every workspace library and integration binary
      # in one invocation. This includes the internal crates extracted after
      # the original single-crate optimization was written.
      #
      # NOTE: this step uses setup-soldr's `soldr` (from PATH), the
      # same wrapper as `Build workspace + tests` above. Historically
      # it invoked the just-built `target/<triple>/debug/soldr` binary
      # to dogfood the fresh build, but that swapped `RUSTC_WRAPPER` to
      # a different path than step 1 used. cargo hashes the wrapper
      # path into per-crate fingerprints, so the swap invalidated every
      # rlib and forced a full recompile (~1m 27s on the linux-x64
      # lane, main run 28760796620). Keeping the wrapper stable lets
      # cargo's freshness check hit and skip rustc entirely. The
      # isolated SOLDR_CACHE_DIR / ZCCACHE_CACHE_DIR still land via
      # the env block, so tests stay isolated from the shared CI seed.
      - name: Run library + CLI smoke tests
        shell: pwsh
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/soldr-self-tests/${{ inputs.target }}
          SOLDR_CACHE_LIFECYCLE: command
          SOLDR_CACHE_SHUTDOWN_TIMEOUT_SECS: "30"
          ZCCACHE_CACHE_DIR: ${{ runner.temp }}/soldr-self-tests/${{ inputs.target }}/cache/zccache
        run: |
          Write-Host "Using isolated test SOLDR_CACHE_DIR=$env:SOLDR_CACHE_DIR"
          Write-Host "Using isolated test ZCCACHE_CACHE_DIR=$env:ZCCACHE_CACHE_DIR"
          $timer = [Diagnostics.Stopwatch]::StartNew()
          soldr cargo test --workspace --lib --tests --locked --target ${{ inputs.target }}
          $exitCode = $LASTEXITCODE
          $timer.Stop()
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ([string]::Format(
            [Globalization.CultureInfo]::InvariantCulture,
            "- **${{ inputs.target }} / Library + smoke tests**: {0:F3}s",
            $timer.Elapsed.TotalSeconds
          ))
          exit $exitCode

      # soldr#1218 — the standalone `Run fetch integration test` step
      # was removed; the same `tests/fetch_crgx.rs` binary already runs
      # inside `Run CLI smoke tests` above (which invokes `cargo test
      # -p soldr-cli --tests` — `--tests` selects every integration test
      # target). Running it twice wasted ~40 s per CI run for zero
      # additional coverage.

      - name: Stop isolated test cache
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/soldr-self-tests/${{ inputs.target }}
          ZCCACHE_CACHE_DIR: ${{ runner.temp }}/soldr-self-tests/${{ inputs.target }}/cache/zccache
        run: |
          soldr cache shutdown --shutdown-timeout-seconds 30
          if ($LASTEXITCODE -ne 0) {
            soldr zccache stop
          }

      # soldr#1799 — surface the per-build XML logs and the JSONL compile
      # journals from CI compiles so toolchain-home leakage and warm-run
      # recompile storms are diagnosable straight from the Actions UI.
      # Printed as two separate steps (XML vs JSONL/JSON) and uploaded as
      # a downloadable artifact. Roots covered: the default soldr homes
      # (~/.soldr, ~/.soldr-dev) used by the build step, and the isolated
      # SOLDR_CACHE_DIR tree used by the test steps.
      - name: Print build XML logs
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $roots = @("$HOME/.soldr", "$HOME/.soldr-dev", "${{ runner.temp }}/soldr-self-tests")
          $files = @($roots | Where-Object { Test-Path $_ } | ForEach-Object {
            Get-ChildItem -Path $_ -Recurse -Filter *.xml -ErrorAction SilentlyContinue
          } | Where-Object { $_.DirectoryName -match 'logs' })
          if ($files.Count -eq 0) { Write-Host 'No build XML logs found.' }
          foreach ($f in $files) {
            Write-Host "===== $($f.FullName) ====="
            Get-Content $f.FullName
          }

      - name: Print JSONL compile journals
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $roots = @("$HOME/.soldr", "$HOME/.soldr-dev", "${{ runner.temp }}/soldr-self-tests")
          $files = @($roots | Where-Object { Test-Path $_ } | ForEach-Object {
            Get-ChildItem -Path $_ -Recurse -Include *.jsonl, *.stats.json -ErrorAction SilentlyContinue
          } | Where-Object { $_.DirectoryName -match 'logs' })
          if ($files.Count -eq 0) { Write-Host 'No JSONL compile journals found.' }
          foreach ($f in $files) {
            Write-Host "===== $($f.FullName) ====="
            Get-Content $f.FullName
          }

      - name: Upload build log artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-logs-${{ inputs.target }}
          if-no-files-found: ignore
          path: |
            ~/.soldr/logs/
            ~/.soldr-dev/logs/
            ~/.soldr/cache/zccache/logs/
            ~/.soldr-dev/cache/zccache/logs/
            ${{ runner.temp }}/soldr-self-tests/**/logs/
