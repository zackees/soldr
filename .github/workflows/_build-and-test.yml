name: _Build and Test

# Reusable template that captures the per-platform "build the
# workspace and run our smoke test suite" pattern. Callers in
# ci.yml materialise one top-level job per platform so each shows
# up as its own entry in the GitHub Actions sidebar (no matrix
# expansion, no `(arch)` suffix hidden behind a parent name).
#
# The pattern is intentionally the same shape as `_bootstrap-e2e.yml`
# (the existing reusable that handles soldr→third-party builds): one
# template, N explicit callers.

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      shared_key:
        # setup-soldr cache key suffix base; usually the platform-arch pair
        # (e.g. "windows-x86_64-msvc").
        required: true
        type: string
      cache_key:
        # Optional extra key segment so two callers on the same
        # platform (e.g. workspace build vs. lint) don't collide
        # inside the same shared-key bucket.
        required: false
        type: string
        default: ''
      # soldr#1218 — `run_fetch_test` input removed. It gated a
      # dedicated `cargo test --test fetch_crgx` step that duplicated
      # what `Run CLI smoke tests` already covers via `--tests`. The
      # separate step never actually skipped the fetch — smoke tests
      # ran it unconditionally regardless of this toggle.
      install_components:
        # Comma-separated rustup components (e.g. "rustfmt,clippy").
        # Empty by default; Windows callers pass the components they
        # need on the build runner.
        required: false
        type: string
        default: ''
      verify_windows_msys_default_msvc:
        # Windows-x64 only: regression guard from
        # .github/scripts/windows-msys-default-msvc.sh. Other
        # platforms have no equivalent.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ inputs.target }}
    runs-on: ${{ inputs.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      # Managed zccache is fetched from zackees/zccache, which is a
      # cross-repo GitHub Releases lookup from this workflow. Use soldr's
      # explicit opt-in token env so release metadata requests are
      # authenticated without weakening the generic GITHUB_TOKEN guard.
      SOLDR_GITHUB_TOKEN: ${{ github.token }}
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      # soldr#1178 — dropped the dtolnay/rust-toolchain step: setup-soldr
      # below installs the same 1.94.1 toolchain, so running dtolnay
      # first duplicated ~8 s of install work per CI run. The host target
      # (x86_64-unknown-linux-gnu) is rustup's default so no explicit
      # `rustup target add` is required. Components are installed further
      # down via the "Install requested Rust components" step.
      #
      # soldr#1083 follow-up: cache + soldr-cook disabled. Cook
      # rewrites the workspace manifest in ways incompatible with
      # cross-compile lanes; save cost no longer justifies. Pure
      # toolchain install via setup-soldr.
      - name: Setup soldr build cache
        id: setup_soldr
        uses: zackees/setup-soldr@cca74625e75e70b56f1805fa6eeee9069f945d48
        with:
          toolchain: 1.94.1
          cache: false
          zccache-seed-strict: true

      # soldr#1241 — cache ~/.cargo/{registry,git} + target/ so
      # `Build workspace + tests`, `Run library tests`, `Run CLI
      # smoke tests` don't recompile ~700 deps from scratch every
      # run. Same SHA-pinned action as #1228/#1233/#1236/#1238/#1240.
      - name: Restore cargo + target caches
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: build-and-test-${{ inputs.target }}

      - name: Enable Windows line-table debug symbols
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CARGO_PROFILE_DEV_DEBUG=line-tables-only" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_PROFILE_TEST_DEBUG=line-tables-only" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore checkout after soldr-cook
        shell: pwsh
        run: git restore --worktree -- .

      # soldr#1252 — removed the "Reset stale cache fallback artifacts"
      # step. Same rationale as the sibling in _bootstrap-e2e.yml:
      # setup-soldr's `cache: false` (#1083) makes its restore-status
      # never `exact-hit`, so the guard tripped every run and the step
      # deleted `target/<triple>/` right after Swatinem/rust-cache
      # (#1242) restored it. rust-cache's own restore is authoritative.

      - name: Install requested Rust components
        if: inputs.install_components != ''
        shell: pwsh
        run: |
          $components = "${{ inputs.install_components }}" -split "," |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ }
          foreach ($component in $components) {
            rustup component add $component
          }

      # soldr#1176 — build workspace bins AND test binaries in one pass.
      # Downstream `Run library tests` / `Run CLI smoke tests` steps then
      # find every artifact fresh in target/deps and skip rustc entirely
      # (cargo's freshness check hits, no compile). Saves the redundant
      # test-mode compile that used to happen twice (once here in non-
      # test mode, once again in each test step in test mode).
      - name: Build workspace + tests
        shell: pwsh
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          soldr cargo build --workspace --tests --bins --locked --target ${{ inputs.target }}
          $exitCode = $LASTEXITCODE
          $timer.Stop()
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ([string]::Format(
            [Globalization.CultureInfo]::InvariantCulture,
            "- **${{ inputs.target }} / Build workspace + tests**: {0:F3}s",
            $timer.Elapsed.TotalSeconds
          ))
          exit $exitCode

      - name: Resolve built soldr binary
        shell: pwsh
        run: |
          $exeName = if ($IsWindows) { "soldr.exe" } else { "soldr" }
          $soldrPath = Join-Path $env:GITHUB_WORKSPACE "target/${{ inputs.target }}/debug/$exeName"
          if (-not (Test-Path -LiteralPath $soldrPath)) {
            throw "built soldr binary not found at $soldrPath"
          }
          "LOCAL_SOLDR=$soldrPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stop setup-soldr builder cache before tests
        uses: zackees/setup-soldr/cleanup@cca74625e75e70b56f1805fa6eeee9069f945d48

      - name: Run library tests
        shell: pwsh
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/soldr-self-tests/${{ inputs.target }}
          SOLDR_CACHE_LIFECYCLE: command
          SOLDR_CACHE_SHUTDOWN_TIMEOUT_SECS: "30"
          ZCCACHE_CACHE_DIR: ${{ runner.temp }}/soldr-self-tests/${{ inputs.target }}/cache/zccache
        run: |
          Write-Host "Using isolated test SOLDR_CACHE_DIR=$env:SOLDR_CACHE_DIR"
          Write-Host "Using isolated test ZCCACHE_CACHE_DIR=$env:ZCCACHE_CACHE_DIR"
          $timer = [Diagnostics.Stopwatch]::StartNew()
          & $env:LOCAL_SOLDR cargo test --workspace --lib --locked --target ${{ inputs.target }}
          $exitCode = $LASTEXITCODE
          $timer.Stop()
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ([string]::Format(
            [Globalization.CultureInfo]::InvariantCulture,
            "- **${{ inputs.target }} / Library tests**: {0:F3}s",
            $timer.Elapsed.TotalSeconds
          ))
          exit $exitCode

      - name: Run CLI smoke tests
        shell: pwsh
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/soldr-self-tests/${{ inputs.target }}
          SOLDR_CACHE_LIFECYCLE: command
          SOLDR_CACHE_SHUTDOWN_TIMEOUT_SECS: "30"
          ZCCACHE_CACHE_DIR: ${{ runner.temp }}/soldr-self-tests/${{ inputs.target }}/cache/zccache
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          & $env:LOCAL_SOLDR cargo test -p soldr-cli --tests --locked --target ${{ inputs.target }}
          $exitCode = $LASTEXITCODE
          $timer.Stop()
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ([string]::Format(
            [Globalization.CultureInfo]::InvariantCulture,
            "- **${{ inputs.target }} / CLI smoke tests**: {0:F3}s",
            $timer.Elapsed.TotalSeconds
          ))
          exit $exitCode

      - name: Verify Windows defaults to MSVC under Git Bash
        if: inputs.verify_windows_msys_default_msvc == true && runner.os == 'Windows'
        shell: bash
        env:
          # The build step above passes `--target ${{ inputs.target }}`, so cargo
          # writes the binary to `target/<triple>/debug/`, not `target/debug/`.
          # The script defaults to the no-target path; point it at the
          # matrix-aware location explicitly. See issue #418.
          SOLDR_EXE: ${{ github.workspace }}\target\${{ inputs.target }}\debug\soldr.exe
        run: bash .github/scripts/windows-msys-default-msvc.sh

      # soldr#1218 — the standalone `Run fetch integration test` step
      # was removed; the same `tests/fetch_crgx.rs` binary already runs
      # inside `Run CLI smoke tests` above (which invokes `cargo test
      # -p soldr-cli --tests` — `--tests` selects every integration test
      # target). Running it twice wasted ~40 s per CI run for zero
      # additional coverage.

      - name: Upload Windows test PDBs on failure
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-test-pdbs-${{ inputs.target }}
          path: |
            target/${{ inputs.target }}/debug/**/*.pdb
            target/debug/**/*.pdb
          if-no-files-found: warn

      - name: Stop isolated test cache
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/soldr-self-tests/${{ inputs.target }}
          ZCCACHE_CACHE_DIR: ${{ runner.temp }}/soldr-self-tests/${{ inputs.target }}/cache/zccache
        run: |
          & $env:LOCAL_SOLDR cache shutdown --shutdown-timeout-seconds 30
          if ($LASTEXITCODE -ne 0) {
            zccache stop
          }
