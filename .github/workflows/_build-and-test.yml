name: _Build and Test

# Reusable template that captures the per-platform "build the
# workspace and run our smoke test suite" pattern. Callers in
# ci.yml materialise one top-level job per platform so each shows
# up as its own entry in the GitHub Actions sidebar (no matrix
# expansion, no `(arch)` suffix hidden behind a parent name).
#
# The pattern is intentionally the same shape as `_bootstrap-e2e.yml`
# (the existing reusable that handles soldr→third-party builds): one
# template, N explicit callers.

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      shared_key:
        # setup-soldr cache key suffix base; usually the platform-arch pair
        # (e.g. "windows-x86_64-msvc").
        required: true
        type: string
      cache_key:
        # Optional extra key segment so two callers on the same
        # platform (e.g. workspace build vs. lint) don't collide
        # inside the same shared-key bucket.
        required: false
        type: string
        default: ''
      run_fetch_test:
        # The crates.io fetch integration test (tests/fetch_crgx.rs in
        # the monocrate soldr-cli) is heavy and not platform-
        # conditional. Disable when a caller only wants the unit-test
        # sweep.
        required: false
        type: boolean
        default: true
      install_components:
        # Comma-separated rustup components (e.g. "rustfmt,clippy").
        # Empty by default; Windows callers pass the components they
        # need on the build runner.
        required: false
        type: string
        default: ''
      verify_windows_msys_default_msvc:
        # Windows-x64 only: regression guard from
        # .github/scripts/windows-msys-default-msvc.sh. Other
        # platforms have no equivalent.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ inputs.target }}
    runs-on: ${{ inputs.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.94.1
          targets: ${{ inputs.target }}
          components: ${{ inputs.install_components }}

      - name: Setup soldr build cache
        id: setup_soldr
        uses: zackees/setup-soldr@be9cd32c413a696e85c13eaeef25400666dd5317
        with:
          toolchain: 1.94.1
          cache: true
          zccache-seed-strict: true
          cache-key-suffix: build-${{ inputs.shared_key }}-${{ inputs.cache_key }}
          prebuild-deps: soldr-cook
          prebuild-deps-flags: "--target ${{ inputs.target }}"

      - name: Restore checkout after soldr-cook
        shell: pwsh
        run: git restore --worktree -- .

      - name: Reset stale cache fallback artifacts
        if: >-
          ${{
            steps.setup_soldr.outputs.build-cache-restore-status != 'exact-hit' ||
            steps.setup_soldr.outputs.target-cache-restore-status != 'exact-hit'
          }}
        shell: pwsh
        run: |
          Write-Host "Disabling target-cache for later steps after a fallback setup-soldr restore."
          "SOLDR_TARGET_CACHE_MODE=off" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $targetTripleDir = Join-Path "target" "${{ inputs.target }}"
          if (Test-Path -LiteralPath $targetTripleDir) {
            Write-Host "Removing restored target artifacts from $targetTripleDir"
            Remove-Item -LiteralPath $targetTripleDir -Recurse -Force
          }

          $artifactDir = Join-Path $env:ZCCACHE_CACHE_DIR "artifacts"
          if (Test-Path -LiteralPath $artifactDir) {
            Write-Host "Removing restored zccache artifacts from $artifactDir"
            Remove-Item -LiteralPath $artifactDir -Recurse -Force
          }

      - name: Install requested Rust components
        if: inputs.install_components != ''
        shell: pwsh
        run: |
          $components = "${{ inputs.install_components }}" -split "," |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ }
          foreach ($component in $components) {
            rustup component add $component
          }

      - name: Build workspace
        shell: pwsh
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          soldr cargo build --workspace --locked --target ${{ inputs.target }}
          $exitCode = $LASTEXITCODE
          $timer.Stop()
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ([string]::Format(
            [Globalization.CultureInfo]::InvariantCulture,
            "- **${{ inputs.target }} / Build workspace**: {0:F3}s",
            $timer.Elapsed.TotalSeconds
          ))
          exit $exitCode

      - name: Resolve built soldr binary
        shell: pwsh
        run: |
          $exeName = if ($IsWindows) { "soldr.exe" } else { "soldr" }
          $soldrPath = Join-Path $env:GITHUB_WORKSPACE "target/${{ inputs.target }}/debug/$exeName"
          if (-not (Test-Path -LiteralPath $soldrPath)) {
            throw "built soldr binary not found at $soldrPath"
          }
          "LOCAL_SOLDR=$soldrPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Stop setup-soldr builder cache before tests
        uses: zackees/setup-soldr/cleanup@be9cd32c413a696e85c13eaeef25400666dd5317

      - name: Run library tests
        shell: pwsh
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/soldr-self-tests/${{ inputs.target }}
          SOLDR_CACHE_LIFECYCLE: command
          SOLDR_CACHE_SHUTDOWN_TIMEOUT_SECS: "30"
          ZCCACHE_CACHE_DIR: ${{ runner.temp }}/soldr-self-tests/${{ inputs.target }}/cache/zccache
        run: |
          Write-Host "Using isolated test SOLDR_CACHE_DIR=$env:SOLDR_CACHE_DIR"
          Write-Host "Using isolated test ZCCACHE_CACHE_DIR=$env:ZCCACHE_CACHE_DIR"
          $timer = [Diagnostics.Stopwatch]::StartNew()
          & $env:LOCAL_SOLDR cargo test --workspace --lib --locked --target ${{ inputs.target }}
          $exitCode = $LASTEXITCODE
          $timer.Stop()
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ([string]::Format(
            [Globalization.CultureInfo]::InvariantCulture,
            "- **${{ inputs.target }} / Library tests**: {0:F3}s",
            $timer.Elapsed.TotalSeconds
          ))
          exit $exitCode

      - name: Run CLI smoke tests
        shell: pwsh
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/soldr-self-tests/${{ inputs.target }}
          SOLDR_CACHE_LIFECYCLE: command
          SOLDR_CACHE_SHUTDOWN_TIMEOUT_SECS: "30"
          ZCCACHE_CACHE_DIR: ${{ runner.temp }}/soldr-self-tests/${{ inputs.target }}/cache/zccache
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          & $env:LOCAL_SOLDR cargo test -p soldr-cli --tests --locked --target ${{ inputs.target }}
          $exitCode = $LASTEXITCODE
          $timer.Stop()
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ([string]::Format(
            [Globalization.CultureInfo]::InvariantCulture,
            "- **${{ inputs.target }} / CLI smoke tests**: {0:F3}s",
            $timer.Elapsed.TotalSeconds
          ))
          exit $exitCode

      - name: Verify Windows defaults to MSVC under Git Bash
        if: inputs.verify_windows_msys_default_msvc == true && runner.os == 'Windows'
        shell: bash
        env:
          # The build step above passes `--target ${{ inputs.target }}`, so cargo
          # writes the binary to `target/<triple>/debug/`, not `target/debug/`.
          # The script defaults to the no-target path; point it at the
          # matrix-aware location explicitly. See issue #418.
          SOLDR_EXE: ${{ github.workspace }}\target\${{ inputs.target }}\debug\soldr.exe
        run: bash .github/scripts/windows-msys-default-msvc.sh

      - name: Run fetch integration test
        if: inputs.run_fetch_test == true
        shell: pwsh
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/soldr-self-tests/${{ inputs.target }}
          SOLDR_CACHE_LIFECYCLE: command
          SOLDR_CACHE_SHUTDOWN_TIMEOUT_SECS: "30"
          ZCCACHE_CACHE_DIR: ${{ runner.temp }}/soldr-self-tests/${{ inputs.target }}/cache/zccache
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          & $env:LOCAL_SOLDR cargo test -p soldr-cli --test fetch_crgx --locked --target ${{ inputs.target }}
          $exitCode = $LASTEXITCODE
          $timer.Stop()
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ([string]::Format(
            [Globalization.CultureInfo]::InvariantCulture,
            "- **${{ inputs.target }} / Fetch integration test**: {0:F3}s",
            $timer.Elapsed.TotalSeconds
          ))
          exit $exitCode

      - name: Stop isolated test cache
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/soldr-self-tests/${{ inputs.target }}
          ZCCACHE_CACHE_DIR: ${{ runner.temp }}/soldr-self-tests/${{ inputs.target }}/cache/zccache
        run: |
          & $env:LOCAL_SOLDR cache shutdown --shutdown-timeout-seconds 30
          if ($LASTEXITCODE -ne 0) {
            zccache stop
          }
