name: _Build and Test

# Reusable template that bootstraps the source CLI and runs its prescribed
# host-validation plan. Callers in
# ci.yml materialise one top-level job per platform so each shows
# up as its own entry in the GitHub Actions sidebar (no matrix
# expansion, no `(arch)` suffix hidden behind a parent name).
#
# The pattern is intentionally the same shape as `_bootstrap-e2e.yml`
# (the existing reusable that handles soldr→third-party builds): one
# template, N explicit callers.

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      source_driver_artifact_name:
        description: >-
          Same-run exact-SHA Soldr driver to reuse only when already available.
          Missing or invalid artifacts fall back to the local source build.
        required: false
        type: string
        default: ""
      # soldr#1664 — `shared_key` input removed. It was `required: true`,
      # so every caller had to supply it, but the body never read it:
      # the cache step keys off `build-and-test-${{ inputs.target }}`
      # instead. Using it would have changed that key (busting the
      # existing cache) to express what `target` already expresses
      # uniquely, so removal is the honest fix. Same reasoning as the
      # two dead inputs below.
      # soldr#1218 — `run_fetch_test` input removed. It gated a
      # dedicated `cargo test --test fetch_tools fetch_crgx::` step (then
      # spelled `--test fetch_crgx`, before soldr#2934 grouped the
      # soldr-cli integration tests into category targets) that duplicated
      # what `Run CLI smoke tests` already covers via `--tests`. The
      # separate step never actually skipped the fetch — smoke tests
      # ran it unconditionally regardless of this toggle.
      # soldr#1313 — `install_components` + `verify_windows_msys_default_msvc`
      # inputs removed. Only caller (build-linux-x64 in ci.yml) uses
      # ubuntu-24.04 and never set either input — both steps were dead.
      # If a future Windows caller lands, re-thread these inputs then.

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ inputs.target }}
    runs-on: ${{ inputs.runner }}
    # soldr#1985 - was inheriting GitHub's 360-minute default.
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      # soldr still fetches managed support tools from GitHub Releases.
      # Use soldr's explicit opt-in token env so release metadata requests
      # are authenticated without weakening the generic GITHUB_TOKEN guard.
      SOLDR_GITHUB_TOKEN: ${{ github.token }}
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: always
      # zccache 1.13.17+ gives registered Rust amalgamations and large native
      # C/C++ units exclusive compiler admission. Keep Cargo/Soldr job counts
      # unset: ordinary compilation uses the hosted runner's full parallelism,
      # while known heavyweight units run alone. An OOM is an admission bug,
      # not a reason to cap the entire host-validation DAG.
      # soldr#2996 Phase 8, measured over 3 runs against 6 baseline runs.
      #
      # Expectations are bounded: the hot modules stay serial within
      # .config/nextest.toml's test groups. Windows-target cold builds retain
      # full-pool reservation; native Linux permits unrelated tests beside
      # the one-at-a-time cold-build family. Compiler work launched by those
      # tests still enters Soldr's canonical shared/exclusive admission gate.
      #
      # Median nextest stage: 1,441,985 ms at 1 thread (6 samples) ->
      # 1,200,200 ms at 2 (3 samples), a 4.0 min saving, with every
      # threads=2 sample faster than every baseline sample and zero TIMEOUT
      # lines. soldr#3024 now measures 4 threads after compiler-admission and
      # Cargo-orchestration OOM fixes; an OOM is a Soldr scheduling defect.
      NEXTEST_TEST_THREADS: "4"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Enlarge swap (OOM headroom)
        if: runner.os == 'Linux'
        shell: bash
        run: bash .github/scripts/setup_ci_swap.sh

      # soldr#1178 — dropped the dtolnay/rust-toolchain step: setup-soldr
      # below installs the same 1.95.0 toolchain, so running dtolnay
      # first duplicated ~8 s of install work per CI run. The host target
      # (x86_64-unknown-linux-gnu) is rustup's default so no explicit
      # `rustup target add` is required. Components are installed further
      # down via the "Install requested Rust components" step.
      #
      # soldr#2996: cook was not yet wired into this lane, and
      # Swatinem/rust-cache was the target/ restore in use here -- but it was
      # removed in soldr#3047, not kept. Its `ws-dev-*` key held 2.15 GiB
      # across 5 entries for a 0% hit rate (its environment hash covered every
      # toolchain in `rustup toolchain list`, so it flipped with the Dylint
      # nightly). The replacement is the Tier-2 object store in soldr#3041
      # plus the workflow-level `soldr cook` step in soldr#3043.
      # The older soldr#1248 wording here claimed cook restore was being
      # "reintroduced in the cross/release lanes first"; that has pointed the
      # wrong way since soldr#2867.
      # soldr#1340 — pre-cache the 1.95.0 toolchain in ~/.rustup so
      # setup-soldr finds it via its "Runner rustup home already
      # contains toolchain X" check and skips its own 9 s rustup
      # install. On cache miss (first run at a new key) the install
      # step runs locally and populates ~/.rustup for the save.
      - name: Cache rustup 1.95.0 in ~/.rustup
        id: rustup_cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.rustup/toolchains/1.95.0-x86_64-unknown-linux-gnu
          key: rustup-1.95.0-linux-x64-v1

      - name: Install rustup 1.95.0 to ~/.rustup (if not cached)
        if: steps.rustup_cache.outputs.cache-hit != 'true'
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update

      # soldr#1799: pin the soldr that builds us. This prevents action-default
      # drift from changing build or catalogue behavior between lanes.
      - name: Setup pinned soldr toolchain
        uses: zackees/setup-soldr@5f1f68dcb8377818413c28ce52214261ae8ff771
        with:
          version: 0.9.10
          toolchain: 1.95.0
          # Provision the ci-test Dylint foundation once, separately from
          # the stable source-driver target tree used by the prescribed DAG.
          ci-tests: true
          dylint-toolchain: nightly-2026-05-28
          cargo-dylint-version: 6.0.3
          dylint-link-version: 6.0.3
          # soldr#2451: disable every setup-soldr reuse layer, not just the
          # `cache` umbrella (soldr-mini / solo-toolchain / build-cache each
          # ignore it). This lane builds + tests the soldr under test, so it
          # must never restore a prebuilt soldr binary.
          cache: false
          build-cache: false
          target-cache: false
          cargo-registry-cache: false
          soldr-mini-cache: false
          solo-toolchain-cache: false
          zccache-seed-strict: true

      - name: Install ci-test Rust components
        run: soldr rustup component add rustfmt clippy

      # Keep every host-side invocation in one isolated Soldr domain. The
      # setup action selects its own cache root while it installs the pinned
      # builder; exporting this before the first workspace build makes the
      # build, warm checks, status, cleanup, nextest, and final shutdown use
      # one wrapper path and one compiler cache.
      #
      # soldr#3040 needs cargo's own freshness signal because the zccache
      # journal cannot see a unit cargo never sent to rustc. This level logs
      # one line per DIRTY unit (cargo's `Fresh` status lines need `-v`,
      # which ci-test does not pass, so Fresh is inferred from the
      # lockfile, not from this log). Nested cargo fixtures under nextest
      # inherit the variable, so their dirty lines land in the same capture
      # — report-only contamination, named deliberately.
      - name: Select canonical host CI cache domain
        shell: bash
        run: |
          echo "SOLDR_CACHE_DIR=${{ runner.temp }}/soldr-host-ci/${{ inputs.target }}" >> "$GITHUB_ENV"
          echo "ZCCACHE_CACHE_DIR=${{ runner.temp }}/soldr-host-ci/${{ inputs.target }}/cache/zccache" >> "$GITHUB_ENV"
          echo "SOLDR_CACHE_LIFECYCLE=command" >> "$GITHUB_ENV"
          echo "SOLDR_CACHE_SHUTDOWN_TIMEOUT_SECS=30" >> "$GITHUB_ENV"
          echo "CARGO_LOG=cargo::core::compiler::fingerprint=info" >> "$GITHUB_ENV"

      # soldr#3039 Phase 0 (soldr#3041): the Tier-2 per-unit object store
      # under this canonical domain is the only compiler cache this lane has,
      # and `runner.temp` discarded it every run -- 1,447 of 1,567 compiles
      # missed with `context_not_found` in the run-33536940076 baseline. The
      # step above exists for ISOLATION (one domain, one wrapper, one compiler
      # cache), not for ephemerality, so persisting it changes nothing about
      # that contract, and no setup-soldr reuse layer is re-enabled
      # (soldr#2451 toggles are untouched).
      #
      # Path shape is a deliberate reference fix against soldr#3041's literal
      # text, recorded in soldr#3039: the issue proposed caching
      # `cache/zccache` with `!.../logs` and `!.../history` negations.
      # actions/cache globs `path` with `implicitDescendants: false` and then
      # hands the matched DIRECTORY to tar, which recurses -- so a `!subdir`
      # negation removes nothing, the compile journals would ride along, every
      # warm-run measurement would double-count prior runs, and the entry would
      # grow without bound. Positive selection is exact instead: the embedded
      # service's object store lives under
      # `cache/zccache/daemon-state/embedded-v1/v<VERSION>/`
      # (crates/soldr-daemon/src/zccache_embedded.rs), while the journals
      # (`cache/zccache/history/`) and session logs (`cache/zccache/logs/`)
      # that `Upload build log artifacts` ships are siblings OUTSIDE it.
      #
      # The `github.run_id` suffix plus `restore-keys` is load-bearing:
      # actions/cache never re-saves on an exact-key hit, so a key without it
      # freezes the store after the first save. The lockfile+toolchain hash
      # prefers a same-graph entry; the bare prefix still restores something
      # after a dependency bump. The save runs in the post-step, after
      # `Stop canonical host CI cache` has flushed the daemon.
      - name: Restore Tier-2 zccache object store (soldr#3039)
        id: zccache_unit_store
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/soldr-host-ci/${{ inputs.target }}/cache/zccache/daemon-state
          key: zccache-unit-v1-${{ inputs.target }}-${{ hashFiles('Cargo.lock', 'dylints/**/Cargo.lock', 'rust-toolchain.toml', 'dylints/**/rust-toolchain.toml') }}-${{ github.run_id }}
          restore-keys: |
            zccache-unit-v1-${{ inputs.target }}-${{ hashFiles('Cargo.lock', 'dylints/**/Cargo.lock', 'rust-toolchain.toml', 'dylints/**/rust-toolchain.toml') }}-
            zccache-unit-v1-${{ inputs.target }}-

      # soldr#1335 — removed `Enable Windows line-table debug symbols`
      # + `Upload Windows test PDBs on failure`. Both gated on
      # `runner.os == 'Windows'`; the only caller (build-linux-x64 in
      # ci.yml) uses ubuntu-24.04, so both were dead. If a Windows
      # caller returns, both come back in one PR.

      # soldr#1254 — removed the "Restore checkout after soldr-cook"
      # step. setup-soldr's `cache: false` disables cook, so nothing
      # rewrites the workspace and `git restore --worktree -- .` was
      # 4-7 s of dead code.

      # soldr#1252 — removed the "Reset stale cache fallback artifacts"
      # step. Same rationale as the sibling in _bootstrap-e2e.yml:
      # setup-soldr's `cache: false` makes its restore-status never
      # `exact-hit`, so the guard tripped every run and the step
      # deleted `target/<triple>/` right after Swatinem/rust-cache
      # (#1242) restored it. rust-cache's own restore is authoritative.

      # The pinned released Soldr is only the compiler needed to bootstrap the
      # source revision's CLI. The validation step switches once to that source
      # binary, then keeps its wrapper identity stable for the complete DAG.
      # soldr#3017: persist the Dylint libraries and analysis trees.
      #
      # These are 638s/run of byte-identical cold work -- MISS counts are the
      # same on every run -- and Swatinem/rust-cache could never have served
      # them: it deletes `target/dylint/**` at save time, keeping only
      # {build,.fingerprint,deps} inside a profile dir. `dylint_cook_acceptance.py`
      # settles the mechanism: `object_cache_only` MISSES (a per-unit object
      # cache alone does not avoid the work) while `warm_restored_target` SKIPS
      # (a restored tree does).
      #
      # `tests` is deliberately excluded, and this is the load-bearing part.
      # soldr#3012 measured the three trees: libraries 362.6 MiB, target
      # 598.6 MiB, tests 1.9 GiB. `target/dylint/tests/` is the UI-test tree --
      # compiled fixture crates and their harness binaries -- which
      # ci/cache-ownership.json puts permanently in tier 3: linked test products
      # "may not enter cook, an rlib cache, a broad target/ cache, a
      # compiler-cache archive, or any other cross-run reusable store".
      # Persisting it would be the same defect the cook payload had
      # (soldr#3003): an archive scoped to a DIRECTORY rather than an artifact
      # tier. So the UI-test stages stay cold by design, not by omission.
      #
      # The directory exclusion still stands and is still correct. As of
      # soldr#3042, though, the THIRD-PARTY DEPENDENCY LAYER inside that
      # directory is prepared ahead of time by a `soldr dylint cook
      # --tree tests` step below, so "the UI-test stages stay cold by
      # design" now applies only to the linked UI-test products themselves.
      #
      # 961.2 MiB to recover 302.6s of the 638s. The key covers the exact
      # nightly every lint manifest declares plus the lint sources themselves,
      # so a driver bump or a lint edit invalidates it.
      - name: Restore Dylint libraries and analysis trees
        id: dylint_trees
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/dylint/libraries
            target/dylint/target
          key: dylint-foundation-v1-${{ inputs.target }}-${{ hashFiles('dylints/**/rust-toolchain.toml', 'dylints/**/Cargo.toml', 'dylints/**/src/**') }}

      # The two paths are the cook artifact store (`cook_cache_dir` =
      # `<SOLDR_CACHE_DIR>/cache/cook`, crates/soldr-cache/src/cache_lib/cook_archive.rs)
      # and the `cook_index_v2` rows that name them
      # (`<SOLDR_CACHE_DIR>/state.sqlite3`, crates/soldr-cache/src/cache_lib/cook_index.rs).
      # Persisting one without the other is useless: the front-door hydrate
      # looks the artifact up through the daemon's index, it does not scan
      # the directory.
      #
      # The `-wal`/`-shm` sidecars are listed because `state_store` opens the
      # database with `PRAGMA journal_mode=WAL`
      # (crates/soldr-cache/src/cache_lib/state_store.rs). A clean shutdown
      # checkpoints and removes them -- actions/cache just warns on a path that
      # is not there -- but an unclean one leaves committed rows living only in
      # the `-wal`. Saving the database without them would restore an index
      # that is silently missing its most recent entries, which presents as an
      # unexplained cold cook rather than as an error.
      #
      # The literal paths mirror `SOLDR_CACHE_DIR` as set by "Select canonical
      # host CI cache domain"; that step writes GITHUB_ENV, which is why this
      # block repeats the path expression instead of referencing the
      # variable.
      #
      # Correctness does NOT come from this cache key. It comes from the cook
      # index key (recipe hash + triple + profile + channel + rustc version).
      # A loose actions/cache key can therefore only cost a wasted restore,
      # never a stale artifact -- and a bumped dependency changes the recipe
      # hash, so the index misses and cook rebuilds. That is soldr#3043's
      # staleness negative test, satisfied by construction.
      #
      # An exact key hit means actions/cache does not re-save, so the entry
      # cannot grow run over run. Sizes count against soldr#3047's 2.0 GiB
      # allocation and are reported by the cook step.
      #
      # Fold this block into soldr#3041's single Soldr-domain `actions/cache`
      # block when that hunk lands; it is separate only because #3041 is not
      # on main yet.
      #
      # No broad `target/` snapshot is restored and no linked test product is
      # persisted: the cook archive is the trimmed dependency tree
      # (`StripTargetOptions::cook`, crates/soldr-cache/src/cache_lib/strip_target.rs),
      # which is tier 1 `cook` in ci/cache-ownership.json.
      - name: Restore stable cook archives (soldr#3043)
        id: stable_cook_cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ${{ runner.temp }}/soldr-host-ci/${{ inputs.target }}/cache/cook
            ${{ runner.temp }}/soldr-host-ci/${{ inputs.target }}/state.sqlite3
            ${{ runner.temp }}/soldr-host-ci/${{ inputs.target }}/state.sqlite3-wal
            ${{ runner.temp }}/soldr-host-ci/${{ inputs.target }}/state.sqlite3-shm
          key: stable-cook-v1-${{ inputs.target }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: |
            stable-cook-v1-${{ inputs.target }}-

      # soldr#3024: the unconditional cross-bootstrap job already builds this
      # exact workflow SHA with the pinned 1.95.0 toolchain, dev profile, and
      # default soldr-cli features. Reuse its run-scoped driver when the producer has
      # already finished. There is deliberately no `needs:` edge: a cold or
      # failed producer must not lengthen native validation, and both download
      # and provenance failures fall through to the source build below.
      - name: Reuse shared source driver if already available
        id: source_driver_download
        if: inputs.source_driver_artifact_name != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.source_driver_artifact_name }}
          path: ${{ runner.temp }}/host-source-driver

      - name: Verify shared source driver provenance
        id: shared_source_driver
        if: steps.source_driver_download.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/host-source-driver"
          artifact_soldr="$artifact_dir/soldr"
          expected_sha="${{ github.sha }}"
          test -f "$artifact_dir/source-sha"
          actual_sha=$(<"$artifact_dir/source-sha")
          [[ "$actual_sha" == "$expected_sha" ]]
          test -f "$artifact_soldr"
          chmod +x "$artifact_soldr"
          "$artifact_soldr" --version
          source_soldr="${GITHUB_WORKSPACE}/target/${{ inputs.target }}/debug/soldr"
          mkdir -p "$(dirname "$source_soldr")"
          cp "$artifact_soldr" "$source_soldr"

      - name: Build ci-test driver
        if: steps.shared_source_driver.outcome != 'success'
        shell: bash
        env:
          # soldr#3043: the stable-cook cache restored above makes the cook
          # index non-empty for the FIRST time this early in the job, so this
          # step's front-door pre-flight would now try to hydrate it -- under
          # the PINNED 0.9.10 bootstrap Soldr, which predates both this PR's
          # `cook_hydrate::resolve_target_dir` fix and its
          # `SOLDR_COOK_HYDRATE_TARGET` companion. That binary extracts a
          # `--target`-scoped archive into the bare `target/` root, which cargo
          # never reads for a `--target` build: a multi-GB write that buys
          # nothing and competes for runner disk with the tree ci-test needs.
          # The source-revision cook step below does the hydrate correctly.
          # Remove this once the pinned setup-soldr Soldr carries the fix.
          SOLDR_COOK_AUTO_HYDRATE: "0"
        run: |
          # setup-soldr 0.9.10 writes its historical ci-tests=1 caps through
          # GITHUB_ENV. This lane deliberately leaves both knobs unset so
          # source Soldr's exclusive heavy-unit admission owns concurrency.
          unset CARGO_BUILD_JOBS SOLDR_JOBS
          soldr cargo build --profile dev -p soldr-cli --bin soldr \
            --target ${{ inputs.target }}
      # The broker is intentionally a stable singleton and never replaces
      # itself across Soldr images. The setup action started the released
      # bootstrap generation; retire it explicitly before the source wrapper
      # needs its own daemon service definition.
      - name: Hand off bootstrap broker to source revision
        shell: bash
        run: |
          set -euo pipefail
          unset CARGO_BUILD_JOBS SOLDR_JOBS
          soldr cache shutdown --shutdown-timeout-seconds 30 || soldr zccache stop
          soldr broker remove
          source_soldr="${GITHUB_WORKSPACE}/target/${{ inputs.target }}/debug/soldr"
          "$source_soldr" daemon start

      # soldr#3042: pre-compile the `target/dylint/tests` third-party
      # dependency layer (dylint_testing -> compiletest_rs, git2,
      # libgit2-sys, plus dylint's own build script) before validation
      # starts. In the baseline warm run those 137 units compiled inside
      # the Dylint UI-test branch, concurrently with Fresh Nextest --
      # the window that produced PR #3038's fixture timeout, its 14 GiB
      # compiler shed, and the ETXTBSY exec race on dylint's just-linked
      # build script. Admission control does not close that window; not
      # compiling there does.
      #
      # Position is load-bearing in both directions. AFTER "Build ci-test
      # driver" because `--tree` exists only on the source binary -- the
      # pinned setup-soldr 0.9.10 builder has no such flag -- and AFTER
      # the broker handoff so these compiles route through the same
      # source-owned daemon ci-test will use. BEFORE "Run prescribed host
      # validation" or it buys nothing.
      #
      # This persists nothing across runs: it fills an in-run target tree.
      # `target/dylint/tests` stays banned from every cross-run store
      # (ci/cache-ownership.json); the cross-run saving is the Tier-2
      # object store (soldr#3041).
      - name: Cook the Dylint UI-test dependency layer (soldr#3042)
        continue-on-error: false
        shell: bash
        run: |
          set -euo pipefail
          unset CARGO_BUILD_JOBS SOLDR_JOBS
          source_soldr="${GITHUB_WORKSPACE}/target/${{ inputs.target }}/debug/soldr"
          python3 .github/scripts/cook_dylint_tests_tree.py \
            --soldr "$source_soldr" \
            --target-root "${GITHUB_WORKSPACE}/target"

      # BUCKET (soldr#3043 step 1). `soldr ci-test --explain-plan` freezes
      # exactly one stable compile domain (crates/soldr-cli/src/ci_test/plan.rs):
      # `id: stable`, toolchain = `rust-toolchain.toml`'s channel, target
      # triple = host, target_directory = `target/<host>`, profile `test`;
      # the `rustdoc` domain shares that same directory and profile. Its
      # consumers are `clippy --all-targets --target <host>`,
      # a no-run nextest compile of `--lib --tests --target <host>`,
      # `nextest run`, and `test --doc --target <host>`. "Build ci-test
      # driver" uses `--profile dev` in the same directory. `[profile.test]`
      # in the root Cargo.toml deliberately mirrors `[profile.dev]` ("Mirror
      # dev's effective codegen settings here so their fingerprints remain
      # reusable across that handoff (soldr#2864)"), so dev and test are ONE
      # bucket, not two. Hence exactly one cook invocation: `--workspace
      # --target <host>`, dev profile, default features, `-- --all-targets`
      # for dev-dependency coverage.
      #
      # PATH-DEP GUARD (soldr#3043 step 3). The only `exclude` entry in the
      # root workspace is `.extern-repos/soldr-maturin`, and every path
      # dependency in `crates/*/Cargo.toml` points at a workspace MEMBER, so
      # `unmaterializable_path_deps` should not fire. `dylints/*` are
      # separate `[workspace]` roots and are not part of the stable tree. If
      # exit 3 appears anyway, exclude the offending member with `-p`; do not
      # relax the guard.
      #
      # OPTION (b) IS CHOSEN, NOT (a), and the issue's own preference is
      # overridden for two measured reasons. (i) The pinned setup-soldr
      # 0.9.10 binary is soldr v0.9.10 = commit dcc19c61, which predates
      # soldr#2870 (commit 623f0b49). #2870 added `compile_duration_ms` /
      # `save_elapsed_ms` to `CookEntry` plus the `decide_cook_restore` cost
      # gate, and that gate refuses any row whose timings are zero ("no prior
      # compile duration is recorded"). A cook run by 0.9.10 writes exactly
      # such rows, so it would poison the store for every later HEAD reader.
      # (ii) 0.9.10 also predates this PR's fix to
      # `cook_hydrate::resolve_target_dir`, so its hydrate extracts a
      # `--target` archive to `target/` instead of `target/<triple>/` and the
      # warm path cannot work at all. Option (a) is therefore blocked behind
      # the full soldr-release -> setup-soldr-ingest -> pin-bump loop; option
      # (b) needs none of it.
      #
      # WHY (b) COSTS ALMOST NOTHING HERE, contrary to the issue's framing.
      # "Build ci-test driver" is gated on
      # `steps.shared_source_driver.outcome != 'success'`, so on the normal
      # path (soldr#3024 reuses the cross-bootstrap driver artifact) NO
      # first-party compile happens before this step and cook pre-warms the
      # entire tree ci-test then compiles against. On the fallback path the
      # driver is built first; `restore_project_source` used to bump every
      # workspace source mtime and would have thrown that build away, which
      # is why this PR also makes that restore leave unchanged files
      # untouched.
      #
      # WHY THE STEP SITS AFTER THE BROKER HANDOFF: the cook index is
      # written and read through the daemon, and "Hand off bootstrap broker
      # to source revision" is where the source-revision daemon takes over.
      # Cooking before it would record rows via the 0.9.10 daemon.
      #
      # WHY `SOLDR_RUSTC_WRAPPER` IS EXPORTED: "Run prescribed host
      # validation" runs ci-test with `SOLDR_RUSTC_WRAPPER="$source_soldr"`.
      # `RUSTC_WRAPPER` is part of Cargo's fingerprint, so if cook compiled
      # under a differently-named generated shim every unit it built would
      # be dirty for ci-test. The two steps must name the identical wrapper
      # path.
      #
      # `CookDecision { action: "not-run" }` in ci_test/plan.rs is unchanged
      # and stays unchanged: cook runs at workflow level, never inside the
      # verb.
      #
      # The `< 130` third-party journal-record acceptance is measured with
      # soldr#3040's `analyze_compile_journal.py`, which is not on main yet;
      # `run_stable_cook.py` runs without `--require-warm` until then, so a
      # non-warm run annotates rather than fails.
      #
      # FAILURE POLICY: this step hard-fails, and there is deliberately no
      # soft-fail escape (no `continue-on-error`, no downgrade flag in
      # `run_stable_cook.py`). A cook that cannot run is a defect in the cook
      # path itself, which is part of this repository's subject matter; hiding
      # it behind a warning would mean the lane goes green while the mechanism
      # this PR exists to add is dead, and the only signal would be wall time
      # nobody reads. Exit 3 (COOK_SKIPPED_UNCOOKABLE_WORKSPACE) has a named
      # fix -- exclude the offending member with `-p`, soldr#3043 step 3 -- and
      # every other non-zero is propagated verbatim with cook's own stderr
      # echoed above the annotation. This step was red from the day it landed
      # (#3072) until the fix in the PR that carries this comment: soldr cook
      # forwarded its `--` passthrough to cargo-chef *with* the literal `--`,
      # which clap reads as end-of-options, so cargo-chef rejected
      # `--all-targets` as a positional. If the annotation says cook exited
      # non-zero, read the echoed cook stderr before assuming a workspace
      # problem. The one softness knob is `--require-warm`, left off for the
      # reason given in the paragraph above.
      - name: Cook stable dependency tree (soldr#3043)
        shell: bash
        run: |
          set -euo pipefail
          unset CARGO_BUILD_JOBS SOLDR_JOBS
          source_soldr="${GITHUB_WORKSPACE}/target/${{ inputs.target }}/debug/soldr"
          SOLDR_RUSTC_WRAPPER="$source_soldr" python3 .github/scripts/run_stable_cook.py \
            --soldr "$source_soldr" \
            --target "${{ inputs.target }}" \
            --cache-dir "$SOLDR_CACHE_DIR"

      # soldr#2868: one source-owned verb now covers rustfmt, lint-ci, Clippy,
      # all Dylint domains, one Nextest test-profile compilation plus its
      # Fresh execution, doctests, and the dependency-policy fanout. Use the
      # source binary as its own explicit
      # rustc wrapper: nested tests override SOLDR_CACHE_DIR and must not inherit
      # an older bootstrap wrapper whose daemon route is unavailable there.
      # Preserve the real rustup Cargo before shadowing its bare name. Code that
      # intentionally launches nested Cargo must honor $CARGO, whose distinct
      # shim re-enters this source revision through the Soldr front door. Cargo
      # overwrites CARGO for build children, so ci-test also installs the
      # generated target runner at the final Nextest test-process boundary.
      - name: Run prescribed host validation
        shell: bash
        run: |
          set -euo pipefail
          # Clear setup-soldr's bootstrap-only legacy caps at the source-owned
          # boundary. Explicit overrides remain untouched outside this lane.
          unset CARGO_BUILD_JOBS SOLDR_JOBS
          source_soldr="${GITHUB_WORKSPACE}/target/${{ inputs.target }}/debug/soldr"
          real_cargo=$("$source_soldr" rustup which cargo)
          cargo_guard="${RUNNER_TEMP}/soldr-ci-cargo-guard"
          python3 .github/scripts/install_ci_cargo_guard.py \
            --source-soldr "$source_soldr" \
            --real-cargo "$real_cargo" \
            --output-dir "$cargo_guard"
          export SOLDR_REAL_CARGO="$real_cargo"
          export CARGO="$(<"$cargo_guard/allowed-cargo-path")"
          export SOLDR_CI_TEST_CARGO_RUNNER="$(<"$cargo_guard/test-runner-path")"
          export PATH="$cargo_guard/trap:$PATH"
          # soldr#3040: keep cargo's fingerprint log where the artifact upload
          # already looks. Only stderr is duplicated; the console stream is
          # unchanged because tee writes back to fd 2.
          mkdir -p "$SOLDR_CACHE_DIR/logs"
          SOLDR_RUSTC_WRAPPER="$source_soldr" "$source_soldr" \
            ci-test --target "${{ inputs.target }}" \
            2> >(tee -a "$SOLDR_CACHE_DIR/logs/cargo-fingerprint.log" >&2)

      # soldr#1838 Phase 4: inspect the complete source-owned validation run,
      # not merely the optional local driver build. `always()` keeps the cache
      # and toolchain diagnostics available when ci-test itself fails.
      - name: Assert the build did not silently run uncached (soldr#1838)
        if: always()
        continue-on-error: ${{ !contains(inputs.target, 'linux-gnu') }}
        shell: bash
        run: |
          source_soldr="${GITHUB_WORKSPACE}/target/${{ inputs.target }}/debug/soldr"
          "$source_soldr" status --json > soldr-status.json
          python3 .github/scripts/check_compile_fallbacks.py soldr-status.json

      # soldr#1799: a managed-home leak silently changes the compiler identity
      # and invalidates Cargo/zccache reuse. Check every build log emitted by
      # ci-test, even on a failing validation run; unlike #1838 this is a hard
      # invariant on every platform.
      - name: Assert managed toolchain homes did not leak (soldr#1799)
        if: always()
        shell: bash
        run: |
          python3 .github/scripts/check_toolchain_homes.py "$SOLDR_CACHE_DIR/logs/builds" \
            --managed-root "$HOME/.soldr" --managed-root "$HOME/.soldr-dev"

      # soldr#2996 Phase 6 proposes persisting `target/dylint/` -- the only
      # mechanism that reaches the 638s Dylint block, since Swatinem/rust-cache
      # deletes those trees at save time and a per-unit object cache alone
      # still misses. The directive that admitted at most one cache family
      # beyond `soldr cook` against a flat 5 GB budget is superseded by
      # soldr#3039: the Tier-2 per-unit object store persisted above is NOT a
      # new family -- ci/cache-ownership.json already defines `zccache-unit`
      # as durable and deliberately live in normal lanes -- and the flat
      # figure is replaced by the per-family allocation in that manifest's
      # `budget` map (soldr#3047), of which this store's share is 2.0 GiB.
      # The Dylint tree carve-out still has to be costed and nobody has the
      # number; this reports it.
      #
      # `always()` because the sizes are just as interesting when ci-test
      # failed, and the script reports rather than fails, so it can never be
      # the reason this lane goes red.
      - name: Report Dylint tree sizes
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/report_dylint_tree_size.py

      # soldr#3047 — actions/cache has no `save-if`, so main-only saving
      # needs the restore/save split: PRs restore main's tree and no longer
      # write their own 0.21 GiB copy. This step sits after the size report
      # so the reported numbers describe what is being saved.
      - name: Save Dylint libraries and analysis trees (soldr#3047)
        if: ${{ github.ref == 'refs/heads/main' && steps.dylint_trees.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            target/dylint/libraries
            target/dylint/target
          key: ${{ steps.dylint_trees.outputs.cache-primary-key }}

      - name: Stop canonical host CI cache
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          source_soldr="${GITHUB_WORKSPACE}/target/${{ inputs.target }}/debug/soldr"
          "$source_soldr" cache shutdown --shutdown-timeout-seconds 30 \
            || "$source_soldr" zccache stop
          "$source_soldr" broker remove || true

      # soldr#3039 Phase 0: the `actions/cache` post-step tars the object store
      # after every main step, and Soldr's OWN archive transport already refuses
      # to collect part of that tree -- `archive_always_excludes_cache_path`
      # (crates/soldr-cache/src/cache_lib/save_inventory.rs) drops any path with
      # a `staging` component plus every `.lock` / `.sock` / `.socket` / `.pid`
      # file "regardless of the requested save profile". That rule was written
      # from a bench-lane failure in this exact directory: `soldr save` walked
      # `daemon-state/embedded-v1/v*/staging/<session>/.active.lock`, the daemon
      # deleted it before the stat, and the save died. tar has the same race, and
      # a cache save that fails is only a WARNING -- the entry would silently
      # never be written and the whole point of persisting the store would be
      # lost with the lane still green.
      #
      # Restoring the files is the second half of the problem: a stale lock or
      # socket landing in a later run's root is what that module documents as
      # preventing the compile daemon from starting, and staging holds
      # partially-written publishes by construction, so none of it is payload.
      # Deleting it here is safe by the same evidence -- a `soldr load` restore
      # never contains these files, so the service already has to tolerate their
      # absence. The daemon is stopped by the step above, and this reports
      # rather than fails so it can never redden the lane.
      - name: Scrub runtime coordination state from the object store (soldr#3039)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          store="${{ runner.temp }}/soldr-host-ci/${{ inputs.target }}/cache/zccache/daemon-state"
          if [ ! -d "$store" ]; then
            echo "no object store at $store -- nothing to scrub"
            exit 0
          fi
          find "$store" -type d -name staging -prune -exec rm -rf {} + || true
          # `-type s` matters: a unix socket is not a regular file, and a stale
          # socket restored into a later root is the failure this is here for.
          find "$store" \( -type f -o -type s \) \
            \( -name '*.lock' -o -name '*.sock' -o -name '*.socket' \
               -o -name '*.pid' -o -name 'lock' -o -name 'pid' \) \
            -delete || true
          echo "object store staged for the cache save:"
          du -sh "$store" || true

      # soldr#1799 — surface the per-build XML logs and the JSONL compile
      # journals from CI compiles so toolchain-home leakage and warm-run
      # recompile storms are diagnosable. The canonical SOLDR_CACHE_DIR tree
      # covers every build and test step in this host lane.
      #
      # These used to `Get-Content` every matching file into the job console.
      # A compile journal is one JSON object per compile unit, so a full
      # workspace build buried the actual test failure under megabytes of
      # scrollback — the exact opposite of diagnosable. The inventory below
      # prints names and sizes only; the contents are downloadable from the
      # `build-logs-<target>` artifact.
      - name: Index build logs
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 .github/scripts/index_build_logs.py \
            --root "$SOLDR_CACHE_DIR" \
            --artifact-name "build-logs-${{ inputs.target }}"

      # soldr#3040: this is the measuring stick every #3039 phase's
      # acceptance is judged with. The baseline it compares against is run
      # 33536940076.
      - name: Report compile journal analysis (soldr#3040)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          # Report-only. Prints the #3039 baseline table into the job log and
          # writes the machine-readable summary next to the journals so the
          # upload below carries it. It never fails the lane.
          python3 .github/scripts/analyze_compile_journal.py \
            "$SOLDR_CACHE_DIR/cache/zccache" \
            --cargo-logs "$SOLDR_CACHE_DIR/logs/cargo-fingerprint.log" \
            --lockfiles-from-repo \
            --compare-baseline .github/scripts/baselines/compile_journal_baseline_33536940076.json \
            --json-out "$SOLDR_CACHE_DIR/logs/compile-journal-analysis.json" \
            --verbose

      - name: Upload build log artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-logs-${{ inputs.target }}
          if-no-files-found: ignore
          # Keep in sync with `.github/scripts/index_build_logs.py`, which
          # prints the index of what lands here. The non-`logs/` entries are
          # deliberate: the archived compile journals live under
          # `history/<id>/`, and the broker/daemon spawn logs sit at the state
          # root — all three were silently missing from this artifact, which
          # is why a broker that failed to come up left no downloadable trace.
          path: |
            ${{ runner.temp }}/soldr-host-ci/${{ inputs.target }}/logs/
            ${{ runner.temp }}/soldr-host-ci/${{ inputs.target }}/cache/zccache/logs/
            ${{ runner.temp }}/soldr-host-ci/${{ inputs.target }}/cache/zccache/history/**/*.json
            ${{ runner.temp }}/soldr-host-ci/${{ inputs.target }}/cache/zccache/history/**/*.jsonl
            ${{ runner.temp }}/soldr-host-ci/${{ inputs.target }}/*-spawn.log
            ${{ runner.temp }}/soldr-host-ci/${{ inputs.target }}/broker/*.log
            ${{ runner.temp }}/soldr-host-ci/${{ inputs.target }}/broker/*.jsonl

      - name: Ratchet third-party compiles (soldr#3040, report-only)
        if: always()
        shell: bash
        run: |
          # Thresholds are deliberately unreachable today: this phase ships the
          # gate, not the reduction. Each #3039 phase lowers its own threshold
          # in its own PR -- that is how a phase proves it holds and how a
          # later regression is caught. The step is deliberately left able to
          # fail the lane, with no soft-fail escape hatch: once a
          # threshold is real, it must be able to fail the lane.
          python3 .github/scripts/check_third_party_compiles.py \
            "$SOLDR_CACHE_DIR/cache/zccache" \
            --cargo-logs "$SOLDR_CACHE_DIR/logs/cargo-fingerprint.log" \
            --summary-json "$SOLDR_CACHE_DIR/logs/compile-journal-analysis.json" \
            --max-misses 100000 \
            --max-dirty-third-party 100000
