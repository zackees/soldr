name: Baseline Zero-Deps Docker

# Acceptance test for meta #853 (sub-issue #860).
#
# Proves soldr is a genuine full bootstrapper: a Docker image with NO
# pre-installed build toolchain (no clang, no lld, no zig, no llvm, no
# rustup, no build-essential) can still exercise the explicit legacy
# `soldr cargo zigbuild --target *-apple-darwin` path and `soldr cargo
# xwin build --target aarch64-pc-windows-msvc` purely because soldr
# fetches everything those commands need. The blessed macOS cross-build
# path in normal CI is `soldr build --target *-apple-darwin`.
#
# Two variants run in parallel: debian:bookworm-slim (glibc) and
# alpine:3.20 (musl) — glibc and musl have very different prebuilt-
# binary compatibility edges, so both must pass for the bootstrap
# story to be honest.

on:
  # Manual-only. This is an expensive (~42-minute) zero-deps bootstrap
  # acceptance test; it used to auto-run on every fetch/bootstrap-touching
  # PR (via `pull_request: paths:`) and on every push-to-main, which was a
  # lot of runner time for a check that only needs to be exercised
  # deliberately. Run it on demand from the Actions tab (Run workflow) when
  # validating fetch/bootstrap behaviour, the pinned tool set, the
  # dependency graph, or the baseline images.
  workflow_dispatch:

permissions:
  contents: read

# `fast-build` PR label suppression (from #863). The label is a no-op on
# push events because the pull_request payload is null there.
# soldr#1985 - stop superseded runs from holding runner slots.
concurrency:
  group: baseline-zero-deps-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # soldr#1978 item 5. Both `build-soldr` legs used to run this identical
  # x86_64-unknown-linux-gnu build (~305s each). The existing cache could not
  # prevent it: its key has no `matrix.libc` component, so the legs share it,
  # and they run in parallel -- when `crates/**` changes they both miss at the
  # same moment, both build, and both race to save. The cache therefore helped
  # only when nothing had changed, i.e. never on a code PR.
  #
  # Building it once and passing it forward is the shape `ci.yml` already uses
  # for `e2e-cross-bootstrap-soldr`.
  bootstrap-soldr:
    name: bootstrap soldr for the baseline images
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'fast-build') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOLDR_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.95.0
          targets: x86_64-unknown-linux-gnu

      - name: Restore cargo + target caches
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # soldr#1978 item 6. Same (profile, target) as the glibc leg of
          # `build-soldr` below, which `needs:` this job -- so this pass
          # populates the namespace and that one restores it, instead of the
          # two compiling the same release dependency graph into two caches.
          shared-key: ws-release-x86_64-unknown-linux-gnu

      # Same key as before: one binary, one cache entry. Now only one job
      # consults it, so a miss costs one build rather than two.
      - name: Restore cached bootstrap soldr binary
        id: bootstrap_cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/soldr-bin/soldr
          # soldr#1978 item 6: this builds `--release`, while ci.yml's
          # bootstrap builds `--profile ci-bootstrap`. Naming the profile keeps
          # the two caches provably distinct and makes a future profile change
          # invalidate this entry -- hashFiles() alone would not.
          key: bootstrap-soldr-linux-gnu-release-${{ hashFiles('crates/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}

      - name: Bootstrap soldr from checkout
        if: steps.bootstrap_cache.outputs.cache-hit != 'true'
        env:
          RUSTC_WRAPPER: ""
        shell: bash
        run: |
          set -euo pipefail
          "$CARGO_HOME/bin/cargo" build             --package soldr-cli             --release             --locked             --target x86_64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/soldr-bin"
          cp target/x86_64-unknown-linux-gnu/release/soldr "$RUNNER_TEMP/soldr-bin/soldr"
          chmod +x "$RUNNER_TEMP/soldr-bin/soldr"

      - name: Upload bootstrap soldr
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baseline-bootstrap-soldr
          path: ${{ runner.temp }}/soldr-bin/soldr
          if-no-files-found: error
          retention-days: 1

  build-soldr:
    name: Build soldr for ${{ matrix.target }}
    needs: bootstrap-soldr
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'fast-build') }}
    runs-on: ubuntu-latest
    # soldr#1985 - was inheriting GitHub's 360-minute default.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - libc: glibc
            target: x86_64-unknown-linux-gnu
          - libc: musl
            target: x86_64-unknown-linux-musl
    env:
      SOLDR_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      # soldr#1235 — cache ~/.cargo/{registry,git} + target/ so the
      # `Build soldr-cli via soldr cargo zigbuild` step below doesn't
      # recompile ~700 crate deps from scratch on every run. Same
      # SHA-pinned action already in #1228/#1233. The workflow's zero-
      # deps mandate covers only the DOCKER CONTAINER (used by the
      # Bootstrap test acceptance jobs); runner-side compile is a
      # normal build with no such constraint.
      - name: Restore cargo + target caches
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # soldr#1978 item 6. The glibc leg lands on the same key as the
          # `bootstrap-soldr` job above (same profile, same triple); the musl
          # leg gets its own, correctly.
          shared-key: ws-release-${{ matrix.target }}

      # soldr#1978 item 5: the host-side bootstrap is built once by
      # `bootstrap-soldr` and passed here, instead of both legs rebuilding the
      # identical x86_64-unknown-linux-gnu binary (~305s each) whenever
      # `crates/**` changed.
      - name: Download bootstrap soldr
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: baseline-bootstrap-soldr
          path: ${{ runner.temp }}/soldr-bin

      # upload-artifact does not preserve the executable bit.
      - name: Restore bootstrap soldr executable bit
        shell: bash
        run: chmod +x "$RUNNER_TEMP/soldr-bin/soldr"

      - name: Expose bootstrap soldr on PATH
        shell: bash
        run: |
          set -euo pipefail
          test -x "$RUNNER_TEMP/soldr-bin/soldr" || {
            echo "bootstrap soldr not present at $RUNNER_TEMP/soldr-bin/soldr" >&2
            exit 1
          }
          echo "$RUNNER_TEMP/soldr-bin" >> "$GITHUB_PATH"
          echo "BOOTSTRAP_SOLDR=$RUNNER_TEMP/soldr-bin/soldr" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/soldr-bin/soldr" --version

      # soldr#1244 — cache the downloaded cargo-zigbuild + zig
       # binaries. Ziglang.org has spiked to 46 s downloads before; this
       # eliminates the tail-latency risk and shaves 9 s off happy-path
       # runs too.
      - name: Restore zigbuild toolchain cache
        id: zigbuild_cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/cross-bin
          key: soldr-zigbuild-toolchain-cargo-zigbuild-0.23.0-zig-0.13.0-v1

      - name: Pre-fetch zigbuild toolchain
        if: steps.zigbuild_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          dest_dir="${RUNNER_TEMP}/cross-bin"
          mkdir -p "$dest_dir"
          query_args=(--platform linux --arch x86 --extra gnu)
          asset_metadata=$(python3 .github/scripts/toolchain_asset_query.py \
              "${query_args[@]}" --json cargo-zigbuild \
              || { query_args=(--platform linux --arch x86 --extra musl); \
                   python3 .github/scripts/toolchain_asset_query.py \
                     "${query_args[@]}" --json cargo-zigbuild; })
          asset_filename=$(printf '%s' "$asset_metadata" | \
            python3 -c 'import json,sys; print(json.load(sys.stdin)["filename"])')
          expected_sha=$(printf '%s' "$asset_metadata" | \
            python3 -c 'import json,sys; print(json.load(sys.stdin)["sha256"])')
          bash .github/scripts/download_large_asset.sh \
            --url "$(printf '%s' "$asset_metadata" | python3 -c 'import json,sys; print(json.load(sys.stdin)["urls"][0])')" \
            --output "/tmp/${asset_filename}" --sha256 "$expected_sha"
          extract_tmp=$(mktemp -d)
          tar -xaf "/tmp/${asset_filename}" -C "$extract_tmp"
          binary_src=$(find "$extract_tmp" -type f -name cargo-zigbuild -print -quit)
          if [ -z "$binary_src" ]; then
            echo "cargo-zigbuild not found in $asset_filename" >&2
            find "$extract_tmp" -maxdepth 3 -type f -print >&2
            exit 1
          fi
          cp "$binary_src" "$dest_dir/cargo-zigbuild"
          chmod +x "$dest_dir/cargo-zigbuild"
          zig_version="0.13.0"
          zig_asset="zig-linux-x86_64-${zig_version}.tar.xz"
          bash .github/scripts/download_large_asset.sh \
            --url "https://ziglang.org/download/${zig_version}/${zig_asset}" \
            --output "/tmp/${zig_asset}" \
            --sha256 d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea \
            --expected-size 47082308
          # Extract zig to a stable subdir of cross-bin so actions/cache
          # captures both binaries under one path.
          zig_dest="$dest_dir/zig"
          mkdir -p "$zig_dest"
          tar -xaf "/tmp/${zig_asset}" -C "$zig_dest" --strip-components=1
          test -x "$zig_dest/zig" || {
            echo "zig binary missing from $zig_dest after extract" >&2
            find "$zig_dest" -maxdepth 2 -type f -print >&2
            exit 1
          }

      - name: Expose zigbuild toolchain on PATH
        shell: bash
        run: |
          set -euo pipefail
          dest_dir="${RUNNER_TEMP}/cross-bin"
          zig_dest="$dest_dir/zig"
          chmod +x "$dest_dir/cargo-zigbuild"
          chmod +x "$zig_dest/zig"
          echo "$dest_dir" >> "$GITHUB_PATH"
          echo "$zig_dest" >> "$GITHUB_PATH"
          "$dest_dir/cargo-zigbuild" --version
          "$zig_dest/zig" version

      - name: Build soldr-cli via soldr cargo zigbuild
        shell: bash
        run: |
          set -euo pipefail
          # zigbuild fetches its own zig + linker via soldr — we want the
          # same code path the rest of the workflow exercises.
          "$BOOTSTRAP_SOLDR" cargo zigbuild --release --package soldr-cli --target "${{ matrix.target }}"

      - name: Stage soldr binary for upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          src="target/${{ matrix.target }}/release/soldr"
          if [ ! -x "$src" ]; then
            echo "expected soldr binary at $src but it is missing or not executable" >&2
            ls -l "target/${{ matrix.target }}/release" || true
            exit 1
          fi
          cp "$src" "staging/soldr"
          file staging/soldr || true
          ./staging/soldr --version

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: soldr-${{ matrix.libc }}
          path: staging/soldr
          if-no-files-found: error
          retention-days: 7

  docker-baseline:
    name: Bootstrap test (${{ matrix.libc }})
    needs: build-soldr
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'fast-build') }}
    runs-on: ubuntu-latest
    # soldr#1985 - was inheriting GitHub's 360-minute default.
    timeout-minutes: 60
    env:
      BASELINE_NATIVE_TIMEOUT: 10m
      BASELINE_DARWIN_TIMEOUT: 15m
      BASELINE_XWIN_TIMEOUT: 25m
      SOLDR_BASELINE_COMPILE_REPLY_TIMEOUT_SECS: "180"
    strategy:
      fail-fast: false
      matrix:
        include:
          - libc: glibc
            target: x86_64-unknown-linux-gnu
            dockerfile: .github/docker/baseline-glibc/Dockerfile
            context: .github/docker/baseline-glibc
            image_tag: soldr-baseline-glibc:test
            native_target: x86_64-unknown-linux-gnu
          - libc: musl
            target: x86_64-unknown-linux-musl
            dockerfile: .github/docker/baseline-musl/Dockerfile
            context: .github/docker/baseline-musl
            image_tag: soldr-baseline-musl:test
            native_target: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Download soldr binary from build-soldr stage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: soldr-${{ matrix.libc }}
          path: ${{ matrix.context }}

      - name: Verify staged soldr binary
        shell: bash
        run: |
          set -euo pipefail
          ls -l "${{ matrix.context }}"
          test -f "${{ matrix.context }}/soldr"
          chmod +x "${{ matrix.context }}/soldr"
          file "${{ matrix.context }}/soldr" || true

      # soldr#1978 item 5 proposed adding a BuildKit inline / registry cache
      # here, because this builds two images per run with `--pull` and no
      # cache. Measured before doing it, across three consecutive green runs:
      #
      #   Bootstrap test (musl)    4s,  6s,  9s
      #   Bootstrap test (glibc)  11s, 12s, 13s
      #
      # So the whole concern is worth ~15 seconds a run. The expensive steps
      # in this same job are Exercise 4 (cargo xwin build, ~819s) and
      # Exercise 3 (legacy cargo zigbuild, ~528s) -- two orders of magnitude
      # above what caching here could recover, and `--pull` is what keeps the
      # zero-deps claim honest by refusing a stale local base image.
      #
      # Recorded so the idea is not re-derived from the issue text. If this
      # ever gets slow, measure again rather than trusting this comment.
      - name: Build baseline docker image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --pull \
            --tag "${{ matrix.image_tag }}" \
            --file "${{ matrix.dockerfile }}" \
            "${{ matrix.context }}"

      - name: Exercise 1 — soldr version smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm "${{ matrix.image_tag }}" soldr version

      - name: Exercise 2 — native cargo check from zero
        shell: bash
        run: |
          set -euo pipefail
          # Proves the rustup + zccache bootstrap works end-to-end inside
          # a zero-deps image without requiring a system linker. soldr must
          # fetch its own rustc/cargo and its own zccache.
          set +e
          timeout --foreground "$BASELINE_NATIVE_TIMEOUT" \
          docker run --rm \
            --env SOLDR_GITHUB_TOKEN="${{ github.token }}" \
            --env SOLDR_COMPILE_REPLY_TIMEOUT_SECS="$SOLDR_BASELINE_COMPILE_REPLY_TIMEOUT_SECS" \
            "${{ matrix.image_tag }}" \
            bash -eux -c '
              mkdir -p /tmp/hello/src
              cd /tmp/hello
              printf "%s\n" \
                "[package]" \
                "name = \"hello\"" \
                "version = \"0.1.0\"" \
                "edition = \"2021\"" \
                > Cargo.toml
              printf "%s\n" \
                "[toolchain]" \
                "channel = \"1.95.0\"" \
                > rust-toolchain.toml
              printf "%s\n" "fn main() { println!(\"hi\"); }" > src/main.rs
              soldr cargo check --target ${{ matrix.native_target }}
            ' 2> exercise2.stderr | tee exercise2.stdout
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            if [ "$status" -eq 124 ]; then
              echo "::error title=Exercise 2 timed out (${{ matrix.libc }})::native cargo check exceeded $BASELINE_NATIVE_TIMEOUT"
            else
              echo "::error title=Exercise 2 failed (${{ matrix.libc }})::native cargo check from zero failed (exit $status)"
            fi
            echo "--- captured stderr ---"
            cat exercise2.stderr || true
            echo "--- captured stdout ---"
            cat exercise2.stdout || true
            exit "$status"
          fi

      - name: Exercise 3 — legacy cargo zigbuild for aarch64-apple-darwin
        shell: bash
        run: |
          set -euo pipefail
          # Proves rust target install + Apple SDK auto-fetch (#862) +
          # zig auto-fetch (#841) still work for the explicit legacy
          # cargo-zigbuild path from a zero-deps image.
          set +e
          timeout --foreground "$BASELINE_DARWIN_TIMEOUT" \
          docker run --rm \
            --env SOLDR_GITHUB_TOKEN="${{ github.token }}" \
            --env SOLDR_COMPILE_REPLY_TIMEOUT_SECS="$SOLDR_BASELINE_COMPILE_REPLY_TIMEOUT_SECS" \
            "${{ matrix.image_tag }}" \
            bash -eux -c '
              mkdir -p /tmp/hellomac/src
              cd /tmp/hellomac
              printf "%s\n" \
                "[package]" \
                "name = \"hellomac\"" \
                "version = \"0.1.0\"" \
                "edition = \"2021\"" \
                > Cargo.toml
              printf "%s\n" \
                "[toolchain]" \
                "channel = \"1.95.0\"" \
                > rust-toolchain.toml
              printf "%s\n" "fn main() { println!(\"hi\"); }" > src/main.rs
              soldr prepare --target aarch64-apple-darwin
              # soldr-lint-ci: allow cross-compile-surface -- intentional legacy-path regression test (Exercise 3 proves the explicit cargo-zigbuild bootstrap still works)
              soldr cargo zigbuild --target aarch64-apple-darwin
              ls -l target/aarch64-apple-darwin/debug/hellomac
            ' 2> exercise3.stderr | tee exercise3.stdout
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            if [ "$status" -eq 124 ]; then
              echo "::error title=Exercise 3 timed out (${{ matrix.libc }})::cargo zigbuild aarch64-apple-darwin exceeded $BASELINE_DARWIN_TIMEOUT"
            else
              echo "::error title=Exercise 3 failed (${{ matrix.libc }})::cargo zigbuild aarch64-apple-darwin failed (exit $status)"
            fi
            echo "--- captured stderr ---"
            cat exercise3.stderr || true
            echo "--- captured stdout ---"
            cat exercise3.stdout || true
            exit "$status"
          fi

      - name: Exercise 4 — cargo xwin build for x86_64-pc-windows-msvc
        if: ${{ matrix.libc == 'glibc' }}
        shell: bash
        run: |
          set -euo pipefail
          # Proves rust target install + LLVM auto-fetch (#864) +
          # cargo-xwin auto-fetch work together from a zero-deps image.
          # The managed LLVM archive is currently glibc-linked; musl
          # remains covered by the native and Apple/zigbuild exercises.
          set +e
          timeout --foreground "$BASELINE_XWIN_TIMEOUT" \
          docker run --rm \
            --env SOLDR_GITHUB_TOKEN="${{ github.token }}" \
            --env SOLDR_COMPILE_REPLY_TIMEOUT_SECS="$SOLDR_BASELINE_COMPILE_REPLY_TIMEOUT_SECS" \
            "${{ matrix.image_tag }}" \
            bash -eux -c '
              mkdir -p /tmp/hellowin/src
              cd /tmp/hellowin
              printf "%s\n" \
                "[package]" \
                "name = \"hellowin\"" \
                "version = \"0.1.0\"" \
                "edition = \"2021\"" \
                > Cargo.toml
              printf "%s\n" \
                "[toolchain]" \
                "channel = \"1.95.0\"" \
                > rust-toolchain.toml
              printf "%s\n" "fn main() { println!(\"hi\"); }" > src/main.rs
              soldr prepare --target x86_64-pc-windows-msvc
              # soldr-lint-ci: allow cross-compile-surface -- intentional legacy-path regression test (Exercise 4 proves the explicit cargo-xwin bootstrap still works)
              soldr --no-cache cargo xwin build --target x86_64-pc-windows-msvc
              ls -l target/x86_64-pc-windows-msvc/debug/hellowin.exe
            ' 2> exercise4.stderr | tee exercise4.stdout
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            if [ "$status" -eq 124 ]; then
              echo "::error title=Exercise 4 timed out (${{ matrix.libc }})::cargo xwin build x86_64-pc-windows-msvc exceeded $BASELINE_XWIN_TIMEOUT"
            else
              echo "::error title=Exercise 4 failed (${{ matrix.libc }})::cargo xwin build x86_64-pc-windows-msvc failed (exit $status)"
            fi
            echo "--- captured stderr ---"
            cat exercise4.stderr || true
            echo "--- captured stdout ---"
            cat exercise4.stdout || true
            exit "$status"
          fi

      - name: Summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "### Baseline Zero-Deps (${{ matrix.libc }})"
            echo
            echo "- Base image: ${{ matrix.libc == 'glibc' && 'debian:bookworm-slim' || 'alpine:3.20' }}"
            echo "- Pre-installed build tools: **none**"
            echo "- Compile reply timeout: ${SOLDR_BASELINE_COMPILE_REPLY_TIMEOUT_SECS}s"
            echo "- Exercise watchdogs: native ${BASELINE_NATIVE_TIMEOUT}, darwin ${BASELINE_DARWIN_TIMEOUT}, xwin ${BASELINE_XWIN_TIMEOUT}"
            echo "- Exercises:"
            echo "  - soldr version"
            echo "  - soldr cargo check --target ${{ matrix.native_target }}"
            echo "  - soldr prepare --target aarch64-apple-darwin"
            echo "  - soldr cargo zigbuild --target aarch64-apple-darwin (legacy explicit path)"
            echo "  - soldr prepare --target x86_64-pc-windows-msvc"
            echo "  - soldr --no-cache cargo xwin build --target x86_64-pc-windows-msvc"
          } >> "$GITHUB_STEP_SUMMARY"
