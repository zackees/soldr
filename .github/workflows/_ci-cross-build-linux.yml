# soldr#1051 / #1038: consolidated linux cross-build for all 8 targets.
#
# One ubuntu-24.04 job per target triple that does the whole every-commit
# pipeline for that target in a single runner spin-up. Target dispatch
# table:
#
#   *-unknown-linux-gnu (x86_64 native)  -> plain cargo
#   *-unknown-linux-gnu (aarch64 cross)  -> cargo zigbuild
#   *-unknown-linux-musl                 -> cargo zigbuild
#   *-apple-darwin                       -> cargo zigbuild + apple-sdk + persistent zig-cc wrappers
#   *-pc-windows-msvc                    -> cargo xwin
#
# Output: release binary at target/<triple>/release/soldr[.exe] + an
# optional cargo nextest archive at dist/<artifact_name>-tests.tar.zst.
# Both are uploaded as the named artifact for downstream
# _ci-target-run.yml consumption.

name: CI cross-build (linux host)

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
        description: Target triple to cross-build for.
      artifact_name:
        type: string
        required: true
        description: Name to use for the uploaded artifact.
      build_test_archive:
        type: boolean
        default: true
        description: |
          Build a `cargo nextest archive` of test binaries alongside
          the release binary. Set false to skip — useful for lanes
          that don't run tests downstream.
      source_ref:
        type: string
        default: ""
        description: |
          Optional commit SHA to checkout. Defaults to the workflow's
          implicit ref via actions/checkout default behavior.

permissions:
  contents: read

jobs:
  cross-build:
    name: cross-build ${{ inputs.target }} (linux host)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # zstd-sys' build.rs probes pkg-config; pkg-config-rs refuses
      # cross-compile probes by default. Setting this 1 lets the probe
      # run (and fall back to vendored compile if it fails). Required
      # after PR #1111 expanded the transitive *-sys dep tree.
      PKG_CONFIG_ALLOW_CROSS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive
          ref: ${{ inputs.source_ref != '' && inputs.source_ref || github.sha }}

      # soldr#1061 phase A: replaced the bare dtolnay/rust-toolchain
      # + Swatinem cargo-cache pair with setup-soldr's integrated
      # `prebuild-deps: soldr-cook` flow. setup-soldr handles:
      #   1. Rust toolchain install (1.94.1 per rust-toolchain.toml)
      #   2. cargo registry + target cache (actions/cache@v4 keyed on
      #      Cargo.lock + rustc + target)
      #   3. `soldr cook` hydration — restores prebuilt
      #      target/<triple>/release/build/*/out/ artifacts (the cc-rs
      #      outputs from zstd-sys, libsqlite3-sys, tikv-jemalloc-sys,
      #      ring, etc.) so cargo build doesn't recompile C source on
      #      every PR.
      # Without this, every cross-build lane spent 45-70s/lane on
      # cc-rs invocations that produced bit-identical outputs to
      # the previous PR. soldr#1061 gap analysis: ~2h/day of CI
      # wallclock burned across the 8-lane matrix.
      # soldr#1083 follow-up: cache + soldr-cook disabled. Cook's
      # cargo-chef pass replaces every workspace crate's lib.rs /
      # main.rs / build.rs with `fn main() {}` stubs AND rewrites
      # the workspace Cargo.toml to a stripped variant — both
      # incompatible with cross-compile lanes (wheel-version
      # extraction broke, formatter saw stub-only files). Save cost
      # no longer offsets the savings. Pure toolchain install via
      # setup-soldr; no cook, no cache restore, no
      # `git restore --worktree` workaround needed.
      - name: Setup soldr build cache (Rust toolchain only)
        uses: zackees/setup-soldr@cca74625e75e70b56f1805fa6eeee9069f945d48
        with:
          toolchain: 1.94.1
          cache: false
          zccache-seed-strict: true

      - name: Add cross-compile target
        shell: bash
        run: rustup target add ${{ inputs.target }}

      # soldr#1189 — split apt install per target. The clang stack
      # (clang lld llvm llvm-dev libclang-dev) is only needed by MSVC
      # (cargo-xwin) and darwin (blessed_build).
      # soldr#1200 — cache the .deb archive dir so cache-hit runs skip
      # the Azure apt mirror storm entirely (seen spiking to 433 s on
      # run 28537700050). Uses raw actions/cache + apt's
      # `Dir::Cache::Archives` override so nothing breaks the SHA-
      # pinning policy (unlike reverted #1185).
      - name: Restore apt archive cache (baseline)
        id: apt_cache_baseline
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/apt-archive-cache
          key: soldr-apt-baseline-ubuntu-24.04-v1

      - name: Install apt deps (baseline)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/apt-archive-cache
          # Redirect apt's archive dir to a user-writable location that
          # actions/cache can save/restore. -o Dir::Cache::Archives= is
          # apt's documented override. sudo still needed to write
          # /var/lib/dpkg on install.
          sudo apt-get -o Dir::Cache::Archives="$HOME/apt-archive-cache" update
          sudo apt-get -o Dir::Cache::Archives="$HOME/apt-archive-cache" \
            install -y --no-install-recommends \
            build-essential pkg-config file jq xz-utils bzip2 zip unzip \
            ca-certificates curl git cmake perl \
            musl-tools

      - name: Restore apt archive cache (clang stack)
        if: contains(inputs.target, 'pc-windows-msvc') || contains(inputs.target, 'apple-darwin')
        id: apt_cache_clang
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/apt-archive-cache-clang
          key: soldr-apt-clang-ubuntu-24.04-v1

      - name: Install apt deps (clang stack for MSVC/darwin)
        if: contains(inputs.target, 'pc-windows-msvc') || contains(inputs.target, 'apple-darwin')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/apt-archive-cache-clang
          sudo apt-get -o Dir::Cache::Archives="$HOME/apt-archive-cache-clang" \
            install -y --no-install-recommends \
            clang lld llvm llvm-dev libclang-dev

      # zig + cargo-zigbuild — required for musl, darwin, and aarch64
      # gnu cross-builds.
      - name: Setup zig
        if: contains(inputs.target, 'musl') || contains(inputs.target, 'apple-darwin') || (contains(inputs.target, 'linux-gnu') && contains(inputs.target, 'aarch64'))
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      - name: Install cargo-zigbuild
        if: contains(inputs.target, 'musl') || contains(inputs.target, 'apple-darwin') || (contains(inputs.target, 'linux-gnu') && contains(inputs.target, 'aarch64'))
        uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2
        with:
          tool: cargo-zigbuild@0.23.0

      # cargo-xwin — required for *-pc-windows-msvc.
      - name: Install cargo-xwin
        if: contains(inputs.target, 'pc-windows-msvc')
        uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2
        with:
          tool: cargo-xwin@0.18.6

      # nextest — required for the test archive output.
      - name: Install cargo-nextest
        if: inputs.build_test_archive
        uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2
        with:
          tool: cargo-nextest

      # soldr#1172 + soldr#1174 — cargo-xwin re-downloads the MSVC CRT+SDK
      # (~8-13 min) every run even though soldr's blessed_build extracts
      # an xwin-cache and exports XWIN_CACHE_DIR. cargo-xwin honors
      # XWIN_CACHE_DIR and writes to it, but the pre-shipped soldr-toolchain
      # tarball's layout doesn't match cargo-xwin's expectations, so it
      # re-populates the same dir. Cache the whole XWIN_CACHE_DIR parent
      # (soldr's `.complete` stamp + cargo-xwin's downloaded CRT/SDK) so
      # the second run and beyond skips the download entirely.
      #
      # Cache key embeds MANAGED_XWIN_CACHE_VERSION (2026-06-22 today —
      # bump when crates/soldr-cli/src/fetch/xwin_cache.rs changes).
      - name: Cache cargo-xwin MSVC CRT+SDK (via XWIN_CACHE_DIR)
        if: contains(inputs.target, 'pc-windows-msvc')
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/setup-soldr-soldr/sdk/${{ inputs.target }}/xwin/2026-06-22
          key: soldr-xwin-cache-${{ inputs.target }}-cargo-xwin-0.18.6-v2026-06-22

      # Bootstrap soldr from the current checkout. Darwin uses it to
      # drive `soldr prepare --target ... --github-env`. Windows MSVC
      # uses it to drive `soldr build --target X` (the blessed
      # cross-compile surface). The version that setup-soldr installs
      # (~v0.7.42 today) predates both subcommands so we need a fresh
      # binary from main HEAD. Bare cargo build to avoid a chicken-
      # and-egg with the wrapper.
      # soldr#1162 — cache the host-side bootstrap soldr + soldr-clang-shim.
      # Same story as #1160 / #1161 for baseline-zero-deps: three CI lanes
      # (apple-darwin x2 + windows-msvc x1) rebuild the identical host binaries
      # (~295 s each) with RUSTC_WRAPPER="", so there is no zccache to catch it.
      # When crates/**, Cargo.toml, Cargo.lock, rust-toolchain.toml are unchanged
      # a lane hits the cache and skips the 5-minute compile.
      - name: Restore cached bootstrap soldr binaries
        id: bootstrap_cache
        if: contains(inputs.target, 'apple-darwin') || contains(inputs.target, 'pc-windows-msvc')
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/soldr-bin
          key: bootstrap-soldr-blessed-linux-gnu-${{ hashFiles('crates/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}

      # soldr#1194 — dogfood: use the pinned setup-soldr `soldr` (v0.7.42
       # today, resolved via `zackees/setup-soldr@cca74625`) to drive the
       # bootstrap compile. The pinned soldr auto-injects RUSTC_WRAPPER=
       # zccache, so bootstrap gets seed hits on shared crates instead of
       # rebuilding ~700 crates from scratch each cache-miss run.
      # `soldr cargo build` is a plain passthrough that v0.7.42 already
      # supports; it does not require the `soldr build` subcommand (which
      # arrived later — that's what THIS bootstrap step is producing for
      # the downstream Cross-build release binary step).
      - name: Bootstrap soldr for SDK / blessed-build prep
        if: (contains(inputs.target, 'apple-darwin') || contains(inputs.target, 'pc-windows-msvc')) && steps.bootstrap_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          soldr cargo build --release --locked --package soldr-cli \
            --bin soldr --bin soldr-clang-shim \
            --target x86_64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/soldr-bin"
          cp target/x86_64-unknown-linux-gnu/release/soldr "$RUNNER_TEMP/soldr-bin/soldr"
          # blessed_build::install_clang_shim looks for soldr-clang-shim
          # next to the soldr exe. Without it, `soldr build` errors with
          # "soldr-clang-shim binary not found".
          cp target/x86_64-unknown-linux-gnu/release/soldr-clang-shim "$RUNNER_TEMP/soldr-bin/soldr-clang-shim"

      - name: Expose bootstrap soldr on PATH
        if: contains(inputs.target, 'apple-darwin') || contains(inputs.target, 'pc-windows-msvc')
        shell: bash
        run: |
          set -euo pipefail
          test -x "$RUNNER_TEMP/soldr-bin/soldr" || chmod +x "$RUNNER_TEMP/soldr-bin/soldr"
          test -x "$RUNNER_TEMP/soldr-bin/soldr-clang-shim" || chmod +x "$RUNNER_TEMP/soldr-bin/soldr-clang-shim"
          echo "$RUNNER_TEMP/soldr-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/soldr-bin/soldr" --version

      # Persistent zig-cc wrapper scripts for the zigbuild-driven
      # targets (musl + aarch64-linux-gnu). Darwin is intentionally
      # excluded: it goes through `soldr build` which handles SDK +
      # CC injection internally via blessed_build.rs. Setting
      # CC_<triple>=zig-wrapper on darwin overrode the clang-with-
      # -isysroot env that blessed_build.rs sets and broke
      # libmimalloc-sys' CommonCrypto include resolution.
      - name: Setup persistent zig-cc wrappers (musl + linux-gnu aarch64)
        if: contains(inputs.target, 'linux-musl') || (contains(inputs.target, 'linux-gnu') && contains(inputs.target, 'aarch64'))
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/make_zig_cc_wrappers.sh "${{ inputs.target }}"

      # Darwin used to need:
      #   - Prepare Apple SDK  (soldr prepare --github-env)
      #   - Inject SDKROOT into CFLAGS_<t>
      # Both are gone now. `soldr build` does the SDK fetch + sets
      # CC_<t>=clang + CFLAGS_<t>=-isysroot+--target+-fuse-ld=lld
      # internally via blessed_build::prepare. Workflow-level env
      # injection of the old zigbuild path would override those and
      # re-break the build.

      # For musl + aarch64-gnu (every linux zigbuild target): suppress
      # rustc's self-contained crt files. Zig already supplies its own
      # crt1.o via `-target X`; without this, the linker sees BOTH and
      # fails with "duplicate symbol: _start". soldr#1068.
      - name: Disable rustc self-contained crt (musl + aarch64-gnu)
        if: contains(inputs.target, 'linux-musl') || (contains(inputs.target, 'linux-gnu') && contains(inputs.target, 'aarch64'))
        shell: bash
        run: |
          set -euo pipefail
          target_u_upper=$(echo "${{ inputs.target }}" | tr '-' '_' | tr '[:lower:]' '[:upper:]')
          echo "CARGO_TARGET_${target_u_upper}_RUSTFLAGS=-C link-self-contained=no" >> "$GITHUB_ENV"

      # Stage A — lint intentionally NOT run here. `cargo fmt --check` and
      # `cargo clippy --workspace --all-targets` are both covered by the
      # required top-level Lint job in ci.yml, which is a stricter blocker
      # (Lint denies warnings via `-D warnings` where the old per-lane
      # clippy did not). Duplicating them per lane cost ~1-2 s of fmt +
      # ~90 s of clippy per lane for no additional safety. See soldr#1180
      # (fmt) + soldr#1164 (clippy).
      # `-p soldr-cli` scope filter documented in soldr#1066.

      # Host clippy is intentionally NOT run here. It's already covered by
      # the top-level `Lint` job in ci.yml (`soldr cargo clippy --workspace
      # --all-targets --locked -- -D warnings` — a strict superset of what
      # this file used to run). Duplicating clippy on every cross-build
      # lane cost ~90 s × 6 lanes for no additional safety. soldr#1164.
      # See soldr#1068 for the reason clippy must stay HOST-only (never
      # `--target X`) on cross-build workflows.

      # Stage B — release binary build, tool dispatched per target.
      # Windows MSVC + Apple Darwin: `soldr build` (the blessed cross-
      # compile surface per CLAUDE.md "Two build paths" — handles
      # xwin-cache + clang shim + lld-link for win, and Apple SDK +
      # clang + lld for darwin, via blessed_build.rs). Darwin needs
      # `soldr build` after #1112: mimalloc joined the dep tree via
      # zccache, and libmimalloc-sys' build script #include's
      # `CommonCrypto/CommonCryptoError.h` which lives in the real
      # Apple SDK but NOT in zig's bundled minimal darwin sysroot.
      # `cargo zigbuild` fails to compile mimalloc; `soldr build`
      # exports SDKROOT + CC_<triple>=clang and finds the header.
      - name: Cross-build release binary
        shell: bash
        run: |
          set -euo pipefail
          target='${{ inputs.target }}'
          if [[ "$target" == *-pc-windows-msvc ]] \
             || [[ "$target" == *-apple-darwin ]]; then
            soldr build --release --target "$target" \
              --package soldr-cli --bin soldr
          elif [[ "$target" == *-unknown-linux-musl ]] \
               || [[ "$target" == aarch64-unknown-linux-gnu ]]; then
            # soldr#1207 — dogfood: route zigbuild through soldr so
            # RUSTC_WRAPPER=zccache lands on host-side build.rs +
            # proc-macro compiles. Cross-target rustc calls still
            # miss the seed (different rustc inputs), but the
            # HOST-triple compilation surface picks up hits. soldr
            # defers to the PATH-installed cargo-zigbuild@0.23.0 by
            # default so the underlying binary is identical to
            # bare-cargo mode.
            soldr cargo zigbuild --release --target "$target" \
              --package soldr-cli --bin soldr
          else
            cargo build --release --target "$target" \
              --package soldr-cli --bin soldr
          fi
          suffix=""
          case "$target" in *-pc-windows-msvc) suffix=".exe" ;; esac
          ls -la "target/$target/release/soldr$suffix"
          file "target/$target/release/soldr$suffix"

      # Stage C — test binary archive (consumed by _ci-target-run.yml).
      # Skipped for windows-msvc: `cargo nextest archive` doesn't go
      # through `cargo xwin`, so it can't find MSVC `lib.exe` on
      # linux. Tracked under #1068; will switch to `soldr build`-style
      # blessed env-var injection in a follow-up.
      # Skip for windows-msvc + apple-darwin: cargo nextest archive
      # doesn't go through soldr build's blessed env injection, so it
      # can't find MSVC lib.exe (windows) or Apple SDK CommonCrypto
      # headers (darwin). The target-run lane falls back to a
      # `soldr --version` smoke test for these targets. Tracked as
      # #1068 (windows) and the post-#1112 mimalloc dep tree (darwin).
      - name: Build nextest archive
        if: inputs.build_test_archive && !contains(inputs.target, 'pc-windows-msvc') && !contains(inputs.target, 'apple-darwin')
        shell: bash
        env:
          # soldr#1168 — drop full DWARF from test binaries so the
          # tar.zst archive shrinks from ~3.4 GB to ~1 GB. `line-tables-
          # only` keeps enough info for backtraces to show file:line in
          # the target-run lane, which is the main triage need there.
          # Env-scoped to this step so local `cargo test` still gets
          # full debuginfo.
          CARGO_PROFILE_TEST_DEBUG: line-tables-only
        run: |
          set -euo pipefail
          mkdir -p dist
          target='${{ inputs.target }}'
          archive="dist/${{ inputs.artifact_name }}-tests.tar.zst"
          cargo nextest archive \
            --target "$target" \
            --workspace \
            --archive-file "$archive" \
            --archive-format tar-zst
          ls -la "$archive"

      # Stage D — stage + upload artifact bundle
      - name: Stage artifact bundle
        shell: bash
        run: |
          set -euo pipefail
          target='${{ inputs.target }}'
          suffix=""
          case "$target" in *-pc-windows-msvc) suffix=".exe" ;; esac
          mkdir -p dist/package
          cp "target/$target/release/soldr$suffix" "dist/package/soldr$suffix"
          chmod +x "dist/package/soldr$suffix" 2>/dev/null || true
          # Fixtures go alongside the binary so the target-run job can
          # set SOLDR_TEST_FIXTURES_DIR via the helper from #1040.
          if [ -d crates/soldr-cli/tests/fixtures ]; then
            cp -R crates/soldr-cli/tests/fixtures dist/package/fixtures
          fi
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            dist/package/
            dist/${{ inputs.artifact_name }}-tests.tar.zst
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
