# soldr#1051 / #1038: consolidated linux cross-build for all 8 targets.
#
# One ubuntu-24.04 job per target triple that does the whole every-commit
# pipeline for that target in a single runner spin-up. Target dispatch
# table:
#
#   *-unknown-linux-gnu (x86_64 native)  -> plain cargo
#   *-unknown-linux-gnu (aarch64 cross)  -> cargo zigbuild
#   *-unknown-linux-musl                 -> cargo zigbuild
#   *-apple-darwin                       -> cargo zigbuild + apple-sdk + persistent zig-cc wrappers
#   *-pc-windows-msvc                    -> cargo xwin
#
# Output: release binary at target/<triple>/release/soldr[.exe] + an
# optional cargo nextest archive at dist/<artifact_name>-tests.tar.zst.
# Both are uploaded as the named artifact for downstream
# _ci-target-run.yml consumption.

name: CI cross-build (linux host)

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
        description: Target triple to cross-build for.
      artifact_name:
        type: string
        required: true
        description: Name to use for the uploaded artifact.
      build_test_archive:
        type: boolean
        default: true
        description: |
          Build a `cargo nextest archive` of test binaries alongside
          the release binary. Set false to skip — useful for lanes
          that don't run tests downstream.
      source_ref:
        type: string
        default: ""
        description: |
          Optional commit SHA to checkout. Defaults to the workflow's
          implicit ref via actions/checkout default behavior.

permissions:
  contents: read

jobs:
  cross-build:
    name: cross-build ${{ inputs.target }} (linux host)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive
          ref: ${{ inputs.source_ref != '' && inputs.source_ref || github.sha }}

      # soldr#1061 phase A: replaced the bare dtolnay/rust-toolchain
      # + Swatinem cargo-cache pair with setup-soldr's integrated
      # `prebuild-deps: soldr-cook` flow. setup-soldr handles:
      #   1. Rust toolchain install (1.94.1 per rust-toolchain.toml)
      #   2. cargo registry + target cache (actions/cache@v4 keyed on
      #      Cargo.lock + rustc + target)
      #   3. `soldr cook` hydration — restores prebuilt
      #      target/<triple>/release/build/*/out/ artifacts (the cc-rs
      #      outputs from zstd-sys, libsqlite3-sys, tikv-jemalloc-sys,
      #      ring, etc.) so cargo build doesn't recompile C source on
      #      every PR.
      # Without this, every cross-build lane spent 45-70s/lane on
      # cc-rs invocations that produced bit-identical outputs to
      # the previous PR. soldr#1061 gap analysis: ~2h/day of CI
      # wallclock burned across the 8-lane matrix.
      - name: Setup soldr build cache (Rust toolchain + cook hydration)
        uses: zackees/setup-soldr@cca74625e75e70b56f1805fa6eeee9069f945d48
        with:
          toolchain: 1.94.1
          cache: true
          zccache-seed-strict: true
          cache-key-suffix: ci-cross-${{ inputs.target }}
          prebuild-deps: soldr-cook
          prebuild-deps-flags: ""

      # `prebuild-deps: soldr-cook` runs cargo-chef under the hood,
      # which replaces every workspace crate's main.rs / lib.rs / build.rs
      # with `fn main() {}` stubs while it cooks dependency layers. The
      # cook step doesn't restore the originals — soldr#1066. Without
      # this `git restore` the subsequent `cargo fmt --check` sees the
      # stubs (missing trailing newlines, lone `fn main() {}` content)
      # and fails. The ci.yml `lint` job uses the identical pattern.
      - name: Restore checkout after soldr-cook
        shell: bash
        run: git restore --worktree -- .

      - name: Add cross-compile target
        shell: bash
        run: rustup target add ${{ inputs.target }}

      - name: Install apt deps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file jq xz-utils bzip2 zip unzip \
            ca-certificates curl git \
            musl-tools cmake perl \
            clang lld llvm llvm-dev libclang-dev

      # zig + cargo-zigbuild — required for musl, darwin, and aarch64
      # gnu cross-builds.
      - name: Setup zig
        if: contains(inputs.target, 'musl') || contains(inputs.target, 'apple-darwin') || (contains(inputs.target, 'linux-gnu') && contains(inputs.target, 'aarch64'))
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      - name: Install cargo-zigbuild
        if: contains(inputs.target, 'musl') || contains(inputs.target, 'apple-darwin') || (contains(inputs.target, 'linux-gnu') && contains(inputs.target, 'aarch64'))
        uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2
        with:
          tool: cargo-zigbuild@0.23.0

      # cargo-xwin — required for *-pc-windows-msvc.
      - name: Install cargo-xwin
        if: contains(inputs.target, 'pc-windows-msvc')
        uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2
        with:
          tool: cargo-xwin@0.18.6

      # nextest — required for the test archive output.
      - name: Install cargo-nextest
        if: inputs.build_test_archive
        uses: taiki-e/install-action@bffeee26d4db9be238a4ea78d8826604ebcb594d # v2
        with:
          tool: cargo-nextest

      # Bootstrap soldr from the current checkout (only for darwin —
      # used to drive `soldr prepare --target ... --github-env` which
      # materializes the apple SDK via the catalogue + exports SDKROOT
      # to subsequent steps). Bare cargo build to avoid a chicken-and-
      # egg with the wrapper.
      - name: Bootstrap soldr for SDK prep (darwin only)
        if: contains(inputs.target, 'apple-darwin')
        shell: bash
        env:
          RUSTC_WRAPPER: ""
        run: |
          set -euo pipefail
          cargo build --release --locked --package soldr-cli --bin soldr \
            --target x86_64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/soldr-bin"
          cp target/x86_64-unknown-linux-gnu/release/soldr "$RUNNER_TEMP/soldr-bin/soldr"
          chmod +x "$RUNNER_TEMP/soldr-bin/soldr"
          echo "$RUNNER_TEMP/soldr-bin" >> "$GITHUB_PATH"

      # Apple SDK fetch for darwin targets — soldr prepare materializes
      # it via the catalogue + exports SDKROOT.
      - name: Prepare Apple SDK (darwin only)
        if: contains(inputs.target, 'apple-darwin')
        shell: bash
        run: |
          set -euo pipefail
          soldr prepare --target ${{ inputs.target }} --github-env "$GITHUB_ENV"

      # Persistent zig-cc wrapper scripts for every zigbuild target
      # (darwin + musl + aarch64-linux-gnu). soldr#1043 / #1068.
      # Required so cargo clippy / nextest archive's cc-rs invocations
      # find a cross-cc (`zig cc -target X`) rather than expecting
      # `aarch64-linux-gnu-gcc` etc. on the host.
      - name: Setup persistent zig-cc wrappers
        if: contains(inputs.target, 'apple-darwin') || contains(inputs.target, 'linux-musl') || (contains(inputs.target, 'linux-gnu') && contains(inputs.target, 'aarch64'))
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/make_zig_cc_wrappers.sh "${{ inputs.target }}"

      # For darwin: ensure SDKROOT propagates to cc-rs via -isysroot in
      # CFLAGS_<t>, so jemalloc / other C deps with autoconf-emitted
      # `#include <sys/syscall.h>` resolve against the Apple SDK rather
      # than the linux host headers. soldr#1068.
      - name: Inject SDKROOT into CFLAGS (darwin only)
        if: contains(inputs.target, 'apple-darwin')
        shell: bash
        run: |
          set -euo pipefail
          target_u=$(echo "${{ inputs.target }}" | tr '-' '_')
          if [ -n "${SDKROOT:-}" ]; then
            echo "CFLAGS_${target_u}=-isysroot $SDKROOT" >> "$GITHUB_ENV"
            echo "CXXFLAGS_${target_u}=-isysroot $SDKROOT" >> "$GITHUB_ENV"
          fi

      # For musl + aarch64-gnu (every linux zigbuild target): suppress
      # rustc's self-contained crt files. Zig already supplies its own
      # crt1.o via `-target X`; without this, the linker sees BOTH and
      # fails with "duplicate symbol: _start". soldr#1068.
      - name: Disable rustc self-contained crt (musl + aarch64-gnu)
        if: contains(inputs.target, 'linux-musl') || (contains(inputs.target, 'linux-gnu') && contains(inputs.target, 'aarch64'))
        shell: bash
        run: |
          set -euo pipefail
          target_u_upper=$(echo "${{ inputs.target }}" | tr '-' '_' | tr '[:lower:]' '[:upper:]')
          echo "CARGO_TARGET_${target_u_upper}_RUSTFLAGS=-C link-self-contained=no" >> "$GITHUB_ENV"

      # Stage A — lint
      # `-p soldr-cli` instead of `--all`: soldr-cli has a `path`
      # dependency on `_vender/zccache/crates/zccache`, and although
      # `_vender/zccache` is in `workspace.exclude`, `cargo fmt --all`
      # still walks the path-dep target and flags rustfmt drift in
      # submodule sources we do not own. See soldr#1066.
      - name: cargo fmt --check
        run: cargo fmt -p soldr-cli -- --check

      # Host clippy, NOT `--target ${{ inputs.target }}`. Running
      # clippy against a cross target requires the C cross-toolchain
      # for every *-sys / ring build script. The cross-build lane below
      # dispatches to cargo-xwin / cargo-zigbuild for the actual cross-
      # compile; clippy only needs the host toolchain to catch
      # source-level lint issues. soldr#1068.
      - name: cargo clippy (host)
        run: cargo clippy --workspace --all-targets

      # Stage B — release binary build, tool dispatched per target.
      # Windows MSVC: `soldr build` (the blessed cross-compile surface
      # per CLAUDE.md "Two build paths" — handles xwin-cache + clang
      # shim + lld-link env vars internally). Avoids cargo-xwin's CFLAGS
      # `/imsvc <path>` token-concatenation bug for aarch64. #1070.
      - name: Cross-build release binary
        shell: bash
        run: |
          set -euo pipefail
          target='${{ inputs.target }}'
          if [[ "$target" == *-pc-windows-msvc ]]; then
            soldr build --release --target "$target" \
              --package soldr-cli --bin soldr
          elif [[ "$target" == *-apple-darwin ]] \
               || [[ "$target" == *-unknown-linux-musl ]] \
               || [[ "$target" == aarch64-unknown-linux-gnu ]]; then
            cargo zigbuild --release --target "$target" \
              --package soldr-cli --bin soldr
          else
            cargo build --release --target "$target" \
              --package soldr-cli --bin soldr
          fi
          suffix=""
          case "$target" in *-pc-windows-msvc) suffix=".exe" ;; esac
          ls -la "target/$target/release/soldr$suffix"
          file "target/$target/release/soldr$suffix"

      # Stage C — test binary archive (consumed by _ci-target-run.yml).
      # Skipped for windows-msvc: `cargo nextest archive` doesn't go
      # through `cargo xwin`, so it can't find MSVC `lib.exe` on
      # linux. Tracked under #1068; will switch to `soldr build`-style
      # blessed env-var injection in a follow-up.
      - name: Build nextest archive
        if: inputs.build_test_archive && !contains(inputs.target, 'pc-windows-msvc')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          target='${{ inputs.target }}'
          archive="dist/${{ inputs.artifact_name }}-tests.tar.zst"
          cargo nextest archive \
            --target "$target" \
            --workspace \
            --archive-file "$archive" \
            --archive-format tar-zst
          ls -la "$archive"

      # Stage D — stage + upload artifact bundle
      - name: Stage artifact bundle
        shell: bash
        run: |
          set -euo pipefail
          target='${{ inputs.target }}'
          suffix=""
          case "$target" in *-pc-windows-msvc) suffix=".exe" ;; esac
          mkdir -p dist/package
          cp "target/$target/release/soldr$suffix" "dist/package/soldr$suffix"
          chmod +x "dist/package/soldr$suffix" 2>/dev/null || true
          # Fixtures go alongside the binary so the target-run job can
          # set SOLDR_TEST_FIXTURES_DIR via the helper from #1040.
          if [ -d crates/soldr-cli/tests/fixtures ]; then
            cp -R crates/soldr-cli/tests/fixtures dist/package/fixtures
          fi
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            dist/package/
            dist/${{ inputs.artifact_name }}-tests.tar.zst
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
