name: Soldr Perf Cluster

# See perf/README.md for the design and what each cell is supposed
# to prove. Workers receive a soldr binary built once (and cached!)
# by the master job and exercise every selected scenario for one
# (platform, fixture) cell in a single runner. Grouping by
# (platform, fixture) instead of per-scenario amortises runner
# startup, toolchain install, soldr download, and apt-get over all
# selected scenarios for that fixture; each scenario still gets a
# clean per-scenario workdir + cache root so isolation is preserved.
#
# Triggered by `workflow_dispatch` (manual button) and by pushes to
# `main` / `perf/**` / `evaluate/**`. ci.yml has a matching
# `branches-ignore` so perf branches only run this workflow.
#
# Input UI: GHA does not support multi-select. Platforms and fixtures
# are `choice` dropdowns (their enums are tiny; `all` is the only
# multi-value case). Scenarios are three booleans so arbitrary
# subsets like "cold-tar-untar-warm + worktree-share" are
# expressible. Push events leave every `inputs.X` empty — gate steps
# treat empty as the dispatch default (`linux` / `all` / scenario
# enabled) via `inputs.X || '<default>'` and `:-true` bash fallbacks.

on:
  workflow_dispatch:
    inputs:
      platforms:
        # mac-x86 is intentionally not listed (Intel macs are EOL on
        # GHA's roadmap). Until a matrix row exists for a given
        # platform its cells gate themselves out via the
        # bench/build-soldr gate steps, so the dispatch UI stays
        # stable as cross-platform RSS pollers land in
        # perf/lib/common.sh.
        description: Platform subset
        type: choice
        required: true
        default: linux
        options:
          - all
          - linux
          - mac-arm
          - win
      fixtures:
        description: Fixture subset
        type: choice
        required: true
        default: all
        options:
          - all
          - medium
          - sqlite-link
      scenarios:
        # Single-select dropdown to match the platforms / fixtures
        # shape. Arbitrary subsets (e.g. "cold + worktree but not
        # touch") aren't expressible here today — pick `all` or one
        # specific scenario. If subsets become a regular need, swap
        # back to per-scenario booleans.
        description: Scenario subset
        type: choice
        required: true
        default: all
        options:
          - all
          - cold-tar-untar-warm
          - worktree-share
          - touch-no-change
      debug:
        description: Verbose tracing + retain raw RSS CSVs
        type: boolean
        required: true
        default: false
  push:
    branches:
      - main
      - 'perf/**'
      - 'evaluate/**'
    paths:
      - '.github/workflows/perf-cluster.yml'
      - 'perf/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'

permissions:
  contents: read

concurrency:
  # Never cancel a perf run in flight — every measurement is a data
  # point we want to keep, even if a follow-up push lands before this
  # one finishes. Runs queue per-ref instead of superseding.
  group: perf-cluster-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-soldr:
    name: build-soldr (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        # Currently ships linux only; win / mac-arm / mac-x86 rows
        # drop in here once perf/lib/common.sh has cross-platform
        # RSS pollers. The dispatch input still accepts those names
        # so the surface stays stable.
        include:
          - platform: linux
            runs_on: ubuntu-24.04
    runs-on: ${{ matrix.runs_on }}
    steps:
      # Platform gate is a step (not job-level `if:`) because GHA
      # rejects `matrix.X` references in job-level `if:` expressions
      # with "Unrecognized named-value: 'matrix'", even though the
      # same context is available at `runs-on:` and inside step
      # `if:` blocks. Mirrors the gate-step pattern used by the
      # bench job below.
      - name: Gate cell against dispatch inputs
        id: gate
        env:
          REQ_PLATFORMS: ${{ inputs.platforms || 'linux' }}
          M_PLATFORM:    ${{ matrix.platform }}
        run: |
          if [[ "${REQ_PLATFORMS}" == "all" ]] \
             || [[ ",${REQ_PLATFORMS}," == *",${M_PLATFORM},"* ]]; then
            echo "selected=true" >> "$GITHUB_OUTPUT"
          else
            echo "selected=false" >> "$GITHUB_OUTPUT"
            echo "Platform ${M_PLATFORM} not selected by dispatch input '${REQ_PLATFORMS}'; skipping build." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.gate.outputs.selected == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        if: steps.gate.outputs.selected == 'true'
        run: |
          rustup show active-toolchain || rustup toolchain install stable --profile minimal --no-self-update

      # Layer 1: actions/cache keyed by the source-of-truth files that
      # determine the soldr binary. Same source on the same platform =
      # zero-compile restore of the prebuilt binary. PRs that only
      # touch perf/ reuse a cached binary indefinitely.
      - name: Restore cached soldr binary
        if: steps.gate.outputs.selected == 'true'
        id: soldr-bin-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: target/release/soldr
          key: soldr-bin-${{ matrix.platform }}-${{ hashFiles('crates/**', 'Cargo.toml', 'Cargo.lock') }}

      # Layer 2: cache cargo intermediates (registry, target/) so a
      # cache-miss rebuild is incremental, not from scratch. Only
      # exercised when the binary cache misses. Soldr itself is NOT
      # used here on purpose — perf must work even when soldr is
      # broken or absent on a new platform.
      - name: Restore cargo intermediates
        if: steps.gate.outputs.selected == 'true' && steps.soldr-bin-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: perf-build-soldr-${{ matrix.platform }}

      - name: Build soldr (release)
        if: steps.gate.outputs.selected == 'true' && steps.soldr-bin-cache.outputs.cache-hit != 'true'
        run: cargo build --release -p soldr-cli

      - name: Stage binary
        if: steps.gate.outputs.selected == 'true'
        run: |
          mkdir -p soldr-artifact
          cp target/release/soldr soldr-artifact/soldr
          chmod +x soldr-artifact/soldr
          soldr-artifact/soldr version --json | tee soldr-artifact/version.json

      - name: Upload soldr binary
        if: steps.gate.outputs.selected == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: soldr-bin-${{ matrix.platform }}
          path: soldr-artifact/
          retention-days: 7

  bench:
    name: bench (${{ matrix.platform }} / ${{ matrix.fixture }})
    needs: build-soldr
    strategy:
      fail-fast: false
      matrix:
        platform: [linux]
        fixture: [medium, sqlite-link]
        include:
          - platform: linux
            runs_on: ubuntu-24.04
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Gate cell against dispatch inputs
        id: gate
        env:
          REQ_PLATFORMS: ${{ inputs.platforms || 'linux' }}
          REQ_FIXTURES:  ${{ inputs.fixtures  || 'all' }}
          REQ_SCENARIOS: ${{ inputs.scenarios || 'all' }}
          REF_NAME:      ${{ github.ref_name }}
          M_PLATFORM:    ${{ matrix.platform }}
          M_FIXTURE:     ${{ matrix.fixture }}
        run: |
          in_subset() {
            local req="$1" val="$2"
            [[ "${req}" == "all" ]] && return 0
            [[ ",${req}," == *",${val},"* ]] && return 0
            return 1
          }

          # Branch-aware narrowing: `perf/<axis-value>/**` (or
          # `perf/<axis-value>-**`) forces the corresponding axis to
          # that value, overriding the dispatch input. Push events
          # get this for free; dispatching `fixtures=all` from a
          # perf/sqlite/foo branch still runs sqlite-link only.
          # Extend this case for new fixtures/scenarios as needed.
          if   [[ "${REF_NAME}" =~ ^perf/sqlite(/|-) ]]; then
            echo "Branch ${REF_NAME} narrows fixtures -> sqlite-link"
            REQ_FIXTURES="sqlite-link"
          elif [[ "${REF_NAME}" =~ ^perf/medium(/|-) ]]; then
            echo "Branch ${REF_NAME} narrows fixtures -> medium"
            REQ_FIXTURES="medium"
          fi

          # Cell is gated on (platform, fixture) only. Scenarios that
          # are not selected are filtered out of the per-cell loop
          # below, so a cell with zero selected scenarios still skips
          # the rest of the steps but does not consume bench-time.
          ALL_SCENARIOS="cold-tar-untar-warm worktree-share touch-no-change"
          selected_scenarios=""
          for s in ${ALL_SCENARIOS}; do
            if in_subset "${REQ_SCENARIOS}" "${s}"; then
              selected_scenarios="${selected_scenarios:+${selected_scenarios} }${s}"
            fi
          done

          if in_subset "${REQ_PLATFORMS}" "${M_PLATFORM}" \
             && in_subset "${REQ_FIXTURES}" "${M_FIXTURE}" \
             && [[ -n "${selected_scenarios}" ]]; then
            echo "selected=true" >> "$GITHUB_OUTPUT"
            echo "scenarios=${selected_scenarios}" >> "$GITHUB_OUTPUT"
          else
            echo "selected=false" >> "$GITHUB_OUTPUT"
            echo "Cell (${M_PLATFORM}, ${M_FIXTURE}) not selected by dispatch inputs (or zero matching scenarios); skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.gate.outputs.selected == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        if: steps.gate.outputs.selected == 'true'
        run: |
          # Workers need cargo on PATH so soldr cargo can dispatch to
          # it. Soldr fetches/manages zccache itself on first use.
          rustup show active-toolchain || rustup toolchain install stable --profile minimal --no-self-update

      - name: Install fixture native deps
        if: steps.gate.outputs.selected == 'true' && matrix.fixture == 'sqlite-link'
        run: |
          # rusqlite's `bundled` feature compiles libsqlite3 from C
          # via cc-rs. ubuntu-24.04 ships gcc already, but be
          # explicit so a future image change does not silently break
          # this row.
          which gcc || sudo apt-get install -y gcc

      - name: Download soldr binary
        if: steps.gate.outputs.selected == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: soldr-bin-${{ matrix.platform }}
          path: soldr-bin

      - name: Stage soldr on PATH
        if: steps.gate.outputs.selected == 'true'
        run: |
          chmod +x soldr-bin/soldr
          mkdir -p "$HOME/.local/bin"
          cp soldr-bin/soldr "$HOME/.local/bin/soldr"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify soldr is the artifact build
        if: steps.gate.outputs.selected == 'true'
        run: |
          which soldr
          soldr version --json

      - name: Run selected scenarios
        if: steps.gate.outputs.selected == 'true'
        id: run
        env:
          SOLDR_DEBUG: ${{ inputs.debug == true && '1' || '' }}
          SELECTED_SCENARIOS: ${{ steps.gate.outputs.scenarios }}
          M_PLATFORM: ${{ matrix.platform }}
          M_FIXTURE: ${{ matrix.fixture }}
        run: |
          set -o pipefail

          out_root="${RUNNER_TEMP}/perf-${M_PLATFORM}-${M_FIXTURE}"
          mkdir -p "${out_root}"
          echo "out_root=${out_root}" >> "$GITHUB_OUTPUT"

          # One header for the cell; each scenario appends a row via
          # measure::append_summary_md.
          {
            echo "## ${M_PLATFORM} / ${M_FIXTURE}"
            echo
            echo "| scenario | cold/A ms | warm/B ms | speedup | hits/misses | hit rate | peak daemon RSS |"
            echo "| --- | --- | --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          status=0
          for scenario in ${SELECTED_SCENARIOS}; do
            # Per-scenario workdir keeps cache dirs / tarball / RSS
            # CSV isolated even though all scenarios share this runner.
            workdir="${out_root}/${scenario}"
            mkdir -p "${workdir}"
            bash perf/lib/extract.sh "${M_FIXTURE}" "${workdir}"

            echo "::group::scenario: ${scenario}"
            if bash "perf/scenarios/${scenario}/run.sh" "${workdir}/${M_FIXTURE}" \
                 | tee "${workdir}/result.json"; then
              :
            else
              # Don't abort the loop on a single scenario failure —
              # the other scenarios on this fixture are independent
              # signals worth collecting. Final exit status reflects
              # the worst case.
              echo "scenario ${scenario} failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "${status}"

      - name: Upload raw results
        if: steps.gate.outputs.selected == 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-results-${{ matrix.platform }}-${{ matrix.fixture }}
          path: |
            ${{ steps.run.outputs.out_root }}/*/result.json
            ${{ steps.run.outputs.out_root }}/*/*-shutdown.json
            ${{ steps.run.outputs.out_root }}/*/rss-*.csv
          if-no-files-found: warn
          retention-days: 14

  evaluate:
    # Per-fixture gate: pull each scenario's result.json and check the
    # warm-vs-cold speedup against MIN_SPEEDUP. cold-tar-untar-warm is
    # the hard gate (fails the workflow); worktree-share and
    # touch-no-change are soft today (::warning::) — they'll be
    # promoted to hard once their baselines are trusted. Matrix has
    # one row per fixture so each fixture's "Evaluate" cell shows up
    # as its own check in the GHA UI.
    name: Evaluate ${{ matrix.fixture }}
    needs: bench
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runs_on: ubuntu-24.04
            fixture: medium
            min_speedup: "3.0"
          - platform: linux
            runs_on: ubuntu-24.04
            fixture: sqlite-link
            min_speedup: "3.0"
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Gate cell against dispatch inputs
        id: gate
        env:
          REQ_PLATFORMS: ${{ inputs.platforms || 'linux' }}
          REQ_FIXTURES:  ${{ inputs.fixtures  || 'all' }}
          REF_NAME:      ${{ github.ref_name }}
          M_PLATFORM:    ${{ matrix.platform }}
          M_FIXTURE:     ${{ matrix.fixture }}
        run: |
          in_subset() {
            local req="$1" val="$2"
            [[ "${req}" == "all" ]] && return 0
            [[ ",${req}," == *",${val},"* ]] && return 0
            return 1
          }

          # Branch-aware fixture narrowing — must match bench gate.
          if   [[ "${REF_NAME}" =~ ^perf/sqlite(/|-) ]]; then
            REQ_FIXTURES="sqlite-link"
          elif [[ "${REF_NAME}" =~ ^perf/medium(/|-) ]]; then
            REQ_FIXTURES="medium"
          fi

          # Scenario subset is evaluated per-scenario inside the
          # assertion step (each scenario emits its own JSON), so the
          # cell-level gate only checks platform + fixture.
          if in_subset "${REQ_PLATFORMS}" "${M_PLATFORM}" \
             && in_subset "${REQ_FIXTURES}"  "${M_FIXTURE}"; then
            echo "selected=true" >> "$GITHUB_OUTPUT"
          else
            echo "selected=false" >> "$GITHUB_OUTPUT"
            echo "Evaluate (${M_PLATFORM}, ${M_FIXTURE}) not selected by dispatch inputs; skipping." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download perf results for ${{ matrix.fixture }}
        if: steps.gate.outputs.selected == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: perf-results-${{ matrix.platform }}-${{ matrix.fixture }}
          path: perf-results

      - name: Evaluate scenarios for ${{ matrix.fixture }}
        if: steps.gate.outputs.selected == 'true'
        env:
          MIN_SPEEDUP:   ${{ matrix.min_speedup }}
          REQ_SCENARIOS: ${{ inputs.scenarios || 'all' }}
          M_PLATFORM:    ${{ matrix.platform }}
          M_FIXTURE:     ${{ matrix.fixture }}
        run: |
          set -uo pipefail

          in_subset() {
            local req="$1" val="$2"
            [[ "${req}" == "all" ]] && return 0
            [[ ",${req}," == *",${val},"* ]] && return 0
            return 1
          }

          # scenario -> "fail" or "warn". cold-tar-untar-warm is the
          # only gate today; the others are soft until their baselines
          # stabilize (see workflow header).
          mode_for() {
            case "$1" in
              cold-tar-untar-warm) echo "fail" ;;
              worktree-share|touch-no-change) echo "warn" ;;
              *) echo "warn" ;;
            esac
          }

          # Each scenario emits a different (cold_key, warm_key) pair.
          # Centralizing here keeps the assertion loop scenario-agnostic.
          cold_key_for() {
            case "$1" in
              worktree-share) echo "a_ms" ;;
              *) echo "cold_ms" ;;
            esac
          }
          warm_key_for() {
            case "$1" in
              worktree-share) echo "b_ms" ;;
              *) echo "warm_ms" ;;
            esac
          }

          {
            echo "## Evaluate ${M_PLATFORM} / ${M_FIXTURE}"
            echo
            echo "| scenario | cold ms | warm ms | speedup | threshold | mode | result |"
            echo "| --- | --- | --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          status=0
          for scenario in cold-tar-untar-warm worktree-share touch-no-change; do
            if ! in_subset "${REQ_SCENARIOS}" "${scenario}"; then
              echo "scenario ${scenario} not selected by dispatch input; skipping"
              continue
            fi

            mode="$(mode_for "${scenario}")"
            cold_key="$(cold_key_for "${scenario}")"
            warm_key="$(warm_key_for "${scenario}")"

            result_json="$(find perf-results -type f -path "*/${scenario}/result.json" | head -n1)"
            if [[ -z "${result_json}" ]]; then
              echo "| ${scenario} | - | - | - | >= ${MIN_SPEEDUP}x | ${mode} | MISSING |" >> "$GITHUB_STEP_SUMMARY"
              if [[ "${mode}" == "fail" ]]; then
                echo "::error::${scenario}/result.json not found in ${M_FIXTURE} artifact"
                status=1
              else
                echo "::warning::${scenario}/result.json not found in ${M_FIXTURE} artifact"
              fi
              continue
            fi

            cold_ms="$(jq -r --arg k "${cold_key}" '.[$k] // empty' "${result_json}")"
            warm_ms="$(jq -r --arg k "${warm_key}" '.[$k] // empty' "${result_json}")"

            if [[ -z "${cold_ms}" || -z "${warm_ms}" ]]; then
              echo "| ${scenario} | ${cold_ms:--} | ${warm_ms:--} | - | >= ${MIN_SPEEDUP}x | ${mode} | BAD-JSON |" >> "$GITHUB_STEP_SUMMARY"
              if [[ "${mode}" == "fail" ]]; then
                echo "::error::${scenario} result.json missing ${cold_key}/${warm_key}"
                status=1
              else
                echo "::warning::${scenario} result.json missing ${cold_key}/${warm_key}"
              fi
              continue
            fi

            # Treat a 0ms warm build as a measurement bug, not a win.
            if (( warm_ms <= 0 )); then
              echo "| ${scenario} | ${cold_ms} | ${warm_ms} | - | >= ${MIN_SPEEDUP}x | ${mode} | BAD-WARM |" >> "$GITHUB_STEP_SUMMARY"
              if [[ "${mode}" == "fail" ]]; then
                echo "::error::${scenario} ${warm_key}=${warm_ms} is non-positive"
                status=1
              else
                echo "::warning::${scenario} ${warm_key}=${warm_ms} is non-positive"
              fi
              continue
            fi

            speedup="$(awk -v c="${cold_ms}" -v w="${warm_ms}" 'BEGIN { printf "%.2f", c / w }')"
            pass="$(awk -v s="${speedup}" -v t="${MIN_SPEEDUP}" 'BEGIN { print (s >= t) ? "1" : "0" }')"

            if [[ "${pass}" == "1" ]]; then
              echo "| ${scenario} | ${cold_ms} | ${warm_ms} | ${speedup}x | >= ${MIN_SPEEDUP}x | ${mode} | PASS |" >> "$GITHUB_STEP_SUMMARY"
              echo "${scenario}: ${speedup}x >= ${MIN_SPEEDUP}x — PASS"
            else
              if [[ "${mode}" == "fail" ]]; then
                echo "| ${scenario} | ${cold_ms} | ${warm_ms} | ${speedup}x | >= ${MIN_SPEEDUP}x | fail | FAIL |" >> "$GITHUB_STEP_SUMMARY"
                echo "::error::${scenario} (${M_FIXTURE}) only ${speedup}x faster (need >= ${MIN_SPEEDUP}x)"
                status=1
              else
                echo "| ${scenario} | ${cold_ms} | ${warm_ms} | ${speedup}x | >= ${MIN_SPEEDUP}x | warn | WARN |" >> "$GITHUB_STEP_SUMMARY"
                echo "::warning::${scenario} (${M_FIXTURE}) only ${speedup}x faster (need >= ${MIN_SPEEDUP}x); soft gate — not failing today"
              fi
            fi
          done

          exit "${status}"
