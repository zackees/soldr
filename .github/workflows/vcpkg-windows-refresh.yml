name: Refresh vcpkg Windows triplet bundles

# soldr#945 + soldr#946 — periodic producer for the
# vcpkg `x64-windows-static-md` + `arm64-windows-static-md`
# port bundles. This workflow lives in soldr proper (not in
# the soldr-toolchain forge framework) because vcpkg's MSVC
# triplets cannot be cross-compiled from a Linux runner — the
# port build needs real Windows.
#
# Trigger model: weekly + manual. The bundles change rarely
# (only when the pinned `vcpkg-pin.txt` list is bumped, or a
# port's own version bumps inside the pinned vcpkg baseline)
# so a weekly cadence is enough.
#
# Output destination: soldr-toolchain's `assets` branch under
#
#     deps/vcpkg/<triplet>/<baseline-sha>/bundle.tar.zst
#
# plus a `latest.txt` pointer at the most-recent baseline. The
# soldr-side fetcher (TBD module under `crates/soldr-cli/src/fetch/`)
# consumes those rows.
#
# The pin list lives at `.github/vcpkg-pin.txt` (one port per
# line). Bumping it is a manual PR — same pattern as the
# managed crgx / cargo-chef pins in CLAUDE.md's lockstep
# bookkeeping.

on:
  schedule:
    # Sundays 09:00 UTC — quietest window for GHA runners
    # and lets a Monday-morning consumer pick up the refresh.
    - cron: "0 9 * * 0"
  workflow_dispatch:
    inputs:
      triplets:
        description: "Comma-separated triplets to refresh (default: both)"
        required: false
        default: "x64-windows-static-md,arm64-windows-static-md"
        type: string
      vcpkg_baseline:
        description: "vcpkg baseline SHA (default: master HEAD at run time)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: refresh-vcpkg-windows
  cancel-in-progress: false

env:
  VCPKG_BINARY_SOURCES: clear
  VCPKG_DISABLE_METRICS: "1"

jobs:
  # soldr#1664: the `triplets` input used to be decorative — the matrix
  # below hard-coded both values, so asking for one triplet still paid
  # for a full Windows port build of both. This job turns the input into
  # the actual matrix, and rejects an unknown triplet rather than
  # silently refreshing something else.
  resolve-matrix:
    name: Resolve triplet matrix
    runs-on: ubuntu-latest
    # Checkout plus one resolver script; seconds in practice.
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Check out soldr (for the resolver script)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Resolve requested triplets
        id: resolve
        shell: bash
        run: |
          python3 .github/scripts/vcpkg_triplet_matrix.py \
            --triplets "${{ inputs.triplets }}" \
            --output "$GITHUB_OUTPUT"

  build-triplet:
    name: ${{ matrix.triplet }}
    needs: resolve-matrix
    # MUST be windows. Linux-side clang-cl triplets exist but
    # port coverage is too spotty for the pin list we ship.
    runs-on: windows-latest
    # Building the vcpkg port set from source is genuinely long:
    # observed max 60.6 min, p50 55.4 min over 9 runs (arm64 is the
    # slower triplet). A bound near the p50 would kill healthy runs,
    # so this is ~3x the observed max.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-matrix.outputs.matrix) }}
    steps:
      - name: Check out soldr (for the pin list)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up vcpkg
        shell: pwsh
        run: |
          $baseline = "${{ inputs.vcpkg_baseline }}"
          if (-not $baseline) {
            git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
            $baseline = (git -C "$env:RUNNER_TEMP\vcpkg" rev-parse HEAD).Trim()
          } else {
            git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
            git -C "$env:RUNNER_TEMP\vcpkg" checkout $baseline
          }
          echo "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" >> $env:GITHUB_ENV
          echo "VCPKG_BASELINE=$baseline" >> $env:GITHUB_ENV
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

      - name: Install ports
        shell: pwsh
        run: |
          $pinFile = ".github/vcpkg-pin.txt"
          if (-not (Test-Path $pinFile)) {
            Write-Error "missing $pinFile - add the port pin list before refreshing"
            exit 1
          }
          $ports = Get-Content $pinFile | Where-Object {
            $_ -and -not $_.StartsWith("#")
          }
          $portList = $ports -join " "
          Write-Host "Installing $portList for triplet ${{ matrix.triplet }}"
          & "$env:VCPKG_ROOT\vcpkg.exe" install $ports --triplet ${{ matrix.triplet }}

      - name: Package
        shell: pwsh
        run: |
          $installed = Join-Path $env:VCPKG_ROOT "installed/${{ matrix.triplet }}"
          if (-not (Test-Path $installed)) {
            Write-Error "vcpkg install did not produce $installed"
            exit 1
          }
          $outDir = Join-Path $env:RUNNER_TEMP "bundle"
          New-Item -ItemType Directory -Force $outDir | Out-Null
          $tarball = Join-Path $outDir "bundle.tar"
          tar -cf $tarball -C $installed .
          if (-not (Test-Path $tarball)) {
            Write-Error "tar produced no output at $tarball"
            exit 1
          }
          # zstd ships with GHA Windows runners since 2024.
          zstd -19 --rm $tarball -o "$outDir/bundle.tar.zst"
          $size = (Get-Item "$outDir/bundle.tar.zst").Length
          Write-Host "Bundle size: $size bytes"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_BASELINE }}
          path: ${{ runner.temp }}\bundle\bundle.tar.zst
          retention-days: 7

  publish:
    name: Publish to soldr vcpkg-bundles release
    needs: build-triplet
    runs-on: ubuntu-latest
    # Artifact download + release upload; observed max 0.4 min.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Stage + upload to vcpkg-bundles-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Publish to a rolling `vcpkg-bundles-latest` GitHub release on
        # this repo (zackees/soldr). The default `GITHUB_TOKEN` has
        # write access to current-repo releases, so this avoids the
        # cross-repo PAT (`SOLDR_TOOLCHAIN_PUSH_TOKEN`) the previous
        # design needed.
        #
        # soldr#2814 — two corrections to what this comment used to say,
        # because both sent a reader looking for things that are not there:
        #
        #   * it named a `fetch/vcpkg.rs` consumer that resolves these
        #     assets. No such file exists and none ever has (`git log --all`
        #     on that path is empty, and `crates/` contains no reference to
        #     vcpkg at all). Whether anything OUTSIDE this repo consumes the
        #     URLs is the open question on that issue.
        #   * it said each refresh "rotates the release tag forward so
        #     historical baselines remain accessible". The tag is the
        #     constant `vcpkg-bundles-latest`, so nothing rotates and no
        #     historical baseline is retained. The per-run baseline survives
        #     only inside the asset NAME
        #     (`vcpkg-{triplet}-{baseline}.tar.zst`).
        shell: bash
        run: |
          set -euo pipefail
          TAG="vcpkg-bundles-latest"
          mkdir -p staging
          for d in artifacts/vcpkg-*; do
            artifact_name=$(basename "$d")
            stripped="${artifact_name#vcpkg-}"
            baseline="${stripped##*-}"
            triplet="${stripped%-*}"
            staged="staging/vcpkg-${triplet}-${baseline}.tar.zst"
            cp "$d/bundle.tar.zst" "$staged"
            echo "${baseline}" > "staging/vcpkg-${triplet}-baseline.txt"
            ls -lh "$staged"
          done
          # Never delete the published bundles in order to replace them.
          #
          # soldr#2814: this used to `gh release delete --cleanup-tag` and then
          # `gh release create`. The create fails under immutable releases --
          #
          #     tag_name was used by an immutable release
          #     Cannot create ref due to creations being restricted.
          #
          # -- so every scheduled run destroyed the release and could not put
          # it back. The tag is now permanently burned and the release is gone.
          # A publish step must not remove the current artifact before its
          # replacement is durable; that is the 0.9.0 lesson from soldr#2469.
          #
          # Updating assets in place also fails on an immutable release, but it
          # fails without taking anything with it, which is the difference that
          # matters here.
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" staging/* \
                --repo "${GITHUB_REPOSITORY}" \
                --clobber
          else
            gh release create "$TAG" \
                --repo "${GITHUB_REPOSITORY}" \
                --title "vcpkg bundles (latest baseline)" \
                --notes "Auto-published by .github/workflows/vcpkg-windows-refresh.yml. Bundles built fresh against vcpkg master HEAD at workflow run time." \
                staging/*
          fi
