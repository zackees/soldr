# Enforces the repository's GitHub Actions-cache budget (soldr#3047 Phase B).
#
# Its scheduled/main/manual operational sweep remains separate so a schedule
# does not launch canonical CI's full validation graph. The PR check itself is
# a job in ci.yml, where it receives job-scoped `actions: read`.
#
# See ci/cache-ownership.json's `budget` object for the family allocations
# this gate enforces, and .github/scripts/check_cache_budget.py for the gate
# itself (including its `--prune` dry-run mode).

name: Cache Budget

on:
  push:
    branches:
      - main
  schedule:
    # Six-hourly: every host-lane run on a PR ref saves a ~1.3 GiB Tier-2
    # generation that nothing restores across PRs, and three of them
    # already breach the 9.5 GiB hard ceiling (soldr#3102).
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:

# One live run per workflow per ref: a new push to a branch or PR cancels the
# superseded run instead of queuing behind it in the shared account-wide runner
# pool. Runs on main get a unique group, so they are never cancelled or coalesced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  # `actions: write` is what `gh cache delete` needs for the sweep step;
  # on pull_request events GitHub downgrades the token regardless.
  actions: write

jobs:
  budget:
    name: Repository Actions cache budget
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      # Sweep only from a main checkout; pull requests remain read-only checks.
      - name: Sweep reclaimable cache entries
        if: github.ref == 'refs/heads/main'
        # The script evaluates the budget on the listing it fetched BEFORE
        # deleting, so a sweep that reclaims its way back under budget still
        # exits 1 here; the check step below is the verdict.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --no-project --python 3.13 python
          .github/scripts/check_cache_budget.py --prune --apply
      - name: Repository Actions cache budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --no-project --python 3.13 python
          .github/scripts/check_cache_budget.py
