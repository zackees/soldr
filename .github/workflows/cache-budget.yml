# Enforces the repository's GitHub Actions-cache budget (soldr#3047 Phase B).
#
# A dedicated workflow rather than a step in ci.yml: a `schedule:` trigger
# added to ci.yml would run its full 21-job sweep every day just to total up
# cache bytes, and this job needs `actions: read` (to call `gh cache list` /
# the cache-usage API) -- a grant ci.yml's top-level `permissions: contents:
# read` does not carry.
#
# See ci/cache-ownership.json's `budget` object for the family allocations
# this gate enforces, and .github/scripts/check_cache_budget.py for the gate
# itself (including its `--prune` dry-run mode).

name: Cache Budget

on:
  pull_request:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  budget:
    name: Repository Actions cache budget
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - name: Repository Actions cache budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --no-project --python 3.13 python
          .github/scripts/check_cache_budget.py
