name: Dylint Cook Acceptance


# Not a per-PR job (soldr#1900 follow-up, requested by the owner).
#
# This acceptance runs its scenarios inside a Docker container via
# `ci/perf_local.py`. That container earns its keep *locally*: it is a
# named, reusable runner with persistent target/Cargo/soldr volumes, so
# a developer's second run is warm.
#
# On GitHub Actions there is nothing to reuse. The runner is already an
# ephemeral, isolated VM, so the container adds no isolation the job did
# not already have — it only adds a full image build to every run. The
# last successful cache-acceptance run took 45 minutes; the cook one
# runs 13-26. The cache workflow also triggered on `crates/**`, so every
# Rust PR paid for it.
#
# So it moves to manual dispatch plus a weekly schedule: the coverage
# stays, and it stops sitting between a one-line change and a merge.
# Run it on demand before touching dylint caching:
#
#     gh workflow run "Dylint Cook Acceptance"
#
# Note the deliberate distinction: Docker stays where it provides an
# environment the runner genuinely is not — `baseline-zero-deps.yml`
# builds an old-glibc image to prove the binary runs there. That is
# testing a different platform, not re-isolating an isolated one.

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# soldr#1985 - stop superseded runs from holding runner slots.
concurrency:
  group: dylint-cook-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dylint-cook:
    name: check-shaped dependency cook matrix
    runs-on: ubuntu-24.04
    # soldr#3042 added a second three-mode matrix that builds the
    # dylint_testing dependency layer (compiletest_rs, git2, libgit2-sys),
    # roughly doubling the run.
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      # soldr#2763: uv must exist before the first step that uses it.
      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5

      # The acceptance re-invokes itself through `sys.executable`, so pinning
      # the interpreter here pins the whole chain rather than just the entry
      # point. The script is stdlib-only; the pin is about the runner image's
      # Python being reproducible.
      - name: Run Docker acceptance and benchmarks
        env:
          SOLDR_PERF_LOCAL_PTRACE: "1"
        run: uv run --no-project --python 3.13 python .github/scripts/dylint_cook_acceptance.py

      - name: Upload watchdog stacks and Tokio recording
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dylint-cook-watchdog-${{ github.run_id }}
          path: ${{ runner.temp }}/dylint-cook-diagnostics
          if-no-files-found: ignore
          retention-days: 7
