name: Dylint Cook Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/scripts/dylint_cook_acceptance.py"
      - ".github/workflows/dylint-cook-acceptance.yml"
      - "ci/fixtures/dylint-cache/**"
      - "crates/soldr-cli/src/dylint_cook.rs"
      - "crates/soldr-cli/src/dylint_toolchain.rs"
      - "crates/soldr-cli/src/cargo_front_door/**"
      - "crates/soldr-cli/src/cli_args.rs"
      - "crates/soldr-cli/src/soldr_main.rs"
      - "_vender/zccache"

permissions:
  contents: read

jobs:
  dylint-cook:
    name: check-shaped dependency cook matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Run Docker acceptance and benchmarks
        env:
          SOLDR_PERF_LOCAL_PTRACE: "1"
        run: python3 .github/scripts/dylint_cook_acceptance.py

      - name: Upload watchdog stacks and Tokio recording
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dylint-cook-watchdog-${{ github.run_id }}
          path: ${{ runner.temp }}/dylint-cook-diagnostics
          if-no-files-found: ignore
          retention-days: 7
