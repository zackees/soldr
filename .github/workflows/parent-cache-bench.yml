name: Parent Cache Bench

# Tier L1.x benchmark for issue #352.
#
# Proves the parent-cache (worktree-cache-sharing) speedup is real and acts
# as a regression gate. All real work lives in bench/parent_cache_bench.py
# so a local developer can run the exact same benchmark by hand:
#
#   uv run --no-project --script bench/parent_cache_bench.py --target zccache --threshold 5
#
# #691: the `push: main` auto-trigger is temporarily disabled. The
# `target: self` (dogfood) case has been consistently achieving only
# ~1.53x speedup (well below the 5x gate threshold) with 0 warm cache
# hits, while the `perf-matrix.yml` worktree-share scenario hits 100%
# on the `sqlite-link` and `medium` third-party fixtures. The
# divergence points at something in soldr-cli's own build that defeats
# parent-cache sharing -- worth root-causing, but a permanently red
# gate teaches everyone to ignore CI signal. Re-enable the push
# trigger after the soldr-cli dogfood-vs-fixture divergence is
# understood. Until then, the bench is still runnable on demand via
# `workflow_dispatch` (and locally via bench/parent_cache_bench.py).

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target ('self', 'zccache', or 'repo:URL')."
        required: true
        default: "self"
        type: string
      threshold_ratio:
        description: "Warm-with-remap build must be at least this many times faster than the no-remap control."
        required: true
        default: "5"
        type: string
  # #691: push trigger temporarily disabled (see header note). Re-enable
  # after the soldr-cli dogfood regression is root-caused, not before.
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "crates/soldr-cli/src/cache_lib/**"
  #     - "crates/soldr-cli/src/zccache.rs"
  #     - ".github/workflows/parent-cache-bench.yml"
  #     - "bench/parent_cache_bench.py"

permissions:
  contents: read

# soldr#1985 - stop superseded runs from holding runner slots.
concurrency:
  group: parent-cache-bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Parent cache speedup
    runs-on: ubuntu-24.04
    # soldr#1978 item 8 burn-down. Deliberately generous: 15 observed runs land
    # at 6-17 min, but the `target` input accepts `repo:URL`, so an arbitrary
    # (large) repo could be built cold+warm here and history does not bound the
    # worst case. 180 min is ~10x the observed max and still halves the
    # 360-minute default it replaces, so it catches a genuine hang without any
    # realistic risk of killing a healthy benchmark.
    timeout-minutes: 180
    env:
      TARGET: ${{ inputs.target || 'self' }}
      THRESHOLD: ${{ inputs.threshold_ratio || '5' }}
      # soldr#1322 — soldr's zccache/crgx fetch reads SOLDR_GITHUB_TOKEN
      # for authenticated GitHub Releases lookups (5,000/hr) instead of
      # unauthenticated (60/hr per runner IP). Follow-up to #1319 / #1323.
      SOLDR_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.95.0

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # soldr#1978 item 6 deliberately leaves this off the shared
          # `ws-<profile>-<target>` scheme. This job builds AND measures in
          # the same job (`cargo build --release` then
          # `bench/parent_cache_bench.py`), so a CI lane writing this
          # namespace would change what is on disk when the benchmark starts
          # -- measurement contamination, not just topology drift.
          shared-key: parent-cache-bench

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Build soldr-cli
        run: cargo build --package soldr-cli --release --locked

      - name: Add built soldr to PATH
        shell: bash
        run: echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"

      - name: Run parent-cache benchmark
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --script bench/parent_cache_bench.py \
            --target "${TARGET}" \
            --threshold "${THRESHOLD}"
