name: _Bootstrap E2E

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      target:
        required: true
        type: string
      binary_name:
        required: true
        type: string
      source_ref:
        required: true
        type: string
      third_party_repo:
        required: false
        type: string
        default: "zackees/soldr"
      third_party_ref:
        required: false
        type: string
        default: "0c8daefe4a4ac526b491fade590b32636340dce1"
      third_party_path:
        required: false
        type: string
        default: "third_party/bootstrap-fixture"
      third_party_build_dir:
        required: false
        type: string
        default: "crates/soldr-cli/tests/fixtures/windows-msvc-default"

permissions:
  contents: read

jobs:
  bootstrap-e2e:
    name: Build soldr and bootstrap third-party app (${{ inputs.target }})
    runs-on: ${{ inputs.runner }}
    # soldr#1985 - was inheriting GitHub's 360-minute default.
    timeout-minutes: 30
    env:
      # setup-soldr currently builds this PR with a released soldr binary.
      # Keep native cc-rs compiles on musl-gcc until the soldr-side default
      # in this branch is released and picked up by setup-soldr.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CXX_x86_64_unknown_linux_musl: musl-g++
      CC_aarch64_unknown_linux_musl: musl-gcc
      CXX_aarch64_unknown_linux_musl: musl-g++
      # soldr still fetches managed support tools from GitHub Releases.
      # Use soldr's explicit opt-in token env so release metadata requests
      # are authenticated without weakening the generic GITHUB_TOKEN guard.
      SOLDR_GITHUB_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive
          ref: ${{ inputs.source_ref }}
          path: soldr

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive
          repository: ${{ inputs.third_party_repo }}
          ref: ${{ inputs.third_party_ref }}
          path: ${{ inputs.third_party_path }}

      # soldr#1178 — dropped dtolnay/rust-toolchain: setup-soldr below
      # installs the same 1.94.1 toolchain via the `toolchain-file:
      # rust-toolchain.ci.toml` input (which declares the target too),
      # so running dtolnay first duplicated ~6-8 s of install work.

      # Dormant today: ci.yml is the only caller and passes
      # x86_64-unknown-linux-gnu, so this condition is never true. Kept rather
      # than deleted -- it is setup, not a check, so its not running hides
      # nothing, and a musl caller would need it back verbatim. Noted because
      # a reader can otherwise reasonably assume musl is exercised here.
      - name: Install musl tools
        if: contains(inputs.target, 'musl')
        shell: bash
        run: |
          set -euo pipefail
          # Narrower input surface per #41:
          # - --no-install-recommends prevents apt from pulling in optional deps,
          #   so the exact package set is what the release path declares.
          # - a small retry loop makes transient apt/mirror errors recoverable
          #   without weakening the installed set.
          # - the resolved package version is logged so it is auditable from
          #   the workflow run.
          attempts=0
          max_attempts=3
          until sudo apt-get update; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge "$max_attempts" ]; then
              echo "apt-get update failed after $max_attempts attempts" >&2
              exit 1
            fi
            sleep $((attempts * 3))
          done
          attempts=0
          until sudo apt-get install -y --no-install-recommends musl-tools; do
            attempts=$((attempts + 1))
            if [ "$attempts" -ge "$max_attempts" ]; then
              echo "apt-get install musl-tools failed after $max_attempts attempts" >&2
              exit 1
            fi
            sleep $((attempts * 3))
          done
          dpkg-query -W -f='musl-tools installed version: ${Version}\n' musl-tools

      - name: Write setup-soldr toolchain spec
        shell: bash
        working-directory: soldr
        run: |
          cat > rust-toolchain.ci.toml <<'EOF'
          [toolchain]
          channel = "1.94.1"
          profile = "minimal"
          targets = ["${{ inputs.target }}"]
          EOF
          cat rust-toolchain.ci.toml

      # soldr#1248/#2 follow-up: cache + soldr-cook stay disabled in
      # this bootstrap template while target/profile-shaped cook restore
      # is reintroduced in the cross/release lanes first. Toolchain
      # install only.
      # soldr#1340 — pre-cache the 1.94.1 toolchain in ~/.rustup so
      # setup-soldr uses it instead of installing to its managed
      # RUSTUP_HOME (saves ~9 s per lane). Same pattern as #1341.
      # #1341 verified setup-soldr's log flips from "does not already
      # contain toolchain" to "Using runner rustup home /home/runner/
      # .rustup for toolchain 1.94.1" — toolchain-snapshot: added=0.
      - name: Cache rustup 1.94.1 in ~/.rustup
        id: rustup_cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.rustup/toolchains/1.94.1-x86_64-unknown-linux-gnu
          key: rustup-1.94.1-linux-x64-v1

      - name: Install rustup 1.94.1 to ~/.rustup (if not cached)
        if: steps.rustup_cache.outputs.cache-hit != 'true'
        run: rustup toolchain install 1.94.1 --profile minimal --no-self-update

      - name: Setup soldr build cache
        uses: zackees/setup-soldr@b12d5664f3f0d18f16ae992d6546e90247300b6b
        env:
          ACTION_WORKSPACE: ${{ github.workspace }}/soldr
        with:
          # soldr#1799: pin the soldr that builds us -- the action's default
          # (0.8.23) predates #1820 and GCs live target/ artifacts after every
          # build, so the next build recompiles the world. See
          # tests/test_setup_soldr_version_pins.py.
          version: 0.8.29
          toolchain-file: rust-toolchain.ci.toml
          cache: false
          zccache-seed-strict: true
          linker: platform-default

      # soldr#1232 — cache ~/.cargo/{registry,git} + soldr/target/ so
      # `Build soldr-cli` doesn't recompile ~700 deps from scratch every
      # run. Same pattern as #1227 for _ci-cross-build-linux.yml.
      # `workspaces: soldr` because the checkout lands in a subdir.
      - name: Restore cargo + target caches
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: bootstrap-e2e-${{ inputs.target }}
          workspaces: soldr

      # soldr#1252 — removed the "Reset stale cache fallback artifacts"
      # step. It guarded on `setup_soldr.outputs.*-cache-restore-status
      # != 'exact-hit'`, but with setup-soldr's `cache: false`, that
      # condition trips EVERY run —
      # so the step was deleting `target/<triple>/` right after
      # Swatinem/rust-cache (added in #1233) restored it, nuking all
      # rust-cache benefit. rust-cache's own restore is authoritative
      # now; no separate "fallback reset" is needed.

      - name: Build soldr-cli
        shell: pwsh
        working-directory: soldr
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          soldr cargo build --package soldr-cli --locked --target "${{ inputs.target }}"
          $exitCode = $LASTEXITCODE
          $timer.Stop()
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ([string]::Format(
            [Globalization.CultureInfo]::InvariantCulture,
            "- **${{ inputs.target }} / Build soldr-cli**: {0:F3}s",
            $timer.Elapsed.TotalSeconds
          ))
          exit $exitCode

      - name: Resolve third-party toolchain
        id: third_party_toolchain
        shell: pwsh
        run: |
          $checkoutRoot = Join-Path $env:GITHUB_WORKSPACE "${{ inputs.third_party_path }}"
          $candidateFiles = @(
            (Join-Path $checkoutRoot "${{ inputs.third_party_build_dir }}/rust-toolchain.toml"),
            (Join-Path $checkoutRoot "rust-toolchain.toml")
          )

          $toolchainFile = $candidateFiles | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $toolchainFile) {
            "channel=repo-default" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          $channelLine = Select-String -Path $toolchainFile -Pattern '^channel = "(.*)"$' | Select-Object -First 1
          if (-not $channelLine) {
            throw "failed to resolve third-party Rust toolchain from $toolchainFile"
          }

          $channel = $channelLine.Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal
          rustup target add --toolchain $channel "${{ inputs.target }}"
          "channel=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Resolve soldr binary path
        id: soldr_binary
        shell: pwsh
        run: |
          $soldrPath = Join-Path $env:GITHUB_WORKSPACE "soldr/target/${{ inputs.target }}/debug/${{ inputs.binary_name }}"
          "path=$soldrPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Show soldr version
        shell: pwsh
        run: |
          & "${{ steps.soldr_binary.outputs.path }}" --version

      - name: Stop setup-soldr builder cache before bootstrap test
        uses: zackees/setup-soldr/cleanup@b12d5664f3f0d18f16ae992d6546e90247300b6b

      - name: Build third-party app through soldr
        shell: pwsh
        working-directory: ${{ inputs.third_party_path }}/${{ inputs.third_party_build_dir }}
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/${{ inputs.third_party_path }}/${{ inputs.third_party_build_dir }}/target-${{ inputs.target }}
          SOLDR_CACHE_DIR: ${{ runner.temp }}/bootstrap-e2e-${{ inputs.target }}
          SOLDR_CACHE_LIFECYCLE: command
          SOLDR_CACHE_SHUTDOWN_TIMEOUT_SECS: "30"
          ZCCACHE_CACHE_DIR: ${{ runner.temp }}/bootstrap-e2e-${{ inputs.target }}/cache/zccache
        run: |
          Write-Host "Using isolated bootstrap SOLDR_CACHE_DIR=$env:SOLDR_CACHE_DIR"
          Write-Host "Using isolated bootstrap ZCCACHE_CACHE_DIR=$env:ZCCACHE_CACHE_DIR"
          $timer = [Diagnostics.Stopwatch]::StartNew()
          & "${{ steps.soldr_binary.outputs.path }}" cargo build --locked --target "${{ inputs.target }}"
          $exitCode = $LASTEXITCODE
          $timer.Stop()
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ([string]::Format(
            [Globalization.CultureInfo]::InvariantCulture,
            "- **${{ inputs.target }} / Bootstrap third-party build**: {0:F3}s",
            $timer.Elapsed.TotalSeconds
          ))
          exit $exitCode

      - name: Show shared soldr cache status
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        working-directory: ${{ inputs.third_party_path }}/${{ inputs.third_party_build_dir }}
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/bootstrap-e2e-${{ inputs.target }}
          ZCCACHE_CACHE_DIR: ${{ runner.temp }}/bootstrap-e2e-${{ inputs.target }}/cache/zccache
        run: |
          $soldrPath = "${{ steps.soldr_binary.outputs.path }}"
          if ([string]::IsNullOrWhiteSpace($soldrPath) -or -not (Test-Path -LiteralPath $soldrPath)) {
            Write-Host "Soldr binary is unavailable; skipping shared cache status."
            exit 0
          }
          & $soldrPath cache

      - name: Stop isolated bootstrap cache
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          SOLDR_CACHE_DIR: ${{ runner.temp }}/bootstrap-e2e-${{ inputs.target }}
          ZCCACHE_CACHE_DIR: ${{ runner.temp }}/bootstrap-e2e-${{ inputs.target }}/cache/zccache
        run: |
          $soldrPath = "${{ steps.soldr_binary.outputs.path }}"
          if ([string]::IsNullOrWhiteSpace($soldrPath) -or -not (Test-Path -LiteralPath $soldrPath)) {
            exit 0
          }
          & $soldrPath cache shutdown --shutdown-timeout-seconds 30

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: soldr-${{ inputs.target }}
          path: ${{ steps.soldr_binary.outputs.path }}

      # soldr#1799 — surface build XML logs + JSONL compile journals so
      # toolchain-home leakage and warm-run recompile storms are
      # diagnosable from the Actions UI. Printed as separate steps and
      # uploaded as a downloadable artifact.
      - name: Print build XML logs
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $roots = @("$HOME/.soldr", "$HOME/.soldr-dev", "${{ runner.temp }}/bootstrap-e2e-${{ inputs.target }}")
          $files = @($roots | Where-Object { Test-Path $_ } | ForEach-Object {
            Get-ChildItem -Path $_ -Recurse -Filter *.xml -ErrorAction SilentlyContinue
          } | Where-Object { $_.DirectoryName -match 'logs' })
          if ($files.Count -eq 0) { Write-Host 'No build XML logs found.' }
          foreach ($f in $files) {
            Write-Host "===== $($f.FullName) ====="
            Get-Content $f.FullName
          }

      - name: Print JSONL compile journals
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $roots = @("$HOME/.soldr", "$HOME/.soldr-dev", "${{ runner.temp }}/bootstrap-e2e-${{ inputs.target }}")
          $files = @($roots | Where-Object { Test-Path $_ } | ForEach-Object {
            Get-ChildItem -Path $_ -Recurse -Include *.jsonl, *.stats.json -ErrorAction SilentlyContinue
          } | Where-Object { $_.DirectoryName -match 'logs' })
          if ($files.Count -eq 0) { Write-Host 'No JSONL compile journals found.' }
          foreach ($f in $files) {
            Write-Host "===== $($f.FullName) ====="
            Get-Content $f.FullName
          }

      - name: Upload build log artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-logs-bootstrap-${{ inputs.target }}
          if-no-files-found: ignore
          path: |
            ~/.soldr/logs/
            ~/.soldr-dev/logs/
            ~/.soldr/cache/zccache/logs/
            ~/.soldr-dev/cache/zccache/logs/
            ${{ runner.temp }}/bootstrap-e2e-${{ inputs.target }}/**/logs/
