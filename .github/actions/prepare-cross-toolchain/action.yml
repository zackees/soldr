name: Preparing Cross Compile Toolchain
description: |
  Uniform cross-compile toolchain bootstrap. One step per matrix cell;
  internally dispatches based on `target` triple via `soldr prepare`:
    *-pc-windows-msvc → ensure cargo-xwin + LLVM + extract vendored
      MSVC CRT cache to ~/.cache/cargo-xwin/ (no live MS download).
    x86_64-pc-windows-gnu → on Windows x64, ensure managed MinGW-w64
      GCC and export target-scoped Cargo/cc-rs env; on other hosts,
      ensure cargo-zigbuild + zig.
    *-apple-darwin    → ensure cargo-zigbuild + zig + Apple SDK;
      export SDKROOT into $GITHUB_ENV.
    *-unknown-linux-* → ensure cargo-zigbuild + zig.
  Collapses what used to be 3-4 separate workflow steps into one named
  "Preparing Cross Compile Toolchain". Designed for
  cross-compile-all-targets.yml + sibling workflows.

inputs:
  target:
    description: "Rust target triple (e.g. x86_64-pc-windows-msvc)"
    required: true
  soldr:
    description: |
      Path to the `soldr` binary to invoke. Defaults to `soldr` on
      $PATH (typically the bootstrap soldr installed earlier in the
      workflow).
    required: false
    default: soldr
  save:
    description: |
      Optional path. If set, `soldr prepare` writes a tar.zst archive
      of the prepared state (zig + LLVM + Apple SDK + xwin cache) to
      this file AFTER preparation completes. Plumb the same path into
      `actions/cache@v4`'s save step so a sibling run with `restore:`
      can skip the downloads.
    required: false
    default: ""
  restore:
    description: |
      Optional path. If set and the file exists, `soldr prepare`
      extracts it BEFORE running the normal prepare flow. Anything
      still missing afterwards is downloaded normally.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Preparing Cross Compile Toolchain
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::soldr prepare --target ${{ inputs.target }}"
        args=( prepare --target "${{ inputs.target }}" --github-env "$GITHUB_ENV" )
        if [ -n "${{ inputs.restore }}" ] && [ -f "${{ inputs.restore }}" ]; then
          args+=( --restore "${{ inputs.restore }}" )
        fi
        if [ -n "${{ inputs.save }}" ]; then
          args+=( --save "${{ inputs.save }}" )
        fi
        "${{ inputs.soldr }}" "${args[@]}"
        echo "::endgroup::"
