name: Preparing Cross Compile Toolchain
description: |
  Uniform target lifecycle preparation. One step per matrix cell;
  the caller selects only a target triple and `soldr prepare` owns the
  compiler, linker, SDK/sysroot, Rust standard library, and environment.
  The same preparation contract is consumed by soldr build, clippy, test
  compilation, nextest archives, and PEP 517 operations.

inputs:
  target:
    description: "Rust target triple (e.g. x86_64-pc-windows-msvc)"
    required: true
  soldr:
    description: |
      Path to the `soldr` binary to invoke. Defaults to `soldr` on
      $PATH (typically the bootstrap soldr installed earlier in the
      workflow).
    required: false
    default: soldr
  save:
    description: |
      Optional path. If set, `soldr prepare` writes a tar.zst archive
      of the prepared compiler and platform state after preparation.
      Plumb the same path into `actions/cache@v4`'s save step so a
      sibling run with `restore:` can skip downloads.
    required: false
    default: ""
  restore:
    description: |
      Optional path. If set and the file exists, `soldr prepare`
      extracts it before running the normal preparation flow. Anything
      still missing afterwards is downloaded normally.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Preparing Cross Compile Toolchain
      shell: bash
      run: |
        set -euo pipefail
        echo "::group::soldr prepare --target ${{ inputs.target }}"
        args=( prepare --target "${{ inputs.target }}" --github-env "$GITHUB_ENV" )
        if [ -n "${{ inputs.restore }}" ] && [ -f "${{ inputs.restore }}" ]; then
          args+=( --restore "${{ inputs.restore }}" )
        fi
        if [ -n "${{ inputs.save }}" ]; then
          args+=( --save "${{ inputs.save }}" )
        fi
        "${{ inputs.soldr }}" "${args[@]}"
        echo "::endgroup::"
