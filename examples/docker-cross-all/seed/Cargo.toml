# Image-bake seed manifest — used ONLY at Dockerfile build time so
# `soldr prepare --target all` can resolve the target matrix without
# a real workspace mounted. Mirrors the root Cargo.toml's
# [workspace.metadata.soldr].targets list. Keep in sync; the bake
# step fails fast if the metadata table is missing.

[workspace]
members = []
resolver = "2"

[workspace.metadata.soldr]
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]
