syntax = "proto3";

package running_process.probe_diag.v1;

import "probe_diag_v1/probe_diag_v1_common.proto";

// Durable crash history.
//
// Unlike the live registry, these records outlive the process. They therefore
// carry *redacted metadata only* — signature, class, timing, an opaque
// artifact id — so the surface stays safe behind token+loopback. The artifact
// itself holds the sensitive detail and is fetched separately under its own
// gating.
//
// Only processes that reached ARMED produce findable crash records.

message CrashQuery {
  string app_class = 1;
  string app_name = 2;

  // Grouping key across instances — enables "all crashes of this shape".
  string signature = 3;

  // Half-open window [since, until). Zero means unbounded on that side.
  uint64 since_unix_ms = 4;
  uint64 until_unix_ms = 5;

  // Mandatory for record queries, and capped. Crash history grows without
  // bound between GC runs, so an absent limit is refused rather than
  // defaulted — the same rule the live query surface uses, for the same
  // reason. Ignored by CrashStatsQuery, whose result is bounded by the number
  // of distinct signatures rather than by the number of rows.
  uint32 limit = 6;

  // SQL LIKE pattern on app_class, e.g. "clud%" to sweep clud and
  // clud-worker together. Escaped with backslash, so a literal '%' or '_' in
  // a class name cannot silently widen the match. Applied in addition to
  // `app_class` when both are set.
  string app_class_like = 7;

  string instance_name = 8;

  reserved 9 to 15;
}

message CrashRecord {
  ProcessKey key = 1;

  // Stable grouping key derived from the faulting frames.
  string signature = 2;

  uint64 crash_unix_ms = 3;

  // Was `artifact_path`. Removed rather than deprecated: the daemon-private
  // path discloses the owner's directory layout to every caller of a query
  // surface that is supposed to return redacted metadata only. Callers use
  // the opaque `id` below and fetch the bytes through the artifact endpoint,
  // which resolves the id itself.
  reserved 4;

  string app_class = 5;
  string app_name = 6;
  string app_version = 7;
  string instance_name = 8;

  // Signal name / exception code, e.g. "SIGSEGV" or "0xC0000005".
  string fault_kind = 9;

  string arch = 10;
  string os = 11;

  // Opaque artifact handle. Resolved by the daemon; never a path.
  int64 id = 12;

  // Artifact size, so a caller can decide whether to fetch before it does.
  uint64 artifact_bytes = 13;

  string cwd = 14;

  reserved 15 to 23;
}

message CrashQueryReply {
  repeated CrashRecord records = 1;
  ProbeErrorCode error = 2;
  string detail = 3;
  reserved 4 to 15;
}

// Aggregate rollup over the same filter a CrashQuery accepts.
//
// Separate from CrashQuery so the reply type differs: a caller asking "how
// often does this crash" gets counts, not a truncated page of rows it would
// have to count itself (and would count wrongly, because `limit` truncates).
message CrashStatsQuery {
  CrashQuery filter = 1;
  reserved 2 to 15;
}

// One crash signature and how it behaved inside the queried window.
message CrashSignatureStat {
  string signature = 1;
  uint64 count = 2;
  uint64 first_unix_ms = 3;
  uint64 last_unix_ms = 4;

  // Distinct application classes that produced this signature. A signature
  // appearing across classes usually means shared library code, which is the
  // thing worth knowing about it.
  repeated string app_classes = 5;

  reserved 6 to 15;
}

message CrashStatsReply {
  repeated CrashSignatureStat signatures = 1;

  // Total matching crashes, which is NOT the sum of a truncated record page.
  uint64 total = 2;

  // Observed window across matches, both zero when there are none.
  uint64 first_unix_ms = 3;
  uint64 last_unix_ms = 4;

  // Distinct application classes among matches.
  uint64 distinct_classes = 5;

  ProbeErrorCode error = 6;
  string detail = 7;
  reserved 8 to 15;
}
