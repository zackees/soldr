[package]
name = "running-process-probe-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "rpprobed — probe daemon skeleton: bring-up, discovery, and control socket (#631)"
# Published: `rpprobed` and `rpprobe` are the operator-facing binaries of
# the probe, and an unpublished crate cannot be `cargo install`ed.
publish = true
build = "build.rs"

[[bin]]
name = "rpprobed"
path = "src/bin/rpprobed.rs"

[[bin]]
name = "rpprobe"
path = "src/bin/rpprobe.rs"

[dependencies]
# Broker primitives reused as libraries: framing codec, peer-cred/owner-only
# ACL, privilege refusal, SID hashing, private-dir hardening. The probe daemon
# is NOT a broker backend — it borrows the plumbing, not the wire.
running-process = { path = "../running-process", version = "4.8.0", default-features = false, features = [
    "client",
] }
# probe_diag.v1 schema (S1 / #630).
running-process-probe = { path = "../running-process-probe", version = "4.8.0" }

interprocess = "2"
prost = "0.14"
# Timestamp/Duration, for deriving idle time from console-api stats (#788).
prost-types = "0.14"
thiserror = { workspace = true }
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { workspace = true }
blake3 = "1"
sysinfo = "0.30"
globset = "0.4"
regex = "1"

# HTTP surface (#642). Confined to THIS crate on purpose: the published
# `running-process` crate must not grow an axum/hyper/tokio dependency tree
# for a diagnostic UI that only the daemon serves.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["limit"] }
# tokio console-api client for the off-CPU/async adapter (#788). Confined to
# this crate like the rest of the HTTP surface. `console-api` 0.9 tracks prost
# 0.14 and tonic 0.14, matching what this crate already uses, so it adds no
# second copy of prost. Note this is the *client* half only: subscribing needs
# no `tokio_unstable`, which is a property of the profiled application.
console-api = "0.9"
tonic = { version = "0.14", default-features = false, features = [
    "codegen",
    "transport",
] }
tokio-stream = "0.1"
# Constant-time token comparison. A `==` on the bearer token leaks its prefix
# through timing, and the token is the only thing standing between a local
# process and every artifact this daemon holds.
subtle = "2"
clap = { version = "4", features = ["derive"] }
# Profile exports (#644): the .pprof convention is a gzipped protobuf.
flate2 = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
prost-build = "0.14"
protox = "0.9"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
# `#[tokio::test]` for the async handler units.
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
