[package]
name = "testbins"
version = "0.0.0"
edition = "2021"
publish = false

[lints]
workspace = true

[[bin]]
name = "testbin-cwd-reporter"
path = "src/bin/cwd_reporter.rs"

[[bin]]
name = "testbin-dies-after-spawn"
path = "src/bin/dies_after_spawn.rs"

[[bin]]
name = "testbin-emitter"
path = "src/bin/emitter.rs"

[[bin]]
name = "testbin-env-dump"
path = "src/bin/env_dump.rs"

[[bin]]
name = "testbin-env-reporter"
path = "src/bin/env_reporter.rs"

[[bin]]
name = "testbin-inherited-listener-daemon"
path = "src/bin/inherited_listener_daemon.rs"

[[bin]]
name = "testbin-sleeper"
path = "src/bin/sleeper.rs"

[[bin]]
name = "testbin-spawner"
path = "src/bin/spawner.rs"

[[bin]]
name = "testbin-stubborn"
path = "src/bin/stubborn.rs"

[[bin]]
# #150: raw-ANSI emitter used by the PTY passthrough integration
# tests. No external deps.
name = "testbin-tui-counter"
path = "src/bin/tui_counter.rs"

[[bin]]
# #448 / #449: stdin echoer for MITM substrate tests. Reads stdin in
# 4 KB chunks, writes each chunk back to stdout immediately (or
# suppresses with `--no-echo`).
name = "testbin-stdin-echoer"
path = "src/bin/stdin_echoer.rs"

[[bin]]
# #449: backpressure fixture. Reads stdin in `--buf-size` chunks but
# sleeps `--sleep-ms` between reads, so the host has to tolerate a
# slow consumer when injecting multi-MB pastes.
name = "testbin-slow-stdin-reader"
path = "src/bin/slow_stdin_reader.rs"

[[bin]]
# #551 slice 7c: deterministic CreateFileW caller used by the
# Windows interposer integration test. Sleeps, then opens a
# caller-supplied path via kernel32!CreateFileW — guaranteed to
# hit the slice 6b detour (which patches that exact entry).
name = "testbin-createfilew-probe"
path = "src/bin/createfilew_probe.rs"

[[bin]]
# #636: faults only in a child process so the test harness itself is never
# exposed to a real SIGSEGV/access violation.
name = "testbin-probe-crasher"
path = "src/bin/probe_crasher.rs"

[[bin]]
# #792: allocates a known amount at a named frame, then writes a pprof heap
# profile, so the daemon's heap surface can be tested against a profile a real
# allocator produced.
name = "testbin-mimalloc-leaker"
path = "src/bin/mimalloc_leaker.rs"

# Unconditional because `dies_after_spawn` uses `running_process::{spawn, SpawnStdio}`
# on every platform. `spawner` also uses it but only inside `#[cfg(windows)]` blocks.
[dependencies]
running-process = { path = "../crates/running-process", features = ["probe"] }
libc = "0.2"
# The inherited-listener fixture accepts on a listener the broker passed it,
# and `accept` comes from this crate's `Listener` trait.
interprocess = "2"

# mimalloc + its pprof-compatible sampling heap profiler (#792). Unconditional
# on purpose: this is a Windows-first mimalloc fork, so it has no platform gap
# to work around and needs no per-target gate. The `0.9` line is the v3 mimalloc
# port and is what this project targets.
mimalloc-pprof = "0.9"

# Signal fixtures use libc on every platform.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
] }
